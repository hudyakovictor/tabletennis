<div id="preloader" class="preloader" data-phase="boot" role="status" aria-live="polite">
  <div class="pl-backdrop" aria-hidden="true"></div>
  <div class="pl-readout" role="progressbar" aria-labelledby="pl-status" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <svg class="pl-ring" viewBox="0 0 184 184" aria-hidden="true">
      <circle cx="92" cy="92" r="76" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="7"/>
      <circle class="pl-progress" cx="92" cy="92" r="76" fill="none" stroke="#FFC93A" stroke-width="7" stroke-linecap="round" stroke-dasharray="477.522" stroke-dashoffset="477.522"/>
    </svg>
    <b class="pl-percent num">0<span>%</span></b>
    <span id="pl-status" class="pl-status" data-i18n="loader.loading">Арена выходит на смену</span>
  </div>
  <button class="pl-retry b3 dark sm" data-i18n="loader.retry" hidden>Повторить загрузку</button>
</div>
