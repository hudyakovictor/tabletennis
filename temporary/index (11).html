<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07090D">
<title>Signal Arena — каталог интерактивных ассетов</title>
<style>/* Signal Arena — Interactive Asset Catalog. Mobile-first, Telegram Mini App.
   Всё inline: ни одного внешнего ресурса, ни одного шрифта по сети. */
:root{
  --bg:#07090D; --surface:#0B0F14; --surface-2:#0D1117; --line:#1C2430; --line-2:#2A3441;
  --ink:#E6EDF3; --ink-2:#9FB0C2; --ink-3:#6E7D8F;
  --read:#007AFD; --read-d:#002E60; --read-l:#66B8FF;
  --decide:#4ADE80; --decide-d:#1A5230; --decide-l:#A7F3C0;
  --protocol:#A78BFA; --protocol-d:#3B1F6A; --protocol-l:#DDD6FE;
  --protect:#F59E0B; --protect-d:#78440A; --protect-l:#FDE68A;
  --danger:#FF4D4D; --gold:#FFD166;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --e-out:cubic-bezier(.22,1,.36,1);
  --e-snap:cubic-bezier(.34,1.56,.64,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(72px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:460px;margin:0 auto;padding:0 12px}
@media(min-width:900px){.wrap{max-width:1180px}}

/* ---------------------------------------------------------------- шапка */
.hero{position:relative;overflow:hidden;padding:26px 0 18px;
  background:
    radial-gradient(620px 260px at 12% -30%,rgba(0,122,253,.26),transparent 62%),
    radial-gradient(520px 230px at 88% -22%,rgba(167,139,250,.22),transparent 60%),
    radial-gradient(420px 200px at 50% 120%,rgba(74,222,128,.10),transparent 60%);
}
.hero:after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:28px 28px;mask-image:linear-gradient(180deg,#000,transparent 78%)}
.hero h1{font-size:23px;letter-spacing:-.025em;font-weight:700;position:relative}
.hero h1 b{background:linear-gradient(92deg,var(--read-l),var(--protocol-l));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ink-2);font-size:12.5px;margin-top:6px;max-width:34em;position:relative}
.kpis{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;position:relative}
.kpi{background:rgba(13,17,23,.72);border:1px solid var(--line);border-radius:12px;padding:8px 11px;backdrop-filter:blur(6px)}
.kpi b{display:block;font-size:17px;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--ink-3);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em}

/* ------------------------------------------------------------- фильтры */
.bar{position:sticky;top:0;z-index:40;background:rgba(7,9,13,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin-top:14px}
.bar .in{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;max-width:1180px;margin:0 auto}
.bar .in::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:999px;padding:7px 13px;font-size:12px;cursor:pointer;transition:.18s var(--e-out);white-space:nowrap;user-select:none}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:#07090D;border-color:var(--ink);font-weight:650}

/* --------------------------------------------------------------- сетка */
.grid{display:grid;gap:12px;padding:14px 0}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
  display:flex;flex-direction:column;position:relative;contain:content}
.asset.hide{display:none}
.ahead{display:flex;align-items:flex-start;gap:9px;padding:13px 14px 10px}
.anum{font:700 10.5px/1 ui-monospace,monospace;background:#11161D;border:1px solid var(--line);
  border-radius:7px;padding:6px 7px;color:var(--ink-2);letter-spacing:.03em}
.atitle{flex:1;min-width:0}
.atitle h3{font-size:14px;font-weight:650;letter-spacing:-.01em}
.atitle p{color:var(--ink-3);font-size:11.5px;margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.tag{font:600 9px/1 ui-monospace,monospace;letter-spacing:.07em;padding:4px 6px;border-radius:5px;
  background:#11161D;color:var(--ink-3);border:1px solid var(--line)}
.tag.i{color:var(--decide);border-color:rgba(74,222,128,.28);background:rgba(74,222,128,.08)}
.tag.a{color:var(--read-l);border-color:rgba(102,184,255,.28);background:rgba(102,184,255,.08)}
.tag.v{color:var(--protocol);border-color:rgba(167,139,250,.28);background:rgba(167,139,250,.08)}
.stage{position:relative;margin:0 10px 10px;border-radius:var(--r-m);overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,#101822,#0A0D12 70%);
  border:1px solid var(--line);min-height:210px;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation}
.stage.tall{min-height:290px}
.stage canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hint{display:flex;align-items:center;gap:7px;padding:0 14px 13px;color:var(--ink-3);font-size:11px}
.hint b{color:var(--ink-2);font-weight:600}
.dotled{width:6px;height:6px;border-radius:50%;background:var(--decide);box-shadow:0 0 0 0 rgba(74,222,128,.6);
  animation:led 2.4s infinite}
@keyframes led{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.btn{background:#11161D;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;
  padding:6px 11px;font-size:11px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.94)}
.btn:hover{color:var(--ink);border-color:var(--line-2)}
.reset{position:absolute;right:8px;top:8px;z-index:5}

/* --------------------------------------------------- общие части ассетов */
.sa-card{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(165deg,#121A24,#0B1016);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px -22px #000,inset 0 1px 0 rgba(255,255,255,.06)}
.sa-card .foil{position:absolute;inset:-40%;pointer-events:none;mix-blend-mode:screen;opacity:.0;
  background:conic-gradient(from 0deg,#ff00c8,#00e5ff,#7cff6b,#ffe066,#ff00c8);filter:blur(16px)}
.sa-card .glare{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 60%);
  transform:translateX(-120%)}
.sa-label{font:700 9px/1 ui-monospace,monospace;letter-spacing:.1em;padding:4px 7px;border-radius:6px}
.sa-val{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ring-track{stroke:#1C2430}
.lvl-pill{display:inline-flex;gap:3px;align-items:center}
.lvl-pill i{width:5px;height:5px;border-radius:1.5px;background:#2A3441;display:block}
.lvl-pill i.on{background:currentColor;box-shadow:0 0 6px currentColor}
.scrim{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 45%,transparent,rgba(0,0,0,.55));pointer-events:none}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
.flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{color:var(--ink-3);font-size:11px;padding:18px 2px 8px;line-height:1.6}
footer b{color:var(--ink-2)}
</style>
</head><body>
<div id="app"></div>
<script>/* ===== engine.js ===== */
/* ============================================================================
   SA — микро-движок каталога.
   Задачи: единый rAF, частицы на canvas, пружины, жесты, тактильная отдача
   Telegram, ленивый монтаж ассетов. Ноль зависимостей.
   ========================================================================== */
const SA = (() => {
  const reg = [];
  const TAU = Math.PI * 2;

  /* ---------------------------------------------------------- математика */
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
  const randi = (a, b) => Math.floor(rand(b + 1, a));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const map = (v, a, b, c, d) => c + (clamp((v - a) / (b - a)) * (d - c));
  const ease = {
    out: t => 1 - Math.pow(1 - t, 3),
    in: t => t * t * t,
    io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2),
    elastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1,
    bounce: t => { const n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
  };

  /* ------------------------------------------------- единый кадр анимации */
  const tasks = new Set();
  let last = performance.now(), running = false;
  function frame(now) {
    const dt = Math.min(48, now - last) / 1000; last = now;
    tasks.forEach(t => { try { t(dt, now) } catch (e) { tasks.delete(t) } });
    running = tasks.size > 0;
    if (running) requestAnimationFrame(frame); 
  }
  function raf(fn) {
    tasks.add(fn);
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame) }
    return () => tasks.delete(fn);
  }

  /* ------------------------------------------------------------- пружина */
  class Spring {
    constructor(v = 0, { stiff = 170, damp = 18, mass = 1 } = {}) {
      this.v = v; this.target = v; this.vel = 0; this.k = stiff; this.d = damp; this.m = mass;
    }
    set(t) { this.target = t; return this }
    jump(v) { this.v = this.target = v; this.vel = 0; return this }
    step(dt) {
      const f = -this.k * (this.v - this.target) - this.d * this.vel;
      this.vel += (f / this.m) * dt; this.v += this.vel * dt;
      if (Math.abs(this.vel) < .0008 && Math.abs(this.v - this.target) < .0008) { this.v = this.target; this.vel = 0 }
      return this.v;
    }
    get settled() { return this.vel === 0 && this.v === this.target }
  }

  /* -------------------------------------------- тактильная отдача / звук */
  const tg = window.Telegram && window.Telegram.WebApp;
  function haptic(kind = 'light') {
    try {
      const h = tg && tg.HapticFeedback;
      if (h) {
        if (['light', 'medium', 'heavy', 'rigid', 'soft'].includes(kind)) h.impactOccurred(kind);
        else if (['error', 'success', 'warning'].includes(kind)) h.notificationOccurred(kind);
        else h.selectionChanged();
        return;
      }
      if (navigator.vibrate) navigator.vibrate({ light: 8, medium: 14, heavy: 24, success: [10, 40, 16], error: [26, 50, 26] }[kind] || 8);
    } catch (e) {}
  }

  /* --------------------------------------------------------------- DOM */
  function el(tag, props = {}, kids = []) {
    const n = document.createElement(tag);
    for (const k in props) {
      if (k === 'class') n.className = props[k];
      else if (k === 'style') n.style.cssText = props[k];
      else if (k === 'html') n.innerHTML = props[k];
      else if (k === 'text') n.textContent = props[k];
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), props[k], { passive: k !== 'ontouchmove' });
      else n.setAttribute(k, props[k]);
    }
    (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return n;
  }
  const svg = (markup) => {
    const d = document.createElement('div'); d.innerHTML = markup.trim(); return d.firstChild;
  };
  const NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs = {}) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* -------------------------------------------------- система частиц FX */
  class FX {
    constructor(host) {
      this.c = el('canvas', { class: 'fx' });
      host.appendChild(this.c);
      this.ctx = this.c.getContext('2d');
      this.p = []; this.dpr = Math.min(2, devicePixelRatio || 1);
      this.resize(); this.stop = null;
      this._ro = new ResizeObserver(() => this.resize()); this._ro.observe(host);
    }
    resize() {
      const r = this.c.getBoundingClientRect();
      this.w = Math.max(1, r.width); this.h = Math.max(1, r.height);
      this.c.width = this.w * this.dpr; this.c.height = this.h * this.dpr;
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }
    emit(o = {}) {
      const n = o.n || 18;
      for (let i = 0; i < n; i++) {
        const a = o.angle !== undefined ? o.angle + rand(o.spread || .6, -(o.spread || .6)) : rand(TAU);
        const sp = rand(o.speed || 170, (o.speedMin !== undefined ? o.speedMin : (o.speed || 170) * .3));
        this.p.push({
          x: o.x ?? this.w / 2, y: o.y ?? this.h / 2,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0, max: rand(o.life || 1, (o.life || 1) * .55),
          size: rand(o.size || 4, (o.size || 4) * .4),
          g: o.gravity ?? 320, drag: o.drag ?? .88,
          col: Array.isArray(o.color) ? pick(o.color) : (o.color || '#fff'),
          shape: o.shape || 'dot', rot: rand(TAU), vr: rand(7, -7), glow: o.glow !== false
        });
      }
      this.run();
    }
    ring(o = {}) { // ударная волна
      this.rings = this.rings || [];
      this.rings.push({ x: o.x ?? this.w / 2, y: o.y ?? this.h / 2, r: o.r0 || 6, max: o.r || 90,
        life: 0, dur: o.dur || .55, col: o.color || '#fff', w: o.width || 3 });
      this.run();
    }
    run() {
      if (this.stop) return;
      this.stop = raf(dt => {
        const x = this.ctx; x.clearRect(0, 0, this.w, this.h);
        for (let i = this.p.length - 1; i >= 0; i--) {
          const q = this.p[i]; q.life += dt;
          if (q.life >= q.max) { this.p.splice(i, 1); continue }
          q.vy += q.g * dt; q.vx *= Math.pow(q.drag, dt * 60) || 1; q.vy *= Math.pow(q.drag, dt * 60) || 1;
          q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
          const t = 1 - q.life / q.max;
          x.globalAlpha = t; x.fillStyle = q.col;
          if (q.glow) { x.shadowBlur = 12; x.shadowColor = q.col } else x.shadowBlur = 0;
          if (q.shape === 'rect') { x.save(); x.translate(q.x, q.y); x.rotate(q.rot);
            x.fillRect(-q.size, -q.size * .5, q.size * 2, q.size); x.restore(); }
          else if (q.shape === 'line') { x.save(); x.translate(q.x, q.y); x.rotate(Math.atan2(q.vy, q.vx));
            x.fillRect(0, -q.size * .25, q.size * 3.2 * t, q.size * .5); x.restore(); }
          else if (q.shape === 'tri') { x.save(); x.translate(q.x, q.y); x.rotate(q.rot); x.beginPath();
            x.moveTo(0, -q.size); x.lineTo(q.size, q.size); x.lineTo(-q.size, q.size); x.closePath(); x.fill(); x.restore(); }
          else { x.beginPath(); x.arc(q.x, q.y, q.size * (.4 + t * .6), 0, TAU); x.fill() }
        }
        if (this.rings) for (let i = this.rings.length - 1; i >= 0; i--) {
          const r = this.rings[i]; r.life += dt;
          const t = r.life / r.dur;
          if (t >= 1) { this.rings.splice(i, 1); continue }
          x.globalAlpha = (1 - t) * .9; x.strokeStyle = r.col; x.lineWidth = r.w * (1 - t) + .4;
          x.shadowBlur = 16; x.shadowColor = r.col;
          x.beginPath(); x.arc(r.x, r.y, lerp(r.r0 || 6, r.max, ease.out(t)), 0, TAU); x.stroke();
        }
        x.globalAlpha = 1; x.shadowBlur = 0;
        if (!this.p.length && !(this.rings && this.rings.length)) { this.stop(); this.stop = null }
      });
    }
  }

  /* ------------------------------------------------------------- жесты */
  function drag(node, { onStart, onMove, onEnd, axis } = {}) {
    let id = null, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, vx = 0, vy = 0;
    const down = e => {
      const p = e.touches ? e.touches[0] : e;
      id = e.pointerId ?? 1; sx = lx = p.clientX; sy = ly = p.clientY; lt = performance.now(); vx = vy = 0;
      node.setPointerCapture && e.pointerId !== undefined && node.setPointerCapture(e.pointerId);
      onStart && onStart({ x: 0, y: 0, ex: p.clientX, ey: p.clientY, e });
    };
    const move = e => {
      if (id === null) return;
      const p = e.touches ? e.touches[0] : e;
      const now = performance.now(), dt = Math.max(8, now - lt);
      vx = (p.clientX - lx) / dt * 1000; vy = (p.clientY - ly) / dt * 1000;
      lx = p.clientX; ly = p.clientY; lt = now;
      if (axis) e.cancelable && e.preventDefault();
      onMove && onMove({ x: p.clientX - sx, y: p.clientY - sy, vx, vy, ex: p.clientX, ey: p.clientY, e });
    };
    const up = e => {
      if (id === null) return; id = null;
      onEnd && onEnd({ x: lx - sx, y: ly - sy, vx, vy, e });
    };
    node.addEventListener('pointerdown', down);
    node.addEventListener('pointermove', move, { passive: !axis });
    node.addEventListener('pointerup', up); node.addEventListener('pointercancel', up);
    return () => { node.removeEventListener('pointerdown', down); node.removeEventListener('pointermove', move);
      node.removeEventListener('pointerup', up); node.removeEventListener('pointercancel', up) };
  }

  /* ------------------------------------------------ числовой «одометр» */
  function roll(node, from, to, dur = .7, fmt = v => Math.round(v)) {
    const t0 = performance.now();
    const stop = raf(() => {
      const t = clamp((performance.now() - t0) / (dur * 1000));
      node.textContent = fmt(lerp(from, to, ease.out(t)));
      if (t === 1) stop();
    });
    return stop;
  }

  /* -------------------------------------------------- тряска контейнера */
  function shake(node, power = 8, dur = .45) {
    const t0 = performance.now();
    const stop = raf(() => {
      const t = clamp((performance.now() - t0) / (dur * 1000));
      const p = power * (1 - t) * (1 - t);
      node.style.transform = `translate(${rand(p, -p).toFixed(2)}px,${rand(p, -p).toFixed(2)}px)`;
      if (t === 1) { node.style.transform = ''; stop() }
    });
  }

  /* ------------------------------------------- генераторы рыночных данных */
  function series(n = 60, { start = 100, vol = 1.4, trend = .06, seed = Math.random() * 1e4 } = {}) {
    let s = seed, p = start; const out = [];
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647 };
    for (let i = 0; i < n; i++) {
      const o = p, mv = (rnd() - .5) * vol * 2 + trend;
      const c = o + mv, h = Math.max(o, c) + rnd() * vol * .8, l = Math.min(o, c) - rnd() * vol * .8;
      out.push({ o, h, l, c, v: .25 + rnd() * .75 }); p = c;
    }
    return out;
  }

  /* ----------------------------------------------------------- реестр */
  function register(a) { reg.push(a); return a }

  return { reg, register, clamp, lerp, rand, randi, pick, map, ease, raf, Spring, haptic, el, svg, s, FX,
           drag, roll, shake, series, TAU };
})();
window.SA = SA;


/* ===== ui.js ===== */
/* ============================================================================
   SA.ui — общие строительные блоки: иконки карт (та же сетка 400, что и в
   продакшн-генераторе) и сама карта навыка со слоями фольги/блика.
   ========================================================================== */
SA.ui = (() => {
  const T = {
    READ:     { main: '#007AFD', dark: '#002E60', light: '#66B8FF', ru: 'ЧИТАТЬ' },
    DECIDE:   { main: '#4ADE80', dark: '#1A5230', light: '#A7F3C0', ru: 'РЕШАТЬ' },
    PROTOCOL: { main: '#A78BFA', dark: '#3B1F6A', light: '#DDD6FE', ru: 'ПРОТОКОЛ' },
    PROTECT:  { main: '#F59E0B', dark: '#78440A', light: '#FDE68A', ru: 'ЗАЩИТА' },
  };

  /* Иконки — ровно те формы, что утверждены в брифе (safe-circle Ø320) */
  const P = {
    // 05 volatility: волна / воронка / циклон
    volatility: (L, c, l) => L === 1
      ? `<path d="${wavePath(78,322,210,46)}" fill="none" stroke="${c}" stroke-width="46" stroke-linecap="round"/>
         <path d="${wavePath(100,300,272,20)}" fill="none" stroke="${l}" stroke-width="22" stroke-linecap="round"/>`
      : L === 2

  function head(x, y, s, c) { return `<polygon points="${x},${y} ${x - s},${y - s * .78} ${x - s},${y + s * .78}" fill="${c}"/>` }
  function wavePath(x0, x1, y, amp, pts = 50) {

  }
  function spiralPath(cx, cy, r0, r1, turns, pts = 120) {
    let d = ''; for (let i = 0; i <= pts; i++) { const t = i / pts, a = t * turns * Math.PI * 2, r = r0 + (r1 - r0) * t;

  function icon(kind, level = 1, type = 'READ', size = 72) {

  function card({ type = 'READ', title = 'Карта', kind = 'volatility', level = 1, num = '05', w = 158, foil = true, sub = '' } = {}) {

})();


/* ===== engine2.js ===== */
/* ============================================================================
   SA+ — расширение движка под вторую волну ассетов.
   Здесь живёт всё, что переиспользуют графики и эффекты: ретина-холст,
   шкалы, сглаживание кривых, spotlight/magnetic/tilt, value-noise, конфетти,
   разбиение текста на буквы, наблюдатель видимости.
   ========================================================================== */
(() => {
const { el, raf, clamp, lerp, rand, ease, Spring } = SA;

/* ---------------------------------------------------------- ретина-холст */
SA.canvas = function (host, { alpha = true } = {}) {
  const c = el('canvas', { style: 'position:absolute;inset:0;width:100%;height:100%;display:block' });
  host.appendChild(c);
  const x = c.getContext('2d', { alpha });
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const api = {
    c, x, w: 0, h: 0, dpr,
    fit() { const r = host.getBoundingClientRect();
      api.w = Math.max(1, r.width); api.h = Math.max(1, r.height);
      c.width = api.w * dpr; c.height = api.h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); },
    clear() { x.clearRect(0, 0, api.w, api.h) },
    grid(step = 26, col = 'rgba(255,255,255,.035)') {
      x.strokeStyle = col; x.lineWidth = 1;
      for (let y = step; y < api.h; y += step) { x.beginPath(); x.moveTo(0, y + .5); x.lineTo(api.w, y + .5); x.stroke() }
      for (let i = step; i < api.w; i += step) { x.beginPath(); x.moveTo(i + .5, 0); x.lineTo(i + .5, api.h); x.stroke() }
    },
    dots(step = 18, col = 'rgba(255,255,255,.06)', r = 1.1) {
      x.fillStyle = col;
      for (let y = step; y < api.h; y += step) for (let i = step; i < api.w; i += step) {
        x.beginPath(); x.arc(i, y, r, 0, SA.TAU); x.fill() }
    },
    vgrad(stops, x0 = 0, y0 = 0, x1 = 0, y1 = api.h) {
      const g = x.createLinearGradient(x0, y0, x1, y1);
      stops.forEach(([p, c2]) => g.addColorStop(p, c2)); return g;
    },
    glowLine(pts, { color = '#66B8FF', width = 2.4, blur = 16, cap = 'round' } = {}) {
      x.save(); x.lineJoin = 'round'; x.lineCap = cap;
      x.shadowColor = color; x.shadowBlur = blur; x.strokeStyle = color; x.lineWidth = width;
      x.beginPath(); SA.tracePath(x, pts); x.stroke();
      x.shadowBlur = 0; x.globalAlpha = .55; x.lineWidth = width * .45; x.strokeStyle = '#fff';
      x.beginPath(); SA.tracePath(x, pts); x.stroke(); x.restore();
    },
  };
  api.fit(); new ResizeObserver(api.fit).observe(host);
  return api;
};

/* --------------------------------------------- пауза сцен вне экрана
   Шестьдесят живых сцен на одной странице — это шестьдесят тиков в кадре.
   Оборачиваем SA.raf: задача, зарегистрированная во время сборки ассета,
   запоминает свою сцену и молчит, пока сцена помечена как невидимая
   (dataset.off = '1' выставляет оболочка каталога по IntersectionObserver). */
const _raf = SA.raf;
SA.raf = function (fn) {
  const scope = SA._scope;
  if (!scope) return _raf(fn);
  return _raf((dt, now) => { if (scope.dataset && scope.dataset.off === '1') return; fn(dt, now) });
};

/* ------------------------------------------------------------ геометрия */
SA.scale = (d0, d1, r0, r1) => v => r0 + (clamp((v - d0) / (d1 - d0 || 1)) * (r1 - r0));
SA.scaleRaw = (d0, d1, r0, r1) => v => r0 + ((v - d0) / (d1 - d0 || 1)) * (r1 - r0);

/** мягкая кривая Катмулла–Рома по точкам [{x,y}] прямо в контекст */
SA.tracePath = function (ctx, p, tension = .5) {
  if (!p.length) return;
  ctx.moveTo(p[0].x, p[0].y);
  if (p.length < 3) { p.slice(1).forEach(q => ctx.lineTo(q.x, q.y)); return }
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    ctx.bezierCurveTo(
      p1.x + (p2.x - p0.x) / 6 * tension * 2, p1.y + (p2.y - p0.y) / 6 * tension * 2,
      p2.x - (p3.x - p1.x) / 6 * tension * 2, p2.y - (p3.y - p1.y) / 6 * tension * 2,
      p2.x, p2.y);
  }
};
SA.svgPath = function (p, tension = .5) {
  if (!p.length) return '';
  let d = `M${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += ` C${(p1.x + (p2.x - p0.x) / 6 * tension * 2).toFixed(1)} ${(p1.y + (p2.y - p0.y) / 6 * tension * 2).toFixed(1)}`
      + ` ${(p2.x - (p3.x - p1.x) / 6 * tension * 2).toFixed(1)} ${(p2.y - (p3.y - p1.y) / 6 * tension * 2).toFixed(1)}`
      + ` ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
};

/* ------------------------------------------------------- value-noise 1D */
const _n = Array.from({ length: 256 }, () => Math.random());
SA.noise = function (x) {
  const i = Math.floor(x), f = x - i, a = _n[i & 255], b = _n[(i + 1) & 255];
  const t = f * f * (3 - 2 * f); return a + (b - a) * t;
};

/* ------------------------------------------------- pointer-эффекты */
/** spotlight: прокидывает --mx/--my в CSS и подсвечивает рамку */
SA.spotlight = function (node, { radius = 190, color = 'rgba(102,184,255,.16)', border = true } = {}) {
  const lay = el('div', { style: `position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
    background:radial-gradient(${radius}px circle at var(--mx,50%) var(--my,50%), ${color}, transparent 72%)` });
  node.appendChild(lay);
  let bd = null;
  if (border) { bd = el('div', { style: `position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;
    transition:opacity .35s;padding:1px;
    background:radial-gradient(${radius * .9}px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.55), transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude` });
    node.appendChild(bd); }
  const on = e => { const r = node.getBoundingClientRect();
    node.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    node.style.setProperty('--my', (e.clientY - r.top) + 'px');
    lay.style.opacity = '1'; if (bd) bd.style.opacity = '1' };
  const off = () => { lay.style.opacity = '0'; if (bd) bd.style.opacity = '0' };
  node.addEventListener('pointermove', on); node.addEventListener('pointerenter', on);
  node.addEventListener('pointerleave', off);
  return { lay, destroy() { node.removeEventListener('pointermove', on); node.removeEventListener('pointerleave', off) } };
};

/** магнитная кнопка: тянется к курсору и пружинит обратно */
SA.magnetic = function (node, { power = .35, max = 16 } = {}) {
  const sx = new Spring(0, { stiff: 260, damp: 20 }), sy = new Spring(0, { stiff: 260, damp: 20 });
  raf(dt => { const a = sx.step(dt), b = sy.step(dt);
    node.style.transform = `translate(${a.toFixed(2)}px,${b.toFixed(2)}px)` });
  const host = node.parentElement || node;
  host.addEventListener('pointermove', e => {
    const r = node.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) > r.width * 1.4) { sx.set(0); sy.set(0); return }
    sx.set(clamp(dx * power, -max, max)); sy.set(clamp(dy * power, -max, max));
  });
  host.addEventListener('pointerleave', () => { sx.set(0); sy.set(0) });
};

/** 3D-тилт для любой поверхности */
SA.tilt = function (node, { max = 14, scale = 1.02, glare = false } = {}) {
  const rx = new Spring(0, { stiff: 160, damp: 17 }), ry = new Spring(0, { stiff: 160, damp: 17 }),
        sc = new Spring(1, { stiff: 160, damp: 18 });
  let g = null;
  if (glare) { g = el('div', { style: `position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transition:opacity .3s` });
    node.appendChild(g) }
  raf(dt => { node.style.transform =
    `perspective(900px) rotateX(${rx.step(dt).toFixed(2)}deg) rotateY(${ry.step(dt).toFixed(2)}deg) scale(${sc.step(dt).toFixed(3)})` });
  node.addEventListener('pointermove', e => {
    const r = node.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    ry.set((px - .5) * max * 2); rx.set(-(py - .5) * max * 2); sc.set(scale);
    if (g) { g.style.opacity = '1'; g.style.backgroundPosition = `${px * 100}% 0` }
  });
  node.addEventListener('pointerleave', () => { rx.set(0); ry.set(0); sc.set(1); if (g) g.style.opacity = '0' });
};

/* ------------------------------------------------------- текст по буквам */
SA.splitText = function (node, text, { cls = '' } = {}) {
  node.textContent = '';
  const spans = [];
  [...text].forEach(ch => {
    const s = el('span', { class: cls, style: 'display:inline-block;white-space:pre;will-change:transform,opacity' , text: ch });
    node.appendChild(s); spans.push(s);
  });
  return spans;
};

const GLYPHS = '▁▂▃▄▅▆▇█#%&@$0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
/** scramble: текст «дешифруется» слева направо */
SA.scramble = function (node, text, { dur = .9, speed = 2 } = {}) {
  const t0 = performance.now(); const n = text.length;
  const stop = raf(() => {
    const t = clamp((performance.now() - t0) / (dur * 1000));
    const reveal = Math.floor(ease.out(t) * n);
    let out = text.slice(0, reveal);
    for (let i = reveal; i < n; i++) out += text[i] === ' ' ? ' ' : GLYPHS[(Math.random() * GLYPHS.length) | 0];
    node.textContent = out;
    if (t === 1) { node.textContent = text; stop() }
  });
  return stop;
};

/* -------------------------------------------------------------- конфетти */
SA.confetti = function (fx, { x, y, n = 70, colors = ['#FFD166', '#4ADE80', '#66B8FF', '#A78BFA', '#fff'] } = {}) {
  fx.emit({ x, y, n: Math.round(n * .6), color: colors, speed: 460, life: 1.5, size: 5, gravity: 720, drag: .92, shape: 'rect' });
  fx.emit({ x, y, n: Math.round(n * .4), color: colors, speed: 300, life: 1.8, size: 3.4, gravity: 520, drag: .9, shape: 'tri' });
  fx.ring({ x, y, r: 180, color: '#fff', width: 2.5, dur: .5 });
};

/* ------------------------------------------------- наблюдатель видимости */
SA.inView = function (node, cb, opts = {}) {
  const io = new IntersectionObserver(es => es.forEach(e => cb(e.isIntersecting, e)), { threshold: .25, ...opts });
  io.observe(node); return () => io.disconnect();
};

/* ---------------------------------------------------------- форматтеры */
SA.fmt = {
  num: (v, d = 0) => Number(v).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }),
  pct: (v, d = 1) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d) + '%',
  usd: v => '$' + Number(v).toLocaleString('ru-RU', { maximumFractionDigits: 0 }),
  r: v => v.toFixed(2) + 'R',
};

/* ------------------------------------------------ генератор OHLC-истории */
SA.ohlc = function (n, { start = 100, vol = 1.5, drift = .05, seed = 42, regime = null } = {}) {
  let s = seed, p = start; const out = [];
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647 };
  for (let i = 0; i < n; i++) {
    let v = vol, d = drift;
    if (regime === 'squeeze') { v = vol * (i < n * .6 ? .35 : 2.1); }
    if (regime === 'trend') { d = drift * 2.4; v = vol * .8 }
    if (regime === 'range') { d = -(p - start) * .08; v = vol }
    const o = p, mv = (rnd() - .5) * v * 2 + d, c = o + mv;
    out.push({ i, o, h: Math.max(o, c) + rnd() * v * .9, l: Math.min(o, c) - rnd() * v * .9, c, v: .2 + rnd() * .8 });
    p = c;
  }
  return out;
};

/* ------------------------------------------- бейдж-подпись для графиков */
SA.tipEl = () => el('div', { class: 'mono', style: `position:absolute;pointer-events:none;opacity:0;transition:opacity .18s;
  background:rgba(7,9,13,.92);border:1px solid #2A3441;border-radius:9px;padding:6px 8px;font-size:10px;
  box-shadow:0 10px 24px -14px #000;backdrop-filter:blur(8px);z-index:6;white-space:nowrap` });
})();


/* ===== engine3.js ===== */
/* ============================================================================
   SA++ — третий слой движка: физика, процедурная графика и жесты.
   Что сюда вынесено и почему:
   • детерминированный PRNG — чтобы сцены выглядели одинаково при каждом показе;

/* ============================================================================

/* ------------------------------------------------------- перенос текста */
SA.wrapText = function (ctx, text, maxW) {
  const words = String(text).split(' ');
  const lines = []; let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    const width = ctx.measureText ? (ctx.measureText(test).width || 0) : test.length * 5;
    if (width > maxW && line) { lines.push(line); line = w } else line = test;
  });
  if (line) lines.push(line);
  return lines;
};

/* ------------------------------------------------------------ FLIP */
/** Снимает позиции, выполняет mutate(), анимирует разницу. */
SA.flip = function (nodes, mutate, { dur = 420, stagger = 18 } = {}) {
  const first = new Map();
  nodes.forEach(n => first.set(n, n.getBoundingClientRect()));
  mutate();
  nodes.forEach((n, i) => {
    const a = first.get(n), b = n.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    n.style.transition = 'none';
    n.style.transform = `translate(${dx}px,${dy}px)`;
    requestAnimationFrame(() => {
      n.style.transition = `transform ${dur}ms cubic-bezier(.22,1,.3,1) ${i * stagger}ms`;
      n.style.transform = '';
    });
  });
};

/* ------------------------------------------- перетаскивание строк списка */
SA.sortable = function (host, { handleSel = null, onReorder } = {}) {

    const handle = handleSel ? node.querySelector(handleSel) || node : node;

      onStart(d) {

        node.style.zIndex = '20'; node.style.transition = 'none';
        node.style.transform = 'scale(1.03)';
        node.style.boxShadow = '0 16px 30px -18px #000';

      onMove(d) {
        if (!dragging) return;
        const dy = d.ey - startY;

        const rects = rowsRects();
        const myMid = rects[order.indexOf(node)].top + rects[order.indexOf(node)].height / 2 + dy;
        order.forEach((other, i) => {
          if (other === node) return;

};

/* -------------------------------------------------- виртуальный список */
SA.virtualList = function (host, { count, rowH = 34, render, buffer = 4 }) {
  host.style.position = 'relative'; host.style.overflow = 'auto';
  const spacer = el('div', { style: `height:${count * rowH}px;position:relative` });
  host.appendChild(spacer);
  const pool = new Map();
  function draw() {
    const top = host.scrollTop, h = host.clientHeight || 200;
    const from = Math.max(0, Math.floor(top / rowH) - buffer);
    const to = Math.min(count - 1, Math.ceil((top + h) / rowH) + buffer);
    pool.forEach((node, i) => { if (i < from || i > to) { node.remove(); pool.delete(i) } });
    for (let i = from; i <= to; i++) {
      if (pool.has(i)) continue;
      const node = render(i);
      node.style.position = 'absolute'; node.style.left = '0'; node.style.right = '0';
      node.style.top = (i * rowH) + 'px'; node.style.height = (rowH - 4) + 'px';

};

/* --------------------------------------------- точки из текста (частицы) */
SA.textPoints = function (text, { size = 72, step = 4, font = '900 72px ui-sans-serif,system-ui' } = {}) {
  try {

    x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';

    const pts = [];
    for (let py = 0; py < h; py += step)

  } catch (e) { return [] }

/* ----------------------------------------------------- морфинг контуров */
/** Пересэмплирует полигон в n точек — чтобы морфить разные формы. */
SA.resample = function (pts, n) {

    const t = (i / n) * total;

    const f = t - Math.floor(t);
    out.push({ x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f) });

};

SA.polygon = function (n, r = 1, rot = -Math.PI / 2, wob = 0) {

    const a = rot + (i / n) * TAU;
    const rr = r * (1 + (wob ? Math.sin(i * 2.3) * wob : 0));
    return { x: Math.cos(a) * rr, y: Math.sin(a) * rr };
  });

/* ------------------------------------------------------- поле волн */
SA.waveField = function () {
  const src = [];
  return {
    add(x, y, { amp = 16, speed = 220, width = 60, decay = 1.6 } = {}) {
      src.push({ x, y, t: 0, amp, speed, width, decay });
      if (src.length > 8) src.shift();

    step(dt) { src.forEach(s => s.t += dt); for (let i = src.length - 1; i >= 0; i--) if (src[i].t > src[i].decay) src.splice(i, 1) },
    at(x, y) {
      let v = 0;
      src.forEach(s => {
        const d = Math.hypot(x - s.x, y - s.y);
        const r = s.t * s.speed;
        const k = Math.exp(-((d - r) ** 2) / (2 * s.width * s.width));
        v += Math.sin((d - r) * .08) * k * s.amp * (1 - s.t / s.decay);
      });
      return v;
    },
    /** Радиальное смещение точки — вектор, пригодный для деформации сетки. */
    disp(x, y) {
      let dx = 0, dy = 0;
      src.forEach(s => {
        const ox = x - s.x, oy = y - s.y;
        const d = Math.hypot(ox, oy) || .001;
        const r = s.t * s.speed;
        const k = Math.exp(-((d - r) ** 2) / (2 * s.width * s.width));
        const a = Math.sin((d - r) * .08) * k * s.amp * (1 - s.t / s.decay);
        dx += ox / d * a; dy += oy / d * a;
      });
      return { x: dx, y: dy };
    },
    get count() { return src.length },
  };
};

/* ===== engine5.js ===== */
/* ============================================================================
   SA5 — слой индикаторов, статистики и переиспользуемых контролов.

   Зачем отдельный слой. Волны 1–4 закрывали «как это ощущается»: жест,
   отклик, эффект. Пятая волна закрывает «что это значит»: RSI, ATR, дельта,
   матожидание, просадка, размер позиции. Чтобы 32 новых ассета не
   превратились в 32 копии одного и того же кода, сюда вынесены:

   • честная математика индикаторов (ровно те формулы, что в терминале);
   • статистика преимущества: Монте-Карло, Келли, матожидание, просадка;
   • интервальное повторение SM-2 — ядро механики запоминания;
   • рендер свечей/гистограмм/осей одной строкой;
   • контролы: слайдер с подписью, сегмент-переключатель, вердикт-плашка.

   Главный приём обучения, который поддерживает этот слой — «крути параметр
   и смотри, что ломается». Ни в одном видеокурсе период RSI потрогать нельзя.
   ========================================================================== */
(() => {
const { el, clamp, lerp, TAU } = SA;

/* ======================================================= базовые скользящие */
SA.sma = function (src, n) {
  const out = new Array(src.length).fill(null);
  let s = 0;
  for (let i = 0; i < src.length; i++) {
    s += src[i];
    if (i >= n) s -= src[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
};

SA.ema = function (src, n) {
  const out = new Array(src.length).fill(null);
  const k = 2 / (n + 1);
  let prev = null;
  for (let i = 0; i < src.length; i++) {
    prev = prev === null ? src[i] : src[i] * k + prev * (1 - k);
    out[i] = i >= n - 1 ? prev : null;
  }
  return out;
};

SA.stdev = function (src, n) {
  const out = new Array(src.length).fill(null);
  for (let i = n - 1; i < src.length; i++) {
    let m = 0;
    for (let j = i - n + 1; j <= i; j++) m += src[j];
    m /= n;
    let v = 0;
    for (let j = i - n + 1; j <= i; j++) v += (src[j] - m) ** 2;
    out[i] = Math.sqrt(v / n);
  }
  return out;
};

/* ============================================================== осцилляторы */
/** RSI по Уайлдеру — сглаживание средних, а не простое среднее. */
SA.rsi = function (closes, n = 14) {
  const out = new Array(closes.length).fill(null);
  let gain = 0, loss = 0;
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    const g = Math.max(0, d), l = Math.max(0, -d);
    if (i <= n) { gain += g / n; loss += l / n; if (i === n) out[i] = rsiVal(gain, loss); continue }
    gain = (gain * (n - 1) + g) / n;
    loss = (loss * (n - 1) + l) / n;
    out[i] = rsiVal(gain, loss);
  }
  return out;
};
function rsiVal(g, l) { return l === 0 ? 100 : 100 - 100 / (1 + g / l) }

SA.macd = function (closes, fast = 12, slow = 26, sig = 9) {
  const ef = SA.ema(closes, fast), es = SA.ema(closes, slow);
  const line = closes.map((_, i) => (ef[i] === null || es[i] === null) ? null : ef[i] - es[i]);
  const clean = line.map(v => v === null ? 0 : v);
  const sl = SA.ema(clean, sig);
  const signal = line.map((v, i) => v === null ? null : sl[i]);
  const hist = line.map((v, i) => (v === null || signal[i] === null) ? null : v - signal[i]);
  return { line, signal, hist };
};

SA.stoch = function (bars, n = 14, d = 3) {
  const k = new Array(bars.length).fill(null);
  for (let i = n - 1; i < bars.length; i++) {
    let hh = -Infinity, ll = Infinity;
    for (let j = i - n + 1; j <= i; j++) { hh = Math.max(hh, bars[j].h); ll = Math.min(ll, bars[j].l) }
    k[i] = hh === ll ? 50 : (bars[i].c - ll) / (hh - ll) * 100;
  }
  const kc = k.map(v => v === null ? 50 : v);
  const ds = SA.sma(kc, d).map((v, i) => k[i] === null ? null : v);
  return { k, d: ds };
};

/* ============================================================ волатильность */
SA.trueRange = function (bars) {
  return bars.map((b, i) => i === 0 ? b.h - b.l
    : Math.max(b.h - b.l, Math.abs(b.h - bars[i - 1].c), Math.abs(b.l - bars[i - 1].c)));
};
SA.atr = function (bars, n = 14) {
  const tr = SA.trueRange(bars);
  const out = new Array(bars.length).fill(null);
  let a = null;
  for (let i = 0; i < bars.length; i++) {
    if (i < n) { a = a === null ? tr[i] : (a * i + tr[i]) / (i + 1); if (i === n - 1) out[i] = a; continue }
    a = (a * (n - 1) + tr[i]) / n;
    out[i] = a;
  }
  return out;
};

SA.bollinger = function (closes, n = 20, k = 2) {
  const mid = SA.sma(closes, n), sd = SA.stdev(closes, n);
  const up = mid.map((m, i) => m === null ? null : m + sd[i] * k);
  const dn = mid.map((m, i) => m === null ? null : m - sd[i] * k);
  const width = mid.map((m, i) => m === null ? null : (up[i] - dn[i]) / m * 100);
  return { mid, up, dn, width, sd };
};

/* ================================================================== объёмы */
SA.obv = function (bars) {
  let v = 0;
  return bars.map((b, i) => {
    if (i) v += b.c > bars[i - 1].c ? b.v : b.c < bars[i - 1].c ? -b.v : 0;
    return v;
  });
};

SA.vwap = function (bars) {
  let pv = 0, vv = 0;
  return bars.map(b => { const tp = (b.h + b.l + b.c) / 3; pv += tp * b.v; vv += b.v; return pv / vv });
};

/** Профиль объёма: распределение объёма по ценовым корзинам + POC и зона 70%. */
SA.volumeProfile = function (bars, bins = 26) {
  const lo = Math.min(...bars.map(b => b.l)), hi = Math.max(...bars.map(b => b.h));
  const step = (hi - lo) / bins || 1;
  const cells = Array.from({ length: bins }, (_, i) => ({ lo: lo + i * step, hi: lo + (i + 1) * step, v: 0 }));
  bars.forEach(b => {
    const a = Math.max(0, Math.floor((b.l - lo) / step));
    const z = Math.min(bins - 1, Math.floor((b.h - lo) / step));
    const share = b.v / Math.max(1, z - a + 1);
    for (let i = a; i <= z; i++) cells[i].v += share;
  });
  const total = cells.reduce((s, c) => s + c.v, 0) || 1;
  let poc = 0;
  cells.forEach((c, i) => { if (c.v > cells[poc].v) poc = i });
  /* зона стоимости: добавляем соседей к POC, пока не наберём 70% объёма */
  let lowI = poc, hiI = poc, acc = cells[poc].v;
  while (acc / total < .7 && (lowI > 0 || hiI < bins - 1)) {
    const a = lowI > 0 ? cells[lowI - 1].v : -1;
    const b = hiI < bins - 1 ? cells[hiI + 1].v : -1;
    if (b > a) { hiI++; acc += cells[hiI].v } else { lowI--; acc += cells[lowI].v }
  }
  return { cells, poc, total, va: [cells[lowI].lo, cells[hiI].hi], max: cells[poc].v };
};

/* ============================================================ уровни и сетки */
SA.fib = function (a, b) {
  const L = [0, .236, .382, .5, .618, .786, 1, 1.272, 1.618];
  return L.map(k => ({ k, v: a + (b - a) * k }));
};
SA.pivots = function (bar) {
  const p = (bar.h + bar.l + bar.c) / 3;
  return { p, r1: 2 * p - bar.l, s1: 2 * p - bar.h,
    r2: p + (bar.h - bar.l), s2: p - (bar.h - bar.l) };
};
SA.ichimoku = function (bars, t = 9, k = 26, s = 52) {
  const mid = (i, n) => {
    if (i < n - 1) return null;
    let hh = -Infinity, ll = Infinity;
    for (let j = i - n + 1; j <= i; j++) { hh = Math.max(hh, bars[j].h); ll = Math.min(ll, bars[j].l) }
    return (hh + ll) / 2;
  };
  const tenkan = bars.map((_, i) => mid(i, t));
  const kijun = bars.map((_, i) => mid(i, k));
  const spanA = bars.map((_, i) => (tenkan[i] === null || kijun[i] === null) ? null : (tenkan[i] + kijun[i]) / 2);
  const spanB = bars.map((_, i) => mid(i, s));
  return { tenkan, kijun, spanA, spanB, shift: k };
};

/* =============================================================== статистика */
SA.mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
SA.quantile = function (arr, q) {
  const a = [...arr].sort((x, y) => x - y);
  if (!a.length) return 0;
  const p = (a.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p);
  return lo === hi ? a[lo] : lerp(a[lo], a[hi], p - lo);
};
SA.corr = function (a, b) {
  const ma = SA.mean(a), mb = SA.mean(b);
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) {
    const x = a[i] - ma, y = b[i] - mb;
    num += x * y; da += x * x; db += y * y;
  }
  return da && db ? num / Math.sqrt(da * db) : 0;
};
SA.linreg = function (ys) {
  const n = ys.length;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  ys.forEach((y, x) => { sx += x; sy += y; sxy += x * y; sxx += x * x });
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx || 1);
  return { slope, intercept: (sy - slope * sx) / n };
};
SA.histogram = function (vals, bins = 20, lo = null, hi = null) {
  const mn = lo === null ? Math.min(...vals) : lo;
  const mx = hi === null ? Math.max(...vals) : hi;
  const step = (mx - mn) / bins || 1;
  const out = Array.from({ length: bins }, (_, i) => ({ lo: mn + i * step, hi: mn + (i + 1) * step, n: 0 }));
  vals.forEach(v => { const i = clamp(Math.floor((v - mn) / step), 0, bins - 1); out[i].n++ });
  return { bins: out, max: Math.max(...out.map(b => b.n), 1), step, mn, mx };
};

/* ---------------------------------------------- деньги: риск и ожидание */
/** Матожидание в R: сколько в среднем приносит одна сделка. */
SA.expectancy = (wr, rr) => wr * rr - (1 - wr);
/** Доля Келли; в торговле берут четверть — отсюда опция frac. */
SA.kelly = function (wr, rr, frac = 1) {
  const k = (wr * (rr + 1) - 1) / rr;
  return Math.max(0, k) * frac;
};
/** Кривая счёта по серии R с фиксированным риском в процентах. */
SA.equity = function (rs, { start = 10000, risk = .01, compound = true } = {}) {
  let eq = start; const out = [eq];
  rs.forEach(r => { eq += (compound ? eq : start) * risk * r; out.push(Math.max(0, eq)) });
  return out;
};
SA.maxDD = function (curve) {
  let peak = curve[0], dd = 0, at = 0, from = 0, pk = 0;
  curve.forEach((v, i) => {
    if (v > peak) { peak = v; pk = i }
    const d = (peak - v) / peak;
    if (d > dd) { dd = d; at = i; from = pk }

};
SA.streaks = function (flags) {
  let win = 0, loss = 0, cw = 0, cl = 0;
  flags.forEach(f => {
    if (f) { cw++; cl = 0; win = Math.max(win, cw) } else { cl++; cw = 0; loss = Math.max(loss, cl) }
  });

};
/** Монте-Карло: trials путей по n сделок — распределение итога и просадки. */
SA.monteCarlo = function ({ wr = .45, rr = 2, n = 100, trials = 300, risk = .01, seed = 7 } = {}) {

  const ends = [], dds = [], paths = [];
  for (let t = 0; t < trials; t++) {
    const rs = Array.from({ length: n }, () => rnd() < wr ? rr : -1);
    const eq = SA.equity(rs, { risk });
    ends.push(eq[eq.length - 1] / eq[0] - 1);
    dds.push(SA.maxDD(eq).dd);

/** Стандартная ошибка винрейта: сколько сделок нужно, чтобы поверить цифре. */
SA.wrError = (wr, n) => Math.sqrt(Math.max(1e-6, wr * (1 - wr) / Math.max(1, n)));

/* ------------------------------------------------- интервальное повторение */
/** Упрощённый SM-2: q от 0 до 5, возвращает новый интервал в днях. */
SA.sm2 = function (card, q) {
  const c = { ef: 2.5, n: 0, int: 0, ...card };
  if (q < 3) { c.n = 0; c.int = 1 }
  else {
    c.n += 1;
    c.int = c.n === 1 ? 1 : c.n === 2 ? 6 : Math.round(c.int * c.ef);
    c.ef = Math.max(1.3, c.ef + (.1 - (5 - q) * (.08 + (5 - q) * .02)));
  }
  c.due = c.int;
  return c;
};

/* ============================================================ рендер-хелперы */
/** Свечи одной строкой: возвращает шкалы, чтобы рисовать поверх. */
SA.candles = function (g, bars, { x0 = 10, x1 = null, y0 = 10, y1 = null, pad = 1.6, body = .6,
  up = '#4ADE80', dn = '#FF4D4D', alpha: al = .85 } = {}) {
  const X1 = x1 === null ? g.w - 10 : x1, Y1 = y1 === null ? g.h - 10 : y1;
  const lo = Math.min(...bars.map(b => b.l)) - pad, hi = Math.max(...bars.map(b => b.h)) + pad;
  const X = SA.scaleRaw(0, bars.length - 1, x0, X1), Y = SA.scaleRaw(lo, hi, Y1, y0);
  const w = (X1 - x0) / bars.length * body;
  bars.forEach((d, i) => {
    const isUp = d.c >= d.o;
    g.x.strokeStyle = SA.alpha(isUp ? up : dn, al);
    g.x.fillStyle = g.x.strokeStyle;
    g.x.lineWidth = Math.max(1, w * .2);
    g.x.beginPath(); g.x.moveTo(X(i), Y(d.h)); g.x.lineTo(X(i), Y(d.l)); g.x.stroke();
    const a = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));
    g.x.fillRect(X(i) - w / 2, a, w, Math.max(1.2, b - a));
  });
  return { X, Y, lo, hi, w };
};

/** Линия индикатора с обрывами на null. */
SA.plot = function (g, vals, X, Y, { color = '#66B8FF', width = 1.6, dash = null, glow = 0 } = {}) {
  g.x.save();
  g.x.strokeStyle = color; g.x.lineWidth = width; g.x.lineJoin = 'round';
  if (dash) g.x.setLineDash(dash);
  if (glow) { g.x.shadowColor = color; g.x.shadowBlur = glow }
  let open = false;
  g.x.beginPath();
  vals.forEach((v, i) => {
    if (v === null || v === undefined || !isFinite(v)) { open = false; return }
    const px = X(i), py = Y(v);
    open ? g.x.lineTo(px, py) : g.x.moveTo(px, py);
    open = true;
  });
  g.x.stroke(); g.x.restore();
};

/** Заливка между двумя сериями (облако Ишимоку, полосы Боллинджера). */
SA.band = function (g, a, b, X, Y, color) {
  const idx = a.map((v, i) => (v === null || b[i] === null) ? -1 : i).filter(i => i >= 0);
  if (idx.length < 2) return;
  g.x.beginPath();
  idx.forEach((i, j) => j ? g.x.lineTo(X(i), Y(a[i])) : g.x.moveTo(X(i), Y(a[i])));
  for (let j = idx.length - 1; j >= 0; j--) g.x.lineTo(X(idx[j]), Y(b[idx[j]]));
  g.x.closePath(); g.x.fillStyle = color; g.x.fill();
};

/** Гистограмма с нулевой осью (MACD, дельта). */
SA.histBars = function (g, vals, X, Y, { pos = '#4ADE80', neg = '#FF4D4D', w = 3 } = {}) {
  const y0 = Y(0);
  vals.forEach((v, i) => {
    if (v === null) return;
    g.x.fillStyle = v >= 0 ? pos : neg;
    const y = Y(v);
    g.x.fillRect(X(i) - w / 2, Math.min(y, y0), w, Math.max(1, Math.abs(y - y0)));
  });
};

/** Горизонтальная подпись уровня у правого края. */
SA.tagRight = function (g, y, text, color, { pad = 4 } = {}) {
  g.x.font = '700 9px ui-monospace,monospace';
  const w = g.x.measureText(text).width + pad * 2;
  SA.rr(g.x, g.w - w - 2, y - 7, w, 14, 4);
  g.x.fillStyle = SA.alpha(color, .22); g.x.fill();
  g.x.strokeStyle = SA.alpha(color, .7); g.x.lineWidth = 1; g.x.stroke();
  g.x.fillStyle = color; g.x.textAlign = 'center'; g.x.textBaseline = 'middle';
  g.x.fillText(text, g.w - w / 2 - 2, y);
};

/* ================================================================ контролы */
/** Слайдер с подписью: главный инструмент «покрути параметр». */
SA.slider = function (host, { label = '', min = 0, max = 100, value = 50, step = 1,

  const top = el('div', { class: 'mono', style: `display:flex;justify-content:space-between;font-size:8.5px;
    letter-spacing:.08em;color:#6E7D8F` });
  const name = el('span', { text: label });
  const val = el('b', { style: `color:${color}` });
  top.append(name, val);
  const track = el('div', { style: `position:relative;height:18px;border-radius:9px;background:#0C1118;
    border:1px solid #1C2430;touch-action:none;cursor:pointer` });
  const fill = el('div', { style: `position:absolute;left:0;top:0;bottom:0;border-radius:9px;
    background:linear-gradient(90deg,${SA.alpha(color, .25)},${SA.alpha(color, .55)})` });
  const knob = el('div', { style: `position:absolute;top:2px;width:14px;height:14px;border-radius:7px;background:#fff;
    box-shadow:0 0 10px ${SA.alpha(color, .7)};margin-left:-7px` });
  track.append(fill, knob); wrap.append(top, track); host.appendChild(wrap);
  let v = value;
  const api = {
    get value() { return v },
    set(nv, silent) {
      v = clamp(Math.round(nv / step) * step, min, max);
      const k = (v - min) / (max - min || 1);
      fill.style.width = (k * 100) + '%';
      knob.style.left = (k * 100) + '%';
      val.textContent = fmt(v);
      if (!silent && onInput) onInput(v);
      return v;
    },
    node: wrap, track,
  };
  const pick = ex => { const r = track.getBoundingClientRect();
    api.set(min + clamp((ex - r.left) / (r.width || 1)) * (max - min)) };
  SA.drag(track, { axis: true,
    onStart(d) { pick(d.ex); SA.haptic('light') },
    onMove(d) { pick(d.ex) },
    onEnd() { SA.haptic('rigid') } });
  api.set(value, true);
  return api;
};

/** Сегмент-переключатель; возвращает api с set/index. */
SA.segment = function (host, labels, { value = 0, color = '#66B8FF', onPick } = {}) {
  const wrap = el('div', { style: `display:flex;gap:3px;padding:3px;border-radius:10px;background:#0C1118;
    border:1px solid #1C2430` });
  host.appendChild(wrap);
  let cur = value;
  const nodes = labels.map((t, i) => {
    const b = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:6px 2px;border-radius:7px;
      font-size:9px;cursor:pointer;transition:.2s;color:#6E7D8F`, text: t });
    b.addEventListener('click', () => api.set(i));
    wrap.appendChild(b); return b;
  });
  const api = {
    get index() { return cur },
    set(i, silent) {
      cur = i;
      nodes.forEach((b, j) => {
        b.style.background = j === i ? SA.alpha(color, .16) : 'transparent';
        b.style.color = j === i ? color : '#6E7D8F';
        b.style.boxShadow = j === i ? `inset 0 0 0 1px ${SA.alpha(color, .45)}` : 'none';
      });
      if (!silent) { SA.haptic('selection'); onPick && onPick(i, labels[i]) }
    },
    node: wrap, nodes,
  };
  api.set(value, true);
  return api;
};

/** Плашка вердикта: один и тот же визуальный язык «правильно/опасно/мимо». */
SA.verdict = function (host, { style: st = '' } = {}) {
  const n = el('div', { class: 'mono', style: `font-size:9.5px;line-height:1.45;padding:6px 9px;border-radius:9px;
    background:rgba(7,9,13,.86);border:1px solid #1C2430;color:#9FB0C2;transition:.25s;${st}` });
  host.appendChild(n);
  const COL = { ok: '#4ADE80', warn: '#F59E0B', bad: '#FF4D4D', info: '#66B8FF', mute: '#55687C' };
  return {
    node: n,
    set(kind, html) {
      const c = COL[kind] || COL.info;
      n.style.borderColor = SA.alpha(c, .45);
      n.style.background = SA.alpha(c, .08);
      n.innerHTML = html;
      n.style.color = kind === 'mute' ? '#6E7D8F' : '#C7D3E1';
    },
  };
};

/** Ряд KPI-плиток — быстрый способ показать «что посчиталось». */
SA.kpiRow = function (host, items) {
  const row = el('div', { style: 'display:flex;gap:5px' });
  host.appendChild(row);
  const cells = items.map(it => {
    const c = el('div', { style: `flex:1;min-width:0;border-radius:9px;padding:5px 6px;background:#0E131A;
      border:1px solid #1A222C;display:flex;flex-direction:column;gap:1px` });
    c.innerHTML = `<span class="mono" style="font-size:7.5px;letter-spacing:.1em;color:#55687C">${it.t}</span>
      <b class="mono v" style="font-size:12px;color:${it.c || '#E6EDF3'}">${it.v || '—'}</b>`;
    row.appendChild(c);
    return c;
  });
  return {
    row,
    set(i, v, color) {
      const b = cells[i].querySelector('.v');
      if (!b) return;
      b.textContent = v;
      if (color) b.style.color = color;
    },
  };
};
})();


/* ===== assets-cards.js ===== */
/* ============================================================================
   ГРУППА 1 — КАРТЫ (01–08): тилт, апгрейд, пак, слияние, рука, слот,
   свайп-решение, разблокировка.
   ========================================================================== */
const { el, raf, Spring, haptic, clamp, lerp, rand, ease, drag, FX } = SA;

/* 01 ------------------------------------------------------------------- */
SA.register({
  n: '01', title: 'Голо-карта: 3D-тилт и фольга', group: 'cards',
  hint: 'Веди пальцем по карте — <b>наклон, фольга и блик</b> идут за курсором',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    const card = SA.ui.card({ type: 'READ', num: '05', kind: 'volatility', level: 3, w: 170,
      title: 'Контекст волатильности', sub: 'HOLO' });
    const holder = el('div', { style: 'perspective:900px;display:grid;place-items:center;width:100%;height:100%' }, [card]);
    card.style.transformStyle = 'preserve-3d';
    stage.appendChild(holder);
    const fx = new FX(stage);
    const rx = new Spring(0, { stiff: 150, damp: 16 }), ry = new Spring(0, { stiff: 150, damp: 16 });
    const gl = new Spring(0, { stiff: 90, damp: 20 });
    const foil = card.querySelector('.foil'), glare = card.querySelector('.glare');
    let px = .5, py = .5;
    const onMove = e => {
      const p = e.touches ? e.touches[0] : e, r = card.getBoundingClientRect();
      px = clamp((p.clientX - r.left) / r.width); py = clamp((p.clientY - r.top) / r.height);
      ry.set((px - .5) * 26); rx.set(-(py - .5) * 26); gl.set(1);
    };
    const reset = () => { rx.set(0); ry.set(0); gl.set(0) };
    stage.addEventListener('pointermove', onMove); stage.addEventListener('pointerleave', reset);
    stage.addEventListener('pointerdown', e => { onMove(e); haptic('light');
      const r = stage.getBoundingClientRect();
      fx.ring({ x: e.clientX - r.left, y: e.clientY - r.top, r: 70, color: '#66B8FF', width: 2.5 }); });
    raf(dt => {
      const a = rx.step(dt), b = ry.step(dt), g = gl.step(dt);
      card.style.transform = `rotateX(${a}deg) rotateY(${b}deg) scale(${1 + g * .035})`;
      foil.style.opacity = (.14 + g * .34).toFixed(3);
      foil.style.transform = `translate(${(px - .5) * -70}px,${(py - .5) * -70}px) rotate(${b * 2}deg)`;
      glare.style.transform = `translateX(${lerp(-120, 120, px)}%)`;
      glare.style.opacity = (g * .9).toFixed(2);
      card.style.boxShadow = `0 ${18 + g * 16}px ${40 + g * 26}px -22px #000, 0 0 ${g * 40}px -8px #007AFD66`;
    });
  }
});

/* 02 ------------------------------------------------------------------- */
SA.register({
  n: '02', title: 'Апгрейд карты: переворот L2 → L3', group: 'cards',
  hint: 'Жми <b>Апгрейд</b> — заряд, переворот, смена уровня иконки',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    let level = 2;
    const mk = l => SA.ui.card({ type: 'PROTECT', num: '38', kind: 'chase', level: l, w: 150,
      title: 'Не догонять', sub: 'LVL ' + l });
    const box = el('div', { style: 'position:relative;width:150px;aspect-ratio:3/4.3;transform-style:preserve-3d' });
    let face = mk(level); face.style.cssText += ';position:absolute;inset:0;width:100%;backface-visibility:hidden';
    box.appendChild(face);
    const holder = el('div', { style: 'perspective:1100px;display:flex;flex-direction:column;align-items:center;gap:12px' },
      [box, el('button', { class: 'btn', style: 'border-color:#78440A;color:#FDE68A' , text: 'Апгрейд ⇧' })]);
    stage.appendChild(holder);
    const fx = new FX(stage);
    const btn = holder.querySelector('button');
    let busy = false;
    btn.onclick = () => {
      if (busy || level >= 3) { if (level >= 3) { level = 1; btn.textContent = 'Апгрейд ⇧' } else return }
      busy = true; haptic('medium');
      const t0 = performance.now(); let swapped = false;
      const stop = raf(() => {
        const t = clamp((performance.now() - t0) / 720);
        const a = ease.io(t) * 180;
        box.style.transform = `rotateY(${a}deg) scale(${1 + Math.sin(t * Math.PI) * .12})`;
        if (!swapped && t > .5) {
          swapped = true; level = Math.min(3, level + 1);
          const nf = mk(level); nf.style.cssText += ';position:absolute;inset:0;width:100%;transform:rotateY(180deg)';
          box.replaceChild(nf, face); face = nf;
          const r = box.getBoundingClientRect(), s = stage.getBoundingClientRect();
          const cx = r.left - s.left + r.width / 2, cy = r.top - s.top + r.height / 2;
          fx.emit({ x: cx, y: cy, n: 46, color: ['#F59E0B', '#FDE68A', '#fff'], speed: 320, life: .9, size: 4, gravity: 240, shape: 'line' });
          fx.ring({ x: cx, y: cy, r: 150, color: '#FDE68A', width: 3 });
          haptic('success'); SA.shake(stage.firstChild, 6, .4);
        }
        if (t === 1) { box.style.transform = swapped ? 'rotateY(180deg)' : ''; busy = false;
          if (level >= 3) btn.textContent = 'Сбросить ↺'; stop() }
      });
    };
  }
});

/* 03 ------------------------------------------------------------------- */
SA.register({

      background:linear-gradient(160deg,#1B2432,#0C1016);border:1px solid #2A3441;box-shadow:0 20px 40px -24px #000` });
    pack.innerHTML = `<div style="position:absolute;inset:0;background:
        conic-gradient(from 210deg at 50% 40%,#007AFD33,#A78BFA33,#4ADE8033,#F59E0B33,#007AFD33);opacity:.65;filter:blur(2px)"></div>
      <div class="rip" style="position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(#222C3A,#161D27);

      <div style="position:absolute;inset:0;display:grid;place-items:center">

                  ['PROTOCOL', '26', 'pause', 'Не торговать — решение']];
    drag(pack, { axis: true,

/* 04 ------------------------------------------------------------------- */
SA.register({
  n: '04', title: 'Слияние карт: фьюз в следующий уровень', group: 'cards',
  hint: 'Тащи левую карту <b>на правую</b> — слияние, вспышка, L3',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    const a = SA.ui.card({ type: 'DECIDE', num: '16', kind: 'enter', level: 2, w: 116, title: 'Входить сейчас' });
    const b = SA.ui.card({ type: 'DECIDE', num: '16', kind: 'enter', level: 2, w: 116, title: 'Входить сейчас' });
    a.style.cssText += ';position:absolute;left:14%;top:50%;transform:translateY(-50%);cursor:grab;z-index:3;touch-action:none';
    b.style.cssText += ';position:absolute;right:14%;top:50%;transform:translateY(-50%)';
    const halo = el('div', { style: `position:absolute;right:14%;top:50%;width:118px;height:168px;transform:translateY(-50%);
      border-radius:20px;box-shadow:0 0 0 2px #4ADE8000;transition:box-shadow .2s` });
    stage.append(halo, a, b);
    const fx = new FX(stage);
    let x = 0, y = 0, merged = false;
    const home = () => { a.style.transition = 'transform .45s var(--e-snap)'; a.style.transform = 'translateY(-50%)'; x = y = 0 };
    drag(a, { axis: true,
      onStart() { a.style.transition = 'none'; a.style.cursor = 'grabbing' },
      onMove(d) { if (merged) return; x = d.x; y = d.y;
        const near = dist(); halo.style.boxShadow = `0 0 0 ${near < 70 ? 3 : 0}px #4ADE80${near < 70 ? 'aa' : '00'}`;
        a.style.transform = `translate(${x}px,calc(-50% + ${y}px)) rotate(${x * .04}deg) scale(${1 + clamp((70 - near) / 400)})`; },
      onEnd() { a.style.cursor = 'grab'; if (merged) return;
        if (dist() > 70) return home();
        merged = true; haptic('heavy');
        const rb = b.getBoundingClientRect(), s = stage.getBoundingClientRect();
        const cx = rb.left - s.left + rb.width / 2, cy = rb.top - s.top + rb.height / 2;
        a.style.transition = 'transform .32s var(--e-out),opacity .32s'; a.style.opacity = '0';
        a.style.transform = `translate(${cx - (a.getBoundingClientRect().left - s.left) - 58}px,-50%) scale(.6)`;
        setTimeout(() => {
          const n = SA.ui.card({ type: 'DECIDE', num: '16', kind: 'enter', level: 3, w: 116, title: 'Входить сейчас', sub: 'FUSED' });
          n.style.cssText += ';position:absolute;right:14%;top:50%;transform:translateY(-50%) scale(1.18);transition:transform .6s var(--e-snap)';
          stage.replaceChild(n, b);
          requestAnimationFrame(() => n.style.transform = 'translateY(-50%) scale(1)');
          fx.emit({ x: cx, y: cy, n: 56, color: ['#4ADE80', '#A7F3C0', '#fff'], speed: 380, life: 1, size: 4, shape: 'line' });
          fx.ring({ x: cx, y: cy, r: 170, color: '#A7F3C0', width: 3 });
          halo.style.boxShadow = '0 0 0 0 #0000'; haptic('success'); SA.shake(stage, 7, .45);
        }, 280);
      } });
    function dist() {
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      return Math.hypot((ra.left + ra.width / 2) - (rb.left + rb.width / 2), (ra.top + ra.height / 2) - (rb.top + rb.height / 2));
    }
  }
});

/* 05 ------------------------------------------------------------------- */
SA.register({
  n: '05', title: 'Рука: веер карт с физикой', group: 'cards',
  hint: 'Тяни карту <b>вверх</b> — она выходит из веера; отпусти выше линии, чтобы сыграть',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const zone = el('div', { style: `position:absolute;left:12px;right:12px;top:20px;height:92px;border:1.5px dashed #2A3441;
      border-radius:14px;display:grid;place-items:center;color:#6E7D8F;font-size:11px;transition:.2s` , text: 'СЛОТ РЕШЕНИЯ' });
    const hand = el('div', { style: 'position:absolute;left:0;right:0;bottom:-26px;height:190px' });
    stage.append(zone, hand);
    const fx = new FX(stage);
    const defs = [['READ', '05', 'volatility', 'Волатильность'], ['READ', '02', 'ladder', 'Старший ТФ'],
      ['DECIDE', '16', 'enter', 'Входить'], ['PROTOCOL', '26', 'pause', 'Пропустить'], ['PROTECT', '38', 'chase', 'Не догонять']];
    const N = defs.length;
    const cards = defs.map((d, i) => {
      const c = SA.ui.card({ type: d[0], num: d[1], kind: d[2], title: d[3], level: 2, w: 92 });
      const spread = 34, rot = 7;
      const base = { x: (i - (N - 1) / 2) * spread, y: Math.abs(i - (N - 1) / 2) * 9, r: (i - (N - 1) / 2) * rot };
      c.style.cssText += `;position:absolute;left:50%;bottom:0;margin-left:-46px;transform-origin:50% 130%;z-index:${i};
        touch-action:none;cursor:grab;transition:transform .42s var(--e-snap)`;
      c.dataset.base = JSON.stringify(base);
      const put = (dx = 0, dy = 0, extra = '') => c.style.transform =
        `translate(${base.x + dx}px,${base.y + dy}px) rotate(${base.r}deg) ${extra}`;
      put();
      let lifted = false;
      drag(c, { axis: true,
        onStart() { c.style.transition = 'none'; c.style.zIndex = 50; haptic('light') },
        onMove(d) {
          lifted = d.y < -40;
          c.style.transform = `translate(${base.x + d.x}px,${base.y + d.y}px) rotate(${lifted ? 0 : base.r}deg) scale(${lifted ? 1.1 : 1.02})`;

        },

          c.style.transition = 'transform .5s var(--e-snap),opacity .4s'; c.style.zIndex = i;
          zone.style.borderColor = '#2A3441'; zone.style.color = '#6E7D8F';
          if (d.y < -96) {
            const zr = zone.getBoundingClientRect(), sr = stage.getBoundingClientRect(), cr = c.getBoundingClientRect();
            c.style.transform = `translate(${base.x + (zr.left + zr.width / 2) - (cr.left + cr.width / 2)}px,

            haptic('success');
            fx.ring({ x: zr.left - sr.left + zr.width / 2, y: zr.top - sr.top + zr.height / 2, r: 120, color: '#4ADE80', width: 2.5 });
            setTimeout(() => { c.style.opacity = '.25'; }, 420);
            setTimeout(() => { c.style.opacity = '1'; put() }, 1500);
          } else { put(); haptic('light') }

      hand.appendChild(c); return c;

/* 06 ------------------------------------------------------------------- */
SA.register({
  n: '06', title: 'Магнитный слот: притяжение и фиксация', group: 'cards',
  hint: 'Тяни фишку к слоту — <b>магнитный захват</b> и щелчок фиксации',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    const slot = el('div', { style: `position:absolute;right:16%;top:50%;width:92px;height:92px;margin:-46px -46px 0 0;
      border-radius:22px;border:2px dashed #2A3441;display:grid;place-items:center;transition:.2s` });
    slot.innerHTML = `<div class="mono" style="font-size:9px;color:#6E7D8F;letter-spacing:.1em">DROP</div>`;
    const field = el('div', { style: `position:absolute;right:16%;top:50%;width:92px;height:92px;margin:-46px -46px 0 0;
      border-radius:50%;pointer-events:none;opacity:0;transition:opacity .25s;
      background:radial-gradient(circle,#007AFD33,transparent 70%)` });
    const chip = el('div', { style: `position:absolute;left:16%;top:50%;width:74px;height:74px;margin-top:-37px;border-radius:20px;
      background:linear-gradient(160deg,#16202C,#0B1016);border:1px solid #2A3441;display:grid;place-items:center;
      cursor:grab;touch-action:none;box-shadow:0 14px 28px -18px #000` });
    chip.innerHTML = SA.ui.icon('crosshair', 2, 'DECIDE', 40);
    stage.append(field, slot, chip);
    const fx = new FX(stage);
    const sx = new Spring(0, { stiff: 220, damp: 20 }), sy = new Spring(0, { stiff: 220, damp: 20 });
    let locked = false, dragging = false;
    raf(dt => { chip.style.transform = `translate(${sx.step(dt).toFixed(2)}px,${sy.step(dt).toFixed(2)}px) scale(${locked ? .92 : 1})` });
    drag(chip, { axis: true,
      onStart() { dragging = true; locked = false; chip.style.cursor = 'grabbing' },
      onMove(d) {
        const r = chip.getBoundingClientRect(), s = slot.getBoundingClientRect();
        const dx = (s.left + s.width / 2) - (r.left + r.width / 2), dy = (s.top + s.height / 2) - (r.top + r.height / 2);
        const dist = Math.hypot(dx, dy), pull = dist < 110 ? (1 - dist / 110) * .55 : 0;
        sx.set(d.x + dx * pull); sy.set(d.y + dy * pull);
        field.style.opacity = dist < 140 ? String(1 - dist / 140) : '0';

/* ============================================================================
   ГРУППА 2 — РЫНОК (09–16): график, лента, ликвидность, стакан, стоп,
   зона входа, сжатие волатильности, радар.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, ease, drag, FX, series } = SA;

/* маленький холст с ретиной и авто-ресайзом */
function canvas(host, draw) {
  const c = el('canvas', { style: 'position:absolute;inset:0;width:100%;height:100%' });
  host.appendChild(c);
  const x = c.getContext('2d'); let w = 0, h = 0, dpr = Math.min(2, devicePixelRatio || 1);
  const fit = () => { const r = host.getBoundingClientRect(); w = r.width; h = r.height;
    c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0) };
  fit(); new ResizeObserver(fit).observe(host);
  return { c, x, get w() { return w }, get h() { return h }, clear() { x.clearRect(0, 0, w, h) } };
}
const grid = (g, step = 26, col = 'rgba(255,255,255,.035)') => {
  g.x.strokeStyle = col; g.x.lineWidth = 1;
  for (let y = step; y < g.h; y += step) { g.x.beginPath(); g.x.moveTo(0, y + .5); g.x.lineTo(g.w, y + .5); g.x.stroke() }
  for (let x2 = step; x2 < g.w; x2 += step) { g.x.beginPath(); g.x.moveTo(x2 + .5, 0); g.x.lineTo(x2 + .5, g.h); g.x.stroke() }
};

SA.register({
  n: '09', title: 'Свечной график: отрисовка и скраб', group: 'market',

  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage, null); const fx = new FX(stage);
    const data = series(64, { start: 100, vol: 1.7, trend: .08, seed: 7331 });
    const badge = el('div', { class: 'mono', style: `position:absolute;padding:4px 7px;border-radius:7px;font-size:10px;
      background:#007AFD;color:#021018;pointer-events:none;opacity:0;transition:opacity .2s;font-weight:700` });
    stage.appendChild(badge);
    let reveal = 0, cursor = -1;
    const lo = Math.min(...data.map(d => d.l)), hi = Math.max(...data.map(d => d.h));
    const yOf = (v, h) => 16 + (1 - (v - lo) / (hi - lo)) * (h - 52);
    raf(dt => {
      reveal = Math.min(data.length, reveal + dt * 46);
      g.clear(); grid(g, 24);
      const n = data.length, cw = g.w / n;
      // объёмы
      data.forEach((d, i) => { if (i > reveal) return;
        g.x.fillStyle = d.c >= d.o ? 'rgba(74,222,128,.16)' : 'rgba(255,77,77,.16)';
        g.x.fillRect(i * cw + 1, g.h - 8 - d.v * 34, cw - 2, d.v * 34) });
      // свечи
      data.forEach((d, i) => {
        if (i > reveal) return;
        const up = d.c >= d.o, col = up ? '#4ADE80' : '#FF4D4D';
        const x0 = i * cw + cw / 2, a = (i === Math.floor(reveal)) ? .5 : 1;
        g.x.globalAlpha = a; g.x.strokeStyle = col; g.x.lineWidth = Math.max(1, cw * .14);
        g.x.beginPath(); g.x.moveTo(x0, yOf(d.h, g.h)); g.x.lineTo(x0, yOf(d.l, g.h)); g.x.stroke();
        g.x.fillStyle = col;
        const yA = yOf(Math.max(d.o, d.c), g.h), yB = yOf(Math.min(d.o, d.c), g.h);
        g.x.fillRect(x0 - cw * .3, yA, cw * .6, Math.max(1.5, yB - yA));
        g.x.globalAlpha = 1;
      });
      // курсор
      if (cursor >= 0 && cursor < reveal) {
        const x0 = cursor * cw + cw / 2, d = data[cursor];
        g.x.strokeStyle = 'rgba(0,122,253,.55)'; g.x.setLineDash([4, 4]); g.x.lineWidth = 1;
        g.x.beginPath(); g.x.moveTo(x0, 0); g.x.lineTo(x0, g.h); g.x.stroke();
        g.x.beginPath(); g.x.moveTo(0, yOf(d.c, g.h)); g.x.lineTo(g.w, yOf(d.c, g.h)); g.x.stroke(); g.x.setLineDash([]);
        g.x.fillStyle = '#66B8FF'; g.x.beginPath(); g.x.arc(x0, yOf(d.c, g.h), 3.6, 0, 7); g.x.fill();
        badge.style.opacity = '1'; badge.textContent = d.c.toFixed(2);

      } else badge.style.opacity = '0';
    });
    const track = e => { const r = stage.getBoundingClientRect(); const nx = clamp((e.clientX - r.left) / r.width);

    stage.addEventListener('pointermove', track);
    stage.addEventListener('pointerleave', () => cursor = -1);
    stage.addEventListener('pointerdown', e => { track(e); haptic('light');
      const r = stage.getBoundingClientRect(); fx.ring({ x: e.clientX - r.left, y: e.clientY - r.top, r: 48, color: '#66B8FF', width: 2 }) });
  }
});

SA.register({
  n: '11', title: 'Карта ликвидности: тепло под пальцем', group: 'market',

    const pools = Array.from({ length: 9 }, () => ({ x: rand(.92, .08), y: rand(.9, .1), w: rand(.3, .08), s: rand(1, .35) }));
    let torch = { x: -1, y: -1, r: new Spring(0, { stiff: 140, damp: 18 }) };
    raf(dt => {
      g.clear(); grid(g, 22);
      const R = torch.r.step(dt) * 92;
      // базовые уровни
      g.x.strokeStyle = 'rgba(255,255,255,.1)'; g.x.lineWidth = 1.4;
      pools.forEach(p => { g.x.beginPath(); g.x.moveTo((p.x - p.w / 2) * g.w, p.y * g.h); g.x.lineTo((p.x + p.w / 2) * g.w, p.y * g.h); g.x.stroke() });
      if (R > 2 && torch.x >= 0) {
        const grd = g.x.createRadialGradient(torch.x, torch.y, 4, torch.x, torch.y, R);
        grd.addColorStop(0, 'rgba(0,122,253,.22)'); grd.addColorStop(1, 'rgba(0,122,253,0)');
        g.x.fillStyle = grd; g.x.beginPath(); g.x.arc(torch.x, torch.y, R, 0, 7); g.x.fill();

          const px = p.x * g.w, py = p.y * g.h, d = Math.hypot(px - torch.x, py - torch.y);

    const lo = Math.min(...data.map(d => d.l)) - 2, hi = Math.max(...data.map(d => d.h)) + 2;
    const entry = data[data.length - 1].c;
    let stopY = .74, hud;
    hud = el('div', { class: 'mono', style: `position:absolute;left:10px;top:10px;font-size:10px;line-height:1.7;

    const draw = () => {
      g.clear(); grid(g, 24);
      const cw = g.w / data.length;
      const yOf = v => 10 + (1 - (v - lo) / (hi - lo)) * (g.h - 30);
      data.forEach((d, i) => { const up = d.c >= d.o, c = up ? 'rgba(74,222,128,.75)' : 'rgba(255,77,77,.75)';

      const ye = yOf(entry);

      g.x.beginPath(); g.x.moveTo(0, ye); g.x.lineTo(g.w, ye); g.x.stroke(); g.x.setLineDash([]);
      const ys = stopY * g.h;
      g.x.fillStyle = 'rgba(255,77,77,.10)'; g.x.fillRect(0, ye, g.w, ys - ye);
      g.x.strokeStyle = '#FF4D4D'; g.x.lineWidth = 2; g.x.beginPath(); g.x.moveTo(0, ys); g.x.lineTo(g.w, ys); g.x.stroke();

      line.style.top = ys + 'px';

SA.register({

  build(stage) {
    const g = canvas(stage); const fx = new FX(stage);
    const slider = el('div', { style: `position:absolute;left:14px;right:14px;bottom:14px;height:30px;border-radius:15px;
      background:#11161D;border:1px solid #1C2430;touch-action:none;cursor:ew-resize` });
    const knob = el('div', { style: `position:absolute;top:3px;left:3px;width:24px;height:22px;border-radius:11px;background:#66B8FF;

    slider.appendChild(knob); stage.append(slider, cap);
    let sq = .25, phase = 0, released = 0;
    raf(dt => {
      phase += dt * (1 + sq * 6); released = Math.max(0, released - dt * 1.6);
      g.clear();
      const amp = (released > 0 ? released * 46 : lerp(26, 3, sq));
      const freq = lerp(2.4, 7.5, sq) + released * 3;
      g.x.lineWidth = lerp(2, 4.4, sq); g.x.strokeStyle = released > 0 ? '#F59E0B' : (sq > .72 ? '#FFD166' : '#66B8FF');

      g.x.beginPath();
      for (let i = 0; i <= 120; i++) { const t = i / 120, x = t * g.w;

        i ? g.x.lineTo(x, y) : g.x.moveTo(x, y) }
