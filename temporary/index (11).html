        g.x.fillText(a, padL + i * size + size / 2, padT - 10);
      });
      g.size = size; g.padL = padL; g.padT = padT;
    });
    stage.addEventListener('pointerdown', e => {
      const p = local(stage, e);
      const j = Math.floor((p.x - g.padL) / g.size), i = Math.floor((p.y - g.padT) / g.size);
      if (i < 0 || j < 0 || i >= A.length || j >= A.length) { sel = null; return }
      sel = [i, j]; haptic('selection');
      const v = M[i][j];
      hud.innerHTML = i === j
        ? `<b>${A[i]}</b> с самим собой — это и есть твоя «диверсификация»`
        : `<b>${A[i]} / ${A[j]}</b> = <b style="color:${v > .7 ? '#FF4D4D' : '#66B8FF'}">${v.toFixed(2)}</b> ·
           две позиции = <b>${(1 + v).toFixed(2)}×</b> риска, а не 2×`;
    });
  }
});

/* 66 ---------------------------------------------------------------------
   Воронка идеи. Смысл: из ста «идей» до прибыльной сделки доходит три.
   Интерактив: фильтры воронки включаются и меняют выход.                   */
SA.register({
  n: '66', title: 'Воронка идеи: от сигнала до прибыли', group: 'flow',
  hint: 'Включай фильтры — <b>воронка пересчитывается</b> в реальном времени',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const FILTERS = [
      { t: 'Тренд ст. ТФ', keep: .55, on: true, c: '#007AFD' },
      { t: 'Зона и уровень', keep: .6, on: true, c: '#66B8FF' },
      { t: 'Триггер', keep: .5, on: false, c: '#A78BFA' },
      { t: 'Риск ≤ 1R', keep: .7, on: false, c: '#F59E0B' },
    ];
    const row = el('div', { style: `position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:5px;
      flex-wrap:wrap;justify-content:center;z-index:3` });
    const chips = FILTERS.map(f => {
      const c = el('div', { class: 'mono', style: `font-size:9px;padding:6px 8px;border-radius:9px;cursor:pointer;
        transition:.22s`, text: f.t });
      c.addEventListener('click', () => { f.on = !f.on; paint(); haptic(f.on ? 'medium' : 'light');
        if (f.on) fx.ring({ x: c.offsetLeft + c.offsetWidth / 2, y: stage.clientHeight - 24, r: 42, color: f.c, width: 1.6 }) });
      row.appendChild(c); return c;
    });
    stage.appendChild(row);
    function paint() {
      chips.forEach((c, i) => { const f = FILTERS[i];
        c.style.background = f.on ? alpha(f.c, .16) : '#11161D';
        c.style.border = `1px solid ${f.on ? f.c : '#1F2834'}`;
        c.style.color = f.on ? f.c : '#55687C' });
    }
    paint();
    let anim = 0;
    raf(dt => {
      anim = Math.min(1, anim + dt * .8); g.clear();
      const on = FILTERS.filter(f => f.on);
      const stages = [{ t: 'ИДЕЙ', v: 100, c: '#9FB0C2' }];
      let v = 100;
      on.forEach(f => { v = v * f.keep; stages.push({ t: f.t.toUpperCase(), v, c: f.c }) });
      const profit = v * .42;
      stages.push({ t: 'В ПЛЮС', v: profit, c: '#4ADE80' });
      const padT = 18, padB = 54, H = (g.h - padT - padB) / stages.length;
      stages.forEach((s, i) => {
        const w = (g.w - 36) * (s.v / 100) ** .62;
        const y = padT + i * H, k = ease.out(clamp(anim * 1.4 - i * .08));
        const ww = w * k;
        const grd = g.x.createLinearGradient(g.w / 2 - ww / 2, 0, g.w / 2 + ww / 2, 0);
        grd.addColorStop(0, alpha(s.c, .18)); grd.addColorStop(.5, alpha(s.c, .55)); grd.addColorStop(1, alpha(s.c, .18));
        g.x.fillStyle = grd; g.x.shadowColor = s.c; g.x.shadowBlur = 10;
        rr(g.x, g.w / 2 - ww / 2, y, ww, H - 7, 6).fill(); g.x.shadowBlur = 0;
        g.x.fillStyle = '#E6EDF3'; g.x.font = '700 9.5px ui-monospace,monospace';
        g.x.textAlign = 'center'; g.x.textBaseline = 'middle';
        g.x.fillText(`${s.t}  ${s.v.toFixed(s.v < 10 ? 1 : 0)}`, g.w / 2, y + (H - 7) / 2);
        if (i < stages.length - 1) { g.x.strokeStyle = 'rgba(255,255,255,.08)';
          g.x.beginPath(); g.x.moveTo(g.w / 2, y + H - 7); g.x.lineTo(g.w / 2, y + H); g.x.stroke() }
      });
      g.x.fillStyle = '#6E7D8F'; g.x.font = '9px ui-monospace,monospace'; g.x.textAlign = 'center';
      g.x.fillText(`конверсия идеи в прибыль: ${profit.toFixed(1)}%`, g.w / 2, g.h - padB + 16);
    });
  }
});

/* 67 ---------------------------------------------------------------------
   Анатомия свечи: разбор на части. Смысл: «свеча» перестаёт быть
   картинкой и становится записью борьбы покупателя и продавца.            */
SA.register({
  n: '67', title: 'Анатомия свечи: разбор на части', group: 'flow',
  hint: 'Тяни ползунок — <b>свеча расходится на слои</b> с подписями',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const C = { o: 100, h: 112, l: 94, c: 108 };
    const sl = el('div', { style: `position:absolute;left:14px;right:14px;bottom:12px;height:24px;border-radius:12px;
      background:#11161D;border:1px solid #1C2430;touch-action:none;z-index:3` });
    const kn = el('div', { style: `position:absolute;top:3px;left:3px;width:36px;height:16px;border-radius:8px;
      background:#66B8FF;box-shadow:0 0 10px #007AFD88` });
    sl.appendChild(kn); stage.appendChild(sl);
    const legend = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9px;line-height:1.7;
      color:#6E7D8F;z-index:2` });
    stage.appendChild(legend);
    let ex = 0;
    raf(dt => {
      g.clear(); g.grid(26);
      const cx = g.w * .42, Y = scaleRaw(90, 116, g.h - 54, 24);
      const bodyTop = Y(Math.max(C.o, C.c)), bodyBot = Y(Math.min(C.o, C.c));
      const w = 44, e = ease.out(ex);
      // верхняя тень
      const upY = lerp(0, -26, e);
      g.x.strokeStyle = '#4ADE80'; g.x.lineWidth = 3; g.x.lineCap = 'round';
      g.x.beginPath(); g.x.moveTo(cx, Y(C.h) + upY); g.x.lineTo(cx, bodyTop + upY * .35); g.x.stroke();
      // тело
      g.x.fillStyle = 'rgba(74,222,128,.85)'; g.x.shadowColor = '#4ADE80'; g.x.shadowBlur = 14;
      rr(g.x, cx - w / 2, bodyTop, w, bodyBot - bodyTop, 4).fill(); g.x.shadowBlur = 0;
      // нижняя тень
      const dnY = lerp(0, 26, e);
      g.x.beginPath(); g.x.moveTo(cx, bodyBot + dnY * .35); g.x.lineTo(cx, Y(C.l) + dnY); g.x.stroke();
      // подписи, проявляются вместе с разъездом
      g.x.globalAlpha = e;
      const marks = [
        [Y(C.h) + upY, 'МАКСИМУМ · ' + C.h, '#4ADE80', 'куда дотянулись покупатели'],
        [bodyTop, 'ЗАКРЫТИЕ · ' + C.c, '#E6EDF3', 'цена, с которой согласился рынок'],
        [bodyBot, 'ОТКРЫТИЕ · ' + C.o, '#9FB0C2', 'точка старта периода'],
        [Y(C.l) + dnY, 'МИНИМУМ · ' + C.l, '#FF4D4D', 'где продавцы выдохлись'],
      ];
      marks.forEach(([y, t, col, sub]) => {
        g.x.strokeStyle = alpha(col, .4); g.x.setLineDash([3, 4]); g.x.lineWidth = 1;
        g.x.beginPath(); g.x.moveTo(cx + w / 2 + 4, y); g.x.lineTo(g.w - 12, y); g.x.stroke(); g.x.setLineDash([]);
        g.x.fillStyle = col; g.x.font = '700 9px ui-monospace,monospace'; g.x.textAlign = 'right';
        g.x.textBaseline = 'bottom'; g.x.fillText(t, g.w - 12, y - 2);
        g.x.fillStyle = '#55687C'; g.x.font = '8px ui-monospace,monospace'; g.x.textBaseline = 'top';
        g.x.fillText(sub, g.w - 12, y + 2);
      });
      g.x.globalAlpha = 1;
      const range = C.h - C.l, body = Math.abs(C.c - C.o);
      legend.innerHTML = `ТЕЛО / ДИАПАЗОН <b style="color:#E6EDF3">${(body / range * 100).toFixed(0)}%</b><br>
        ВЕРХНЯЯ ТЕНЬ <b style="color:#4ADE80">${((C.h - Math.max(C.o, C.c)) / range * 100).toFixed(0)}%</b><br>
        НИЖНЯЯ ТЕНЬ <b style="color:#FF4D4D">${((Math.min(C.o, C.c) - C.l) / range * 100).toFixed(0)}%</b>`;
      kn.style.left = (3 + ex * (sl.clientWidth - 42)) + 'px';
    });
    drag(sl, { axis: true, onMove(d) { const r = sl.getBoundingClientRect();
      ex = clamp((d.ex - r.left) / r.width); if (Math.random() < .3) haptic('selection') },
      onEnd() { haptic('rigid') } });
  }
});

/* 68 ---------------------------------------------------------------------
   Вероятностный веер. Смысл: цена — это не линия, а распределение.
   Интерактив: тянешь горизонт прогноза, веер расширяется по √времени.      */
SA.register({
  n: '68', title: 'Веер вероятностей вместо прогноза', group: 'flow',
  hint: 'Тяни вправо — <b>горизонт растёт, коридор расширяется</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const hist = ohlc(40, { start: 100, vol: 1.2, drift: .05, seed: 31 }).map(d => d.c);
    const last = hist[hist.length - 1], vol = .018;
    const hud = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;line-height:1.6;
      background:rgba(7,9,13,.75);border:1px solid #1C2430;border-radius:9px;padding:6px 8px;z-index:2` });
    stage.appendChild(hud);
    const H = new Spring(14, { stiff: 120, damp: 17 });
    let hrz = 14;
    raf(dt => {
      const h = H.step(dt);
      g.clear(); g.grid(26);
      const total = hist.length + 40;
      const X = scaleRaw(0, total, 10, g.w - 10);
      const band = last * vol * Math.sqrt(h) * 2.6;
      const Y = scaleRaw(last - band * 1.5, last + band * 1.5, g.h - 16, 16);
      // история
      const pts = hist.map((v, i) => ({ x: X(i), y: Y(v) }));
      g.glowLine(pts, { color: '#66B8FF', width: 2, blur: 10 });
      // веер
      const N = Math.ceil(h);
      [[2.2, .07], [1.5, .12], [1, .2], [.5, .3]].forEach(([k, a]) => {
        g.x.beginPath();
        g.x.moveTo(X(hist.length - 1), Y(last));
        for (let i = 1; i <= N; i++) g.x.lineTo(X(hist.length - 1 + i), Y(last + last * vol * Math.sqrt(i) * k));
        for (let i = N; i >= 1; i--) g.x.lineTo(X(hist.length - 1 + i), Y(last - last * vol * Math.sqrt(i) * k));
        g.x.closePath();
        g.x.fillStyle = alpha('#4ADE80', a); g.x.fill();
      });
      // медиана
      g.x.strokeStyle = 'rgba(255,255,255,.5)'; g.x.setLineDash([4, 4]); g.x.lineWidth = 1.2;
      g.x.beginPath(); g.x.moveTo(X(hist.length - 1), Y(last)); g.x.lineTo(X(hist.length - 1 + N), Y(last)); g.x.stroke();
      g.x.setLineDash([]);
      // ручка горизонта
      const hx = X(hist.length - 1 + N);
      g.x.strokeStyle = '#4ADE80'; g.x.lineWidth = 2;
      g.x.beginPath(); g.x.moveTo(hx, 14); g.x.lineTo(hx, g.h - 14); g.x.stroke();
      g.x.fillStyle = '#4ADE80'; g.x.beginPath(); g.x.arc(hx, g.h / 2, 7, 0, SA.TAU); g.x.fill();
      g.x.fillStyle = '#07090D'; g.x.font = '700 9px ui-monospace,monospace'; g.x.textAlign = 'center';
      g.x.textBaseline = 'middle'; g.x.fillText('⇄', hx, g.h / 2 + .5);
      const w68 = last * vol * Math.sqrt(h) * 1;
      hud.innerHTML = `ГОРИЗОНТ <b style="color:#4ADE80">${Math.round(h)} свечей</b><br>
        68% ИСХОДОВ <b>${(last - w68).toFixed(1)} … ${(last + w68).toFixed(1)}</b><br>
        <span style="color:#6E7D8F">точка-прогноз врёт, коридор — нет</span>`;
    });
    drag(stage, { axis: true,
      onMove(d) { const p = local(stage, { clientX: d.ex, clientY: d.ey });
        const frac = clamp((p.x / p.w - .45) / .5);
        hrz = lerp(2, 40, frac); H.jump(hrz); },
      onEnd() { haptic('rigid');
        const p = stage.getBoundingClientRect();
        fx.ring({ x: p.width * .8, y: p.height / 2, r: 60, color: '#4ADE80', width: 1.6 }) } });
  }
});

/* 93 ---------------------------------------------------------------------
   Композитный чарт: две стратегии на одной сетке. База: evilcharts
   Composed Chart + Legend + Dots. Смысл: «доходность» ничего не значит
   без просадки — поэтому серии включаются и сравниваются вручную.          */
SA.register({
  n: '93', title: 'Сравнение стратегий: серии и легенда', group: 'flow',
  hint: 'Тап по легенде — <b>серия включается</b>; скраб сравнивает точки',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), tip = tipEl(); stage.appendChild(tip);
    const N = 48, rnd = prng(404);
    const A = [], B = [], VOL = [];
    let a = 100, b = 100;
    for (let i = 0; i < N; i++) {
      a *= 1 + (rnd() - .42) * .022;             // агрессивная
      b *= 1 + (rnd() - .46) * .009 + .0035;     // спокойная
      A.push(a); B.push(b); VOL.push(.2 + rnd() * .8);
    }
    const SERIES = [
      { k: 'A', t: 'АГРЕССИВНАЯ', c: '#FF4D4D', on: true, data: A },
      { k: 'B', t: 'СИСТЕМНАЯ', c: '#4ADE80', on: true, data: B },
      { k: 'V', t: 'РИСК В СДЕЛКЕ', c: '#A78BFA', on: true, data: VOL },
    ];
    const legend = el('div', { style: `position:absolute;left:10px;right:10px;top:8px;display:flex;gap:6px;
      justify-content:center;flex-wrap:wrap;z-index:3` });
    const chips = SERIES.map(s => {
      const c = el('div', { class: 'mono', style: 'font-size:9px;padding:5px 8px;border-radius:8px;cursor:pointer;transition:.2s' });
      c.innerHTML = `<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${s.c};
        margin-right:5px;vertical-align:0"></span>${s.t}`;
      c.addEventListener('click', () => { s.on = !s.on; paint(); haptic(s.on ? 'medium' : 'light') });
      legend.appendChild(c); return c;
    });
    const foot = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:8px;text-align:center;
      font-size:9.5px;color:#6E7D8F;z-index:2` });
    stage.append(legend, foot);
    function paint() { chips.forEach((c, i) => { const s = SERIES[i];
      c.style.background = s.on ? alpha(s.c, .14) : '#11161D';
      c.style.border = `1px solid ${s.on ? alpha(s.c, .5) : '#1F2834'}`;
      c.style.color = s.on ? s.c : '#55687C'; }) }
    paint();
    let cur = -1, t = 0;
    raf(dt => {
      t = Math.min(1, t + dt * .7); g.clear(); g.grid(26);
      const padT = 36, padB = 30;
      const vis = SERIES.filter(s => s.on && s.k !== 'V');
      const all = vis.flatMap(s => s.data);
      const lo = all.length ? Math.min(...all) * .99 : 95, hi = all.length ? Math.max(...all) * 1.01 : 105;
      const X = scaleRaw(0, N - 1, 12, g.w - 12), Y = scaleRaw(lo, hi, g.h - padB, padT);
      const shown = Math.max(2, Math.floor(N * ease.out(t)));
      // столбики риска
      if (SERIES[2].on) VOL.slice(0, shown).forEach((v, i) => {
        const h = v * 26;
        g.x.fillStyle = alpha('#A78BFA', .25 + v * .3);
        rr(g.x, X(i) - 2.4, g.h - padB - h, 4.8, h, 2).fill();
      });
      vis.forEach(s => {
        const pts = s.data.slice(0, shown).map((v, i) => ({ x: X(i), y: Y(v) }));
        g.glowLine(pts, { color: s.c, width: 2.2, blur: 12 });
        const last = pts[pts.length - 1];
        g.x.fillStyle = s.c; g.x.beginPath(); g.x.arc(last.x, last.y, 3.6, 0, SA.TAU); g.x.fill();
      });
      if (cur >= 0 && cur < shown) {
        g.x.strokeStyle = 'rgba(255,255,255,.18)';
        g.x.beginPath(); g.x.moveTo(X(cur), padT - 10); g.x.lineTo(X(cur), g.h - padB); g.x.stroke();
        vis.forEach(s => { g.x.fillStyle = '#fff';
          g.x.beginPath(); g.x.arc(X(cur), Y(s.data[cur]), 3.4, 0, SA.TAU); g.x.fill() });
        tip.innerHTML = vis.map(s => `<span style="color:${s.c}">${s.t}</span> ${s.data[cur].toFixed(1)}`).join('<br>')
          + `<br><span style="color:#6E7D8F">риск ${(VOL[cur] * 2).toFixed(2)}%</span>`;
        tip.style.opacity = '1';
        tip.style.left = clamp(X(cur) - 60, 4, g.w - 140) + 'px'; tip.style.top = (padT + 2) + 'px';
      } else tip.style.opacity = '0';
      const ddA = Math.min(...A.map((v, i) => v / Math.max(...A.slice(0, i + 1)) - 1)) * 100;
      const ddB = Math.min(...B.map((v, i) => v / Math.max(...B.slice(0, i + 1)) - 1)) * 100;
      foot.innerHTML = `итог <span style="color:#FF4D4D">${fmt.pct(A[N - 1] - 100)}</span> при просадке
        <b style="color:#FF4D4D">${ddA.toFixed(1)}%</b> · против
        <span style="color:#4ADE80">${fmt.pct(B[N - 1] - 100)}</span> при
        <b style="color:#4ADE80">${ddB.toFixed(1)}%</b>`;
    });
    const track = e => { const p = local(stage, e);
      const i = Math.round(scaleRaw(12, p.w - 12, 0, N - 1)(p.x));
      const n = clamp(i, 0, N - 1); if (n !== cur) { cur = n; if (n % 4 === 0) haptic('selection') } };
    stage.addEventListener('pointermove', track);
    stage.addEventListener('pointerdown', track);
    stage.addEventListener('pointerleave', () => cur = -1);
  }
});

})();

      { q: 'Третий стоп подряд за день.', l: ['Закрываю терминал', { m: 0, p: 18 }], r: ['Отыгрываюсь', { m: -28, p: -24 }] },
      { q: 'Сигнал есть, но против старшего ТФ.', l: ['Пропускаю', { m: 2, p: 8 }], r: ['Беру половину размера', { m: -6, p: -4 }] },
      { q: 'Друг прислал «инсайд» по альту.', l: ['Игнорирую', { m: 0, p: 6 }], r: ['Беру на 30% депо', { m: -30, p: -18 }] },
    ];
    let money = 62, psy = 70, i = 0, over = false;
    const bars = el('div', { style: 'position:absolute;left:12px;right:12px;top:10px;display:flex;gap:10px;z-index:3' });
    const mB = barMeter(bars, { color: '#4ADE80', label: 'КАПИТАЛ' });

    const hintR = el('div', { class: 'mono', style: `position:absolute;right:14px;top:50%;transform:translateY(-50%);
      font-size:10px;color:#F59E0B;opacity:0;transition:.2s;text-align:right;max-width:70px;z-index:4` });
    stage.append(bars, holder, hintL, hintR);
    function paint() { mB.set(money / 100, Math.round(money)); pB.set(psy / 100, Math.round(psy));
      mB.color(money < 30 ? '#FF4D4D' : '#4ADE80'); pB.color(psy < 30 ? '#FF4D4D' : '#A78BFA') }
    function card() {
      const c = DECK[i % DECK.length];
      const n = el('div', { style: `position:relative;width:200px;height:150px;border-radius:16px;padding:14px;
        background:linear-gradient(165deg,#18212D,#0B1016);border:1px solid #27313E;touch-action:none;
        box-shadow:0 18px 40px -22px #000;display:flex;flex-direction:column;justify-content:space-between` });
      n.innerHTML = `<div class="mono" style="font-size:8px;letter-spacing:.14em;color:#6E7D8F">СИТУАЦИЯ ${i + 1}</div>
        <div style="font-size:14px;line-height:1.45;font-weight:600;color:#E6EDF3">${c.q}</div>
        <div class="mono" style="display:flex;justify-content:space-between;font-size:8.5px;color:#39434F">
          <span>← ${c.l[0]}</span><span>${c.r[0]} →</span></div>`;
      holder.appendChild(n);
      hintL.textContent = c.l[0]; hintR.textContent = c.r[0];
      swipe(n, { threshold: 64,
        onMove(d) {
          const k = clamp(Math.abs(d.x) / 110);
          n.style.transform = `translateX(${d.x}px) rotate(${d.x * .05}deg)`;
          n.style.borderColor = d.x < -10 ? alpha('#4ADE80', .3 + k * .6) : d.x > 10 ? alpha('#F59E0B', .3 + k * .6) : '#27313E';
          hintL.style.opacity = d.x < -10 ? String(k) : '0';
          hintR.style.opacity = d.x > 10 ? String(k) : '0';
        },
        onRelease() { n.style.transition = 'transform .3s cubic-bezier(.2,.9,.2,1)'; n.style.transform = '';

        onSwipe(dir) {

/* 70 ---------------------------------------------------------------------
   Окно входа: тайминг-бар. База: timing-механики аркад + microkit feedback.
   Смысл: зелёная зона сжимается с каждым раундом — «рынок не ждёт».        */
SA.register({
  n: '70', title: 'Окно входа: останови бегунок', group: 'arcade',
  hint: 'Тап в <b>зелёной зоне</b> — вход по плану, мимо — проскальзывание',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const hud = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;display:flex;
      justify-content:space-between;font-size:10px;color:#6E7D8F;z-index:2` });
    const log = el('div', { style: `position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;
      gap:4px;z-index:2` });
    stage.append(hud, log);
    let round = 1, score = 0, streak = 0, pos = 0, dir = 1, speed = .85, zone = .3, zx = .4, running = true;
    function reset() { zone = Math.max(.1, .32 - round * .025); zx = rand(.8 - zone, .08);
      speed = .8 + round * .14; pos = 0; dir = 1; running = true }
    reset();
    raf(dt => {
      if (running) { pos += dir * speed * dt; if (pos > 1) { pos = 1; dir = -1 } if (pos < 0) { pos = 0; dir = 1 } }
      g.clear();
      const y = g.h / 2 - 6, h = 26, padX = 16, W = g.w - padX * 2;
      // рельс
      g.x.fillStyle = '#0E131A'; rr(g.x, padX, y, W, h, 13).fill();
      g.x.strokeStyle = '#1C2430'; g.x.lineWidth = 1; g.x.stroke();
      // идеальная зона + её ядро
      const zxp = padX + zx * W, zw = zone * W;
      const grd = g.x.createLinearGradient(zxp, 0, zxp + zw, 0);
      grd.addColorStop(0, alpha('#4ADE80', .18)); grd.addColorStop(.5, alpha('#4ADE80', .5)); grd.addColorStop(1, alpha('#4ADE80', .18));
      g.x.fillStyle = grd; rr(g.x, zxp, y + 2, zw, h - 4, 11).fill();
      const cw = zw * .3;
      g.x.fillStyle = alpha('#FFD166', .55); rr(g.x, zxp + zw / 2 - cw / 2, y + 2, cw, h - 4, 11).fill();
      // бегунок
      const px = padX + pos * W;
      g.x.fillStyle = '#fff'; g.x.shadowColor = '#66B8FF'; g.x.shadowBlur = 16;
      rr(g.x, px - 2.5, y - 7, 5, h + 14, 3).fill(); g.x.shadowBlur = 0;
      // подписи
      g.x.fillStyle = '#39434F'; g.x.font = '8px ui-monospace,monospace'; g.x.textAlign = 'center';
      g.x.fillText('РАНО', padX + W * .12, y + h + 20);
      g.x.fillText('ПО ПЛАНУ', zxp + zw / 2, y - 14);
      g.x.fillText('ПОЗДНО', padX + W * .88, y + h + 20);
      hud.innerHTML = `<span>РАУНД <b style="color:#E6EDF3">${round}</b></span>
        <span>СЕРИЯ <b style="color:${streak > 2 ? '#4ADE80' : '#E6EDF3'}">${streak}</b></span>
        <span>ОЧКИ <b style="color:#66B8FF">${score}</b></span>`;
    });
    function fire() {
      if (!running) return;
      running = false;
      const d = Math.abs(pos - (zx + zone / 2));
      const perfect = d < zone * .15, good = d < zone / 2;
      const r = stage.getBoundingClientRect();
      const px = 16 + pos * (r.width - 32);
      if (perfect) { score += 100 * (1 + streak * .25) | 0; streak++; haptic('success');
        confetti(fx, { x: px, y: r.height / 2, n: 34 });
        push('ИДЕАЛЬНЫЙ ВХОД', `+${Math.round(100 * (1 + (streak - 1) * .25))} · проскальзывание 0.00%`, '#4ADE80');
      } else if (good) { score += 40; streak++; haptic('medium');
        fx.ring({ x: px, y: r.height / 2, r: 70, color: '#66B8FF', width: 2 });
        push('ВХОД ПРИНЯТ', '+40 · проскальзывание 0.04%', '#66B8FF');
      } else { streak = 0; haptic('error');
        fx.emit({ x: px, y: r.height / 2, n: 14, color: '#FF4D4D', speed: 180, life: .6, size: 2.6 });
        push(pos < zx ? 'РАНО: ВХОД В ПУСТОТУ' : 'ПОЗДНО: ЦЕНА УШЛА', '−1R · так выглядит жадность', '#FF4D4D');
      }
      round++;
      setTimeout(reset, 620);
    }
    function push(t, s, c) {
      const row = el('div', { class: 'mono', style: `font-size:9.5px;padding:6px 8px;border-radius:8px;
        background:${alpha(c, .1)};border:1px solid ${alpha(c, .35)};color:${c};
        animation:sa-pop .3s both;display:flex;justify-content:space-between;gap:8px` });
      row.innerHTML = `<b>${t}</b><span style="color:#6E7D8F">${s}</span>`;
      log.prepend(row); while (log.children.length > 3) log.lastChild.remove();
    }
    stage.addEventListener('pointerdown', fire);
  }
});

/* 71 ---------------------------------------------------------------------
   Лестница риска (press your luck). Смысл: математика серии — каждый шаг
   увеличивает выплату и вероятность потерять всё.                          */
SA.register({
  n: '71', title: 'Лестница риска: ещё или фиксирую', group: 'arcade',
  hint: '<b>«Ещё»</b> множит выплату, <b>«Фиксирую»</b> забирает её со стола',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const STEPS = 8;
    const wrap = el('div', { style: 'position:absolute;inset:10px;display:flex;flex-direction:column;gap:5px' });
    const rows = [];
    for (let i = STEPS - 1; i >= 0; i--) {
      const mult = +(1.4 ** (i + 1)).toFixed(2), risk = Math.round(14 + i * 7);
      const r = el('div', { class: 'mono', style: `flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;
        border-radius:10px;background:#0E131A;border:1px solid #1A222C;font-size:10px;color:#55687C;transition:.3s` });
      r.innerHTML = `<span class="st" style="width:16px;color:#39434F">${i + 1}</span>
        <span class="mu" style="font-weight:800">×${mult}</span>
        <span style="margin-left:auto;color:#39434F">риск слёта ${risk}%</span>`;
      rows[i] = { node: r, mult, risk }; wrap.appendChild(r);
    }
    const panel = el('div', { style: 'display:flex;gap:8px;margin-top:2px' });
    const more = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:10px;border-radius:11px;
      background:linear-gradient(180deg,#1C7A43,#135C31);color:#DFFFE9;font-size:11px;font-weight:800;cursor:pointer;
      box-shadow:0 6px 16px -8px #135C31`, text: 'ЕЩЁ СТУПЕНЬ' });
    const take = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:10px;border-radius:11px;
      background:#141C27;border:1px solid #27313E;color:#9FB0C2;font-size:11px;font-weight:800;cursor:pointer`,
      text: 'ФИКСИРУЮ' });
    panel.append(more, take); wrap.appendChild(panel);
    const bank = el('div', { class: 'mono', style: `position:absolute;right:12px;top:-2px;font-size:10px;color:#6E7D8F;z-index:3` });
    stage.append(wrap, bank);
    let level = 0, banked = 0, rnd = prng(2026);
    function paint() {
      rows.forEach((r, i) => {
        const on = i < level, cur = i === level;
        r.node.style.background = on ? alpha('#4ADE80', .12) : cur ? '#131C26' : '#0E131A';
        r.node.style.borderColor = cur ? '#4ADE8088' : on ? alpha('#4ADE80', .3) : '#1A222C';
        r.node.style.color = on || cur ? '#E6EDF3' : '#55687C';
        r.node.style.transform = cur ? 'scale(1.015)' : 'scale(1)';
      });
      const pot = level ? (100 * rows[level - 1].mult).toFixed(0) : 0;
      bank.innerHTML = `НА СТОЛЕ <b style="color:#FFD166">${pot}</b> · В БАНКЕ <b style="color:#4ADE80">${banked}</b>`;
    }
    paint();
    more.addEventListener('click', () => {
      if (level >= STEPS) return;
      const r = rows[level];
      const roll = rnd() * 100;
      const rect = stage.getBoundingClientRect();
      if (roll < r.risk) {
        haptic('error');
        r.node.style.background = alpha('#FF4D4D', .18); r.node.style.borderColor = '#FF4D4D';
        fx.emit({ x: rect.width / 2, y: rect.height / 2, n: 28, color: ['#FF4D4D', '#F59E0B'], speed: 280, life: .9, size: 3.2 });
        bank.innerHTML = `<span style="color:#FF4D4D">СЛЁТ НА СТУПЕНИ ${level + 1}</span> · В БАНКЕ <b style="color:#4ADE80">${banked}</b>`;
        setTimeout(() => { level = 0; paint() }, 700);
      } else {
        level++; haptic(level > 4 ? 'warning' : 'medium');
        fx.ring({ x: rect.width / 2, y: rect.height - 90, r: 80, color: '#4ADE80', width: 1.8 });
        paint();
      }
    });
    take.addEventListener('click', () => {
      if (!level) { haptic('light'); return }
      banked += Math.round(100 * rows[level - 1].mult);
      const rect = stage.getBoundingClientRect();
      confetti(fx, { x: rect.width / 2, y: rect.height * .4, n: 50 });
      haptic('success'); level = 0; paint();
    });
  }
});

/* 72 ---------------------------------------------------------------------
   Конвейер стратегии. Смысл: правила соединяются в цепочку; система
   проверяет логику и показывает ожидание (expectancy).                     */
SA.register({
  n: '72', title: 'Собери стратегию из блоков', group: 'arcade',
  hint: 'Перетащи блоки в конвейер — <b>ожидание считается на лету</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const BLOCKS = [
      { t: 'Тренд 4ч', k: 'filter', e: .18, c: '#007AFD' },
      { t: 'Зона спроса', k: 'filter', e: .14, c: '#66B8FF' },
      { t: 'Триггер-свеча', k: 'trigger', e: .22, c: '#A78BFA' },
      { t: 'Стоп за структурой', k: 'risk', e: .26, c: '#F59E0B' },
      { t: 'Выход 2R', k: 'exit', e: .2, c: '#4ADE80' },
      { t: 'Угадал по чату', k: 'noise', e: -.34, c: '#FF4D4D' },
    ];
    const ORDER = ['filter', 'trigger', 'risk', 'exit'];
    const pool = el('div', { style: `position:absolute;left:10px;right:10px;top:8px;display:flex;flex-wrap:wrap;gap:5px;
      z-index:3` });
    const lane = el('div', { style: `position:absolute;left:10px;right:10px;top:84px;bottom:46px;border-radius:12px;
      border:1px dashed #27313E;background:rgba(255,255,255,.015);display:flex;flex-direction:column;gap:5px;
      padding:8px;overflow:auto` });
    const verdict = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:10px;font-size:10px;
      text-align:center;color:#6E7D8F;z-index:3` });
    stage.append(pool, lane, verdict);
    const chain = [];
    function chip(b, inLane) {
      const n = el('div', { class: 'mono', style: `font-size:9.5px;padding:7px 9px;border-radius:9px;cursor:pointer;
        background:${alpha(b.c, .12)};border:1px solid ${alpha(b.c, .45)};color:${b.c};
        display:flex;align-items:center;gap:6px;transition:transform .2s,opacity .2s;
        ${inLane ? 'justify-content:space-between' : ''}`,
        html: inLane ? `<span>${b.t}</span><span style="color:#55687C">${b.k}</span>` : b.t });
      return n;
    }
    function calc() {
      if (!chain.length) { verdict.innerHTML = 'пустой конвейер — это не «гибкость», это отсутствие системы'; return }
      const kinds = chain.map(b => b.k);
      const hasAll = ORDER.every(k => kinds.includes(k));
      const ordered = kinds.filter(k => ORDER.includes(k))
        .every((k, i, a) => i === 0 || ORDER.indexOf(k) >= ORDER.indexOf(a[i - 1]));
      const e = chain.reduce((s, b) => s + b.e, 0) * (ordered ? 1 : .55) + (hasAll ? .15 : -.1);
      const col = e > .5 ? '#4ADE80' : e > .15 ? '#F59E0B' : '#FF4D4D';
      verdict.innerHTML = `ОЖИДАНИЕ <b style="color:${col}">${e > 0 ? '+' : ''}${e.toFixed(2)}R</b> · ` +
        (hasAll ? (ordered ? 'цепочка полная и в правильном порядке' : 'все блоки есть, но порядок нарушен')
                : 'не хватает: ' + ORDER.filter(k => !kinds.includes(k)).join(', '));
    }
    calc();
    BLOCKS.forEach(b => {
      const n = chip(b, false);
      n.addEventListener('click', () => {
        if (chain.includes(b)) return;
        chain.push(b); n.style.opacity = '.25'; n.style.transform = 'scale(.94)';
        const ln = chip(b, true);
        ln.style.animation = 'sa-pop .28s both';
        ln.addEventListener('click', () => { const i = chain.indexOf(b); if (i >= 0) chain.splice(i, 1);
          ln.remove(); n.style.opacity = '1'; n.style.transform = ''; calc(); haptic('light') });
        lane.appendChild(ln); calc(); haptic('medium');
      });
      pool.appendChild(n);
    });
  }
});

/* 73 ---------------------------------------------------------------------
   Бой с боссом: парирование по таймингу. Смысл: эмоция атакует волнами,
   защита — это точный жест в нужный момент, а не «сила воли».              */
SA.register({
  n: '73', title: 'Парирование: бой с «Местью»', group: 'arcade',
  hint: 'Тап в момент совпадения колец — <b>парирование</b>, иначе урон',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    let hpBoss = 100, hpYou = 100, phase = 0, t = 0, combo = 0, msg = 'ОН АТАКУЕТ ВОЛНАМИ', msgT = 0;
    const bars = el('div', { style: 'position:absolute;left:12px;right:12px;top:10px;display:flex;gap:10px;z-index:3' });
    const bB = barMeter(bars, { color: '#FF4D4D', label: 'МЕСТЬ' });
    const yB = barMeter(bars, { color: '#4ADE80', label: 'ТЫ' });
    stage.appendChild(bars);
    const label = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:14px;text-align:center;
      font-size:10px;color:#9FB0C2;z-index:3` });
    stage.appendChild(label);
    let ring = 1.6, active = true;
    raf(dt => {
      t += dt; msgT = Math.max(0, msgT - dt);
      if (active) { ring -= dt * (.55 + phase * .08); if (ring < .25) { hit(false); ring = 1.6; phase++ } }
      g.clear();
      const cx = g.w / 2, cy = g.h / 2 + 6, R = 46;
      // ядро босса
      const pulse = 1 + Math.sin(t * 4) * .04;
      const grd = g.x.createRadialGradient(cx, cy, 4, cx, cy, R * pulse);
      grd.addColorStop(0, '#5B1620'); grd.addColorStop(1, '#190A0E');
      g.x.fillStyle = grd; g.x.beginPath(); g.x.arc(cx, cy, R * pulse, 0, SA.TAU); g.x.fill();
      g.x.strokeStyle = '#FF4D4D'; g.x.lineWidth = 2; g.x.shadowColor = '#FF4D4D'; g.x.shadowBlur = 18;
      g.x.beginPath(); g.x.arc(cx, cy, R * pulse, 0, SA.TAU); g.x.stroke(); g.x.shadowBlur = 0;
      g.x.fillStyle = '#FF9A9A'; g.x.font = '700 26px ui-sans-serif,system-ui'; g.x.textAlign = 'center';
      g.x.textBaseline = 'middle'; g.x.fillText('✕', cx, cy + 1);
      // целевое кольцо
      g.x.strokeStyle = 'rgba(255,255,255,.32)'; g.x.lineWidth = 2;
      g.x.beginPath(); g.x.arc(cx, cy, R + 10, 0, SA.TAU); g.x.stroke();
      // сходящееся кольцо
      const rr2 = R + 10 + ring * 70;
      const near = Math.abs(rr2 - (R + 10)) < 10;
      g.x.strokeStyle = near ? '#4ADE80' : '#66B8FF'; g.x.lineWidth = near ? 3.4 : 2;
      g.x.shadowColor = g.x.strokeStyle; g.x.shadowBlur = near ? 20 : 8;
      g.x.beginPath(); g.x.arc(cx, cy, rr2, 0, SA.TAU); g.x.stroke(); g.x.shadowBlur = 0;
      bB.set(hpBoss / 100, Math.round(hpBoss)); yB.set(hpYou / 100, Math.round(hpYou));
      label.innerHTML = msgT > 0 ? msg : `КОМБО <b style="color:#FFD166">${combo}</b> · ФАЗА ${phase + 1}`;
      g.cx = cx; g.cy = cy; g.R = R;
    });
    function hit(byPlayer) {
      const r = stage.getBoundingClientRect();
      if (byPlayer) {
        const good = Math.abs((g.R + 10 + ring * 70) - (g.R + 10)) < 12;
        if (good) {
          combo++; hpBoss = clamp(hpBoss - (8 + combo * 2), 0, 100); haptic('success');
          fx.ring({ x: g.cx, y: g.cy, r: 120, color: '#4ADE80', width: 2.4 });
          fx.emit({ x: g.cx, y: g.cy, n: 18, color: ['#4ADE80', '#fff'], speed: 260, life: .7, size: 3 });
          msg = 'ПАРИРОВАНО · ЭМОЦИЯ НЕ ПРОШЛА'; msgT = 1.3;
          ring = 1.6; phase++;
          if (hpBoss <= 0) { msg = 'МЕСТЬ ПОБЕЖДЕНА · +240 XP'; msgT = 4; active = false;
            confetti(fx, { x: g.cx, y: g.cy, n: 70 }) }
        } else {
          combo = 0; hpYou = clamp(hpYou - 6, 0, 100); haptic('error');
          SA.shake(stage, 6, .35);
          msg = 'РАНО · ТЫ УДАРИЛ В ПУСТОТУ'; msgT = 1.2;
        }
      } else {
        combo = 0; hpYou = clamp(hpYou - 12, 0, 100); haptic('warning');
        SA.shake(stage, 9, .45);
        fx.emit({ x: g.cx, y: g.cy, n: 14, color: '#FF4D4D', speed: 220, life: .6, size: 3 });
        msg = 'ПРОПУЩЕН УДАР · −12'; msgT = 1.2;
        if (hpYou <= 0) { msg = 'ТЫ СЛИЛСЯ · ПЕРЕЗАПУСК'; msgT = 3; active = false;
          setTimeout(() => { hpYou = hpBoss = 100; phase = 0; combo = 0; ring = 1.6; active = true }, 1600) }
      }
    }
    stage.addEventListener('pointerdown', () => { if (active) hit(true) });
  }
});

/* 74 ---------------------------------------------------------------------
   Память паттерна. Смысл: тренируем распознавание последовательности
   свечей, а не «запоминание картинки из учебника».                        */
SA.register({
  n: '74', title: 'Память паттерна: повтори свечи', group: 'arcade',
  hint: 'Смотри последовательность, затем <b>повтори её тапами</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const KINDS = [
      { t: 'БЫЧЬЯ', c: '#4ADE80', s: '▲' }, { t: 'МЕДВЕЖЬЯ', c: '#FF4D4D', s: '▼' },
      { t: 'ДОДЖИ', c: '#A78BFA', s: '◆' }, { t: 'МОЛОТ', c: '#F59E0B', s: '⬒' },
    ];
    const head = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;top:12px;text-align:center;
      font-size:10px;color:#9FB0C2;z-index:2`, text: 'СМОТРИ ПОСЛЕДОВАТЕЛЬНОСТЬ' });
    const strip = el('div', { style: `position:absolute;left:12px;right:12px;top:40px;height:44px;display:flex;gap:5px;
      align-items:center;justify-content:center;z-index:2` });
    const pad = el('div', { style: `position:absolute;left:12px;right:12px;bottom:14px;display:grid;
      grid-template-columns:1fr 1fr;gap:7px;z-index:2` });
    stage.append(head, strip, pad);
    let seq = [], input = [], level = 1, lock = true;
    const btns = KINDS.map((k, i) => {
      const b = el('div', { class: 'mono', style: `padding:12px 6px;border-radius:12px;text-align:center;cursor:pointer;
        background:#0E131A;border:1px solid ${alpha(k.c, .4)};color:${k.c};font-size:10px;font-weight:700;
        transition:transform .14s,background .2s`, html: `<div style="font-size:16px">${k.s}</div>${k.t}` });
      b.addEventListener('click', () => tap(i, b));
      pad.appendChild(b); return b;
    });
    function flash(b, k) { b.style.background = alpha(k.c, .22); b.style.transform = 'scale(.96)';
      setTimeout(() => { b.style.background = '#0E131A'; b.style.transform = '' }, 170) }
    function drawStrip(upto) {
      strip.innerHTML = '';
      seq.slice(0, upto).forEach(i => {
        const k = KINDS[i];
        strip.appendChild(el('div', { class: 'mono', style: `width:26px;height:34px;border-radius:7px;display:grid;
          place-items:center;background:${alpha(k.c, .14)};border:1px solid ${alpha(k.c, .45)};color:${k.c};
          font-size:13px;animation:sa-pop .22s both`, text: k.s }));
      });
    }
    function play() {
      lock = true; input = []; head.textContent = 'СМОТРИ ПОСЛЕДОВАТЕЛЬНОСТЬ';
      seq.push(randi(0, 3)); drawStrip(0);
      seq.forEach((v, i) => setTimeout(() => { drawStrip(i + 1); flash(btns[v], KINDS[v]); haptic('selection') }, 520 * i + 320));
      setTimeout(() => { lock = false; head.innerHTML = `ПОВТОРИ · ДЛИНА <b style="color:#E6EDF3">${seq.length}</b>`;
        strip.style.opacity = '.25' }, 520 * seq.length + 420);
    }
    function tap(i, b) {
      if (lock) return;
      flash(b, KINDS[i]); haptic('light'); input.push(i);
      const idx = input.length - 1;
      if (input[idx] !== seq[idx]) {
        haptic('error'); SA.shake(stage, 7, .4);
        head.innerHTML = `<span style="color:#FF4D4D">ОШИБКА НА ${idx + 1}-М</span> · было ${KINDS[seq[idx]].t}`;
        strip.style.opacity = '1'; drawStrip(seq.length);
        lock = true; seq = []; level = 1;
        setTimeout(play, 1500); return;
      }
      if (input.length === seq.length) {
        haptic('success'); level++;
        const r = stage.getBoundingClientRect();
        fx.ring({ x: r.width / 2, y: r.height / 2, r: 110, color: '#4ADE80', width: 2 });
        if (seq.length >= 4) confetti(fx, { x: r.width / 2, y: r.height / 2, n: 40 });
        head.innerHTML = `<span style="color:#4ADE80">ВЕРНО</span> · уровень ${level}`;
        strip.style.opacity = '1';
        lock = true; setTimeout(play, 1000);
      }
    }
    setTimeout(play, 500);
  }
});

/* 75 ---------------------------------------------------------------------
   Матчинг заявок. Смысл: ученик руками исполняет роль биржи и перестаёт
   путать лимитку с рыночной.                                              */
SA.register({
  n: '75', title: 'Матчинг: сведи заявки в сделку', group: 'arcade',
  hint: 'Тапни <b>бид и аск, которые пересекаются</b> — заявки сводятся',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const mid = 100;
    const cols = [el('div'), el('div')];
    cols.forEach((c, i) => c.style.cssText = `position:absolute;top:34px;bottom:40px;width:46%;
      ${i ? 'right:10px' : 'left:10px'};display:flex;flex-direction:column;gap:5px;overflow:hidden`);
    const head = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;top:10px;display:flex;
      justify-content:space-between;font-size:9px;color:#6E7D8F;z-index:2` });
    head.innerHTML = '<span style="color:#4ADE80">БИДЫ · покупатели</span><span style="color:#FF4D4D">АСКИ · продавцы</span>';
    const foot = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:12px;text-align:center;
      font-size:10px;color:#6E7D8F;z-index:2`, text: 'сведено 0 · упущено 0' });
    stage.append(head, cols[0], cols[1], foot);
    let sel = null, done = 0, miss = 0, rnd = prng(11);
    const orders = [[], []];
    function spawn(side) {
      const price = +(mid + (side ? 1 : -1) * rnd() * 2.2 - (side ? 0 : 0)).toFixed(2);
      const qty = +(rnd() * 2 + .1).toFixed(2);
      const col = side ? '#FF4D4D' : '#4ADE80';
      const n = el('div', { class: 'mono', style: `flex:none;display:flex;justify-content:space-between;gap:6px;
        padding:7px 8px;border-radius:9px;font-size:10px;cursor:pointer;background:${alpha(col, .1)};
        border:1px solid ${alpha(col, .35)};color:${col};animation:sa-pop .25s both;transition:.2s` });
      n.innerHTML = `<b>${price.toFixed(2)}</b><span style="color:#6E7D8F">${qty}</span>`;
      const o = { price, qty, side, node: n, born: performance.now() };
      n.addEventListener('click', () => pick(o));
      cols[side].appendChild(n); orders[side].push(o);
      if (orders[side].length > 5) { const old = orders[side].shift(); old.node.remove(); miss++; update() }
    }
    function pick(o) {
      if (sel && sel.side === o.side) { sel.node.style.transform = ''; sel = null }
      if (!sel) { sel = o; o.node.style.transform = 'scale(1.04)'; o.node.style.borderColor = '#fff'; haptic('light'); return }
      const bid = sel.side === 0 ? sel : o, ask = sel.side === 1 ? sel : o;
      const r = stage.getBoundingClientRect();
      if (bid.price >= ask.price) {
        done++; haptic('success');
        fx.ring({ x: r.width / 2, y: r.height / 2, r: 90, color: '#4ADE80', width: 2 });
        fx.emit({ x: r.width / 2, y: r.height / 2, n: 14, color: ['#4ADE80', '#fff'], speed: 220, life: .6, size: 2.8 });
        [bid, ask].forEach(x => { x.node.style.opacity = '0'; x.node.style.transform = 'scale(.8)';
          setTimeout(() => x.node.remove(), 220);
          const arr = orders[x.side]; const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1) });
      } else { haptic('error'); SA.shake(o.node, 5, .3);
        o.node.style.borderColor = '#FF4D4D';
        setTimeout(() => o.node.style.borderColor = alpha(o.side ? '#FF4D4D' : '#4ADE80', .35), 350); }
      if (sel) { sel.node.style.transform = ''; sel.node.style.borderColor = alpha(sel.side ? '#FF4D4D' : '#4ADE80', .35) }
      sel = null; update();
    }
    function update() {
      foot.innerHTML = `сведено <b style="color:#4ADE80">${done}</b> · упущено <b style="color:#FF4D4D">${miss}</b>
        · <span style="color:#39434F">сделка возможна, когда бид ≥ аск</span>`;
    }
    update();
    let acc = 0;
    raf(dt => { acc += dt; if (acc > 1.15) { acc = 0; spawn(randi(0, 1)) } });
    for (let i = 0; i < 3; i++) { spawn(0); spawn(1) }
  }
});

/* 76 ---------------------------------------------------------------------
   Удержание маржи. Смысл: цена дышит, а ты ведёшь стоп. Слишком близко —
   выбьет шумом, слишком далеко — съест депозит.                           */
SA.register({
  n: '76', title: 'Ведение стопа: пережить волатильность', group: 'arcade',
  hint: 'Тяни линию стопа — <b>шум выбивает слишком близкий</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const N = 120;
    let series = [100], t = 0, stopY = 96.5, entry = 100, alive = true, peak = 100, pnl = 0, bars = 0;
    const hud = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;line-height:1.6;
      background:rgba(7,9,13,.72);border:1px solid #1C2430;border-radius:9px;padding:6px 8px;z-index:2` });
    const foot = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:10px;text-align:center;
      font-size:9.5px;color:#6E7D8F;z-index:2`, text: 'тяни стоп пальцем · он не должен касаться шума' });
    stage.append(hud, foot);
    let acc = 0;
    raf(dt => {
      t += dt; acc += dt;
      if (alive && acc > .085) {
        acc = 0;
        const last = series[series.length - 1];
        const drift = .035, shock = Math.random() < .06 ? rand(1.6, -.8) : 0;
        const next = last + (Math.random() - .46) * .55 + drift + shock;
        series.push(next); if (series.length > N) series.shift();
        bars++; peak = Math.max(peak, next); pnl = (next - entry) / entry * 100;
        if (next <= stopY) {
          alive = false; haptic('error'); SA.shake(stage, 8, .45);
          const r = stage.getBoundingClientRect();
          fx.emit({ x: r.width * .8, y: r.height / 2, n: 24, color: ['#FF4D4D', '#F59E0B'], speed: 260, life: .9, size: 3 });
          foot.innerHTML = `<span style="color:#FF4D4D">СТОП СРАБОТАЛ</span> · прожито ${bars} свечей ·
            результат ${fmt.pct((stopY - entry) / entry * 100)}`;
          setTimeout(() => { series = [100]; stopY = 96.5; entry = 100; bars = 0; peak = 100; alive = true;
            foot.textContent = 'тяни стоп пальцем · он не должен касаться шума' }, 2000);
        }
      }
      g.clear(); g.grid(24);
      const lo = Math.min(...series, stopY) - .6, hi = Math.max(...series, stopY) + .6;
      const X = scaleRaw(0, N - 1, 10, g.w - 10), Y = scaleRaw(lo, hi, g.h - 16, 16);
      const pts = series.map((v, i) => ({ x: X(i + (N - series.length)), y: Y(v) }));
      // зона риска под стопом
      g.x.fillStyle = 'rgba(255,77,77,.1)'; g.x.fillRect(0, Y(stopY), g.w, g.h - Y(stopY));
      g.x.strokeStyle = '#FF4D4D'; g.x.setLineDash([5, 4]); g.x.lineWidth = 1.6;
      g.x.beginPath(); g.x.moveTo(0, Y(stopY)); g.x.lineTo(g.w, Y(stopY)); g.x.stroke(); g.x.setLineDash([]);
      g.x.fillStyle = '#FF4D4D'; g.x.font = '700 9px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('СТОП ' + stopY.toFixed(2), 10, Y(stopY) - 5);
      // линия входа
      g.x.strokeStyle = 'rgba(167,139,250,.6)'; g.x.setLineDash([3, 4]); g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(0, Y(entry)); g.x.lineTo(g.w, Y(entry)); g.x.stroke(); g.x.setLineDash([]);
      if (pts.length > 1) g.glowLine(pts, { color: pnl >= 0 ? '#4ADE80' : '#FF9A9A', width: 2.2, blur: 12 });
      const head = pts[pts.length - 1];
      if (head) { g.x.fillStyle = '#fff'; g.x.beginPath(); g.x.arc(head.x, head.y, 3.4, 0, SA.TAU); g.x.fill() }
      const dist = ((series[series.length - 1] - stopY) / series[series.length - 1] * 100);
      hud.innerHTML = `P&L <b style="color:${pnl >= 0 ? '#4ADE80' : '#FF4D4D'}">${fmt.pct(pnl)}</b><br>
        ДО СТОПА <b style="color:${dist < .8 ? '#FF4D4D' : '#E6EDF3'}">${dist.toFixed(2)}%</b><br>
        СВЕЧЕЙ <b>${bars}</b>`;
      g.Yinv = y => lo + (1 - (y - 16) / ((g.h - 16) - 16)) * (hi - lo);
    });
    drag(stage, { axis: true,
      onMove(d) { const p = local(stage, { clientX: d.ex, clientY: d.ey });
        if (!g.Yinv) return;
        stopY = clamp(g.Yinv(p.y), 90, series[series.length - 1] - .05);
        if (Math.random() < .25) haptic('selection') },
      onEnd() { haptic('rigid') } });
  }
});

/* 94 ---------------------------------------------------------------------
   Тильт-детектор. Смысл: игра на выдержку — провокации идут одна за другой,
   выигрывает тот, кто НЕ нажимает. Пульс растёт от каждого соблазна.        */
SA.register({
  n: '94', title: 'Тильт-детектор: выдержи провокации', group: 'arcade',
  hint: 'Жми <b>только на зелёный сетап</b>; на провокацию — не трогай экран',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const PROVOKE = [
      'альт +38% за час', 'твой стоп выбило на тик', 'в чате кричат «ракета»',
      'сосед закрыл +5R', 'цена ушла без тебя', 'инфоцыган обещает сигнал',
    ];
    const SETUP = 'сетап по системе: зона + триггер + риск 1%';
    const card = el('div', { style: `position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);
      border-radius:16px;padding:16px;text-align:center;background:#0E131A;border:1px solid #1C2430;
      transition:border-color .25s,background .25s;z-index:2` });
    const txt = el('div', { class: 'mono', style: 'font-size:13px;font-weight:700;color:#E6EDF3;line-height:1.45' });
    const kind = el('div', { class: 'mono', style: 'font-size:9px;letter-spacing:.14em;color:#6E7D8F;margin-bottom:6px' });
    card.append(kind, txt);
    const hud = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;display:flex;
      gap:10px;z-index:3` });
    const pulse = barMeter(hud, { color: '#FF4D4D', label: 'ПУЛЬС' });
    const disc = barMeter(hud, { color: '#4ADE80', label: 'ВЫДЕРЖКА' });
    const foot = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;bottom:12px;text-align:center;
      font-size:9.5px;color:#6E7D8F;z-index:3`, text: 'ждём сетап…' });
    stage.append(card, hud, foot);
    let hp = 18, dsc = 60, isSetup = false, open = false, left = 0, rnd = prng(66), t = 0;
    function next() {
      isSetup = rnd() < .3;
      kind.textContent = isSetup ? 'СИГНАЛ' : 'ШУМ';
      txt.textContent = isSetup ? SETUP : PROVOKE[(rnd() * PROVOKE.length) | 0];
      card.style.borderColor = isSetup ? alpha('#4ADE80', .5) : alpha('#F59E0B', .4);
      card.style.background = isSetup ? alpha('#4ADE80', .07) : alpha('#F59E0B', .05);
      open = true; left = isSetup ? 1.6 : 2.2;
      haptic('selection');
    }
    raf(dt => {
      t += dt;
      if (open) { left -= dt;
        hp = clamp(hp + (isSetup ? -2 : 7) * dt, 0, 100);
        if (left <= 0) { // время вышло
          if (isSetup) { dsc = clamp(dsc - 14, 0, 100); haptic('warning');
            foot.innerHTML = '<span style="color:#F59E0B">ПРОПУЩЕН СЕТАП</span> · ожидание тоже имеет цену'; }
          else { dsc = clamp(dsc + 8, 0, 100); hp = clamp(hp - 10, 0, 100); haptic('success');
            foot.innerHTML = '<span style="color:#4ADE80">ШУМ ПРОИГНОРИРОВАН</span> · +8 к выдержке'; }
          open = false; setTimeout(next, 700);
        }
      } else hp = clamp(hp - 6 * dt, 0, 100);
      pulse.set(hp / 100, Math.round(60 + hp * .9) + ' уд'); disc.set(dsc / 100, Math.round(dsc));
      pulse.color(hp > 70 ? '#FF4D4D' : hp > 40 ? '#F59E0B' : '#4ADE80');
      g.clear();
      // кардиограмма фоном
      const amp = 6 + hp * .22, sp = 1.4 + hp * .04;
      g.x.strokeStyle = alpha(hp > 70 ? '#FF4D4D' : '#4ADE80', .5); g.x.lineWidth = 1.6;
      g.x.beginPath();
      for (let x = 0; x < g.w; x += 3) {
        const ph = (x / g.w * 6 + t * sp) % 1;
        const spike = ph < .08 ? Math.sin(ph / .08 * Math.PI) * amp * 2 : Math.sin(ph * 12) * amp * .18;
        const y = g.h - 34 - spike;
        x ? g.x.lineTo(x, y) : g.x.moveTo(x, y);
      }
      g.x.stroke();
      if (open) { // таймер-полоска на карточке
        card.style.boxShadow = `0 0 0 1px ${isSetup ? alpha('#4ADE80', .3) : alpha('#F59E0B', .25)},
          0 18px 36px -24px #000`;
      }
    });
    stage.addEventListener('pointerdown', () => {
      const r = stage.getBoundingClientRect();
      if (!open) { haptic('error'); dsc = clamp(dsc - 6, 0, 100);
        foot.innerHTML = '<span style="color:#FF4D4D">КЛИК В ПУСТОТУ</span> · руки быстрее головы'; return }
      if (isSetup) { dsc = clamp(dsc + 12, 0, 100); hp = clamp(hp - 14, 0, 100); haptic('success');
        confetti(fx, { x: r.width / 2, y: r.height / 2, n: 34 });
        foot.innerHTML = '<span style="color:#4ADE80">ВХОД ПО СИСТЕМЕ</span> · +12 к выдержке';
      } else { dsc = clamp(dsc - 16, 0, 100); hp = clamp(hp + 22, 0, 100); haptic('error');
        SA.shake(stage, 7, .4);
        fx.emit({ x: r.width / 2, y: r.height / 2, n: 18, color: ['#FF4D4D', '#F59E0B'], speed: 240, life: .7, size: 3 });
        foot.innerHTML = '<span style="color:#FF4D4D">ТИЛЬТ</span> · ты купил шум';
      }
      open = false; setTimeout(next, 700);
    });
    setTimeout(next, 600);
  }
});

})();

/* ============================================================================
   ГРУППА 11 — СТЕКЛО И СИСТЕМНЫЙ СЛОЙ (77–84).
   Разбор: spaceui / vantaui / obsidianui (тёмное стекло, премиальные
   поверхности), uiarc и uselayouts (структура экранов), componentry
   (контролы), skecher (микро-состояния), uiverse (тумблеры), aceternity
   Notch и Text Flipping Board, microkit (микроотклик).
   Системный слой — то, по чему пользователь судит о «дорого/дёшево»
   за первые три секунды. Поэтому здесь физика, а не transition: all.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, FX, canvas, longPress,
        local, rr, alpha, mix, flapBoard, confetti, magnetic, roll, fmt, prng } = SA;

const KEY = 'sa-glass-keys';
if (!document.getElementById(KEY)) {
  const st = el('style', { id: KEY });
  st.textContent = `
  @keyframes sa-shine{0%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
  @keyframes sa-skel{0%{background-position:-180% 0}100%{background-position:180% 0}}
  @keyframes sa-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}`;
  (document.head || document.body).appendChild(st);
}

/* 77 ---------------------------------------------------------------------
   Радиальное меню по удержанию. Смысл: быстрые действия над позицией
   без поиска по экрану — палец не отрывается.                              */
SA.register({
  n: '77', title: 'Радиальное меню действий', group: 'glass',
  hint: '<b>Удерживай</b> и веди к сектору — действие выбирается жестом',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const ACTS = [
      { t: 'СТОП В Б/У', c: '#4ADE80', s: '⊥' },
      { t: '+50% ОБЪЁМА', c: '#66B8FF', s: '＋' },
      { t: 'ЧАСТЬ ФИКС', c: '#FFD166', s: '½' },
      { t: 'ЗАКРЫТЬ', c: '#FF4D4D', s: '✕' },
      { t: 'ЗАМЕТКА', c: '#A78BFA', s: '✎' },
    ];
    const hint = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:14px;text-align:center;
      font-size:10px;color:#6E7D8F;z-index:3`, text: 'УДЕРЖИВАЙ ЦЕНТР' });
    stage.appendChild(hint);
    const open = new Spring(0, { stiff: 190, damp: 18 });
    let holding = false, sel = -1, px = 0, py = 0, t = 0;
    raf(dt => {
      t += dt; const k = open.step(dt);
      g.clear();
      const cx = g.w / 2, cy = g.h / 2 - 4;
      // кнопка-ядро
      g.x.fillStyle = 'rgba(20,28,39,.9)'; g.x.beginPath(); g.x.arc(cx, cy, 26, 0, SA.TAU); g.x.fill();
      g.x.strokeStyle = holding ? '#66B8FF' : '#27313E'; g.x.lineWidth = 2;
      g.x.shadowColor = '#007AFD'; g.x.shadowBlur = holding ? 20 : 0;
      g.x.beginPath(); g.x.arc(cx, cy, 26, 0, SA.TAU); g.x.stroke(); g.x.shadowBlur = 0;
      g.x.fillStyle = '#9FB0C2'; g.x.font = '700 15px ui-sans-serif,system-ui';
      g.x.textAlign = 'center'; g.x.textBaseline = 'middle'; g.x.fillText('⋮', cx, cy);
      if (k < .01) return;
      const r0 = 34, r1 = 34 + 54 * k;
      const span = SA.TAU / ACTS.length;
      ACTS.forEach((a, i) => {
        const a0 = -Math.PI / 2 + i * span + .03, a1 = a0 + span - .06;
        const act = sel === i;
        SA.arcSeg(g.x, cx, cy, r0, r1, a0, a1);
        g.x.fillStyle = act ? alpha(a.c, .42) : 'rgba(16,22,30,.86)';
        g.x.fill();
        g.x.strokeStyle = act ? a.c : alpha(a.c, .35); g.x.lineWidth = act ? 2 : 1;
        if (act) { g.x.shadowColor = a.c; g.x.shadowBlur = 16 }
        g.x.stroke(); g.x.shadowBlur = 0;
        const am = (a0 + a1) / 2, rm = (r0 + r1) / 2;
        g.x.globalAlpha = k;
        g.x.fillStyle = act ? '#fff' : a.c; g.x.font = '700 14px ui-sans-serif,system-ui';
        g.x.fillText(a.s, cx + Math.cos(am) * rm, cy + Math.sin(am) * rm);
        g.x.globalAlpha = 1;
      });
      if (sel >= 0) { hint.innerHTML = `<b style="color:${ACTS[sel].c}">${ACTS[sel].t}</b> · отпусти для подтверждения` }
    });
    const pickAt = (x, y) => {
      const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2 - 4;
      const d = Math.hypot(x - cx, y - cy);
      if (d < 32 || d > 110) return -1;
      let a = Math.atan2(y - cy, x - cx) + Math.PI / 2; if (a < 0) a += SA.TAU;
      return Math.floor(a / (SA.TAU / ACTS.length)) % ACTS.length;
    };
    stage.addEventListener('pointerdown', e => {
      const p = local(stage, e);
      if (Math.hypot(p.x - p.w / 2, p.y - p.h / 2 + 4) > 42) return;
      holding = true; open.set(1); haptic('medium'); hint.textContent = 'ВЕДИ К СЕКТОРУ';
      stage.setPointerCapture && e.pointerId !== undefined && stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', e => {
      if (!holding) return;
      const p = local(stage, e); px = p.x; py = p.y;
      const s = pickAt(p.x, p.y);
      if (s !== sel) { sel = s; if (s >= 0) haptic('selection') }
    });
    const release = () => {
      if (!holding) return; holding = false; open.set(0);
      if (sel >= 0) { const a = ACTS[sel];
        haptic(a.t === 'ЗАКРЫТЬ' ? 'warning' : 'success');
        fx.ring({ x: px, y: py, r: 90, color: a.c, width: 2.2 });
        fx.emit({ x: px, y: py, n: 14, color: [a.c, '#fff'], speed: 200, life: .6, size: 2.6 });
        hint.innerHTML = `ВЫПОЛНЕНО: <b style="color:${a.c}">${a.t}</b>`;
      } else { haptic('light'); hint.textContent = 'УДЕРЖИВАЙ ЦЕНТР' }
      sel = -1;
    };
    stage.addEventListener('pointerup', release);
    stage.addEventListener('pointercancel', release);
  }
});

/* 78 ---------------------------------------------------------------------
   Шторка с физикой и снап-точками. Смысл: главный мобильный контейнер;
   здесь его инерция, резина за пределами и подстройка контента.            */
SA.register({
  n: '78', title: 'Шторка: инерция и точки фиксации', group: 'glass',
  hint: 'Тяни шторку — <b>инерция, резина и три точки фиксации</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const back = el('div', { style: `position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:6px` });
    back.innerHTML = `<div class="mono" style="font-size:9px;letter-spacing:.14em;color:#6E7D8F">ПОЗИЦИЯ</div>
      <div class="mono" style="font-size:22px;font-weight:800;color:#E6EDF3">BTC · LONG</div>
      <div class="mono" style="font-size:11px;color:#4ADE80">+2.4R · вход 63 840</div>`;
    const scrim = el('div', { style: 'position:absolute;inset:0;background:#05070A;opacity:0;pointer-events:none' });
    const sheet = el('div', { style: `position:absolute;left:0;right:0;bottom:0;height:86%;border-radius:18px 18px 0 0;
      background:rgba(16,22,31,.93);backdrop-filter:blur(14px);border:1px solid #232D3A;border-bottom:none;
      box-shadow:0 -18px 40px -22px #000;touch-action:none;will-change:transform;padding:10px 14px 14px` });
    sheet.innerHTML = `<div style="width:38px;height:4px;border-radius:2px;background:#2A3441;margin:0 auto 10px"></div>
      <div class="mono" style="font-size:9px;letter-spacing:.14em;color:#6E7D8F">ПЛАН СОПРОВОЖДЕНИЯ</div>
      <div class="rows" style="margin-top:8px;display:flex;flex-direction:column;gap:6px"></div>`;
    const rows = sheet.querySelector('.rows');
    [['Перевести стоп в безубыток', '+1.0R', '#4ADE80'],
     ['Снять 50% на 2R', 'сделано', '#66B8FF'],
     ['Остаток вести по структуре', 'активно', '#A78BFA'],
     ['Выход при закрытии под 4ч', 'ожидание', '#6E7D8F'],
     ['Запись в журнал', 'после закрытия', '#6E7D8F']].forEach(([t, v, c]) => {
      const r = el('div', { class: 'mono', style: `display:flex;justify-content:space-between;gap:8px;font-size:10.5px;
        padding:8px 9px;border-radius:9px;background:#0E131A;border:1px solid #1A222C;color:#9FB0C2` });
      r.innerHTML = `<span>${t}</span><b style="color:${c}">${v}</b>`;
      rows.appendChild(r);
    });
    stage.append(back, scrim, sheet);
    const SNAP = [.82, .45, .08]; // доля скрытия
    const y = new Spring(0, { stiff: 230, damp: 24 });
    let H = 1, cur = 0, base = 0;
    raf(dt => {
      H = sheet.clientHeight || 200;
      const v = y.step(dt);
      sheet.style.transform = `translateY(${v.toFixed(1)}px)`;
      const openK = 1 - clamp(v / (H * .9));
      scrim.style.opacity = String(openK * .55);
      back.style.transform = `scale(${(1 - openK * .04).toFixed(3)}) translateY(${(-openK * 6).toFixed(1)}px)`;
    });
    const setSnap = i => { cur = clamp(i, 0, SNAP.length - 1); y.set(SNAP[cur] * H); haptic('rigid') };
    requestAnimationFrame(() => { H = sheet.clientHeight || 200; y.jump(SNAP[0] * H) });
    drag(sheet, { axis: true,
      onStart() { base = y.v },
      onMove(d) { let v = base + d.y;
        if (v < 0) v = v * .3;                       // резина сверху
        const max = H * .9; if (v > max) v = max + (v - max) * .3;
        y.jump(v) },
      onEnd(d) {
        const proj = y.v + d.vy * .12;
        let best = 0, bd = 1e9;
        SNAP.forEach((s, i) => { const dd = Math.abs(s * H - proj); if (dd < bd) { bd = dd; best = i } });
        setSnap(best);
      } });
    back.addEventListener('click', () => setSnap(2));
  }
});

/* 79 ---------------------------------------------------------------------
   Живой «островок». База: aceternity Notch / Dynamic Island.
   Смысл: сделка остаётся в поле зрения, не занимая экран.                  */
SA.register({
  n: '79', title: 'Островок сделки: сжатие и раскрытие', group: 'glass',
  hint: 'Тап по островку — <b>он морфится в живой виджет</b> сделки',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const island = el('div', { style: `position:absolute;left:50%;top:14px;transform:translateX(-50%);
      width:132px;height:34px;border-radius:17px;background:#05070A;border:1px solid #1C2430;cursor:pointer;
      overflow:hidden;transition:width .42s cubic-bezier(.22,1,.3,1),height .42s cubic-bezier(.22,1,.3,1),
      border-radius .42s cubic-bezier(.22,1,.3,1);z-index:4;box-shadow:0 12px 30px -16px #000` });
    const mini = el('div', { class: 'mono', style: `position:absolute;inset:0;display:flex;align-items:center;
      gap:7px;padding:0 11px;font-size:10px;color:#E6EDF3;transition:opacity .2s` });
    mini.innerHTML = `<span class="dot" style="width:7px;height:7px;border-radius:50%;background:#4ADE80;
        box-shadow:0 0 8px #4ADE80"></span><b>BTC</b>
      <span class="pl" style="margin-left:auto;color:#4ADE80">+2.41R</span>`;
    const full = el('div', { class: 'mono', style: `position:absolute;inset:0;padding:12px;opacity:0;
      transition:opacity .25s .12s;display:flex;flex-direction:column;gap:7px;pointer-events:none` });
    full.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:9px;letter-spacing:.14em;color:#6E7D8F">ОТКРЫТАЯ ПОЗИЦИЯ</span>
        <span style="font-size:9px;color:#4ADE80">● LIVE</span></div>
      <div style="display:flex;align-items:baseline;gap:8px">
        <b style="font-size:21px;color:#E6EDF3">BTC·LONG</b>
        <span class="pl2" style="font-size:14px;color:#4ADE80;font-weight:800">+2.41R</span></div>
      <div class="spark" style="height:40px;position:relative"></div>
      <div style="display:flex;gap:6px">
        <span style="flex:1;text-align:center;padding:7px;border-radius:9px;background:#132018;border:1px solid #1E4A31;
          color:#4ADE80;font-size:10px">Б/У</span>
        <span style="flex:1;text-align:center;padding:7px;border-radius:9px;background:#1A1216;border:1px solid #3A2026;
          color:#FF8A8A;font-size:10px">ЗАКРЫТЬ</span></div>`;
    island.append(mini, full);
    const body = el('div', { class: 'mono', style: `position:absolute;left:14px;right:14px;top:70px;bottom:14px;
      border-radius:14px;border:1px solid #1A222C;background:linear-gradient(160deg,#0F151D,#0A0E14);
      display:grid;place-items:center;font-size:10px;color:#39434F;text-align:center;padding:14px`,
      text: 'контент экрана остаётся на месте — островок живёт поверх и не отнимает внимание' });
    stage.append(body, island);
    const spark = full.querySelector('.spark');
    const sg = canvas(spark);
    const data = []; let v = 0, open = false, t = 0;
    for (let i = 0; i < 60; i++) { v += (Math.random() - .42) * .22; data.push(v) }
    raf(dt => {
      t += dt;
      if (t > .3) { t = 0; v += (Math.random() - .42) * .22; data.push(v); data.shift();
        const pl = (2.41 + v * .1).toFixed(2);
        mini.querySelector('.pl').textContent = '+' + pl + 'R';
        full.querySelector('.pl2').textContent = '+' + pl + 'R'; }
      if (!open || sg.w < 4) return;
      sg.clear();
      const lo = Math.min(...data), hi = Math.max(...data);
      const X = SA.scaleRaw(0, data.length - 1, 0, sg.w), Y = SA.scaleRaw(lo, hi, sg.h - 3, 3);
      sg.glowLine(data.map((d, i) => ({ x: X(i), y: Y(d) })), { color: '#4ADE80', width: 1.8, blur: 10 });
    });
    island.addEventListener('click', () => {
      open = !open; haptic(open ? 'medium' : 'light');
      island.style.width = open ? '220px' : '132px';
      island.style.height = open ? '176px' : '34px';
      island.style.borderRadius = open ? '22px' : '17px';
      mini.style.opacity = open ? '0' : '1';
      full.style.opacity = open ? '1' : '0';
      full.style.pointerEvents = open ? 'auto' : 'none';
    });
  }
});

    const l1 = el('div'), l2 = el('div'), l3 = el('div');
    const b1 = flapBoard(l1, 8, { size: 26 });
    const b2 = flapBoard(l2, 9, { size: 20 });
    const b3 = flapBoard(l3, 12, { size: 13 });
    const foot = el('div', { class: 'mono', style: 'font-size:9px;color:#39434F', text: 'ТАП — СЛЕДУЮЩИЙ' });
    wrap.append(cap, l1, l2, l3, foot); stage.appendChild(wrap);
    const ROWS = [
      ['BTC USDT', '64 218.40', '+2.4% ЗА ДЕНЬ', '#4ADE80'],
      ['ETH USDT', ' 3 128.75', '-1.1% ЗА ДЕНЬ', '#FF4D4D'],

/* 81 ---------------------------------------------------------------------
   Хореография загрузки. Смысл: пока считается статистика, интерфейс
   не «пустой» — он объясняет, что именно считает.                          */
SA.register({
  n: '81', title: 'Скелетоны: хореография загрузки', group: 'glass',
  hint: 'Тап — <b>скелетоны превращаются в данные</b> по очереди',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const box = el('div', { style: 'position:absolute;inset:12px;display:flex;flex-direction:column;gap:7px' });
    const status = el('div', { class: 'mono', style: 'font-size:9px;letter-spacing:.14em;color:#6E7D8F' });
    const btn = el('div', { class: 'mono', style: `margin-top:auto;text-align:center;padding:9px;border-radius:11px;
      background:#141C27;border:1px solid #27313E;color:#9FB0C2;font-size:10px;cursor:pointer`, text: 'ПЕРЕСЧИТАТЬ СТАТИСТИКУ' });
    const DATA = [
      ['Сделок за месяц', '112', '#E6EDF3', 'сверяю журнал с биржей'],
      ['Винрейт', '47%', '#66B8FF', 'считаю выигрышные серии'],
      ['Средний R', '+0.34R', '#4ADE80', 'взвешиваю результат по риску'],
      ['Макс. просадка', '−6.2%', '#F59E0B', 'ищу пик и дно эквити'],
      ['Нарушений протокола', '4', '#FF4D4D', 'сверяю входы с чек-листом'],
    ];
    const rows = DATA.map(() => {
      const r = el('div', { style: `position:relative;height:38px;border-radius:10px;overflow:hidden;
        background:#0E131A;border:1px solid #1A222C` });
      const sk = el('div', { style: `position:absolute;inset:0;background:linear-gradient(90deg,#121821 8%,#1B2532 28%,#121821 48%);
        background-size:220% 100%;animation:sa-skel 1.3s linear infinite` });
      const val = el('div', { class: 'mono', style: `position:absolute;inset:0;display:flex;align-items:center;
        justify-content:space-between;padding:0 11px;font-size:11px;opacity:0;transition:opacity .3s` });
      r.append(sk, val); box.appendChild(r); return { r, sk, val };
    });
    box.append(status, btn); stage.appendChild(box);
    let busy = false;
    function run() {
      if (busy) return; busy = true; haptic('medium');
      rows.forEach(x => { x.sk.style.display = 'block'; x.val.style.opacity = '0' });
      DATA.forEach(([t, v, c, log], i) => setTimeout(() => {
        status.textContent = log.toUpperCase();
        const x = rows[i];
        x.sk.style.display = 'none';
        x.val.innerHTML = `<span style="color:#9FB0C2">${t}</span><b style="color:${c}">${v}</b>`;
        x.val.style.opacity = '1';
        x.r.style.animation = 'sa-rise .34s both';
        x.r.style.borderColor = alpha(c, .3);
        haptic('selection');
        if (i === DATA.length - 1) { status.innerHTML = '<span style="color:#4ADE80">ГОТОВО · ДАННЫЕ СВЕРЕНЫ</span>';
          busy = false; haptic('success') }
      }, 420 * i + 320));
    }
    btn.addEventListener('click', run);
    setTimeout(run, 400);
  }
});

/* 82 ---------------------------------------------------------------------
   Pull-to-refresh с жидкой каплей. База: gooey-эффекты (aceternity/uiverse).
   Смысл: тянешь ленту котировок — капля растягивается и «отрывается».      */
SA.register({
  n: '82', title: 'Потянуть и обновить: жидкая капля', group: 'glass',
  hint: 'Тяни вниз — <b>капля растягивается и отрывается</b> при обновлении',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const list = el('div', { style: `position:absolute;left:10px;right:10px;top:54px;bottom:10px;display:flex;
      flex-direction:column;gap:6px;touch-action:none` });
    stage.appendChild(list);
    const SYM = ['BTC', 'ETH', 'SOL', 'TON', 'AVAX'];
    let rnd = prng(5);
    function fill() {
      list.innerHTML = '';
      SYM.forEach((s, i) => {
        const ch = (rnd() * 8 - 3.2);
        const r = el('div', { class: 'mono', style: `display:flex;justify-content:space-between;align-items:center;
          padding:8px 10px;border-radius:10px;background:#0E131A;border:1px solid #1A222C;font-size:11px;
          animation:sa-rise .3s both;animation-delay:${i * 45}ms` });
        r.innerHTML = `<b style="color:#E6EDF3">${s}</b>
          <span style="color:#6E7D8F">${(1000 + rnd() * 60000).toFixed(2)}</span>
          <b style="color:${ch >= 0 ? '#4ADE80' : '#FF4D4D'}">${fmt.pct(ch)}</b>`;
        list.appendChild(r);
      });
    }
    fill();
    let pull = 0, refreshing = false, spin = 0;
    const S = new Spring(0, { stiff: 200, damp: 20 });
    raf(dt => {
      const p = S.step(dt); spin += dt * (refreshing ? 7 : 2);
      g.clear();
      const cx = g.w / 2, top = 10, maxP = 78;
      const k = clamp(p / maxP);
      // «капля»: два круга, соединённые перешейком
      const r1 = 9 + k * 3, r2 = 8 * (1 - k * .55), cy2 = top + p;
      g.x.fillStyle = refreshing ? '#4ADE80' : mix('#66B8FF', '#4ADE80', k);
      g.x.shadowColor = g.x.fillStyle; g.x.shadowBlur = 16;
      g.x.beginPath(); g.x.arc(cx, top + 8, r1, 0, SA.TAU); g.x.fill();
      if (k < .96 && p > 2) {
        g.x.beginPath(); g.x.arc(cx, cy2, Math.max(2.5, r2 + k * 5), 0, SA.TAU); g.x.fill();
        // перешеек
        const w1 = r1 * (1 - k * .9), w2 = (r2 + k * 5) * (1 - k * .5);
        g.x.beginPath();
        g.x.moveTo(cx - w1, top + 8);
        g.x.quadraticCurveTo(cx - w2 * 1.1, (top + 8 + cy2) / 2, cx - w2, cy2);
        g.x.lineTo(cx + w2, cy2);
        g.x.quadraticCurveTo(cx + w2 * 1.1, (top + 8 + cy2) / 2, cx + w1, top + 8);
        g.x.closePath(); g.x.fill();
      } else if (p > 2) {
        g.x.beginPath(); g.x.arc(cx, cy2, r2 + 6, 0, SA.TAU); g.x.fill();
      }
      g.x.shadowBlur = 0;
      // индикатор прогресса на капле
      if (p > 14) {
        g.x.strokeStyle = 'rgba(7,9,13,.75)'; g.x.lineWidth = 2.6; g.x.lineCap = 'round';
        g.x.beginPath();
        g.x.arc(cx, cy2, 7, spin, spin + (refreshing ? 4.4 : k * 5.6)); g.x.stroke();
      }
      list.style.transform = `translateY(${(p * .55).toFixed(1)}px)`;
      g.maxP = maxP;
    });
    drag(list, { axis: true,
      onMove(d) { if (refreshing) return;
        pull = Math.max(0, d.y) * .62; S.jump(Math.min(pull, 96));
        if (pull > 78 && !S._armed) { S._armed = true; haptic('rigid') }
        if (pull < 78) S._armed = false; },
      onEnd() {
        if (refreshing) return;
        if (S.v > 74) { refreshing = true; S.set(54); haptic('success');
          setTimeout(() => { fill(); refreshing = false; S.set(0); haptic('light') }, 1100);
        } else S.set(0);
      } });
  }
});

/* 95 ---------------------------------------------------------------------
   Калькулятор позиции. База: componentry / uiarc (контролы и степперы).
   Смысл: главный инструмент курса — размер считается из стопа, а не из

SA.register({
  n: '95', title: 'Калькулятор позиции: всё тянется пальцем', group: 'glass',
  hint: 'Тяни значения по горизонтали — <b>размер пересчитывается мгновенно</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const box = el('div', { style: 'position:absolute;inset:12px;display:flex;flex-direction:column;gap:7px' });
    const F = [
      { k: 'acc', t: 'Депозит', v: 10000, min: 500, max: 50000, step: 250, f: v => fmt.usd(v), c: '#66B8FF' },
      { k: 'risk', t: 'Риск на сделку', v: 1, min: .1, max: 5, step: .1, f: v => v.toFixed(1) + '%', c: '#A78BFA' },
      { k: 'entry', t: 'Вход', v: 64200, min: 60000, max: 68000, step: 10, f: v => v.toFixed(0), c: '#E6EDF3' },
      { k: 'stop', t: 'Стоп', v: 63150, min: 60000, max: 68000, step: 10, f: v => v.toFixed(0), c: '#FF4D4D' },
      { k: 'tp', t: 'Цель', v: 66400, min: 60000, max: 72000, step: 10, f: v => v.toFixed(0), c: '#4ADE80' },
    ];
    const S = {}; F.forEach(f => S[f.k] = f.v);
    const rows = F.map(f => {
      const r = el('div', { class: 'mono', style: `display:flex;align-items:center;justify-content:space-between;
        gap:8px;padding:9px 11px;border-radius:11px;background:#0E131A;border:1px solid #1A222C;
        touch-action:none;cursor:ew-resize;position:relative;overflow:hidden` });
      const track = el('div', { style: `position:absolute;left:0;top:0;bottom:0;width:0%;background:${alpha(f.c, .1)};
        transition:width .08s linear` });
      const name = el('span', { style: 'font-size:10.5px;color:#9FB0C2;position:relative', text: f.t });
      const val = el('b', { style: `font-size:12.5px;color:${f.c};position:relative` });
      r.append(track, name, val); box.appendChild(r);
      let base = 0;
      drag(r, { axis: true,
        onStart() { base = S[f.k]; haptic('light') },
        onMove(d) { const span = (f.max - f.min);
          let v = base + (d.x / 180) * span;
          v = Math.round(v / f.step) * f.step;
          const nv = clamp(v, f.min, f.max);
          if (nv !== S[f.k]) { S[f.k] = nv; calc(); if (Math.random() < .35) haptic('selection') } },
        onEnd() { haptic('rigid') } });
      return { f, val, track };
    });
    const out = el('div', { style: `margin-top:auto;border-radius:12px;padding:11px;background:linear-gradient(160deg,#121A24,#0A0E14);
      border:1px solid #27313E;display:flex;flex-direction:column;gap:5px` });
    box.appendChild(out); stage.appendChild(box);
    function calc() {
      rows.forEach(({ f, val, track }) => { val.textContent = f.f(S[f.k]);
        track.style.width = (((S[f.k] - f.min) / (f.max - f.min)) * 100) + '%' });
      const riskPerUnit = Math.abs(S.entry - S.stop);
      const riskMoney = S.acc * S.risk / 100;
      const qty = riskPerUnit > 0 ? riskMoney / riskPerUnit : 0;
      const notional = qty * S.entry;
      const rr = riskPerUnit > 0 ? Math.abs(S.tp - S.entry) / riskPerUnit : 0;
      const lev = notional / S.acc;

        <div style="display:flex;justify-content:space-between;font-size:10px;color:#6E7D8F">

        <div style="display:flex;justify-content:space-between;font-size:10px;color:#6E7D8F">
          <span>НОМИНАЛ / ПЛЕЧО</span><b style="color:${lev > 5 ? '#FF4D4D' : '#E6EDF3'}">${fmt.usd(notional)} · ${lev.toFixed(1)}×</b></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#6E7D8F">
          <span>РИСК В ДЕНЬГАХ</span><b style="color:#FF4D4D">−${fmt.usd(riskMoney)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#6E7D8F">
          <span>ПОТЕНЦИАЛ</span><b style="color:#4ADE80">+${fmt.usd(qty * Math.abs(S.tp - S.entry))} · ${rr.toFixed(2)}R</b></div>
        <div class="mono" style="margin-top:3px;font-size:9.5px;color:${bad ? '#F59E0B' : '#4ADE80'}">
          ${bad ? (rr < 1.5 ? 'соотношение меньше 1.5R — такая сделка не окупает серию стопов'
                            : 'плечо выше 5× — ликвидация ближе стопа') : 'параметры в рамках протокола'}</div>`;
    }
    calc();
  }
});
