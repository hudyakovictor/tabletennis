})();


/* ===== assets-fx2.js ===== */
/* ============================================================================
   ГРУППА 16 — ВТОРОЙ СЛОЙ ЭФФЕКТОВ (121–128).
   Разбор: componentry (particle typography, image ripple), magicui (light
   rays, glare hover, morphing text), kinetics.colorion (инерция скролла),
   inspora и vantaui (финальные экраны). Эффекты здесь не декорация:
   каждый привязан к смыслу — цена, паттерн, скорость, завершение курса.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, swipe, FX, canvas,
        local, rr, alpha, mix, prng, fmt, scaleRaw, ohlc, confetti, noise2, textPoints, resample,
        morphPts, polygon, waveField, tracePath, wrapText, chroma } = SA;

/* 121 --------------------------------------------------------------------
   Морфинг заголовка. Смысл: один и тот же экран говорит разными словами,
   буквы перетекают — текст живой, а не подменяется.                        */
SA.register({
  n: '121', title: 'Морфинг заголовка: буквы перетекают', group: 'fx2',
  hint: 'Тап — <b>следующая формулировка, буквы перетекают</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    const WORDS = ['ДИСЦИПЛИНА', 'СИСТЕМА', 'ТЕРПЕНИЕ', 'РАСЧЁТ', 'ПРИБЫЛЬ'];
    const host = el('div', { style: `position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;
      overflow:hidden` });
    const row = el('div', { style: 'display:flex;align-items:center;justify-content:center;height:46px' });
    const sub = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:16px;text-align:center;
      font-size:9.5px;color:#55687C`, text: 'тап — следующее слово' });
    host.append(row, sub); stage.append(host);
    let idx = 0;
    const cells = [];
    const MAX = Math.max(...WORDS.map(w => w.length));
    for (let i = 0; i < MAX; i++) {
      const c = el('div', { style: `position:relative;width:0;overflow:hidden;transition:width .42s cubic-bezier(.2,.9,.2,1);
        display:grid;place-items:center;height:46px` });
      const a = el('div', { style: `font:800 26px/1 ui-monospace,monospace;color:#E6EDF3;
        transition:transform .42s cubic-bezier(.2,.9,.2,1),opacity .34s,filter .34s;will-change:transform` });
      const b = el('div', { style: `position:absolute;font:800 26px/1 ui-monospace,monospace;color:#66B8FF;
        transition:transform .42s cubic-bezier(.2,.9,.2,1),opacity .34s,filter .34s;will-change:transform` });
      c.append(a, b); row.appendChild(c); cells.push({ c, a, b, flip: false });
    }
    function show(w) {
      cells.forEach((cell, i) => {
        const ch = w[i] || '';
        const inNode = cell.flip ? cell.a : cell.b;
        const outNode = cell.flip ? cell.b : cell.a;
        inNode.textContent = ch;
        setTimeout(() => {
          cell.c.style.width = ch ? '17px' : '0px';
          inNode.style.transform = 'translateY(0) rotateX(0deg)'; inNode.style.opacity = '1';
          inNode.style.filter = 'blur(0px)';
          outNode.style.transform = 'translateY(-26px) rotateX(70deg)'; outNode.style.opacity = '0';
          outNode.style.filter = 'blur(3px)';
        }, i * 34);
        inNode.style.transform = 'translateY(26px) rotateX(-70deg)'; inNode.style.opacity = '0';
        inNode.style.filter = 'blur(3px)';
        cell.flip = !cell.flip;
      });
    }
    show(WORDS[0]);
    host.addEventListener('click', () => { idx = (idx + 1) % WORDS.length; show(WORDS[idx]); haptic('selection');
      sub.textContent = ['то, чего нет у 97% счетов', 'повторяемость вместо вдохновения',
        'деньги платят за ожидание', 'вероятность, а не вера', 'побочный эффект первых четырёх'][idx] });
  }
});

/* 122 --------------------------------------------------------------------
   Инерционная лента уроков. Смысл: скорость скролла деформирует карточки,
   как перегрузка — это даёт «вес» интерфейсу.                              */
SA.register({
  n: '122', title: 'Лента с инерцией: скорость гнёт карточки', group: 'fx2',
  hint: 'Листай резко — <b>карточки растягиваются и размываются</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const LESSONS = ['Структура рынка', 'Объём и спрос', 'Риск на сделку', 'Психология входа',
      'Фиксация прибыли', 'Журнал и разбор', 'Режимы рынка', 'План на день'];
    const COL = ['#66B8FF', '#4ADE80', '#F59E0B', '#A78BFA', '#FF4D4D', '#FFD166', '#66B8FF', '#4ADE80'];
    const vp = el('div', { style: `position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;touch-action:none;
      cursor:grab` });
    const track = el('div', { style: `position:absolute;left:0;right:0;top:14px;display:flex;flex-direction:column;
      gap:8px;padding:0 12px;will-change:transform` });
    const meter = el('div', { class: 'mono', style: `position:absolute;right:10px;bottom:9px;font-size:9px;color:#39434F;
      z-index:3` });
    vp.appendChild(track); stage.append(vp, meter);
    const cards = LESSONS.map((t, i) => {
      const c = el('div', { style: `height:58px;flex:none;border-radius:13px;padding:0 13px;display:flex;
        align-items:center;gap:10px;will-change:transform,filter;
        background:linear-gradient(140deg,${alpha(COL[i], .14)},#0B1016 70%);border:1px solid ${alpha(COL[i], .3)}` });
      c.innerHTML = `<div style="width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
          background:${alpha(COL[i], .2)};color:${COL[i]};font:800 12px ui-monospace,monospace">${i + 1}</div>
        <div style="display:flex;flex-direction:column">
          <b class="mono" style="font-size:11.5px;color:#E6EDF3">${t}</b>
          <span class="mono" style="font-size:8.5px;color:#55687C">${4 + i} уроков · ${10 + i * 3} мин</span></div>
        <span style="margin-left:auto;color:${COL[i]};font-size:13px">›</span>`;
      track.appendChild(c); return c;
    });
    let y = 0, v = 0, dragging = false, maxY = 0;
    raf(dt => {
      maxY = Math.max(0, track.scrollHeight - stage.clientHeight + 28);
      if (!dragging) { y += v * dt; v *= Math.pow(.0016, dt);
        if (y > 0) { y = lerp(y, 0, 1 - Math.pow(.0005, dt)); v *= .5 }
        if (y < -maxY) { y = lerp(y, -maxY, 1 - Math.pow(.0005, dt)); v *= .5 } }
      track.style.transform = `translateY(${y.toFixed(1)}px)`;
      const speed = clamp(Math.abs(v) / 2200);
      cards.forEach((c, i) => {
        const r = 1 + speed * .22;
        const skew = clamp(v / 4200, -1, 1) * 3;
        c.style.transform = `scaleY(${r.toFixed(3)}) scaleX(${(1 - speed * .05).toFixed(3)}) skewY(${skew.toFixed(2)}deg)`;
        c.style.filter = speed > .06 ? `blur(${(speed * 2.4).toFixed(2)}px)` : 'none';
        c.style.opacity = String(1 - speed * .25);
      });
      meter.textContent = `v ${Math.abs(v).toFixed(0)} px/s`;
    });
    let lastY = 0, lastT = 0;
    drag(vp, {
      onStart(d) { dragging = true; v = 0; lastY = d.ey; lastT = performance.now(); vp.style.cursor = 'grabbing' },
      onMove(d) { const now = performance.now(), dtm = Math.max(8, now - lastT);
        const dy = d.ey - lastY; y += dy; v = dy / dtm * 1000; lastY = d.ey; lastT = now },
      onEnd() { dragging = false; vp.style.cursor = 'grab'; haptic('light') } });
  }
});

/* 123 --------------------------------------------------------------------
   Частицы собирают цифру. База: componentry particle typography.
   Смысл: результат «собирается» из хаоса — метафора системы из шума.       */
SA.register({
  n: '123', title: 'Частицы собирают цифру результата', group: 'fx2',
  hint: 'Веди пальцем — <b>частицы разлетаются и собираются обратно</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const WORDS = ['+247%', 'R 2.8', 'WR 54', '99 LVL'];
    let wi = 0, P = [], targets = [], t = 0;
    const label = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:36px;text-align:center;
      font-size:9.5px;color:#55687C`, text: 'тап — следующая метрика · палец разгоняет частицы' });
    const fallback = el('div', { class: 'mono', style: `position:absolute;inset:0;display:none;place-items:center;
      font:800 40px ui-monospace,monospace;color:#66B8FF` });
    stage.append(fallback, label);
    function build() {
      const size = Math.min(78, g.w * .22);
      const raw = textPoints(WORDS[wi], { size, step: 3, font: `900 ${Math.round(size)}px ui-monospace,monospace` });
      if (!raw.length) { fallback.style.display = 'grid'; fallback.textContent = WORDS[wi]; targets = []; return }
      fallback.style.display = 'none';
      /* textPoints отдаёт нормированные координаты −0.5…0.5 — разворачиваем в сцену */
      const bw = Math.min(g.w - 24, WORDS[wi].length * size * .62), bh = size * 1.3;
      targets = raw.map(p => ({ x: g.w / 2 + p.x * bw, y: g.h / 2 + p.y * bh }));
      while (P.length < targets.length) P.push({ x: rand(g.w), y: rand(g.h), vx: 0, vy: 0,
        c: pick(['#66B8FF', '#4ADE80', '#A78BFA', '#FFD166']) });
      P.length = targets.length;
    }
    let ready = false;
    raf(dt => {
      t += dt;
      if (!ready && g.w > 10) { build(); ready = true }
      g.clear();
      if (!targets.length) return;
      const mx = pointer.x, my = pointer.y, on = pointer.on;
      for (let i = 0; i < P.length; i++) {
        const p = P[i], tg = targets[i];
        let ax = (tg.x - p.x) * 16, ay = (tg.y - p.y) * 16;
        if (on) { const dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
          if (d2 < 5200) { const f = (5200 - d2) / 5200 * 1400 / Math.max(14, Math.sqrt(d2));
            ax += dx * f; ay += dy * f } }
        p.vx = (p.vx + ax * dt) * .86; p.vy = (p.vy + ay * dt) * .86;
        p.x += p.vx * dt; p.y += p.vy * dt;
        const sp = clamp(Math.hypot(p.vx, p.vy) / 420);
        g.x.fillStyle = sp > .1 ? mix(p.c, '#FFFFFF', sp) : p.c;
        g.x.globalAlpha = .55 + sp * .45;
        g.x.fillRect(p.x - 1.3, p.y - 1.3, 2.6, 2.6);
      }
      g.x.globalAlpha = 1;
    });
    const pointer = { x: 0, y: 0, on: false };
    stage.addEventListener('pointermove', e => { const p = local(stage, e); pointer.x = p.x; pointer.y = p.y; pointer.on = true });
    stage.addEventListener('pointerleave', () => pointer.on = false);
    stage.addEventListener('click', () => { wi = (wi + 1) % WORDS.length; build(); haptic('medium') });
  }
});

/* 124 --------------------------------------------------------------------
   Рябь по сетке графика. База: componentry image ripple.
   Смысл: тап по цене создаёт волну — «каждое действие двигает рынок».      */
SA.register({
  n: '124', title: 'Рябь по полотну рынка', group: 'fx2',
  hint: 'Тапай и веди — <b>волны искажают сетку и свечи</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const field = waveField();
    const data = ohlc(40, { start: 100, vol: 1.3, drift: .06, seed: 777 });
    const lo = Math.min(...data.map(d => d.l)) - 1, hi = Math.max(...data.map(d => d.h)) + 1;
    const hint = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:12px;text-align:center;
      font-size:9.5px;color:#39434F`, text: 'волны затухают — как импульс без объёма' });
    stage.appendChild(hint);
    raf(dt => {
      field.step(dt); g.clear();
      const STEP = 15;
      g.x.strokeStyle = 'rgba(255,255,255,.055)'; g.x.lineWidth = 1;
      for (let y = STEP; y < g.h; y += STEP) {
        g.x.beginPath();
        for (let x = 0; x <= g.w; x += 6) {
          const d = field.disp(x, y);
          const px = x + d.x, py = y + d.y;
          x === 0 ? g.x.moveTo(px, py) : g.x.lineTo(px, py);
        }
        g.x.stroke();
      }
      for (let x = STEP; x < g.w; x += STEP) {
        g.x.beginPath();
        for (let y = 0; y <= g.h; y += 6) {
          const d = field.disp(x, y);
          y === 0 ? g.x.moveTo(x + d.x, y + d.y) : g.x.lineTo(x + d.x, y + d.y);
        }
        g.x.stroke();
      }
      const X = scaleRaw(0, data.length - 1, 14, g.w - 14), Y = scaleRaw(lo, hi, g.h - 40, 34);
      data.forEach((d, i) => {
        const bx = X(i), by = Y(d.c), off = field.disp(bx, by);
        const up = d.c >= d.o, w = (g.w - 28) / data.length * .58;
        const amp = Math.hypot(off.x, off.y);
        g.x.strokeStyle = up ? alpha('#4ADE80', .85) : alpha('#FF4D4D', .85);
        g.x.fillStyle = amp > 2 ? mix(up ? '#4ADE80' : '#FF4D4D', '#FFFFFF', clamp(amp / 14)) : g.x.strokeStyle;
        g.x.lineWidth = Math.max(1, w * .18);
        const ox = off.x, oy = off.y;
        g.x.beginPath(); g.x.moveTo(bx + ox, Y(d.h) + oy); g.x.lineTo(bx + ox, Y(d.l) + oy); g.x.stroke();
        const a = Y(Math.max(d.o, d.c)) + oy, b = Y(Math.min(d.o, d.c)) + oy;
        g.x.fillRect(bx + ox - w / 2, a, w, Math.max(1.3, b - a));
      });
      hint.textContent = field.count ? `активных волн: ${field.count}` : 'тапни по полотну — пойдёт волна';
    });
    const push = (e, strong) => { const p = local(stage, e);
      field.add(p.x, p.y, { amp: strong ? 18 : 7, speed: strong ? 240 : 190, width: strong ? 54 : 40, decay: strong ? 1.6 : 1 });
      if (strong) haptic('medium') };
    stage.addEventListener('pointerdown', e => push(e, true));
    let th = 0;
    stage.addEventListener('pointermove', e => { const now = performance.now();
      if (now - th > 110) { th = now; push(e, false) } });
  }
});

/* 125 --------------------------------------------------------------------
   Лучи света и объём. База: magicui Light Rays. Смысл: «куда смотрит
   рынок» — луч следует за пальцем и подсвечивает уровень.                  */
SA.register({
  n: '125', title: 'Лучи: свет идёт за пальцем', group: 'fx2',
  hint: 'Веди пальцем — <b>объёмный свет и подсветка уровня</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const rnd = prng(29);
    const RAYS = Array.from({ length: 16 }, (_, i) => ({
      a: -Math.PI / 2 + (i - 7.5) * .085, w: .018 + rnd() * .03, sp: .25 + rnd() * .5, ph: rnd() * 10 }));
    const line = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:14px;text-align:center;
      font-size:9.5px;color:#55687C`, text: 'свет = внимание толпы; уровень под ним становится магнитом' });
    stage.appendChild(line);
    const SX = new Spring(.5, { stiff: 60, damp: 14 });
    let t = 0;
    raf(dt => {
      t += dt; g.clear();
      const sx = SX.step(dt) * g.w, sy = -30;
      // объёмные лучи
      g.x.globalCompositeOperation = 'lighter';
      RAYS.forEach(r => {
        const flick = .35 + .65 * (.5 + .5 * Math.sin(t * r.sp + r.ph));
        const len = g.h * 1.5;
        const a0 = r.a - r.w, a1 = r.a + r.w;
        const grd = g.x.createLinearGradient(sx, sy, sx + Math.cos(r.a) * len, sy + Math.sin(r.a) * len);
        grd.addColorStop(0, `rgba(130,190,255,${.26 * flick})`);
        grd.addColorStop(.45, `rgba(90,150,255,${.09 * flick})`);
        grd.addColorStop(1, 'rgba(60,110,255,0)');
        g.x.fillStyle = grd;
        g.x.beginPath(); g.x.moveTo(sx, sy);
        g.x.lineTo(sx + Math.cos(a0) * len, sy + Math.sin(a0) * len);
        g.x.lineTo(sx + Math.cos(a1) * len, sy + Math.sin(a1) * len);
        g.x.closePath(); g.x.fill();
      });
      // источник
      const halo = g.x.createRadialGradient(sx, sy + 10, 0, sx, sy + 10, 120);
      halo.addColorStop(0, 'rgba(180,220,255,.5)'); halo.addColorStop(1, 'rgba(180,220,255,0)');
      g.x.fillStyle = halo; g.x.fillRect(sx - 130, -40, 260, 180);
      g.x.globalCompositeOperation = 'source-over';
      // уровни, подсвеченные лучом
      [.42, .58, .74].forEach((ry, i) => {
        const y = g.h * ry;
        const d = Math.abs(sx - g.w * (.3 + i * .22)) / g.w;
        const k = clamp(1 - d * 2.2);
        g.x.strokeStyle = `rgba(230,237,243,${.08 + k * .5})`;
        g.x.lineWidth = 1 + k * 1.2;
        g.x.setLineDash([6, 5]); g.x.beginPath(); g.x.moveTo(12, y); g.x.lineTo(g.w - 12, y); g.x.stroke();
        g.x.setLineDash([]);
        g.x.fillStyle = `rgba(230,237,243,${.2 + k * .8})`;
        g.x.font = '700 9px ui-monospace,monospace'; g.x.textAlign = 'right';
        g.x.fillText(['СОПРОТИВЛЕНИЕ', 'ТЕКУЩАЯ', 'ПОДДЕРЖКА'][i], g.w - 14, y - 5);
      });
      // пылинки
      for (let i = 0; i < 26; i++) {
        const px = (noise2(i * .7, t * .08) * .5 + .5) * g.w;
        const py = ((i / 26 + t * .03) % 1) * g.h;
        const d = Math.abs(px - sx) / g.w;
        g.x.fillStyle = `rgba(200,225,255,${clamp(.5 - d) * .7})`;
        g.x.fillRect(px, py, 1.4, 1.4);
      }
    });
    stage.addEventListener('pointermove', e => { const p = local(stage, e); SX.jump(clamp(p.x / p.w)) });
    stage.addEventListener('pointerdown', e => { const p = local(stage, e); SX.set(clamp(p.x / p.w)); haptic('light') });
  }
});

/* 126 --------------------------------------------------------------------

  build(stage) {

    const PAT = [
      { n: 'МОЛОТ', c: '#4ADE80', d: [[.5, .55, .48, .52], [.52, .56, .2, .5], [.5, .72, .46, .7]],

        t: 'длинная верхняя тень: покупателей сняли на хае' },

    const name = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;top:12px;text-align:center;
      font:800 14px ui-monospace,monospace` });
    const desc = el('div', { class: 'mono', style: `position:absolute;left:14px;right:14px;bottom:34px;text-align:center;
      font-size:10px;line-height:1.5;color:#9FB0C2;transition:opacity .3s` });
    const dots = el('div', { style: `position:absolute;left:0;right:0;bottom:14px;display:flex;gap:5px;justify-content:center` });
    stage.append(name, desc, dots);
    const dn = PAT.map((p, i) => { const d = el('div', { style: `width:6px;height:6px;border-radius:3px;
      background:#2A3441;transition:.3s` }); dots.appendChild(d); return d });
    let cur = 0, nxt = 0, k = 1;
    function go(dir) { cur = nxt; nxt = (nxt + dir + PAT.length) % PAT.length; k = 0; haptic('medium');
      name.textContent = PAT[nxt].n; name.style.color = PAT[nxt].c;
      desc.textContent = PAT[nxt].t;
      dn.forEach((d, i) => { d.style.background = i === nxt ? PAT[i].c : '#2A3441';
        d.style.width = i === nxt ? '16px' : '6px' }) }
    name.textContent = PAT[0].n; name.style.color = PAT[0].c; desc.textContent = PAT[0].t;
    dn[0].style.background = PAT[0].c; dn[0].style.width = '16px';
    raf(dt => {
      k = Math.min(1, k + dt * 1.6);
      const e = ease.io(k);
      g.clear(); g.grid(24);
      const A = PAT[cur].d, B = PAT[nxt].d;
      const col = mix(PAT[cur].c, PAT[nxt].c, e);
      const cw = Math.min(42, g.w / 6);
      const base = g.w / 2 - cw * 1.4;
      for (let i = 0; i < 3; i++) {
        const o = lerp(A[i][0], B[i][0], e), h = lerp(A[i][1], B[i][1], e);
        const l = lerp(A[i][2], B[i][2], e), c = lerp(A[i][3], B[i][3], e);
        const Y = v => g.h - 60 - v * (g.h - 120);
        const x = base + i * cw * 1.4 + cw / 2;
        g.x.strokeStyle = col; g.x.fillStyle = col; g.x.lineWidth = Math.max(2, cw * .12);
        g.x.shadowColor = col; g.x.shadowBlur = 16;
        g.x.beginPath(); g.x.moveTo(x, Y(h)); g.x.lineTo(x, Y(l)); g.x.stroke();
        const y0 = Y(Math.max(o, c)), y1 = Y(Math.min(o, c));
        const up = c >= o;
        g.x.globalAlpha = up ? 1 : .45;
        rr(g.x, x - cw * .34, y0, cw * .68, Math.max(3, y1 - y0), 3);
        g.x.fill(); g.x.globalAlpha = 1; g.x.shadowBlur = 0;
        g.x.lineWidth = 1.4; g.x.stroke();
      }
      desc.style.opacity = String(.35 + e * .65);
    });
    stage.addEventListener('click', () => go(1));
    swipe(stage, { threshold: 46, onSwipe(dir) { if (dir === 'left') go(1); else if (dir === 'right') go(-1) } });
  }
});

/* 128 --------------------------------------------------------------------

    const title = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;top:10px;text-align:center;
      font-size:9px;letter-spacing:.2em;color:#6E7D8F`, text: 'УРОВЕНЬ 99 · КУРС ПРОЙДЕН' });
    const stamp = el('div', { class: 'mono', style: `position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(0) rotate(-18deg);
      padding:9px 16px;border:2.4px solid #4ADE80;border-radius:10px;color:#4ADE80;font:800 15px ui-monospace,monospace;
      letter-spacing:.1em;opacity:0;transition:transform .5s cubic-bezier(.2,1.5,.4,1),opacity .3s;pointer-events:none;
      box-shadow:0 0 30px rgba(74,222,128,.35)`, text: 'ДОПУЩЕН' });
    const foot = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:12px;text-align:center;
      font-size:9.5px;color:#55687C`, text: 'тап по центру — поставить печать' });
    stage.append(title, stamp, foot);
    const TX = new Spring(0, { stiff: 90, damp: 14 }), TY = new Spring(0, { stiff: 90, damp: 14 });
    const K = new Spring(0, { stiff: 70, damp: 16 });
    K.set(1);
    const rnd = prng(123);
    const STARS = Array.from({ length: 70 }, () => ({ x: rnd(), y: rnd(), z: .2 + rnd() * .8, s: .6 + rnd() * 1.6 }));
    let t = 0, done = false;
    raf(dt => {
      t += dt; g.clear();
      const tx = TX.step(dt), ty = TY.step(dt), k = ease.out(K.step(dt));
      // слой 1 — звёзды параллакса
      STARS.forEach(s => {
        const px = s.x * g.w + tx * 26 * s.z, py = s.y * g.h + ty * 26 * s.z;
        g.x.fillStyle = `rgba(160,190,230,${.12 + s.z * .4})`;
        g.x.beginPath(); g.x.arc(px, py, s.s * s.z, 0, SA.TAU); g.x.fill();
      });
      const cx = g.w / 2 + tx * 10, cy = g.h * .46 + ty * 10, R = Math.min(g.w, g.h) * .3;
      // слой 2 — концентрические сетки
      for (let r = 1; r <= 4; r++) {
        g.x.strokeStyle = `rgba(255,255,255,${.05 + r * .012})`; g.x.lineWidth = 1;
        g.x.beginPath();
        SKILL.forEach((_, i) => { const a = -Math.PI / 2 + i / SKILL.length * SA.TAU;
          const x = cx + Math.cos(a) * R * r / 4, y = cy + Math.sin(a) * R * r / 4;
          i ? g.x.lineTo(x, y) : g.x.moveTo(x, y) });
        g.x.closePath(); g.x.stroke();
      }
      // слой 3 — многоугольник навыка
      const pts = SKILL.map(([, v], i) => { const a = -Math.PI / 2 + i / SKILL.length * SA.TAU;
        const rr2 = R * v * k * (1 + Math.sin(t * 1.6 + i) * .015);
        return { x: cx + Math.cos(a) * rr2, y: cy + Math.sin(a) * rr2 } });
      g.x.beginPath(); tracePath(g.x, pts); g.x.closePath();
      const grd = g.x.createRadialGradient(cx, cy, 0, cx, cy, R);
      grd.addColorStop(0, 'rgba(74,222,128,.42)'); grd.addColorStop(1, 'rgba(0,122,253,.12)');
      g.x.fillStyle = grd; g.x.fill();
      g.x.strokeStyle = '#4ADE80'; g.x.lineWidth = 2; g.x.shadowColor = '#4ADE80'; g.x.shadowBlur = 16;
      g.x.stroke(); g.x.shadowBlur = 0;
      pts.forEach(p => { g.x.fillStyle = '#E6EDF3';
        g.x.beginPath(); g.x.arc(p.x, p.y, 2.6, 0, SA.TAU); g.x.fill() });
      // слой 4 — подписи
      g.x.font = '700 9px ui-monospace,monospace'; g.x.textBaseline = 'middle';
      SKILL.forEach(([n, v], i) => {
        const a = -Math.PI / 2 + i / SKILL.length * SA.TAU;
        const x = cx + Math.cos(a) * (R + 22), y = cy + Math.sin(a) * (R + 18);
        g.x.textAlign = Math.cos(a) > .3 ? 'left' : Math.cos(a) < -.3 ? 'right' : 'center';
        g.x.fillStyle = '#9FB0C2'; g.x.fillText(n, x, y);
        g.x.fillStyle = '#4ADE80'; g.x.fillText(Math.round(v * 100 * k) + '%', x, y + 10);
      });
    });
    drag(stage, { axis: false, onMove(d) { const p = local(stage, { clientX: d.ex, clientY: d.ey });
      TX.jump(clamp(p.x / p.w * 2 - 1, -1, 1)); TY.jump(clamp(p.y / p.h * 2 - 1, -1, 1)) },
      onEnd() { TX.set(0); TY.set(0) } });
    stage.addEventListener('click', () => {
      if (done) return; done = true; haptic('success');
      stamp.style.opacity = '1'; stamp.style.transform = 'translate(-50%,-50%) scale(1) rotate(-12deg)';
      const r = stage.getBoundingClientRect();
      fx.ring({ x: r.width / 2, y: r.height * .52, r: 150, color: '#4ADE80', width: 2.4 });
      confetti(fx, { x: r.width / 2, y: r.height * .5, n: 70 });
      foot.innerHTML = '<b style="color:#4ADE80">лицензия выдана</b> · дальше рынок проверит сам';
      setTimeout(() => { done = false; stamp.style.opacity = '0';
        stamp.style.transform = 'translate(-50%,-50%) scale(0) rotate(-18deg)';
        foot.textContent = 'тап по центру — поставить печать' }, 3400);
    });
  }
});
})();


/* ===== assets-ind.js ===== */
/* ============================================================================
   ГРУППА 17 — ИНДИКАТОРЫ (129–136).

   Пробел, который закрывает группа: в каталоге была «эстетика рынка», но не
   было ни одного инструмента, которым реально принимают решение. Видеокурс
   показывает RSI одной картинкой с подписью «перекупленность — продавай».
   Здесь период RSI живёт на слайдере: ученик сам видит, что на периоде 4
   сигналов двадцать и все ложные, а на 21 их два и оба поздние. Понимание
   приходит из противоречия, а не из определения.

   Каждый ассет группы устроен одинаково: живой параметр → мгновенный
   пересчёт по честной формуле → вердикт, который называет вещи своими
   именами → ловушка, в которую индикатор обычно заводит новичка.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, swipe, FX, canvas,
        local, rr, alpha, mix, prng, fmt, scaleRaw, ohlc, confetti, candles, plot, band, histBars,
        tagRight, slider, segment, verdict, kpiRow, rsi, macd, bollinger, atr, stoch, obv, vwap,
        volumeProfile, ema, sma, ichimoku, fib, pivots, trueRange } = SA;

/* 129 --------------------------------------------------------------------
   RSI: период как живой параметр + поиск дивергенции.                     */
SA.register({
  n: '129', title: 'RSI: период решает всё', group: 'ind',
  hint: 'Крути период — <b>сигналы появляются и исчезают</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const bars = ohlc(90, { start: 100, vol: 1.4, drift: .03, seed: 2024 });
    const closes = bars.map(b => b.c);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let period = 14, over = 70, cross = [];
    const sP = slider(ctr, { label: 'ПЕРИОД', min: 2, max: 40, value: 14, color: '#A78BFA',
      onInput(x) { period = x; recalc() } });
    const sO = slider(ctr, { label: 'ПОРОГ', min: 55, max: 90, value: 70, color: '#F59E0B',
      onInput(x) { over = x; recalc() } });
    let series = [];
    function recalc() {
      series = rsi(closes, period);
      cross = [];
      for (let i = 1; i < series.length; i++) {
        if (series[i] === null || series[i - 1] === null) continue;
        if (series[i - 1] < over && series[i] >= over) cross.push({ i, k: 'sell' });
        if (series[i - 1] > 100 - over && series[i] <= 100 - over) cross.push({ i, k: 'buy' });
      }
      /* сколько сигналов «сработало»: цена пошла в нужную сторону за 6 баров */
      let good = 0;
      cross.forEach(c => {
        const a = closes[c.i], b = closes[Math.min(closes.length - 1, c.i + 6)];
        if (c.k === 'sell' ? b < a : b > a) good++;
      });
      const acc = cross.length ? Math.round(good / cross.length * 100) : 0;
      v.set(cross.length > 14 ? 'bad' : acc >= 55 ? 'ok' : 'warn',
        cross.length > 14
          ? `<b>${cross.length} сигналов</b> на 90 барах — это не сигналы, это шум. Короткий период рисует перекупленность каждый второй день.`
          : cross.length < 3
            ? `<b>${cross.length} сигнала</b> — длинный период молчит почти всегда и входит последним. Угадано ${acc}%.`
            : `<b>${cross.length} сигналов, угадано ${acc}%</b> за 6 баров. RSI не разворачивает цену — он описывает скорость движения.`);
    }
    recalc();
    let t = 0;
    raf(dt => {
      t += dt; g.clear();
      const H = g.h, split = H * .46;
      g.grid(26);
      const { X, Y } = candles(g, bars, { x0: 12, x1: g.w - 12, y0: 14, y1: split - 10 });
      const RY = scaleRaw(0, 100, H - 92, split + 6);
      /* зоны перекупленности */
      g.x.fillStyle = alpha('#FF4D4D', .09);
      g.x.fillRect(12, RY(100), g.w - 24, RY(over) - RY(100));
      g.x.fillStyle = alpha('#4ADE80', .09);
      g.x.fillRect(12, RY(100 - over), g.w - 24, RY(0) - RY(100 - over));
      [over, 50, 100 - over].forEach(lv => {
        g.x.strokeStyle = lv === 50 ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.22)';
        g.x.setLineDash(lv === 50 ? [2, 4] : [4, 4]); g.x.lineWidth = 1;
        g.x.beginPath(); g.x.moveTo(12, RY(lv)); g.x.lineTo(g.w - 12, RY(lv)); g.x.stroke();
        g.x.setLineDash([]);
      });
      plot(g, series, X, RY, { color: '#A78BFA', width: 1.8, glow: 10 });
      cross.forEach(c => {
        const col = c.k === 'buy' ? '#4ADE80' : '#FF4D4D';
        g.x.strokeStyle = alpha(col, .35); g.x.lineWidth = 1;
        g.x.beginPath(); g.x.moveTo(X(c.i), 14); g.x.lineTo(X(c.i), H - 92); g.x.stroke();
        g.x.fillStyle = col;
        g.x.beginPath(); g.x.arc(X(c.i), RY(series[c.i]), 2.8, 0, SA.TAU); g.x.fill();
      });
      const last = series[series.length - 1];
      if (last !== null) tagRight(g, RY(last), last.toFixed(0), last > over ? '#FF4D4D' : last < 100 - over ? '#4ADE80' : '#A78BFA');
      g.x.font = '700 8.5px ui-monospace,monospace'; g.x.textAlign = 'left'; g.x.fillStyle = '#55687C';
      g.x.fillText(`RSI(${period})`, 14, split + 14);
    });
    stage.addEventListener('pointerdown', e => {
      const p = local(stage, e);
      if (p.y > g.h * .78) return;
      haptic('light');
      fx.ring({ x: p.x, y: p.y, r: 46, color: '#A78BFA', width: 1.4 });
    });
  }
});

/* 130 --------------------------------------------------------------------
   MACD: гистограмма, пересечения и запаздывание.                          */
SA.register({
  n: '130', title: 'MACD: цена сигнала — это задержка', group: 'ind',
  hint: 'Меняй быструю и медленную — <b>видно цену запаздывания</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const bars = ohlc(96, { start: 100, vol: 1.3, drift: .07, seed: 1313 });
    const closes = bars.map(b => b.c);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let fast = 12, slow = 26, M = null, sigs = [];
    slider(ctr, { label: 'БЫСТРАЯ', min: 3, max: 20, value: 12, color: '#66B8FF', onInput(x) { fast = x; recalc() } });
    slider(ctr, { label: 'МЕДЛЕННАЯ', min: 14, max: 50, value: 26, color: '#F59E0B', onInput(x) { slow = x; recalc() } });
    function recalc() {
      if (slow <= fast + 1) slow = fast + 2;
      M = macd(closes, fast, slow, 9);
      sigs = [];
      for (let i = 1; i < M.hist.length; i++) {
        if (M.hist[i] === null || M.hist[i - 1] === null) continue;
        if (Math.sign(M.hist[i]) !== Math.sign(M.hist[i - 1])) sigs.push({ i, up: M.hist[i] > 0 });
      }
      /* среднее запаздывание: сколько баров прошло от локального экстремума цены */
      let lagSum = 0, cnt = 0;
      sigs.forEach(s => {
        let best = s.i, bv = s.up ? Infinity : -Infinity;
        for (let j = Math.max(0, s.i - 14); j <= s.i; j++) {
          if (s.up ? closes[j] < bv : closes[j] > bv) { bv = closes[j]; best = j }
        }
        lagSum += s.i - best; cnt++;
      });
      const lag = cnt ? (lagSum / cnt).toFixed(1) : '—';
      v.set(sigs.length > 18 ? 'bad' : +lag > 7 ? 'warn' : 'ok',
        `Пересечений: <b>${sigs.length}</b> · среднее запаздывание <b>${lag} бара</b> от разворота цены.
         ${+lag > 7 ? 'Медленная пара ловит только середину движения — вход дорогой, стоп далеко.'
                    : 'Быстрая пара реагирует рано, но половина сигналов отменяется следующей свечой.'}`);
    }
    recalc();
    raf(() => {
      g.clear(); g.grid(26);
      const split = g.h * .46;
      const { X } = candles(g, bars, { x0: 12, x1: g.w - 12, y0: 12, y1: split - 8 });
      const vals = M.hist.concat(M.line, M.signal).filter(x => x !== null);
      const mx = Math.max(.1, Math.max(...vals.map(Math.abs)));
      const MY = scaleRaw(-mx, mx, g.h - 88, split + 4);
      g.x.strokeStyle = 'rgba(255,255,255,.14)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(12, MY(0)); g.x.lineTo(g.w - 12, MY(0)); g.x.stroke();
      histBars(g, M.hist, X, MY, { w: Math.max(2, (g.w - 24) / bars.length * .55) });
      plot(g, M.line, X, MY, { color: '#66B8FF', width: 1.6 });
      plot(g, M.signal, X, MY, { color: '#F59E0B', width: 1.4, dash: [3, 3] });
      sigs.forEach(s => {
        g.x.fillStyle = s.up ? '#4ADE80' : '#FF4D4D';
        g.x.beginPath();
        const y = MY(0);
        g.x.moveTo(X(s.i), y + (s.up ? 7 : -7));
        g.x.lineTo(X(s.i) - 3.4, y + (s.up ? 13 : -13));
        g.x.lineTo(X(s.i) + 3.4, y + (s.up ? 13 : -13));
        g.x.closePath(); g.x.fill();
      });
      g.x.font = '700 8.5px ui-monospace,monospace'; g.x.textAlign = 'left'; g.x.fillStyle = '#55687C';
      g.x.fillText(`MACD(${fast},${slow},9)`, 14, split + 12);
    });
  }
});

/* 131 --------------------------------------------------------------------
   Полосы Боллинджера и сжатие волатильности.                              */
SA.register({
  n: '131', title: 'Боллинджер: сжатие важнее касания', group: 'ind',
  hint: 'Меняй сигмы — <b>касание полосы перестаёт быть сигналом</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const bars = ohlc(80, { start: 100, vol: 1.1, drift: .04, seed: 99, regime: 'squeeze' });
    const closes = bars.map(b => b.c);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let n = 20, k = 2, B = null, touches = 0, squeeze = -1;
    slider(ctr, { label: 'ПЕРИОД', min: 5, max: 40, value: 20, color: '#66B8FF', onInput(x) { n = x; recalc() } });
    slider(ctr, { label: 'СИГМЫ', min: 1, max: 3.5, step: .1, value: 2, color: '#A78BFA',
      fmt: x => x.toFixed(1), onInput(x) { k = x; recalc() } });
    function recalc() {
      B = bollinger(closes, n, k);
      touches = closes.filter((c, i) => B.up[i] !== null && (c >= B.up[i] || c <= B.dn[i])).length;
      const w = B.width.filter(x => x !== null);
      const minW = Math.min(...w);
      squeeze = B.width.findIndex(x => x !== null && x <= minW * 1.12);
      const share = Math.round(touches / closes.length * 100);
      v.set(share > 18 ? 'bad' : share < 3 ? 'warn' : 'ok',
        `Касаний полосы: <b>${touches}</b> (${share}% баров). ${share > 18
          ? 'При таких настройках «цена у полосы» — обычное состояние, а не сигнал.'
          : 'Полоса — это мера нормальности, а не запрет. Сигналом является сжатие ширины, после него идёт импульс.'}`);
    }
    recalc();
    let t = 0, popped = false;
    raf(dt => {
      t += dt; g.clear(); g.grid(26);
      const { X, Y } = candles(g, bars, { x0: 12, x1: g.w - 12, y0: 16, y1: g.h - 104 });
      band(g, B.up, B.dn, X, Y, alpha('#66B8FF', .08));
      plot(g, B.up, X, Y, { color: alpha('#66B8FF', .8), width: 1.3 });
      plot(g, B.dn, X, Y, { color: alpha('#66B8FF', .8), width: 1.3 });
      plot(g, B.mid, X, Y, { color: alpha('#F59E0B', .75), width: 1.2, dash: [4, 4] });
      if (squeeze > 0) {
        const x = X(squeeze);
        g.x.strokeStyle = alpha('#FFD166', .6); g.x.setLineDash([3, 3]); g.x.lineWidth = 1.2;
        g.x.beginPath(); g.x.moveTo(x, 16); g.x.lineTo(x, g.h - 104); g.x.stroke(); g.x.setLineDash([]);
        g.x.fillStyle = '#FFD166'; g.x.font = '700 8.5px ui-monospace,monospace'; g.x.textAlign = 'center';
        g.x.fillText('СЖАТИЕ', x, 12);
        if (!popped && Math.sin(t * 1.4) > .98) {
          popped = true;
          fx.ring({ x, y: Y(closes[squeeze]), r: 56, color: '#FFD166', width: 1.6 });
          setTimeout(() => popped = false, 400);
        }
      }
      /* ширина полосы отдельной лентой */
      const wv = B.width, mw = Math.max(...wv.filter(x => x !== null));
      const WY = scaleRaw(0, mw, g.h - 88, g.h - 116);
      plot(g, wv, X, WY, { color: '#A78BFA', width: 1.4 });
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ШИРИНА ПОЛОСЫ, %', 14, g.h - 118);
      const last = closes[closes.length - 1];
      tagRight(g, Y(last), last.toFixed(1), '#E6EDF3');
    });
  }
});

/* 132 --------------------------------------------------------------------
   ATR: стоп по волатильности вместо стопа «на глаз».                      */
SA.register({
  n: '132', title: 'ATR: стоп по волатильности, а не по страху', group: 'ind',
  hint: 'Двигай множитель — <b>стоп и размер позиции пересчитываются</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const bars = ohlc(70, { start: 64000, vol: 420, drift: 20, seed: 555 });
    const A = atr(bars, 14);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'СТОП' }, { t: 'РАЗМЕР' }, { t: 'РИСК $' }, { t: 'ЦЕЛЬ 2R' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let mult = 1.5, riskPct = 1;
    const DEPO = 10000;
    slider(ctr, { label: 'ATR ×', min: .5, max: 4, step: .1, value: 1.5, color: '#F59E0B',
      fmt: x => x.toFixed(1) + '×', onInput(x) { mult = x; recalc() } });
    slider(ctr, { label: 'РИСК %', min: .25, max: 5, step: .25, value: 1, color: '#FF4D4D',
      fmt: x => x.toFixed(2) + '%', onInput(x) { riskPct = x; recalc() } });
    let stopD = 0, qty = 0;
    function recalc() {
      const a = A[A.length - 1] || 1;
      stopD = a * mult;
      const riskUsd = DEPO * riskPct / 100;
      qty = riskUsd / stopD;
      const price = bars[bars.length - 1].c;
      kpi.set(0, '−' + stopD.toFixed(0), '#FF4D4D');

          : `Стоп <b>${stopD.toFixed(0)}</b> = ${mult.toFixed(1)} × ATR(14) = ${pct.toFixed(2)}% цены. Позиция <b>${qty.toFixed(3)}</b> подобрана так, что при выбивании потеряешь ровно ${riskPct}% депозита, а не «сколько получится».`);
    }
    recalc();
    raf(() => {
      g.clear(); g.grid(26);
      const { X, Y } = candles(g, bars, { x0: 12, x1: g.w - 46, y0: 14, y1: g.h - 136, pad: 300 });

        g.x.beginPath(); g.x.moveTo(12, Y(p)); g.x.lineTo(g.w - 46, Y(p)); g.x.stroke(); g.x.setLineDash([]);

      });

      g.x.fillRect(12, Y(price), g.w - 58, Y(price - stopD) - Y(price));

});

/* 133 --------------------------------------------------------------------
   Профиль объёма, POC и зона стоимости.                                   */
SA.register({
  n: '133', title: 'Профиль объёма: где рынок согласен с ценой', group: 'ind',
  hint: 'Тяни окно расчёта — <b>POC и зона стоимости едут за ним</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const bars = ohlc(110, { start: 100, vol: 1.3, drift: .02, seed: 321 });
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;z-index:3;
      display:flex;flex-direction:column;gap:6px` });
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let from = .35, to = 1, P = null;
    function recalc() {
      const a = Math.floor(from * (bars.length - 1)), b = Math.floor(to * (bars.length - 1));
      const slice = bars.slice(Math.min(a, b - 10), Math.max(a + 10, b));
      P = volumeProfile(slice, 24);
      const poc = P.cells[P.poc];
      const price = bars[bars.length - 1].c;
      const inVA = price >= P.va[0] && price <= P.va[1];
      v.set(inVA ? 'info' : 'warn',
        `POC <b>${((poc.lo + poc.hi) / 2).toFixed(1)}</b> · зона стоимости ${P.va[0].toFixed(1)}–${P.va[1].toFixed(1)} (70% объёма).
         ${inVA ? 'Цена внутри зоны — рынок согласен сам с собой, движения короткие, пробои ложные.'
                : 'Цена вне зоны: либо возврат к POC, либо приём нового баланса. Тонкие зоны проходятся быстро — там нет защитников.'}`);
    }
    recalc();
    let t = 0;
    raf(dt => {
      t += dt; g.clear(); g.grid(26);
      const chartW = g.w - 86;
      const { X, Y } = candles(g, bars, { x0: 12, x1: chartW, y0: 14, y1: g.h - 84 });
      /* окно расчёта */
      const xa = X(Math.floor(from * (bars.length - 1))), xb = X(Math.floor(to * (bars.length - 1)));
      g.x.fillStyle = 'rgba(0,0,0,.45)';
      g.x.fillRect(12, 14, xa - 12, g.h - 98);
      g.x.strokeStyle = alpha('#66B8FF', .7); g.x.lineWidth = 1.4;
      g.x.beginPath(); g.x.moveTo(xa, 14); g.x.lineTo(xa, g.h - 84); g.x.stroke();
      /* сам профиль справа */
      const PW = 70;
      P.cells.forEach((c, i) => {
        const y0 = Y(c.hi), y1 = Y(c.lo);
        const w = c.v / P.max * PW;
        const inVA = c.lo >= P.va[0] - .001 && c.hi <= P.va[1] + .001;
        g.x.fillStyle = i === P.poc ? '#FFD166' : inVA ? alpha('#66B8FF', .55) : alpha('#55687C', .4);
        g.x.fillRect(g.w - 8 - w, y0 + .5, w, Math.max(1.5, y1 - y0 - 1));
      });
      /* линии POC и границ зоны */
      const poc = P.cells[P.poc];
      [[(poc.lo + poc.hi) / 2, '#FFD166', 'POC'], [P.va[0], '#66B8FF', 'VAL'], [P.va[1], '#66B8FF', 'VAH']]
        .forEach(([p, c, lbl]) => {
          g.x.strokeStyle = alpha(c, .6); g.x.setLineDash([4, 4]); g.x.lineWidth = 1;
          g.x.beginPath(); g.x.moveTo(12, Y(p)); g.x.lineTo(g.w - 8, Y(p)); g.x.stroke(); g.x.setLineDash([]);
          g.x.fillStyle = c; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
          g.x.fillText(lbl, 14, Y(p) - 3);
        });
      g.Y = Y; g.chartW = chartW;
    });
    drag(stage, { axis: true, onMove(d) {
      const p = local(stage, { clientX: d.ex, clientY: d.ey });
      from = clamp(p.x / Math.max(1, g.chartW || p.w), 0, .8);
      recalc();
      if (Math.random() < .18) haptic('selection');
    }, onEnd() { haptic('rigid');
      const y = g.Y ? g.Y((P.cells[P.poc].lo + P.cells[P.poc].hi) / 2) : 40;
      fx.ring({ x: (g.chartW || 200) * .6, y, r: 70, color: '#FFD166', width: 1.6 }) } });
  }
});

/* 134 --------------------------------------------------------------------
   VWAP и лента EMA: кто над кем.                                          */
SA.register({
  n: '134', title: 'VWAP и лента EMA: карта согласия', group: 'ind',
  hint: 'Переключай режим — <b>лента показывает согласованность ТФ</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const bars = ohlc(96, { start: 100, vol: 1.2, drift: .08, seed: 4242 });
    const closes = bars.map(b => b.c);
    const VW = vwap(bars);
    const LENS = [8, 13, 21, 34, 55, 89];
    const RIB = LENS.map(n => ema(closes, n));
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const v = verdict(panel, {});
    stage.appendChild(panel);
    const seg = segment(panel, ['ЛЕНТА EMA', 'VWAP', 'ВМЕСТЕ'], { value: 2, color: '#4ADE80',
      onPick(i) { mode = i; describe() } });
    let mode = 2;
    function describe() {
      const i = closes.length - 1;
      const vals = RIB.map(r => r[i]).filter(x => x !== null);
      const sorted = [...vals].sort((a, b) => b - a);
      const aligned = vals.every((x, j) => j === 0 || x <= vals[j - 1]) ||
                      vals.every((x, j) => j === 0 || x >= vals[j - 1]);
      const spread = (Math.max(...vals) - Math.min(...vals)) / closes[i] * 100;
      const overV = closes[i] > VW[i];
      v.set(aligned ? 'ok' : 'warn',
        `${aligned ? '<b>Лента выстроена</b>' : '<b>Лента перепутана</b>'} · разброс ${spread.toFixed(2)}% ·
         цена ${overV ? '<b style="color:#4ADE80">над VWAP</b>' : '<b style="color:#FF4D4D">под VWAP</b>'}.
         ${aligned ? 'Все горизонты согласны — откаты выкупаются, контртренд дорог.'
                   : 'Горизонты спорят. Это не тренд, а перестройка: лучшее действие — не действовать.'}`);
    }
    describe();
    raf(() => {
      g.clear(); g.grid(26);
      const { X, Y } = candles(g, bars, { x0: 12, x1: g.w - 46, y0: 14, y1: g.h - 86, alpha: .5 });
      if (mode !== 1) {
        RIB.forEach((r, i) => {
          const c = mix('#66B8FF', '#A78BFA', i / (RIB.length - 1));
          plot(g, r, X, Y, { color: alpha(c, .9), width: 1.3 });
        });
        for (let i = 0; i < RIB.length - 1; i++) band(g, RIB[i], RIB[i + 1], X, Y, alpha('#66B8FF', .05));
      }
      if (mode !== 0) {
        plot(g, VW, X, Y, { color: '#FFD166', width: 2, glow: 10 });
        tagRight(g, Y(VW[VW.length - 1]), 'VWAP', '#FFD166');
      }
      const last = closes[closes.length - 1];
      tagRight(g, Y(last), last.toFixed(1), last > VW[VW.length - 1] ? '#4ADE80' : '#FF4D4D');
    });
  }
});

      const pos = c > top ? 'НАД' : c < bot ? 'ПОД' : 'ВНУТРИ';

      kpi.set(2, thick.toFixed(1) + '%', thick > 2 ? '#66B8FF' : '#F59E0B');

          : `${pos === 'НАД' ? 'Над облаком' : 'Под облаком'} толщиной ${thick.toFixed(1)}%: тонкое облако легко пробивается, толстое держит. Линии ${cross === 'ВВЕРХ' ? 'подтверждают покупателя' : 'подтверждают продавца'}.`);

      const A = I.spanA, B = I.spanB;
      /* облако окрашивается по знаку разности */
      for (let i = 1; i < bars.length; i++) {
        if (A[i] === null || B[i] === null || A[i - 1] === null) continue;
        g.x.beginPath();
        g.x.moveTo(X(i - 1), Y(A[i - 1])); g.x.lineTo(X(i), Y(A[i]));
        g.x.lineTo(X(i), Y(B[i])); g.x.lineTo(X(i - 1), Y(B[i - 1]));
        g.x.closePath();
        g.x.fillStyle = A[i] >= B[i] ? alpha('#4ADE80', .13) : alpha('#FF4D4D', .13);

      plot(g, B, X, Y, { color: alpha('#FF4D4D', .6), width: 1 });
      plot(g, I.tenkan, X, Y, { color: '#66B8FF', width: 1.4 });
      plot(g, I.kijun, X, Y, { color: '#F59E0B', width: 1.4 });
      const i = clamp(cursor, 0, bars.length - 1);
      g.x.strokeStyle = 'rgba(255,255,255,.4)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(X(i), 14); g.x.lineTo(X(i), g.h - 110); g.x.stroke();
      tagRight(g, Y(bars[i].c), bars[i].c.toFixed(1), '#E6EDF3');
      g.X = X;
    });
    stage.addEventListener('pointermove', e => {
      const p = local(stage, e);
      cursor = Math.round(clamp((p.x - 12) / Math.max(1, (p.w - 52))) * (bars.length - 1));
      describe();
    });
  }

/* ===== assets-edge.js ===== */
/* ============================================================================
   ГРУППА 18 — МАТЕМАТИКА ПРЕИМУЩЕСТВА (137–144).

   Самый дорогой пробел любого курса: про винрейт говорят все, а посчитать
   его следствия не даёт никто. Ученик выходит с верой «нужно угадывать
   чаще, чем ошибаться» и сливает счёт при винрейте 60%, потому что средний
   убыток у него вдвое больше средней прибыли.

   Группа делает одну вещь: превращает абстракции в ручки. Винрейт, риск на
   сделку, соотношение прибыли к убытку — всё это слайдеры, и каждый сдвиг
   мгновенно перерисовывает распределение, просадку и вероятность разорения.
   Это и есть обещанная трёхкратная эффективность: не «запомнить формулу»,
   а «почувствовать, где она ломается».
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, swipe, FX, canvas,
        local, rr, alpha, mix, prng, fmt, scaleRaw, ohlc, confetti, shuffle, plot, histBars,
        slider, segment, verdict, kpiRow, tagRight, expectancy, kelly, equity, maxDD, streaks,
        monteCarlo, histogram, quantile, wrError, mean, corr, sparkline } = SA;

/* 137 --------------------------------------------------------------------
   Матожидание: винрейт без соотношения ничего не значит.                  */
SA.register({
  n: '137', title: 'Матожидание: винрейт сам по себе пуст', group: 'edge',
  hint: 'Крути винрейт и R — <b>граница прибыльности видна сразу</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'МАТОЖИДАНИЕ' }, { t: 'НА 100 СДЕЛОК' }, { t: 'ТОЧКА БЕЗУБ.' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let wr = .45, rr = 2;
    slider(ctr, { label: 'ВИНРЕЙТ', min: 5, max: 95, value: 45, color: '#66B8FF',
      fmt: x => x + '%', onInput(x) { wr = x / 100; recalc() } });
    slider(ctr, { label: 'ПРИБЫЛЬ/УБЫТОК', min: .2, max: 6, step: .1, value: 2, color: '#4ADE80',
      fmt: x => x.toFixed(1) + 'R', onInput(x) { rr = x; recalc() } });
    let exp = 0, be = 0, flash = 0;
    function recalc() {
      exp = expectancy(wr, rr);
      be = 1 / (1 + rr);
      kpi.set(0, exp.toFixed(3) + 'R', exp > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(1, (exp * 100).toFixed(1) + 'R', exp > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(2, (be * 100).toFixed(1) + '%', '#F59E0B');
      v.set(exp > .2 ? 'ok' : exp > 0 ? 'warn' : 'bad',
        exp <= 0
          ? `Минус <b>${Math.abs(exp).toFixed(3)}R</b> на сделку. При соотношении ${rr.toFixed(1)}R нужен винрейт выше <b>${(be * 100).toFixed(1)}%</b> — иначе комиссия добьёт быстрее рынка.`
          : `Плюс <b>${exp.toFixed(3)}R</b> на сделку. Запас над точкой безубытка ${((wr - be) * 100).toFixed(1)} п.п.
             ${exp < .2 ? 'Это тонкий край: проскальзывание и комиссия съедят половину.' : 'Такой край выдерживает серию из 10 убытков без паники.'}`);
      flash = 1;
      haptic(exp > 0 ? 'selection' : 'light');
    }
    recalc();
    let t = 0;
    raf(dt => {
      t += dt; flash = Math.max(0, flash - dt * 2);
      g.clear();
      /* карта безубытка: по X винрейт, по Y соотношение */
      const PAD = { l: 26, r: 12, t: 14, b: 112 };
      const W = g.w - PAD.l - PAD.r, H = g.h - PAD.t - PAD.b;
      const X = scaleRaw(5, 95, PAD.l, PAD.l + W), Y = scaleRaw(.2, 6, PAD.t + H, PAD.t);
      for (let px = 0; px < W; px += 5) {
        for (let py = 0; py < H; py += 5) {
          const w0 = 5 + (px / W) * 90, r0 = .2 + (1 - py / H) * 5.8;
          const e = expectancy(w0 / 100, r0);
          g.x.fillStyle = e > 0 ? alpha('#4ADE80', clamp(e * .5) * .55 + .05)
                                : alpha('#FF4D4D', clamp(-e * .9) * .5 + .04);
          g.x.fillRect(PAD.l + px, PAD.t + py, 5, 5);
        }
      }
      /* линия нулевого матожидания */
      g.x.strokeStyle = '#FFD166'; g.x.lineWidth = 1.6; g.x.setLineDash([5, 4]);
      g.x.beginPath();
      for (let r0 = .2; r0 <= 6; r0 += .05) {
        const w0 = 1 / (1 + r0) * 100;
        const px = X(clamp(w0, 5, 95)), py = Y(r0);
        r0 === .2 ? g.x.moveTo(px, py) : g.x.lineTo(px, py);
      }
      g.x.stroke(); g.x.setLineDash([]);
      /* текущая точка */
      const cx = X(wr * 100), cy = Y(rr);
      g.x.fillStyle = exp > 0 ? '#4ADE80' : '#FF4D4D';
      g.x.shadowColor = g.x.fillStyle; g.x.shadowBlur = 16 + flash * 20;
      g.x.beginPath(); g.x.arc(cx, cy, 6 + flash * 3, 0, SA.TAU); g.x.fill(); g.x.shadowBlur = 0;
      g.x.strokeStyle = 'rgba(255,255,255,.3)'; g.x.lineWidth = 1; g.x.setLineDash([2, 3]);
      g.x.beginPath(); g.x.moveTo(PAD.l, cy); g.x.lineTo(cx, cy); g.x.moveTo(cx, PAD.t + H); g.x.lineTo(cx, cy);
      g.x.stroke(); g.x.setLineDash([]);
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace';
      g.x.textAlign = 'left'; g.x.fillText('R', PAD.l - 20, PAD.t + 6);
      g.x.fillText('ВИНРЕЙТ →', PAD.l, PAD.t + H + 12);
      g.x.fillStyle = '#FFD166'; g.x.fillText('НОЛЬ', X(42), Y(1.5));
    });
  }
});

         ${MC.ruin > .05 ? `При риске ${(risk * 100).toFixed(1)}% на сделку вероятность потерять половину счёта — <b>${(MC.ruin * 100).toFixed(1)}%</b>. Край есть, выживания нет.`
                         : 'В 95% случаев просадка не глубже ' + (MC.ddP95 * 100).toFixed(0) + '%. Именно это число надо выдержать психологически, а не среднюю доходность.'}`);

      const H = g.h - PAD.t - PAD.b;

      const lo = Math.min(...all), hi = Math.max(...all);
      const X = scaleRaw(0, 120, PAD.l, g.w - PAD.r), Y = scaleRaw(lo, hi, PAD.t + H, PAD.t);

      g.x.beginPath(); g.x.moveTo(PAD.l, Y(10000)); g.x.lineTo(g.w - PAD.r, Y(10000)); g.x.stroke();

      MC.paths.forEach((p, i) => {
        const end = p[p.length - 1];
        const col = end > 10000 ? '#4ADE80' : end > 5000 ? '#F59E0B' : '#FF4D4D';
        g.x.strokeStyle = alpha(col, i === 0 ? .9 : .18);
        g.x.lineWidth = i === 0 ? 1.8 : .9;

          const px = X(j), py = Y(p[j]);
          j ? g.x.lineTo(px, py) : g.x.moveTo(px, py);
        }
        g.x.stroke();
      });
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('120 СДЕЛОК · 300 СЕРИЙ · СТАРТ $10 000', PAD.l + 2, PAD.t + 10);
    });
  }
});

/* 139 --------------------------------------------------------------------
   Келли и «оптимальный» риск, который убивает.                            */
SA.register({
  n: '139', title: 'Келли: оптимум, за которым обрыв', group: 'edge',
  hint: 'Двигай риск — <b>кривая роста имеет вершину и обрыв</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'ТВОЙ РИСК' }, { t: 'КЕЛЛИ' }, { t: '¼ КЕЛЛИ' }, { t: 'РОСТ' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let wr = .5, rr = 2, risk = .02;
    slider(ctr, { label: 'ВИНРЕЙТ', min: 25, max: 75, value: 50, color: '#66B8FF',
      fmt: x => x + '%', onInput(x) { wr = x / 100; recalc() } });
    slider(ctr, { label: 'РИСК НА СДЕЛКУ', min: .5, max: 40, step: .5, value: 2, color: '#FF4D4D',
      fmt: x => x + '%', onInput(x) { risk = x / 100; recalc() } });
    let curve = [], K = 0;
    function growth(f) {
      /* логарифмический темп роста капитала при доле f */
      if (f <= 0) return 0;
      const up = 1 + f * rr, dn = 1 - f;
      if (dn <= 0) return -1;
      return wr * Math.log(up) + (1 - wr) * Math.log(dn);
    }
    function recalc() {
      K = kelly(wr, rr);
      curve = [];
      for (let f = 0; f <= .6; f += .005) curve.push({ f, g: growth(f) });
      const mine = growth(risk);
      kpi.set(0, (risk * 100).toFixed(1) + '%', risk > K ? '#FF4D4D' : '#4ADE80');
      kpi.set(1, (K * 100).toFixed(1) + '%', '#F59E0B');
      kpi.set(2, (K * 25).toFixed(1) + '%', '#4ADE80');
      kpi.set(3, mine > 0 ? '+' + (mine * 100).toFixed(2) + '%' : (mine * 100).toFixed(2) + '%',
        mine > 0 ? '#4ADE80' : '#FF4D4D');
      v.set(K <= 0 ? 'bad' : risk > K ? 'bad' : risk > K / 2 ? 'warn' : 'ok',
        K <= 0 ? 'При таких параметрах края нет вообще: любая ставка разрушает капитал. Келли отрицателен — правильный размер позиции равен нулю.'
          : risk > K
            ? `Ты справа от вершины. Риск <b>${(risk * 100).toFixed(1)}%</b> больше Келли <b>${(K * 100).toFixed(1)}%</b>: доходность уже падает, а просадка растёт. За обрывом рост отрицательный даже при выигрышной системе.`
            : `Риск <b>${(risk * 100).toFixed(1)}%</b> против Келли ${(K * 100).toFixed(1)}%. Практики берут четверть Келли — ${(K * 25).toFixed(1)}%: теряешь ~25% скорости, получаешь вдвое меньшую просадку.`);
    }
    recalc();
    raf(() => {
      g.clear(); g.grid(26);
      const PAD = { l: 14, r: 14, t: 16, b: 120 };
      const W = g.w - PAD.l - PAD.r, H = g.h - PAD.t - PAD.b;
      const gm = Math.max(...curve.map(c => c.g), .001);
      const X = scaleRaw(0, .6, PAD.l, PAD.l + W), Y = scaleRaw(-gm * 1.6, gm * 1.25, PAD.t + H, PAD.t);
      g.x.strokeStyle = 'rgba(255,255,255,.16)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(PAD.l, Y(0)); g.x.lineTo(PAD.l + W, Y(0)); g.x.stroke();
      /* заливка положительной зоны */
      g.x.beginPath(); g.x.moveTo(X(0), Y(0));
      curve.forEach(c => g.x.lineTo(X(c.f), Y(Math.max(c.g, -gm * 1.6))));
      g.x.lineTo(X(.6), Y(0)); g.x.closePath();
      g.x.fillStyle = alpha('#4ADE80', .1); g.x.fill();
      g.x.strokeStyle = '#4ADE80'; g.x.lineWidth = 2; g.x.shadowColor = '#4ADE80'; g.x.shadowBlur = 12;
      g.x.beginPath();
      curve.forEach((c, i) => { const py = Y(Math.max(c.g, -gm * 1.6));
        i ? g.x.lineTo(X(c.f), py) : g.x.moveTo(X(c.f), py) });
      g.x.stroke(); g.x.shadowBlur = 0;
      if (K > 0) {
        g.x.strokeStyle = '#F59E0B'; g.x.setLineDash([4, 4]); g.x.lineWidth = 1.3;
        g.x.beginPath(); g.x.moveTo(X(K), PAD.t); g.x.lineTo(X(K), PAD.t + H); g.x.stroke(); g.x.setLineDash([]);
        g.x.fillStyle = '#F59E0B'; g.x.font = '700 8.5px ui-monospace,monospace'; g.x.textAlign = 'center';
        g.x.fillText('КЕЛЛИ', X(K), PAD.t - 4);
        g.x.fillStyle = '#4ADE80'; g.x.fillText('¼', X(K / 4), PAD.t - 4);
      }
      const mine = growth(risk);
      g.x.fillStyle = mine > 0 ? '#E6EDF3' : '#FF4D4D';
      g.x.shadowColor = g.x.fillStyle; g.x.shadowBlur = 14;
      g.x.beginPath(); g.x.arc(X(clamp(risk, 0, .6)), Y(Math.max(mine, -gm * 1.6)), 5.5, 0, SA.TAU);
      g.x.fill(); g.x.shadowBlur = 0;
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ДОЛЯ КАПИТАЛА В СДЕЛКЕ →', PAD.l, PAD.t + H + 12);
    });
  }
});

/* 140 --------------------------------------------------------------------
   Распределение R: где на самом деле живут деньги.                        */
SA.register({
  n: '140', title: 'Распределение R: деньги в хвосте', group: 'edge',
  hint: 'Отрезай лучшие сделки — <b>система теряет смысл</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const rnd = prng(2025);
    /* реалистичный профиль: много мелких минусов, редкие большие плюсы */
    const TRADES = Array.from({ length: 220 }, () => {
      const r = rnd();
      if (r < .55) return -(0.6 + rnd() * .7);
      if (r < .9) return .4 + rnd() * 1.6;
      return 2.5 + rnd() * 6;
    });
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'СУММА R' }, { t: 'СРЕДНЕЕ' }, { t: 'ВИНРЕЙТ' }, { t: 'БЕЗ ТОП-N' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let cut = 0, H = null, kept = TRADES;
    slider(ctr, { label: 'ОТРЕЗАТЬ ЛУЧШИХ', min: 0, max: 20, value: 0, color: '#FF4D4D',
      fmt: x => x + ' шт', onInput(x) { cut = x; recalc() } });
    function recalc() {
      const sorted = [...TRADES].sort((a, b) => b - a);
      const banned = new Set(sorted.slice(0, cut));
      kept = TRADES.filter(r => !banned.has(r));
      H = histogram(kept, 26, -3, 9);
      const total = kept.reduce((s, r) => s + r, 0);
      const wrv = kept.filter(r => r > 0).length / kept.length;
      kpi.set(0, total.toFixed(1) + 'R', total > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(1, (total / kept.length).toFixed(3) + 'R', total > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(2, (wrv * 100).toFixed(0) + '%', '#66B8FF');
      kpi.set(3, cut ? '−' + cut : '—', '#F59E0B');
      const full = TRADES.reduce((s, r) => s + r, 0);
      v.set(total <= 0 ? 'bad' : cut > 0 ? 'warn' : 'ok',
        cut === 0
          ? `220 сделок, итог <b>${full.toFixed(1)}R</b> при винрейте ${(wrv * 100).toFixed(0)}%. Форма распределения важнее средней: большинство сделок мелкие, прибыль приносит правый хвост.`
          : `Убрали <b>${cut}</b> лучших сделок — осталось <b>${total.toFixed(1)}R</b> вместо ${full.toFixed(1)}R.
             ${total <= 0 ? 'Система стала убыточной. Вот почему ранний выход «чтобы зафиксировать» ломает край: он срезает именно хвост.' : 'Край тает на глазах, хотя винрейт почти не изменился.'}`);
    }
    recalc();
    raf(() => {
      g.clear(); g.grid(26);
      const PAD = { l: 14, r: 14, t: 16, b: 124 };
      const W = g.w - PAD.l - PAD.r, Hh = g.h - PAD.t - PAD.b;
      const X = scaleRaw(-3, 9, PAD.l, PAD.l + W), Y = scaleRaw(0, H.max, PAD.t + Hh, PAD.t);
      g.x.strokeStyle = 'rgba(255,255,255,.22)'; g.x.lineWidth = 1.2;
      g.x.beginPath(); g.x.moveTo(X(0), PAD.t); g.x.lineTo(X(0), PAD.t + Hh); g.x.stroke();
      const bw = W / H.bins.length;
      H.bins.forEach(b => {
        if (!b.n) return;
        const mid = (b.lo + b.hi) / 2;
        const col = mid < 0 ? '#FF4D4D' : mid > 2.5 ? '#FFD166' : '#4ADE80';
        const y = Y(b.n);
        g.x.fillStyle = alpha(col, .8);
        rr(g.x, X(b.lo) + 1, y, Math.max(1.5, bw - 2), PAD.t + Hh - y, 2);
        g.x.fill();
      });
      /* средняя и медиана */
      const m = mean(kept);
      g.x.strokeStyle = '#66B8FF'; g.x.setLineDash([4, 3]); g.x.lineWidth = 1.4;
      g.x.beginPath(); g.x.moveTo(X(m), PAD.t); g.x.lineTo(X(m), PAD.t + Hh); g.x.stroke(); g.x.setLineDash([]);
      g.x.fillStyle = '#66B8FF'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'center';
      g.x.fillText('СРЕДНЕЕ', X(m), PAD.t - 4);
      g.x.fillStyle = '#55687C'; g.x.textAlign = 'left';
      g.x.fillText('−3R', PAD.l, PAD.t + Hh + 12);
      g.x.textAlign = 'right'; g.x.fillText('+9R', PAD.l + W, PAD.t + Hh + 12);
      g.x.fillStyle = '#FFD166'; g.x.textAlign = 'center';
      g.x.fillText('ХВОСТ, РАДИ КОТОРОГО ВСЁ', X(5.5), PAD.t + 10);
    });
  }
});

/* 141 --------------------------------------------------------------------
   Кривая счёта: просадка как время, а не только как процент.              */
SA.register({
  n: '141', title: 'Просадка: не глубина, а длина', group: 'edge',
  hint: 'Тяни по кривой — <b>подводное время считается честно</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const rnd = prng(888);
    const rs = Array.from({ length: 180 }, () => rnd() < .44 ? 2 : -1);
    const eq = equity(rs, { risk: .015 });
    const DD = maxDD(eq);
    /* подводное время: доля баров ниже предыдущего пика */
    let peak = eq[0], under = 0, longest = 0, run = 0;
    const uw = eq.map(v => {
      if (v >= peak) { peak = v; run = 0 } else { run++; under++; longest = Math.max(longest, run) }
      return (v - peak) / peak;
    });
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'ИТОГ' }, { t: 'МАКС. ПРОСАДКА' }, { t: 'ПОД ВОДОЙ' }, { t: 'ДЛИННЕЙШАЯ' }]);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    kpi.set(0, '+' + ((eq[eq.length - 1] / eq[0] - 1) * 100).toFixed(0) + '%', '#4ADE80');
    kpi.set(1, '−' + (DD.dd * 100).toFixed(1) + '%', '#FF4D4D');
    kpi.set(2, Math.round(under / eq.length * 100) + '%', '#F59E0B');
    kpi.set(3, longest + ' сделок', '#F59E0B');
    v.set('warn', `Кривая выросла на ${((eq[eq.length - 1] / eq[0] - 1) * 100).toFixed(0)}%, но <b>${Math.round(under / eq.length * 100)}% времени</b>
      счёт был ниже предыдущего максимума. Бросают не из-за глубины, а из-за длины: ${longest} сделок подряд без нового пика.`);
    let cursor = eq.length - 1;
    raf(() => {
      g.clear(); g.grid(26);
      const PAD = { l: 12, r: 44, t: 14, b: 116 };
      const W = g.w - PAD.l - PAD.r, H = (g.h - PAD.t - PAD.b) * .62, H2 = (g.h - PAD.t - PAD.b) * .32;
      const X = scaleRaw(0, eq.length - 1, PAD.l, PAD.l + W);
      const Y = scaleRaw(Math.min(...eq) * .98, Math.max(...eq) * 1.02, PAD.t + H, PAD.t);
      /* заливка подводных участков */
      let seg = null;
      uw.forEach((u, i) => {
        if (u < 0 && !seg) seg = i;
        if ((u >= 0 || i === uw.length - 1) && seg !== null) {
          g.x.fillStyle = alpha('#FF4D4D', .1);
          g.x.fillRect(X(seg), PAD.t, X(i) - X(seg), H);
          seg = null;
        }
      });
      g.glowLine(eq.map((v2, i) => ({ x: X(i), y: Y(v2) })), { color: '#4ADE80', width: 2, blur: 12 });
      /* линия пиков */
      let pk = eq[0];
      const peaks = eq.map(v2 => (pk = Math.max(pk, v2)));
      plot(g, peaks, X, Y, { color: alpha('#FFD166', .6), width: 1, dash: [3, 3] });
      /* подводная лента */
      const Y2 = scaleRaw(Math.min(...uw), 0, PAD.t + H + H2 + 10, PAD.t + H + 12);
      g.x.beginPath(); g.x.moveTo(X(0), Y2(0));
      uw.forEach((u, i) => g.x.lineTo(X(i), Y2(u)));
      g.x.lineTo(X(uw.length - 1), Y2(0)); g.x.closePath();
      g.x.fillStyle = alpha('#FF4D4D', .3); g.x.fill();
      plot(g, uw, X, Y2, { color: '#FF4D4D', width: 1.2 });
      /* курсор */
      const i = clamp(cursor, 0, eq.length - 1);
      g.x.strokeStyle = 'rgba(255,255,255,.45)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(X(i), PAD.t); g.x.lineTo(X(i), PAD.t + H + H2 + 10); g.x.stroke();
      tagRight(g, Y(eq[i]), '$' + Math.round(eq[i]), '#E6EDF3');
      tagRight(g, Y2(uw[i]), (uw[i] * 100).toFixed(1) + '%', '#FF4D4D');
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ПОД ВОДОЙ', PAD.l + 2, PAD.t + H + 10);
    });
    drag(stage, { axis: true, onMove(d) {
      const p = local(stage, { clientX: d.ex, clientY: d.ey });
      cursor = Math.round(clamp((p.x - 12) / Math.max(1, p.w - 56)) * (eq.length - 1));
      if (Math.random() < .15) haptic('selection');
    } });
  }
});

/* 142 --------------------------------------------------------------------
   Сколько сделок нужно, чтобы поверить своей статистике.                  */
SA.register({
  n: '142', title: 'Размер выборки: когда можно верить цифре', group: 'edge',
  hint: 'Двигай число сделок — <b>доверительный интервал сжимается</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'ИНТЕРВАЛ' }, { t: '±' }, { t: 'НУЖНО ДЛЯ ±5%' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let n = 20, wr = .55;
    slider(ctr, { label: 'СДЕЛОК', min: 5, max: 500, value: 20, color: '#66B8FF',
      onInput(x) { n = x; recalc() } });
    slider(ctr, { label: 'НАБЛЮД. ВИНРЕЙТ', min: 20, max: 80, value: 55, color: '#4ADE80',
      fmt: x => x + '%', onInput(x) { wr = x / 100; recalc() } });
    let lo = 0, hi = 1, need = 0;
    function recalc() {
      const se = wrError(wr, n);
      lo = clamp(wr - 1.96 * se); hi = clamp(wr + 1.96 * se);
      need = Math.ceil(wr * (1 - wr) * (1.96 / .05) ** 2);
      kpi.set(0, `${(lo * 100).toFixed(0)}–${(hi * 100).toFixed(0)}%`, '#E6EDF3');
      kpi.set(1, (1.96 * se * 100).toFixed(1) + ' п.п.', hi - lo > .2 ? '#FF4D4D' : '#4ADE80');
      kpi.set(2, need + ' шт', '#F59E0B');
      const crossesBE = lo < .34;
      v.set(hi - lo > .2 ? 'bad' : hi - lo > .1 ? 'warn' : 'ok',
        `При <b>${n}</b> сделках настоящий винрейт лежит в коридоре <b>${(lo * 100).toFixed(0)}–${(hi * 100).toFixed(0)}%</b>.
         ${crossesBE ? 'Коридор задевает зону убытка при 2R — на такой выборке нельзя утверждать, что система вообще работает.'
                     : 'Коридор уже уверенно выше точки безубытка для 2R (34%).'}
         Чтобы сузить до ±5 п.п., нужно <b>${need}</b> сделок.`);
    }
    recalc();
    let t = 0;
    raf(dt => {
      t += dt; g.clear(); g.grid(26);
      const PAD = { l: 16, r: 16, t: 20, b: 118 };
      const W = g.w - PAD.l - PAD.r, H = g.h - PAD.t - PAD.b;
      const X = scaleRaw(0, 1, PAD.l, PAD.l + W);
      /* колокол нормального приближения */
      const se = Math.max(.001, wrError(wr, n));
      const peak = 1 / (se * Math.sqrt(2 * Math.PI));
      const Y = scaleRaw(0, peak * 1.08, PAD.t + H, PAD.t);
      g.x.beginPath();
      for (let p = 0; p <= 1; p += .005) {
        const d = Math.exp(-((p - wr) ** 2) / (2 * se * se)) / (se * Math.sqrt(2 * Math.PI));
        const px = X(p), py = Y(d);
        p === 0 ? g.x.moveTo(px, py) : g.x.lineTo(px, py);
      }
      g.x.lineTo(X(1), Y(0)); g.x.lineTo(X(0), Y(0)); g.x.closePath();
      g.x.fillStyle = g.vgrad([[0, alpha('#66B8FF', .35)], [1, alpha('#66B8FF', .02)]], 0, PAD.t, 0, PAD.t + H);
      g.x.fill();
      g.x.strokeStyle = '#66B8FF'; g.x.lineWidth = 1.6; g.x.stroke();
      /* 95%-интервал */
      g.x.fillStyle = alpha('#FFD166', .14);
      g.x.fillRect(X(lo), PAD.t, X(hi) - X(lo), H);
      [[lo, '#FFD166'], [hi, '#FFD166'], [wr, '#E6EDF3']].forEach(([p, c]) => {
        g.x.strokeStyle = c; g.x.lineWidth = p === wr ? 1.8 : 1; g.x.setLineDash(p === wr ? [] : [4, 3]);
        g.x.beginPath(); g.x.moveTo(X(p), PAD.t); g.x.lineTo(X(p), PAD.t + H); g.x.stroke(); g.x.setLineDash([]);
      });
      /* линия безубытка для 2R */
      g.x.strokeStyle = '#FF4D4D'; g.x.lineWidth = 1.4;
      g.x.beginPath(); g.x.moveTo(X(1 / 3), PAD.t); g.x.lineTo(X(1 / 3), PAD.t + H); g.x.stroke();
      g.x.fillStyle = '#FF4D4D'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'center';
      g.x.fillText('БЕЗУБЫТОК 2R', X(1 / 3), PAD.t - 6);
      g.x.fillStyle = '#55687C'; g.x.textAlign = 'left'; g.x.fillText('0%', PAD.l, PAD.t + H + 12);
      g.x.textAlign = 'right'; g.x.fillText('100%', PAD.l + W, PAD.t + H + 12);
    });
  }
});

/* 143 --------------------------------------------------------------------
   Серии убытков: психология против арифметики.                            */
SA.register({
  n: '143', title: 'Серии: десять минусов подряд — это норма', group: 'edge',
  hint: 'Жми «ещё 100 сделок» — <b>копится статистика серий</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'СДЕЛОК' }, { t: 'МАКС. МИНУСОВ' }, { t: 'ОЖИДАЕМО' }, { t: 'МАКС. ПЛЮСОВ' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const row = el('div', { style: 'display:flex;gap:6px' });
    panel.appendChild(row);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let wr = .45, flags = [], seed = 5;
    slider(ctr, { label: 'ВИНРЕЙТ', min: 20, max: 70, value: 45, color: '#66B8FF',
      fmt: x => x + '%', onInput(x) { wr = x / 100; flags = []; add(200) } });
    const btn = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:8px 0;border-radius:10px;
      font-size:10px;font-weight:700;cursor:pointer;background:#141C27;border:1px solid #27313E;color:#9FB0C2`,
      text: '+ ЕЩЁ 100 СДЕЛОК' });
    row.appendChild(btn);
    btn.addEventListener('click', () => { add(100); haptic('medium') });
    function add(k) {
      let s = seed;
      const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647 };
      for (let i = 0; i < k; i++) flags.push(rnd() < wr);
      seed = s % 2147483647 || 7;
      if (flags.length > 900) flags = flags.slice(-900);
      const st = streaks(flags);
      /* ожидаемая длиннейшая серия убытков: log(n)/log(1/p) */
      const p = 1 - wr;
      const expect = Math.round(Math.log(flags.length) / Math.log(1 / p));
      kpi.set(0, String(flags.length), '#E6EDF3');
      kpi.set(1, String(st.maxLoss), st.maxLoss > expect ? '#FF4D4D' : '#F59E0B');
      kpi.set(2, '≈' + expect, '#66B8FF');
      kpi.set(3, String(st.maxWin), '#4ADE80');
      v.set(st.maxLoss >= 8 ? 'warn' : 'info',
        `На ${flags.length} сделках с винрейтом ${(wr * 100).toFixed(0)}% максимальная серия убытков — <b>${st.maxLoss}</b>,
         математика предсказывала ≈${expect}. Это не поломка системы и не «рынок изменился»: при ${(wr * 100).toFixed(0)}%
         вероятность серии из ${st.maxLoss} минусов где-то в выборке близка к единице. Размер позиции должен выдерживать её без паники.`);
      const rect = stage.getBoundingClientRect();
      if (st.maxLoss >= 10) fx.emit({ x: rect.width / 2, y: 40, n: 16, color: '#FF4D4D', speed: 150, life: .7, size: 2.4 });
    }
    add(200);
    raf(() => {
      g.clear();
      const PAD = { l: 10, r: 10, t: 14, b: 128 };
      const W = g.w - PAD.l - PAD.r, H = g.h - PAD.t - PAD.b;
      /* плитка исходов: красное/зелёное полотно серий */
      const cols = 30;
      const rows = Math.ceil(flags.length / cols);
      const cw = W / cols, ch = Math.min(9, (H - 30) / Math.max(1, rows));
      let run = 0;
      flags.forEach((f, i) => {
        run = f ? 0 : run + 1;
        const x = PAD.l + (i % cols) * cw, y = PAD.t + Math.floor(i / cols) * ch;
        g.x.fillStyle = f ? alpha('#4ADE80', .75) : run >= 5 ? '#FF4D4D' : alpha('#FF4D4D', .4);
        g.x.fillRect(x + .6, y + .6, cw - 1.2, Math.max(1.4, ch - 1.2));
      });
      /* гистограмма длин серий убытков */
      const lens = [];
      let c = 0;
      flags.forEach(f => { if (f) { if (c) lens.push(c); c = 0 } else c++ });
      if (c) lens.push(c);
      const maxLen = Math.max(1, ...lens);
      const cnt = Array.from({ length: maxLen }, (_, i) => lens.filter(l => l === i + 1).length);
      const mx = Math.max(1, ...cnt);
      const by = PAD.t + H - 4, bh = 30;
      cnt.forEach((n2, i) => {
        const bw2 = W / cnt.length;
        const h2 = n2 / mx * bh;
        g.x.fillStyle = i + 1 >= 5 ? '#FF4D4D' : alpha('#FF4D4D', .45);
        g.x.fillRect(PAD.l + i * bw2 + 1, by - h2, bw2 - 2, h2);
        if (cnt.length < 16) {
          g.x.fillStyle = '#55687C'; g.x.font = '700 7px ui-monospace,monospace'; g.x.textAlign = 'center';
          g.x.fillText(String(i + 1), PAD.l + i * bw2 + bw2 / 2, by + 8);
        }
      });
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ДЛИНА СЕРИИ УБЫТКОВ →', PAD.l, by - bh - 4);
    });
  }
});

/* 144 --------------------------------------------------------------------
   Подгонка под историю: как хорошая кривая превращается в мусор.          */
SA.register({
  n: '144', title: 'Переподгонка: идеальная кривая — красный флаг', group: 'edge',
  hint: 'Добавляй фильтры — <b>история хорошеет, будущее ломается</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const rnd = prng(606);
    const BASE = Array.from({ length: 240 }, () => rnd() < .44 ? 2 : -1);
    const SPLIT = 140;
    const panel = el('div', { style: `position:absolute;left:10px;right:10px;bottom:8px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'ИСТОРИЯ' }, { t: 'ФОРВАРД' }, { t: 'ПАДЕНИЕ' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let filters = 0, inS = [], outS = [];
    slider(ctr, { label: 'ФИЛЬТРОВ', min: 0, max: 8, value: 0, color: '#A78BFA',
      onInput(x) { filters = x; recalc() } });
    function recalc() {
      /* каждый «фильтр» вырезает из истории худшие сделки — но только там,
         где они уже случились. На форварде он работает как случайный шум. */
      const inRaw = BASE.slice(0, SPLIT), outRaw = BASE.slice(SPLIT);
      let ins = [...inRaw];
      for (let f = 0; f < filters; f++) {
        const worst = ins.findIndex(r => r < 0);
        if (worst >= 0) ins.splice(worst, 1);
        for (let k = 0; k < 2; k++) {
          const w2 = ins.lastIndexOf(-1);
          if (w2 >= 0) ins.splice(w2, 1);
        }
      }
      /* на форварде фильтры ещё и отрезают часть прибыльных сделок */
      const outs = outRaw.filter((r, i) => !(filters && (i % Math.max(2, 9 - filters) === 0)));
      inS = equity(ins, { risk: .01 });
      outS = equity(outs, { risk: .01 });
      const inR = (inS[inS.length - 1] / inS[0] - 1) * 100;
      const outR = (outS[outS.length - 1] / outS[0] - 1) * 100;
      const drop = inR - outR;
      kpi.set(0, (inR > 0 ? '+' : '') + inR.toFixed(0) + '%', '#4ADE80');
      kpi.set(1, (outR > 0 ? '+' : '') + outR.toFixed(0) + '%', outR > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(2, drop.toFixed(0) + ' п.п.', drop > 30 ? '#FF4D4D' : '#F59E0B');
      v.set(filters === 0 ? 'info' : drop > 30 ? 'bad' : 'warn',
        filters === 0
          ? 'Ноль фильтров: история и форвард дают примерно одно и то же. Это и есть признак живой системы.'
          : `<b>${filters} фильтр(ов)</b> подняли историю до ${inR.toFixed(0)}%, а форвард остался на ${outR.toFixed(0)}%.
             Разрыв <b>${drop.toFixed(0)} п.п.</b> — цена подгонки. Каждое правило вида «не торгуем по вторникам после красной свечи»
             объясняет прошлое и ничего не говорит о будущем.`);
    }
    recalc();
    raf(() => {
      g.clear(); g.grid(26);
      const PAD = { l: 12, r: 12, t: 16, b: 120 };
      const W = g.w - PAD.l - PAD.r, H = g.h - PAD.t - PAD.b;
      const half = W * .56;
      const allIn = inS, allOut = outS;
      const lo = Math.min(...allIn, ...allOut) * .98, hi = Math.max(...allIn, ...allOut) * 1.02;
      const Y = scaleRaw(lo, hi, PAD.t + H, PAD.t);
      const X1 = scaleRaw(0, allIn.length - 1, PAD.l, PAD.l + half);
      const X2 = scaleRaw(0, allOut.length - 1, PAD.l + half, PAD.l + W);
      g.x.fillStyle = alpha('#A78BFA', .05); g.x.fillRect(PAD.l, PAD.t, half, H);
      g.x.fillStyle = alpha('#F59E0B', .05); g.x.fillRect(PAD.l + half, PAD.t, W - half, H);
      g.glowLine(allIn.map((v2, i) => ({ x: X1(i), y: Y(v2) })), { color: '#A78BFA', width: 2, blur: 10 });
      g.glowLine(allOut.map((v2, i) => ({ x: X2(i), y: Y(v2) })),
        { color: allOut[allOut.length - 1] >= allOut[0] ? '#4ADE80' : '#FF4D4D', width: 2, blur: 10 });
      g.x.strokeStyle = 'rgba(255,255,255,.3)'; g.x.setLineDash([4, 4]); g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(PAD.l + half, PAD.t); g.x.lineTo(PAD.l + half, PAD.t + H); g.x.stroke();
      g.x.setLineDash([]);
      g.x.font = '700 8.5px ui-monospace,monospace';
      g.x.fillStyle = '#A78BFA'; g.x.textAlign = 'left'; g.x.fillText('ИСТОРИЯ (ПОДГОНКА)', PAD.l + 3, PAD.t + 10);
      g.x.fillStyle = '#F59E0B'; g.x.textAlign = 'right'; g.x.fillText('ФОРВАРД', PAD.l + W - 3, PAD.t + 10);
    });
  }
});
})();
