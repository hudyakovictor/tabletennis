/* ============================================================================
   ГРУППА 19 — МЕТОДИКА (145–152).

   Почему виджет обучает лучше курса. В обычном курсе работает один канал:
   посмотрел — узнал — забыл. Кривая забывания съедает до 70% материала за
   неделю, потому что нет ни извлечения из памяти, ни интервалов, ни обратной
   связи, ни калибровки уверенности.

   Эта группа — не «геймификация ради значков», а перенос в интерфейс шести
   механик, у которых есть доказанный эффект:
     • активное извлечение (retrieval practice) — 145, 152;
     • интервальное повторение по SM-2 — 145;
     • предсказание до объяснения (predict-then-explain) — 147;
     • постепенное снятие опор (faded worked examples) — 148;
     • перемешивание тем (interleaving) — 150;
     • калибровка уверенности и работа с заблуждениями — 146, 149, 151.

   Каждый ассет честно считает собственную метрику обучения и показывает её
   ученику: не «молодец», а «вот что с твоей памятью происходит прямо сейчас».
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, swipe, FX, canvas,

/* 145 --------------------------------------------------------------------

SA.register({

      { q: 'Зачем нужен ATR в стопе?', a: 'Чтобы стоп стоял за пределом обычного шума, а не там, где «не жалко».' },

      const brier = log.reduce((s, r) => s + (r.p - (r.right ? 1 : 0)) ** 2, 0) / log.length;

      const avgConf = log.reduce((s, r) => s + r.p, 0) / log.length;

    raf(() => {
      g.clear();
      /* диаграмма калибровки: идеал — диагональ */
      const PAD = { l: 14, r: 14, t: 186, b: 108 };
      const S = Math.min(g.w - PAD.l - PAD.r, g.h - PAD.t - PAD.b);
      if (S < 20) return;
      const x0 = g.w / 2 - S / 2, y0 = PAD.t;
      g.x.strokeStyle = 'rgba(255,255,255,.1)'; g.x.lineWidth = 1;
      g.x.strokeRect(x0, y0, S, S);

      g.x.beginPath(); g.x.moveTo(x0, y0 + S); g.x.lineTo(x0 + S, y0); g.x.stroke(); g.x.setLineDash([]);

        const py = y0 + S - acc * S;
        g.x.fillStyle = Math.abs(acc - (a + b) / 2) < .12 ? '#4ADE80' : '#FF4D4D';

        why: 'Ложный пробой вниз снял стопы и вернул цену в диапазон — классическая ловушка ликвидности.' },
    ];
    let ci = 0, stage1 = true, guess = null, bars = [], reveal = 0, score = 0, tries = 0;
    const head = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;font-size:10px;
      color:#6E7D8F` });
    const row = el('div', { style: `position:absolute;left:12px;right:12px;bottom:66px;display:flex;gap:6px;z-index:3` });
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px` });
    const v = verdict(panel, {});
    stage.append(head, row, panel);
    const mk = (t, up, c) => {
      const b = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:9px 0;border-radius:10px;
        font-size:10px;font-weight:700;cursor:pointer;background:${alpha(c, .12)};border:1px solid ${alpha(c, .45)};
        color:${c}`, text: t });
      b.addEventListener('click', () => answer(up));
      row.appendChild(b); return b;
    };
    mk('ВВЕРХ ↑', true, '#4ADE80');
    mk('ВНИЗ ↓', false, '#FF4D4D');
    function load() {
      const c = CASES[ci];
      bars = ohlc(56, { start: 100, vol: 1.3, drift: c.up ? .12 : -.1, seed: c.seed, regime: c.regime });
      stage1 = true; guess = null; reveal = 0;
      head.textContent = `СЛУЧАЙ ${ci + 1} · ЧТО ПРОИЗОЙДЁТ ДАЛЬШЕ?`;
      v.set('mute', 'Объяснение заблокировано, пока нет прогноза. Это и есть главный приём: мозг запоминает ответ только после собственной попытки.');
      row.style.opacity = '1'; row.style.pointerEvents = 'auto';
    }
    function answer(up) {
      if (!stage1) { ci = (ci + 1) % CASES.length; load(); return }
      guess = up; stage1 = false; tries++;
      const c = CASES[ci];
      const right = up === c.up;
      if (right) score++;
      reveal = .001;
      haptic(right ? 'success' : 'error');
      const rect = stage.getBoundingClientRect();
      if (right) confetti(fx, { x: rect.width / 2, y: rect.height * .35, n: 34 });

        `${right ? '<b>Прогноз верный.</b>' : '<b>Прогноз неверный.</b>'} ${c.why}
         <br><span style="color:#55687C">Угадано ${score} из ${tries}. Ошибка после собственного прогноза запоминается лучше, чем верный ответ, услышанный первым.</span>`);
      row.style.opacity = '.4'; row.style.pointerEvents = 'none';
      setTimeout(() => { row.style.opacity = '1'; row.style.pointerEvents = 'auto' }, 900);
      head.textContent = 'ТАП ПО ЛЮБОЙ КНОПКЕ — СЛЕДУЮЩИЙ СЛУЧАЙ';
    }
    load();
    raf(dt => {
      if (reveal > 0 && reveal < 1) reveal = Math.min(1, reveal + dt * 1.1);
      g.clear(); g.grid(26);
      const shownN = stage1 ? 40 : 40 + Math.floor(16 * ease.out(reveal));
      const shown = bars.slice(0, shownN);
      const { X, Y } = candles(g, shown, { x0: 12, x1: g.w - 12, y0: 16, y1: g.h - 108 });
      if (stage1) {
        g.x.fillStyle = 'rgba(7,9,13,.72)';

        g.x.fillText('?', (X(39) + g.w - 12) / 2, (g.h - 108) / 2);

        const col = guess ? '#4ADE80' : '#FF4D4D';
        g.x.strokeStyle = alpha(col, .5); g.x.setLineDash([4, 4]); g.x.lineWidth = 1.6;
        g.x.beginPath();
        g.x.moveTo(X(39), Y(bars[39].c));
        g.x.lineTo(g.w - 14, Y(bars[39].c) + (guess ? -40 : 40));
        g.x.stroke(); g.x.setLineDash([]);

        g.x.fillText('ТВОЙ ПРОГНОЗ', g.w - 16, Y(bars[39].c) + (guess ? -44 : 48));
      }
    });
  }
});

      list.innerHTML = '';
      STEPS.forEach((s, i) => {
        const done = i < step;
        const active = i === step;
        const row = el('div', { style: `flex:1;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:8px;
          background:${active ? alpha('#66B8FF', .08) : '#0E131A'};
          border:1px solid ${done ? alpha('#4ADE80', .4) : active ? alpha('#66B8FF', .45) : '#1A222C'};
          transition:.25s;overflow:hidden` });
        const num = el('div', { class: 'mono', style: `width:16px;color:${done ? '#4ADE80' : '#55687C'};font-size:10px;
          font-weight:800`, text: done ? '✓' : String(i + 1) });
        const txt = el('div', { style: 'display:flex;flex-direction:column;min-width:0;flex:1' });
        txt.innerHTML = `<span class="mono" style="font-size:10px;color:${active ? '#E6EDF3' : '#9FB0C2'}">${s.t}</span>
          ${(support === 'full' || (support === 'half' && i % 2 === 0)) && !done
            ? `<span class="mono" style="font-size:8px;color:#55687C">${s.hint}</span>` : ''}`;
        row.append(num, txt);
        if (active) {
          const pick2 = el('div', { style: 'display:flex;gap:4px;flex:none' });
          const order = support === 'full' ? [s.opts[s.ok], s.opts[(s.ok + 1) % 3]] : s.opts;
          order.forEach(o => {
            const b = el('div', { class: 'mono', style: `padding:5px 7px;border-radius:7px;font-size:8.5px;cursor:pointer;
              background:#141C27;border:1px solid #27313E;color:#9FB0C2`, text: o });
            b.addEventListener('click', () => choose(o === s.opts[s.ok]));
            pick2.appendChild(b);
          });
          row.appendChild(pick2);
        }
        list.appendChild(row);
      });
      barFill.style.width = ((round * STEPS.length + step) / (3 * STEPS.length) * 100) + '%';
    }
    function choose(right) {
      if (right) {
        step++; haptic('success');
        if (step >= STEPS.length) {
          round++; step = 0;
          if (round >= 3) {
            v.set('ok', `<b>Три прохода закрыты, ошибок ${errors}.</b> Первый раз ты шёл по подсказкам, третий — сам.
              Именно постепенное снятие опор переводит знание в навык; объяснение без повторения этого не делает.`);
            round = 0; haptic('success'); render(); return;
          }
          v.set('info', `Проход ${round + 1}: подсказок стало меньше. Если сейчас трудно — это нормально, трудность и есть обучение.`);
        } else {
          v.set('ok', 'Шаг верный. Дальше.');
        }
      } else {
        errors++; haptic('error');
        v.set('bad', `Нет. ${STEPS[step].hint}. Ошибок всего: ${errors}.`);
      }
      render();
    }
    v.set('mute', 'Один и тот же разбор повторяется трижды, каждый раз с меньшей поддержкой.');
    render();
  }
});

SA.register({

  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const TOPICS = [['Структура', '#66B8FF'], ['Риск', '#FF4D4D'], ['Объём', '#4ADE80'], ['Психика', '#A78BFA']];
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'РЕЖИМ' }, { t: 'ТОЧНОСТЬ СЕЙЧАС' }, { t: 'ЧЕРЕЗ НЕДЕЛЮ' }]);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let mode = 1;
    const seg = segment(panel, ['БЛОКАМИ', 'ВПЕРЕМЕШКУ'], { value: 1, color: '#4ADE80',
      onPick(i) { mode = i; describe() } });
    function describe() {
      const now = mode === 0 ? 92 : 71;
      const later = mode === 0 ? 38 : 64;
      kpi.set(0, mode === 0 ? 'БЛОКИ' : 'МИКС', mode === 0 ? '#F59E0B' : '#4ADE80');
      kpi.set(1, now + '%', '#66B8FF');
      kpi.set(2, later + '%', later > 50 ? '#4ADE80' : '#FF4D4D');
      v.set(mode === 0 ? 'warn' : 'ok',
        mode === 0
          ? 'Блоками комфортно: десять задач подряд на одну тему, и к пятой уже «всё понятно». Через неделю остаётся мало, потому что мозг не тренировал <b>выбор метода</b> — тема была известна заранее.'
          : 'Вперемешку неприятно и медленнее: на каждом шаге надо сначала понять, <b>какой инструмент применить</b>. Это и есть главный навык трейдера — на рынке никто не пишет сверху «сейчас задача про риск».');
    }
    describe();
    let t = 0;
    raf(dt => {
      t += dt; g.clear(); g.grid(26);
      const PAD = { l: 14, r: 14, t: 18, b: 136 };
      const W = g.w - PAD.l - PAD.r, H = g.h - PAD.t - PAD.b;
      /* лента занятий: блоки или чередование */
      const N = 24, cw = W / N;
      for (let i = 0; i < N; i++) {
        const ti = mode === 0 ? Math.floor(i / (N / TOPICS.length)) : i % TOPICS.length;
        const [, c] = TOPICS[ti];
        const puls = .75 + .25 * Math.sin(t * 2.4 + i * .5);
        g.x.fillStyle = alpha(c, .35 + (mode === 1 ? .25 : .1) * puls);
        rr(g.x, PAD.l + i * cw + 1, PAD.t, cw - 2, 22, 3); g.x.fill();
      }
      g.x.fillStyle = '#55687C'; g.x.font = '700 7.5px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ПОРЯДОК ЗАНЯТИЙ', PAD.l, PAD.t - 5);
      /* две кривые удержания */
      const X = scaleRaw(0, 14, PAD.l, PAD.l + W);
      const Y = scaleRaw(0, 100, PAD.t + H, PAD.t + 42);
      const curves = [
        { k: 'БЛОКАМИ', c: '#F59E0B', f: d => 92 * Math.exp(-d / 5.5) + 4 },
        { k: 'ВПЕРЕМЕШКУ', c: '#4ADE80', f: d => 71 * Math.exp(-d / 16) + 6 },
      ];
      curves.forEach((cv, i) => {
        const on = (mode === 0 && i === 0) || (mode === 1 && i === 1);
        g.x.strokeStyle = on ? cv.c : alpha(cv.c, .22);
        g.x.lineWidth = on ? 2.2 : 1.2;
        if (on) { g.x.shadowColor = cv.c; g.x.shadowBlur = 12 }
        g.x.beginPath();
        for (let d = 0; d <= 14; d += .25) {
          const px = X(d), py = Y(cv.f(d));
          d === 0 ? g.x.moveTo(px, py) : g.x.lineTo(px, py);
        }
        g.x.stroke(); g.x.shadowBlur = 0;
        g.x.fillStyle = on ? cv.c : alpha(cv.c, .35);
        g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'right';
        g.x.fillText(cv.k, PAD.l + W - 2, Y(cv.f(14)) - 4);
      });
      g.x.fillStyle = '#55687C'; g.x.textAlign = 'left';
      g.x.fillText('УДЕРЖАНИЕ, % · 14 ДНЕЙ →', PAD.l, PAD.t + H + 12);
    });
  }
});

/* 152 --------------------------------------------------------------------
   Проверка мастерства с адаптивной сложностью.                            */
SA.register({
  n: '152', title: 'Мастерство: сложность подстраивается', group: 'learn',
  hint: 'Отвечай — <b>уровень растёт и падает за тобой</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const POOL = [
      { lv: 1, q: 'Риск 1% от $10 000 — это…', a: ['$100', '$1 000', '$10'], ok: 0 },
      { lv: 1, q: 'Стоп нужен, чтобы…', a: ['ограничить убыток', 'увеличить прибыль', 'снизить комиссию'], ok: 0 },
      { lv: 2, q: 'Винрейт 40% при 2R даёт…', a: ['плюс 0.2R', 'минус 0.2R', 'ноль'], ok: 0 },
      { lv: 2, q: 'ATR измеряет…', a: ['средний диапазон', 'направление', 'объём'], ok: 0 },
      { lv: 3, q: 'Просадка 30% требует для возврата…', a: ['+30%', '+43%', '+15%'], ok: 1 },
      { lv: 3, q: 'Четверть Келли берут, чтобы…', a: ['расти быстрее', 'уменьшить просадку', 'увеличить винрейт'], ok: 1 },
      { lv: 4, q: 'Форвард хуже истории на 40 п.п. — это…', a: ['нормальный разброс', 'подгонка', 'смена режима'], ok: 1 },
      { lv: 4, q: 'Брайер 0.30 означает…', a: ['отличную калибровку', 'плохую калибровку', 'высокую точность'], ok: 1 },
    ];
    const head = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;display:flex;
      justify-content:space-between;font-size:9px;color:#6E7D8F` });
    const q = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:32px;font-size:11.5px;
      color:#E6EDF3;line-height:1.4;min-height:34px` });
    const opts = el('div', { style: `position:absolute;left:12px;right:12px;top:78px;display:flex;
      flex-direction:column;gap:5px` });
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px` });
    const v = verdict(panel, {});
    stage.append(head, q, opts, panel);
    let level = 1, streak = 0, asked = 0, right = 0, hist = [];
    const L = new Spring(1, { stiff: 120, damp: 16 });
    function load() {
      const cands = POOL.filter(x => x.lv === Math.round(level));
      const item = cands[Math.floor(Math.random() * cands.length)] || POOL[0];
      q.textContent = item.q;
      head.innerHTML = `<span>УРОВЕНЬ <b style="color:#66B8FF">${Math.round(level)}</b> / 4</span>
        <span>СЕРИЯ <b style="color:${streak > 0 ? '#4ADE80' : '#FF4D4D'}">${streak}</b></span>
        <span>ВЕРНО ${right}/${asked}</span>`;
      opts.innerHTML = '';
      item.a.forEach((t, i) => {
        const b = el('div', { class: 'mono', style: `padding:9px 10px;border-radius:9px;font-size:10px;cursor:pointer;
          background:#0E131A;border:1px solid #1C2430;color:#9FB0C2;transition:.2s`, text: t });
        b.addEventListener('click', () => answer(i === item.ok, item, b));
        opts.appendChild(b);
      });
    }
    function answer(ok, item, node) {
      asked++;
      if (ok) { right++; streak = Math.max(1, streak + 1) } else { streak = Math.min(-1, streak - 1) }
      hist.push(ok ? 1 : 0);
      if (hist.length > 40) hist.shift();
      const before = Math.round(level);
      if (streak >= 2) { level = clamp(level + 1, 1, 4); streak = 0 }
      if (streak <= -2) { level = clamp(level - 1, 1, 4); streak = 0 }
      L.set(level);
      node.style.borderColor = ok ? '#4ADE80' : '#FF4D4D';
      node.style.background = alpha(ok ? '#4ADE80' : '#FF4D4D', .12);
      haptic(ok ? 'success' : 'error');
      const rect = stage.getBoundingClientRect();
      if (Math.round(level) > before) {
        confetti(fx, { x: rect.width / 2, y: rect.height * .3, n: 36 });
        v.set('ok', `<b>Уровень ${Math.round(level)}.</b> Две подряд — сложность выросла. Адаптив держит тебя в зоне, где верно примерно 70–80%: ниже скучно, выше бесполезно.`);
      } else if (Math.round(level) < before) {
        v.set('warn', `<b>Уровень ${Math.round(level)}.</b> Две ошибки — система опустила планку. Это не наказание: на слишком сложном материале обучение останавливается.`);
      } else {
        v.set(ok ? 'info' : 'bad', ok ? 'Верно. Ещё одна такая — и сложность вырастет.' : 'Мимо. Ещё одна ошибка — вернёмся на уровень ниже.');
      }
      setTimeout(load, 650);
    }
    load();
    v.set('mute', 'Вопросы подбираются под текущий уровень. Цель — держать точность около 75%.');
    raf(dt => {
      const lv = L.step(dt);
      g.clear();
      const PAD = { t: 184, b: 86 };
      const H = g.h - PAD.t - PAD.b;
      if (H < 16) return;
      /* полоса уровня */
      const W = g.w - 24;
      for (let i = 1; i <= 4; i++) {
        const x = 12 + (i - 1) * W / 4;
        g.x.fillStyle = i <= lv ? mix('#1D4ED8', '#4ADE80', (i - 1) / 3) : '#141C27';
        rr(g.x, x + 2, PAD.t, W / 4 - 4, 8, 4); g.x.fill();
      }
      g.x.fillStyle = '#fff';
      const kx = 12 + (lv - .5) * W / 4;
      g.x.beginPath(); g.x.arc(kx, PAD.t + 4, 5.5, 0, SA.TAU); g.x.fill();
      /* лента последних ответов */
      const y = PAD.t + 20;
      hist.slice(-26).forEach((h, i) => {
        g.x.fillStyle = h ? '#4ADE80' : '#FF4D4D';
        g.x.globalAlpha = .35 + i / 26 * .65;
        g.x.fillRect(12 + i * ((W) / 26), y, (W / 26) - 2, 10);
      });
      g.x.globalAlpha = 1;
      g.x.fillStyle = '#55687C'; g.x.font = '700 7.5px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ПОСЛЕДНИЕ ОТВЕТЫ', 12, y + 20);
    });
  }
});
})();


/* ===== assets-tape.js ===== */
/* ============================================================================
   ГРУППА 20 — ЛЕНТА И МИКРОСТРУКТУРА (153–160).

   Последний большой пробел каталога. Курсы заканчиваются на свечах, а деньги
   теряются уровнем ниже: в спреде, проскальзывании, комиссии, фандинге,
   ликвидациях и айсбергах. Новичок видит «цену», профессионал видит очередь
   заявок и стоимость входа в неё.

   Здесь всё это сделано щупаемым: стакан, где лимитка стоит в очереди;
   дельта агрессоров; карта ликвидаций, которая объясняет длинные фитили;
   фандинг, который медленно забирает прибыль; и калькулятор полной
   стоимости сделки, где видно, что скальпинг на 0.2% не существует.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, swipe, FX, canvas,
        local, rr, alpha, mix, prng, fmt, scaleRaw, ohlc, confetti, shuffle, candles, plot, histBars,
        slider, segment, verdict, kpiRow, tagRight, heat, heatRisk, sparkline, barMeter } = SA;

/* 153 --------------------------------------------------------------------
   Стакан: очередь, айсберг и стоимость нетерпения.                        */
SA.register({
  n: '153', title: 'Стакан: очередь, айсберг, нетерпение', group: 'tape',
  hint: 'Ставь лимит или бей по рынку — <b>видно цену обоих решений</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const rnd = prng(404);
    const MID = 64000, TICK = 5, LEVELS = 9;
    const book = { bid: [], ask: [] };
    for (let i = 0; i < LEVELS; i++) {
      book.bid.push({ p: MID - TICK * (i + 1), q: 2 + rnd() * 14, ice: i === 3 ? 40 : 0 });
      book.ask.push({ p: MID + TICK * (i + 1), q: 2 + rnd() * 14, ice: i === 2 ? 55 : 0 });
    }
    const head = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;display:flex;
      justify-content:space-between;font-size:9px;color:#6E7D8F` });
    const bookBox = el('div', { style: `position:absolute;left:12px;right:12px;top:28px;bottom:96px;display:flex;
      flex-direction:column;gap:2px` });
    const row = el('div', { style: `position:absolute;left:12px;right:12px;bottom:56px;display:flex;gap:6px` });
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px` });
    const v = verdict(panel, {});
    stage.append(head, bookBox, row, panel);
    let myOrder = null, filled = 0, t = 0, queue = 0;
    const rows = [];
    const all = [...book.ask].reverse().concat(book.bid);
    all.forEach((lv, i) => {
      const isAsk = i < LEVELS;
      const r = el('div', { class: 'mono', style: `flex:1;position:relative;display:flex;align-items:center;
        font-size:9.5px;cursor:pointer;border-radius:5px;overflow:hidden;min-height:0` });
      const bar = el('div', { style: `position:absolute;${isAsk ? 'left' : 'left'}:0;top:0;bottom:0;
        background:${alpha(isAsk ? '#FF4D4D' : '#4ADE80', .18)}` });
      const txt = el('div', { style: `position:relative;display:flex;width:100%;padding:0 8px;gap:8px` });
      txt.innerHTML = `<span style="color:${isAsk ? '#FF8A8A' : '#4ADE80'};width:54px">${lv.p}</span>
        <span class="q" style="color:#9FB0C2">${lv.q.toFixed(1)}</span>
        <span class="mine" style="margin-left:auto;color:#66B8FF"></span>`;
      r.append(bar, txt);
      r.addEventListener('click', () => place(lv, isAsk));
      bookBox.appendChild(r);
      rows.push({ r, bar, lv, isAsk });
    });
    const btnMkt = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:8px 0;border-radius:10px;
      font-size:10px;font-weight:700;cursor:pointer;background:${alpha('#FF4D4D', .14)};
      border:1px solid ${alpha('#FF4D4D', .5)};color:#FF8A8A`, text: 'КУПИТЬ ПО РЫНКУ' });
    const btnCancel = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:8px 0;border-radius:10px;
      font-size:10px;font-weight:700;cursor:pointer;background:#141C27;border:1px solid #27313E;color:#9FB0C2`,
      text: 'СНЯТЬ ЛИМИТ' });
    row.append(btnMkt, btnCancel);
    function place(lv, isAsk) {
      if (isAsk) { haptic('error');
        v.set('warn', 'Лимит на покупку ставится в бид. Заявка выше рынка исполнится как рыночная — и заплатит спред.'); return }
      myOrder = { p: lv.p, q: 1, ahead: lv.q };
      queue = lv.q;
      haptic('medium');
      v.set('info', `Лимит <b>${lv.p}</b>. Перед тобой в очереди <b>${lv.q.toFixed(1)}</b> контрактов — пока их не съедят, твоя заявка не исполнится. Это и есть цена бесплатного входа: ожидание и риск, что цена уйдёт без тебя.`);
    }
    btnMkt.addEventListener('click', () => {
      const best = book.ask[0];
      const slip = (best.p - MID) / MID * 100;
      filled++;
      haptic('success');
      const rect = stage.getBoundingClientRect();
      fx.emit({ x: rect.width / 2, y: rect.height * .3, n: 14, color: '#FF4D4D', speed: 170, life: .5, size: 2.4 });
      v.set('bad', `Куплено по <b>${best.p}</b> вместо ${MID}: переплата <b>${slip.toFixed(3)}%</b> + комиссия тейкера 0.05%.
        На 20 сделках в день это ${(slip + .05) * 20 > 2 ? 'больше' : 'около'} ${((slip + .05) * 20).toFixed(1)}% депозита в месяц только на нетерпении.`);
    });
    btnCancel.addEventListener('click', () => { myOrder = null; haptic('light');
      v.set('mute', 'Лимит снят. Решение «ждать или брать» — это выбор между риском неисполнения и стоимостью спреда.') });
    v.set('mute', 'Тапни уровень в биде, чтобы поставить лимит. Красные уровни — предложение, зелёные — спрос.');
    raf(dt => {
      t += dt;
      /* поток сделок съедает очередь и обновляет объёмы */
      rows.forEach(({ lv, bar, r }, i) => {
        const drift = (rnd() - .5) * dt * 6;
        lv.q = clamp(lv.q + drift, .4, 18);
        if (lv.ice && lv.q < 2) lv.q = 2 + rnd() * 3;   /* айсберг восстанавливается */
        const w = lv.q / 18 * 100;
        bar.style.width = w + '%';
        const q = r.querySelector('.q');
        if (q) q.textContent = lv.q.toFixed(1);
        const mine = r.querySelector('.mine');
        if (mine) mine.textContent = myOrder && myOrder.p === lv.p ? `ТЫ ${queue > 0 ? queue.toFixed(1) + ' впереди' : 'ИСПОЛНЕН'}` : '';
        r.style.boxShadow = lv.ice && Math.sin(t * 3 + i) > .7 ? `inset 0 0 0 1px ${alpha('#FFD166', .45)}` : 'none';
      });
      if (myOrder && queue > 0) {
        queue = Math.max(0, queue - dt * 1.6);
        if (queue === 0) {
          haptic('success');
          v.set('ok', `Лимит исполнен по <b>${myOrder.p}</b> — без спреда и с комиссией мейкера 0.02%. Разница с рыночным входом ${(Math.abs(myOrder.p - book.ask[0].p) / MID * 100).toFixed(3)}% за одно только терпение.`);
          myOrder = null;
        }
      }
      const spread = book.ask[0].p - book.bid[0].p;
      head.innerHTML = `<span>СТАКАН BTC</span>
        <span>СПРЕД <b style="color:#F59E0B">${spread}</b></span>
        <span>АЙСБЕРГ <b style="color:#FFD166">2</b></span>`;
    });
  }
});

/* 154 --------------------------------------------------------------------
   Дельта агрессоров и поглощение.                                         */
SA.register({
  n: '154', title: 'Дельта: кто кого продавил', group: 'tape',
  hint: 'Веди по графику — <b>дельта показывает агрессора и поглощение</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const rnd = prng(717);
    const bars = ohlc(60, { start: 100, vol: 1.2, drift: .04, seed: 717 }).map((b, i) => {
      const body = b.c - b.o;
      /* дельта обычно совпадает со свечой, но иногда расходится — это и есть сигнал */
      const divergent = rnd() < .18;
      const d = divergent ? -Math.sign(body) * (20 + rnd() * 60) : Math.sign(body) * (10 + rnd() * 80);
      return { ...b, d, divergent };
    });
    let cum = 0;
    const cumD = bars.map(b => (cum += b.d));
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'ДЕЛЬТА' }, { t: 'НАКОПЛЕННАЯ' }, { t: 'СИТУАЦИЯ' }]);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let cursor = bars.length - 1;
    function describe() {
      const i = clamp(cursor, 0, bars.length - 1);
      const b = bars[i];
      const body = b.c - b.o;
      const absorb = Math.abs(b.d) > 50 && Math.abs(body) < .4;
      kpi.set(0, (b.d > 0 ? '+' : '') + b.d.toFixed(0), b.d > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(1, (cumD[i] > 0 ? '+' : '') + cumD[i].toFixed(0), cumD[i] > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(2, absorb ? 'ПОГЛОЩЕНИЕ' : b.divergent ? 'РАСХОЖДЕНИЕ' : 'СОГЛАСИЕ',
        absorb ? '#FFD166' : b.divergent ? '#A78BFA' : '#66B8FF');
      v.set(absorb ? 'warn' : b.divergent ? 'warn' : 'info',
        absorb
          ? `Дельта <b>${b.d.toFixed(0)}</b>, а свеча почти без тела: агрессоров много, цена не идёт. Кто-то крупный принимает весь поток лимитами — это поглощение, и обычно оно предшествует развороту.`
          : b.divergent
            ? 'Свеча идёт в одну сторону, дельта — в другую. Движение тянут не агрессоры, а снятие лимитов; такие импульсы часто возвращаются.'
            : 'Дельта и свеча согласны: агрессор двигает цену в свою сторону, сопротивления мало.');
    }
    describe();
    raf(() => {
      g.clear(); g.grid(26);
      const split = g.h * .42;
      const { X, Y } = candles(g, bars, { x0: 12, x1: g.w - 12, y0: 14, y1: split - 6 });
      const mx = Math.max(...bars.map(b => Math.abs(b.d)));
      const DY = scaleRaw(-mx, mx, g.h - 118, split + 6);
      g.x.strokeStyle = 'rgba(255,255,255,.14)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(12, DY(0)); g.x.lineTo(g.w - 12, DY(0)); g.x.stroke();
      const bw = Math.max(2, (g.w - 24) / bars.length * .55);
      bars.forEach((b, i) => {
        g.x.fillStyle = b.divergent ? (b.d > 0 ? alpha('#A78BFA', .9) : alpha('#FFD166', .9))
                                    : (b.d > 0 ? '#4ADE80' : '#FF4D4D');
        const y = DY(b.d), y0 = DY(0);
        g.x.fillRect(X(i) - bw / 2, Math.min(y, y0), bw, Math.max(1, Math.abs(y - y0)));
      });
      /* накопленная дельта линией поверх */
      const cmx = Math.max(...cumD.map(Math.abs)) || 1;
      const CY = scaleRaw(-cmx, cmx, g.h - 118, split + 6);
      plot(g, cumD, X, CY, { color: '#66B8FF', width: 1.6, glow: 8 });
      const i = clamp(cursor, 0, bars.length - 1);
      g.x.strokeStyle = 'rgba(255,255,255,.4)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(X(i), 14); g.x.lineTo(X(i), g.h - 118); g.x.stroke();
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ДЕЛЬТА АГРЕССОРОВ · НАКОПЛЕННАЯ', 14, split + 14);
    });
    stage.addEventListener('pointermove', e => {
      const p = local(stage, e);
      cursor = Math.round(clamp((p.x - 12) / Math.max(1, p.w - 24)) * (bars.length - 1));
      describe();
    });
  }
});

/* 155 --------------------------------------------------------------------
   Карта ликвидаций: откуда берутся длинные фитили.                        */
SA.register({
  n: '155', title: 'Карта ликвидаций: магниты для цены', group: 'tape',
  hint: 'Двигай плечо толпы — <b>кластеры ликвидаций перестраиваются</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const bars = ohlc(70, { start: 64000, vol: 320, drift: 30, seed: 1234 });
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let lev = 20, side = .6;
    slider(ctr, { label: 'ПЛЕЧО ТОЛПЫ', min: 3, max: 100, value: 20, color: '#F59E0B',
      fmt: x => x + '×', onInput(x) { lev = x; describe() } });
    slider(ctr, { label: 'ДОЛЯ ЛОНГОВ', min: 20, max: 80, value: 60, color: '#4ADE80',
      fmt: x => x + '%', onInput(x) { side = x / 100; describe() } });
    function describe() {
      const price = bars[bars.length - 1].c;
      const dist = price / lev;
      v.set(lev > 40 ? 'bad' : lev > 15 ? 'warn' : 'info',
        `При плече <b>${lev}×</b> ликвидация наступает в <b>${(100 / lev).toFixed(1)}%</b> от входа — это ${(dist).toFixed(0)} пунктов.
         ${lev > 40 ? 'На таком плече обычный шум убивает позицию за минуты, и маркетмейкер знает, где именно стоят эти стопы.'
                    : 'Скопление ликвидаций работает как магнит: цене выгодно сходить туда, где можно забрать чужую позицию, и вернуться.'}`);
    }
    describe();
    let t = 0, hit = null;
    raf(dt => {
      t += dt; g.clear(); g.grid(26);
      const { X, Y } = candles(g, bars, { x0: 12, x1: g.w - 56, y0: 14, y1: g.h - 122, pad: 400, alpha: .55 });
      const price = bars[bars.length - 1].c;
      /* тепловая карта: кластеры ликвидаций лонгов снизу, шортов сверху */
      const ROWS = 34;
      const lo = Math.min(...bars.map(b => b.l)) - 400, hi = Math.max(...bars.map(b => b.h)) + 400;
      for (let r = 0; r < ROWS; r++) {
        const p0 = lerp(hi, lo, r / ROWS), p1 = lerp(hi, lo, (r + 1) / ROWS);
        const mid = (p0 + p1) / 2;
        const dLong = (price - mid) / price;
        const dShort = (mid - price) / price;
        const target = 1 / lev;
        const longDens = Math.exp(-((dLong - target) ** 2) / (2 * (target * .35) ** 2)) * side;
        const shortDens = Math.exp(-((dShort - target) ** 2) / (2 * (target * .35) ** 2)) * (1 - side);
        const dens = longDens + shortDens;
        if (dens < .02) continue;
        const col = longDens > shortDens ? '#FF4D4D' : '#4ADE80';
        g.x.fillStyle = alpha(col, clamp(dens) * .5 * (.8 + .2 * Math.sin(t * 2 + r)));
        g.x.fillRect(12, Y(p0), g.w - 68, Math.max(1, Y(p1) - Y(p0)));
        /* правая шкала плотности */
        g.x.fillStyle = alpha(col, clamp(dens) * .9);
        g.x.fillRect(g.w - 50, Y(p0), clamp(dens) * 40, Math.max(1, Y(p1) - Y(p0) - 1));
      }
      g.x.strokeStyle = 'rgba(255,255,255,.5)'; g.x.setLineDash([4, 3]); g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(12, Y(price)); g.x.lineTo(g.w - 56, Y(price)); g.x.stroke(); g.x.setLineDash([]);
      tagRight(g, Y(price), price.toFixed(0), '#E6EDF3');
      g.x.fillStyle = '#55687C'; g.x.font = '700 7.5px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ПЛОТНОСТЬ ЛИКВИДАЦИЙ →', g.w - 150, g.h - 126);
      g.Y = Y;
    });
    stage.addEventListener('pointerdown', e => {
      const p = local(stage, e);
      haptic('medium');
      fx.emit({ x: p.x, y: p.y, n: 18, color: ['#FF4D4D', '#FFD166'], speed: 220, life: .7, size: 2.6 });
      v.set('warn', 'Сходил в кластер — забрал ликвидность. Длинный фитиль на графике обычно означает ровно это: цена пришла за чужими позициями.');
    });
  }
});

/* 156 --------------------------------------------------------------------
   Фандинг и стоимость удержания позиции.                                  */
SA.register({
  n: '156', title: 'Фандинг: тихий налог на терпение', group: 'tape',
  hint: 'Крути ставку и срок — <b>видно, сколько съедает удержание</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'ЗА 8 Ч' }, { t: 'ЗА СРОК' }, { t: 'В ГОД' }, { t: 'ОТ ПРИБЫЛИ' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let rate = .01, days = 14, lev = 5;
    slider(ctr, { label: 'СТАВКА / 8Ч', min: -.05, max: .15, step: .005, value: .01, color: '#F59E0B',
      fmt: x => x.toFixed(3) + '%', onInput(x) { rate = x; recalc() } });
    slider(ctr, { label: 'ДНЕЙ В ПОЗИЦИИ', min: 1, max: 90, value: 14, color: '#66B8FF',
      onInput(x) { days = x; recalc() } });
    let series = [];
    function recalc() {
      const perDay = rate * 3;
      const total = perDay * days * lev;
      const annual = perDay * 365 * lev;
      series = Array.from({ length: days + 1 }, (_, d) => -perDay * d * lev);
      kpi.set(0, (rate * lev).toFixed(3) + '%', rate > 0 ? '#FF4D4D' : '#4ADE80');
      kpi.set(1, (-total).toFixed(2) + '%', total > 0 ? '#FF4D4D' : '#4ADE80');
      kpi.set(2, (-annual).toFixed(0) + '%', annual > 0 ? '#FF4D4D' : '#4ADE80');
      kpi.set(3, total > 0 ? (total / 10 * 100).toFixed(0) + '%' : '0%', '#F59E0B');
      v.set(annual > 30 ? 'bad' : annual > 10 ? 'warn' : 'ok',
        rate < 0
          ? `Ставка отрицательная: держать лонг <b>платят тебе</b>. Так бывает в панике — и это одна из немногих ситуаций, где время работает на покупателя.`
          : `При ставке ${rate.toFixed(3)}% каждые 8 часов и плече ${lev}× удержание ${days} дней стоит <b>${total.toFixed(2)}%</b> позиции.
             В годовом выражении это <b>${annual.toFixed(0)}%</b> — больше, чем доходность большинства стратегий. Фандинг не виден в стакане, но он забирает край молча.`);
    }
    recalc();
    raf(() => {
      g.clear(); g.grid(26);
      const PAD = { l: 14, r: 44, t: 18, b: 128 };
      const W = g.w - PAD.l - PAD.r, H = g.h - PAD.t - PAD.b;
      const lo = Math.min(...series, 0), hi = Math.max(...series, 0);
      const X = scaleRaw(0, days, PAD.l, PAD.l + W), Y = scaleRaw(lo * 1.1 - .1, hi * 1.1 + .1, PAD.t + H, PAD.t);
      g.x.strokeStyle = 'rgba(255,255,255,.16)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(PAD.l, Y(0)); g.x.lineTo(PAD.l + W, Y(0)); g.x.stroke();
      g.x.beginPath(); g.x.moveTo(X(0), Y(0));
      series.forEach((s, i) => g.x.lineTo(X(i), Y(s)));
      g.x.lineTo(X(days), Y(0)); g.x.closePath();
      g.x.fillStyle = series[series.length - 1] < 0 ? alpha('#FF4D4D', .18) : alpha('#4ADE80', .18);
      g.x.fill();
      g.glowLine(series.map((s, i) => ({ x: X(i), y: Y(s) })),
        { color: series[series.length - 1] < 0 ? '#FF4D4D' : '#4ADE80', width: 2, blur: 10 });
      /* отметки списаний каждые 8 часов */
      for (let d = 0; d <= days; d++) {
        if (days > 30 && d % 5) continue;
        g.x.fillStyle = alpha('#F59E0B', .6);
        g.x.beginPath(); g.x.arc(X(d), Y(series[d]), 1.8, 0, SA.TAU); g.x.fill();
      }
      tagRight(g, Y(series[series.length - 1]), series[series.length - 1].toFixed(2) + '%',
        series[series.length - 1] < 0 ? '#FF4D4D' : '#4ADE80');
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('НАКОПЛЕННЫЙ ФАНДИНГ, % ПОЗИЦИИ', PAD.l, PAD.t - 5);
      g.x.fillText('ДНИ →', PAD.l, PAD.t + H + 12);
    });
  }
});

/* 157 --------------------------------------------------------------------
   Полная стоимость сделки: комиссия, спред, проскальзывание.              */
SA.register({
  n: '157', title: 'Полная стоимость: почему скальпинг не бесплатен', group: 'tape',
  hint: 'Меняй частоту и цель — <b>издержки съедают край на глазах</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');

    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'ЦЕЛЬ' }, { t: 'ИЗДЕРЖКИ' }, { t: 'ЧИСТЫМИ' }, { t: 'ДОЛЯ ЕДЫ' }]);
    const ctr = el('div', { style: 'display:flex;gap:8px' });
    panel.appendChild(ctr);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    let target = .4, perDay = 10, taker = true;
    slider(ctr, { label: 'ЦЕЛЬ СДЕЛКИ', min: .05, max: 3, step: .05, value: .4, color: '#4ADE80',
      fmt: x => x.toFixed(2) + '%', onInput(x) { target = x; recalc() } });
    slider(ctr, { label: 'СДЕЛОК В ДЕНЬ', min: 1, max: 40, value: 10, color: '#66B8FF',
      onInput(x) { perDay = x; recalc() } });
    const seg = segment(panel, ['ТЕЙКЕР 0.05%', 'МЕЙКЕР 0.02%'], { value: 0, color: '#F59E0B',
      onPick(i) { taker = i === 0; recalc() } });
    let parts = [];
    function recalc() {
      const fee = (taker ? .05 : .02) * 2;
      const spread = taker ? .02 : 0;
      const slip = taker ? .015 : .005;
      const cost = fee + spread + slip;
      const net = target - cost;
      const share = cost / target * 100;
      parts = [['Комиссия', fee, '#FF4D4D'], ['Спред', spread, '#F59E0B'], ['Проскальзывание', slip, '#A78BFA'],
        ['Остаётся', Math.max(0, net), '#4ADE80']];
      kpi.set(0, target.toFixed(2) + '%', '#E6EDF3');
      kpi.set(1, cost.toFixed(3) + '%', '#FF4D4D');
      kpi.set(2, net.toFixed(3) + '%', net > 0 ? '#4ADE80' : '#FF4D4D');
      kpi.set(3, share.toFixed(0) + '%', share > 50 ? '#FF4D4D' : share > 25 ? '#F59E0B' : '#4ADE80');
      const monthly = net * perDay * 21;
      v.set(net <= 0 ? 'bad' : share > 40 ? 'warn' : 'ok',
        net <= 0
          ? `Цель <b>${target.toFixed(2)}%</b> меньше издержек <b>${cost.toFixed(3)}%</b>. Такая стратегия убыточна при любом винрейте — ты торгуешь в пользу биржи.`
          : `Издержки съедают <b>${share.toFixed(0)}%</b> цели. При ${perDay} сделках в день остаётся ${monthly.toFixed(1)}% в месяц до учёта убыточных сделок.
             ${taker ? 'Переход на лимитные входы сократил бы расходы почти вдвое.' : 'Мейкер-режим требует терпения: часть входов просто не состоится.'}`);
      haptic('selection');
    }
    recalc();
    let t = 0;
    raf(dt => {
      t += dt; g.clear();
      const PAD = { l: 16, r: 16, t: 22, b: 154 };
      const W = g.w - PAD.l - PAD.r, H = Math.max(24, g.h - PAD.t - PAD.b);
      /* ступенчатая диаграмма «куда ушла цель» */
      const total = parts.reduce((s, p) => s + p[1], 0) || 1;
      let x = PAD.l;
      parts.forEach(([name, val, col], i) => {
        const w = val / total * W;
        const pulse = i === parts.length - 1 ? 1 + .04 * Math.sin(t * 3) : 1;
        g.x.fillStyle = alpha(col, .75);
        rr(g.x, x, PAD.t + (1 - pulse) * 4, Math.max(0, w - 2), H * pulse, 5);
        g.x.fill();
        if (w > 26) {
          g.x.save();
          g.x.translate(x + w / 2, PAD.t + H / 2);
          g.x.fillStyle = '#07090D'; g.x.font = '800 9px ui-monospace,monospace';
          g.x.textAlign = 'center'; g.x.textBaseline = 'middle';
          g.x.fillText(val.toFixed(3) + '%', 0, 0);
          g.x.restore();
        }
        x += w;
      });
      /* подписи */
      let lx = PAD.l;
      g.x.font = '700 8px ui-monospace,monospace'; g.x.textBaseline = 'alphabetic';
      parts.forEach(([name, val, col]) => {
        const w = val / total * W;
        if (w > 30) {
          g.x.fillStyle = col; g.x.textAlign = 'center';
          g.x.fillText(name.toUpperCase(), lx + w / 2, PAD.t - 6);
        }
        lx += w;
      });
      g.x.fillStyle = '#55687C'; g.x.textAlign = 'left';
      g.x.fillText('ИЗ ЧЕГО СОСТОИТ ЦЕЛЬ СДЕЛКИ', PAD.l, PAD.t + H + 14);
    });
  }
});

/* 158 --------------------------------------------------------------------
   Исполнение крупной заявки: айсберг против удара в рынок.                */
SA.register({
  n: '158', title: 'Крупная заявка: раздробить или ударить', group: 'tape',
  hint: 'Выбери способ исполнения — <b>сравни среднюю цену</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      flex-direction:column;gap:6px;z-index:3` });
    const kpi = kpiRow(panel, [{ t: 'СРЕДНЯЯ' }, { t: 'ВЛИЯНИЕ' }, { t: 'ВРЕМЯ' }, { t: 'РИСК' }]);
    const row = el('div', { style: 'display:flex;gap:6px' });
    panel.appendChild(row);
    const v = verdict(panel, {});
    stage.appendChild(panel);
    const MID = 100;
    let mode = -1, anim = 0, fills = [];
    const MODES = [
      { k: 'УДАР В РЫНОК', c: '#FF4D4D', chunks: 1, impact: .55, time: '1 сек',
        why: 'Одна большая заявка проедает стакан на пять уровней. Средняя цена хуже на полпроцента, зато позиция набрана мгновенно.' },
      { k: 'АЙСБЕРГ', c: '#4ADE80', chunks: 8, impact: .12, time: '12 мин',
        why: 'Дробление прячет размер: каждая порция забирает верхний уровень, стакан успевает восстановиться. Цена входа почти не страдает, но часть объёма может не набраться.' },
      { k: 'TWAP', c: '#66B8FF', chunks: 14, impact: .07, time: '40 мин',
        why: 'Равномерное исполнение по времени — минимальное влияние, но максимальный риск, что рынок уйдёт без тебя, пока ты аккуратничаешь.' },
    ];
    MODES.forEach((m, i) => {
      const b = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:8px 2px;border-radius:10px;
        font-size:9px;font-weight:700;cursor:pointer;background:${alpha(m.c, .12)};
        border:1px solid ${alpha(m.c, .45)};color:${m.c}`, text: m.k });
      b.addEventListener('click', () => run(i));
      row.appendChild(b);
    });
    function run(i) {
      mode = i; anim = 0;
      const m = MODES[i];
      fills = Array.from({ length: m.chunks }, (_, j) => ({
        p: MID + m.impact * (j + 1) / m.chunks * (1 - j / (m.chunks * 2)),
        q: 1 / m.chunks, t: j / m.chunks,
      }));
      const avg = fills.reduce((s, f) => s + f.p * f.q, 0);
      kpi.set(0, avg.toFixed(3), avg - MID > .3 ? '#FF4D4D' : '#4ADE80');
      kpi.set(1, '+' + ((avg - MID) / MID * 100).toFixed(3) + '%', m.impact > .3 ? '#FF4D4D' : '#4ADE80');
      kpi.set(2, m.time, '#66B8FF');
      kpi.set(3, i === 0 ? 'НИЗКИЙ' : i === 1 ? 'СРЕДНИЙ' : 'ВЫСОКИЙ', i === 0 ? '#4ADE80' : i === 1 ? '#F59E0B' : '#FF4D4D');
      v.set(i === 0 ? 'bad' : 'ok', `<b>${m.k}.</b> ${m.why}`);
      haptic('medium');
      const rect = stage.getBoundingClientRect();
      fx.ring({ x: rect.width / 2, y: rect.height * .35, r: 80, color: m.c, width: 1.6 });
    }
    v.set('mute', 'Один и тот же объём, три способа исполнения. Разница в средней цене — это и есть «влияние на рынок».');
    raf(dt => {
      anim = Math.min(1, anim + dt * .8);
      g.clear(); g.grid(26);
      const PAD = { l: 16, r: 50, t: 20, b: 150 };
      const W = g.w - PAD.l - PAD.r, H = Math.max(30, g.h - PAD.t - PAD.b);
      const Y = scaleRaw(MID - .1, MID + .7, PAD.t + H, PAD.t);
      const X = scaleRaw(0, 1, PAD.l, PAD.l + W);
      g.x.strokeStyle = 'rgba(255,255,255,.3)'; g.x.setLineDash([4, 3]); g.x.lineWidth = 1;
      g.x.beginPath(); g.x.moveTo(PAD.l, Y(MID)); g.x.lineTo(PAD.l + W, Y(MID)); g.x.stroke(); g.x.setLineDash([]);
      tagRight(g, Y(MID), 'MID', '#9FB0C2');
      if (mode >= 0) {
        const m = MODES[mode];
        const shown = fills.filter(f => f.t <= anim);
        shown.forEach((f, i) => {
          const px = X(f.t + .5 / fills.length), py = Y(f.p);
          g.x.fillStyle = alpha(m.c, .85);
          const bw = Math.max(4, W / fills.length - 4);
          rr(g.x, px - bw / 2, py, bw, Y(MID) - py + 1, 2); g.x.fill();
          g.x.fillStyle = m.c;
          g.x.beginPath(); g.x.arc(px, py, 2.6, 0, SA.TAU); g.x.fill();
        });
        if (shown.length) {
          const avg = fills.reduce((s, f) => s + f.p * f.q, 0);
          g.x.strokeStyle = m.c; g.x.lineWidth = 1.4; g.x.setLineDash([5, 3]);
          g.x.beginPath(); g.x.moveTo(PAD.l, Y(avg)); g.x.lineTo(PAD.l + W, Y(avg)); g.x.stroke();
          g.x.setLineDash([]);
          tagRight(g, Y(avg), avg.toFixed(2), m.c);
        }
      }
      g.x.fillStyle = '#55687C'; g.x.font = '700 8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('ЦЕНА ИСПОЛНЕНИЯ ПОРЦИЙ', PAD.l, PAD.t - 6);
      g.x.fillText('ВРЕМЯ →', PAD.l, PAD.t + H + 13);
    });
  }
});

/* 159 --------------------------------------------------------------------
   Лента сделок: распознать крупного игрока в потоке принтов.              */
SA.register({
  n: '159', title: 'Лента принтов: найди крупного в потоке', group: 'tape',
  hint: 'Тапай крупные принты — <b>мелочь штрафуется</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const rnd = prng(515);
    const list = el('div', { style: `position:absolute;left:12px;right:12px;top:30px;bottom:78px;overflow:hidden;
      display:flex;flex-direction:column-reverse;gap:2px` });
    const head = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;display:flex;
      justify-content:space-between;font-size:9px;color:#6E7D8F` });
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px` });
    const v = verdict(panel, {});
    stage.append(head, list, panel);
    let caught = 0, missed = 0, wrong = 0, acc = 0, price = 64000;
    v.set('mute', 'В ленте мелькают крупные принты (≥ 5 BTC). Лови их тапом: именно они двигают цену, остальное — шум розницы.');
    function spawn() {
      const big = rnd() < .18;
      const qty = big ? 5 + rnd() * 20 : .01 + rnd() * 2.4;
      const buy = rnd() < .5;
      price += (buy ? 1 : -1) * (big ? 8 : 1) * rnd();
      const row = el('div', { class: 'mono', style: `flex:none;height:18px;display:flex;align-items:center;gap:8px;
        padding:0 8px;border-radius:5px;font-size:9.5px;cursor:pointer;
        background:${big ? alpha(buy ? '#4ADE80' : '#FF4D4D', .16) : 'transparent'};
        border:1px solid ${big ? alpha(buy ? '#4ADE80' : '#FF4D4D', .4) : 'transparent'};
        color:${buy ? '#4ADE80' : '#FF8A8A'};animation:sa-pop .2s both` });
      row.innerHTML = `<span style="width:52px;color:#9FB0C2">${price.toFixed(0)}</span>
        <b style="width:50px">${qty.toFixed(2)}</b>
        <span style="color:#55687C;font-size:8px">${buy ? 'ПОКУПКА' : 'ПРОДАЖА'}</span>
        <span style="margin-left:auto;color:#39434F;font-size:8px">${big ? '●' : ''}</span>`;
      row.dataset.big = big ? '1' : '';
      row.addEventListener('click', () => {
        if (row.dataset.hit) return;
        row.dataset.hit = '1';
        const sr = stage.getBoundingClientRect(), rr2 = row.getBoundingClientRect();
        if (big) {
          caught++; haptic('success');
          row.style.boxShadow = `0 0 0 1px ${alpha('#FFD166', .8)}`;
          fx.emit({ x: rr2.left - sr.left + 30, y: rr2.top - sr.top + 9, n: 10, color: '#FFD166',
            speed: 150, life: .5, size: 2.2 });
        } else {
          wrong++; haptic('error');
          row.style.opacity = '.35';
        }
        update();
      });
      list.appendChild(row);
      if (big) setTimeout(() => { if (!row.dataset.hit) { missed++; update() } }, 2400);
      while (list.children.length > 14) list.removeChild(list.firstChild);
    }
    function update() {
      const total = caught + missed;
      acc = total ? caught / total : 0;
      head.innerHTML = `<span>ПОЙМАНО <b style="color:#4ADE80">${caught}</b></span>
        <span>УПУЩЕНО <b style="color:#F59E0B">${missed}</b></span>
        <span>ЛОЖНЫХ <b style="color:#FF4D4D">${wrong}</b></span>`;
      if (total >= 4)
        v.set(acc > .7 ? 'ok' : acc > .4 ? 'warn' : 'bad',
          `Точность <b>${(acc * 100).toFixed(0)}%</b>. ${acc > .7
            ? 'Глаз настроен: ты отделяешь поток розницы от заявок, которые реально двигают книгу.'
            : 'Пока теряешься в шуме. Крупные принты идут сериями и почти всегда совпадают с ускорением цены — смотри на размер, а не на цвет.'}`);
    }
    update();
    let acc2 = 0;
    raf(dt => {
      acc2 += dt;
      if (acc2 > .32) { acc2 = 0; spawn() }
    });
  }
});

/* 160 --------------------------------------------------------------------
   Финал ветки: собрать режим исполнения под свою стратегию.               */
SA.register({
  n: '160', title: 'Сборка исполнения под свою стратегию', group: 'tape',
  hint: 'Собери профиль — <b>система посчитает пригодность</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const AXES = [
      { k: 'Горизонт', lo: 'минуты', hi: 'недели', v: .5 },
      { k: 'Частота', lo: '1 в день', hi: '40 в день', v: .5 },
      { k: 'Плечо', lo: 'без', hi: '50×', v: .3 },
      { k: 'Терпение входа', lo: 'по рынку', hi: 'только лимит', v: .5 },
      { k: 'Размер', lo: 'малый', hi: 'крупный', v: .4 },
    ];
    const list = el('div', { style: `position:absolute;left:12px;right:12px;top:12px;display:flex;
      flex-direction:column;gap:7px` });
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      flex-direction:column;gap:6px` });
    const kpi = kpiRow(panel, [{ t: 'ИЗДЕРЖКИ' }, { t: 'РИСК ЛИКВИД.' }, { t: 'ПРИГОДНОСТЬ' }]);
    const v = verdict(panel, {});
    stage.append(list, panel);
    AXES.forEach(a => {
      const box = el('div', { style: 'display:flex;flex-direction:column;gap:2px' });
      const cap = el('div', { class: 'mono', style: `display:flex;justify-content:space-between;font-size:7.5px;
        color:#55687C` });
      cap.innerHTML = `<span>${a.lo}</span><b style="color:#9FB0C2;font-size:8.5px">${a.k}</b><span>${a.hi}</span>`;
      box.appendChild(cap);
      list.appendChild(box);
      slider(box, { label: '', min: 0, max: 100, value: a.v * 100, color: '#66B8FF',
        fmt: () => '', onInput(x) { a.v = x / 100; recalc() } });
    });
    function recalc() {
      const [hor, freq, lev, pat, size] = AXES.map(a => a.v);
      /* издержки растут от частоты и нетерпения, падают от лимитных входов */
      const cost = (0.02 + freq * .18) * (1 - pat * .55) * (1 + size * .6) * 100;
      const liq = lev * (1 - hor * .4) * 100;
      /* пригодность: штраф за противоречия профиля */
      const conflict1 = Math.max(0, freq - .6) * Math.max(0, pat - .6);      /* часто и только лимитом */
      const conflict2 = Math.max(0, lev - .6) * Math.max(0, hor - .6);       /* плечо и долгий горизонт */
      const conflict3 = Math.max(0, size - .6) * Math.max(0, freq - .6);     /* крупно и часто */
      const fit = clamp(1 - conflict1 * 1.6 - conflict2 * 1.4 - conflict3 * 1.5 - cost / 160);
      kpi.set(0, cost.toFixed(1) + '%/мес', cost > 12 ? '#FF4D4D' : cost > 5 ? '#F59E0B' : '#4ADE80');
      kpi.set(1, liq.toFixed(0) + '%', liq > 40 ? '#FF4D4D' : liq > 20 ? '#F59E0B' : '#4ADE80');
      kpi.set(2, (fit * 100).toFixed(0) + '%', fit > .7 ? '#4ADE80' : fit > .4 ? '#F59E0B' : '#FF4D4D');
      const msgs = [];
      if (conflict1 > .05) msgs.push('частая торговля «только лимитом» означает, что половина входов не состоится');
      if (conflict2 > .05) msgs.push('большое плечо на недельном горизонте не переживёт обычную коррекцию');
      if (conflict3 > .05) msgs.push('крупный размер при высокой частоте сам двигает цену против тебя');
      if (cost > 12) msgs.push('издержки съедают больше, чем приносит средняя стратегия');
      v.set(fit > .7 ? 'ok' : fit > .4 ? 'warn' : 'bad',
        msgs.length
          ? `<b>Профиль противоречив:</b> ${msgs.join('; ')}.`
          : `<b>Профиль согласован.</b> Издержки ${cost.toFixed(1)}% в месяц, риск ликвидации ${liq.toFixed(0)}%. Исполнение подобрано под горизонт — это последнее, что отделяет идею от результата.`);
      if (fit > .85) {
        const rect = stage.getBoundingClientRect();
        if (Math.random() < .2) fx.ring({ x: rect.width / 2, y: rect.height * .45, r: 90, color: '#4ADE80', width: 1.4 });
      }
    }
    recalc();
    let t = 0;
    raf(dt => {
      t += dt; g.clear();

  motion: { ru: 'Моушен и VFX', note: 'bento-прожектор, луч цепочки, кнопка удержания, метеоры, орбиты, стирание, печать, ленты' },
  surface:{ ru: 'Поверхность', note: 'счётчик XP, пульс сессии, до/после, док, палитра команд, морфинг-диалог, луч конспекта, тосты' },

  arcade: { ru: 'Игровые циклы', note: 'свайп-решения, окно входа, лестница риска, конвейер, парирование, память, матчинг, ведение стопа' },

  drill:  { ru: 'Тренажёры', note: 'квиз на время, разметка графика, прогноз и калибровка, ранжирование рисков, чек-лист со свайпом, рисование зоны, типы ордеров, поиск ошибок' },
  social: { ru: 'Лига и деньги', note: 'живой лидерборд, голо-профиль, пейволл с одометром, граф рефералов, стрик-кольцо, чат с реакциями, плеер разбора, карточка на вынос' },

SA.reg.forEach(a => a.tags.forEach(t => counts[t]++));

root.appendChild(el('div', { class: 'hero' }, [
  el('div', { class: 'wrap' }, [
    el('h1', { html: 'Signal Arena · каталог <b>интерактивных ассетов</b>' }),

      kpi(counts.interaction, 'интерактив'), kpi(counts.animation, 'анимация'),
      kpi(counts.vfx, 'vfx'), kpi('60', 'fps цель'),
    ]),
  ])
]));

const bar = el('div', { class: 'bar' }); const barIn = el('div', { class: 'in' });
bar.appendChild(barIn); root.appendChild(bar);
const chips = [['all', 'ВСЕ ' + SA.reg.length], ...Object.entries(GROUPS).map(([k, v]) => [k, v.ru.toUpperCase()]),
  ['vfx', 'ТОЛЬКО VFX'], ['interaction', 'ЖЕСТОВЫЕ']];

    barIn.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); apply() };
  barIn.appendChild(c);
});

const wrap = el('div', { class: 'wrap' });
const grid = el('div', { class: 'grid' });
wrap.appendChild(grid); root.appendChild(wrap);

const io = new IntersectionObserver(es => es.forEach(e => {
  e.target.dataset.off = e.isIntersecting ? '0' : '1';   // сцена вне экрана не тратит кадры
  if (e.isIntersecting && !e.target.dataset.mounted) {
    e.target.dataset.mounted = '1';
    const a = SA.reg[+e.target.dataset.i];
    SA._scope = e.target;
    try { a.build(e.target) } catch (err) { e.target.innerHTML = '<div style="color:#FF4D4D;font:11px ui-monospace">ошибка: ' + err.message + '</div>' }
    SA._scope = null;
  }
}), { rootMargin: '220px 0px' });

SA.reg.forEach((a, i) => {
  const card = el('div', { class: 'asset', 'data-group': a.group });
  card.dataset.tags = a.tags.join(',');
  const stage = el('div', { class: 'stage' }); stage.dataset.i = i;
  const reset = el('button', { class: 'btn reset', text: '↺' });
  reset.onclick = () => { stage.innerHTML = ''; stage.className = 'stage'; stage.appendChild(reset);
    delete stage.dataset.mounted; io.unobserve(stage); io.observe(stage); haptic('light') };
  stage.appendChild(reset);
  card.append(
    el('div', { class: 'ahead' }, [
      el('div', { class: 'anum', text: a.n }),
      el('div', { class: 'atitle' }, [
        el('h3', { text: a.title }),
        el('p', { text: GROUPS[a.group].ru }),
        el('div', { class: 'tags' }, a.tags.map(t => el('span', { class: 'tag ' + TAGLABEL[t][0], text: TAGLABEL[t][1] }))),
      ]),
    ]),
    stage,
    el('div', { class: 'hint' }, [el('span', { class: 'dotled' }), el('span', { html: a.hint })]),
  );
  grid.appendChild(card); io.observe(stage);
});

function apply() {
  grid.querySelectorAll('.asset').forEach(c => {
    const ok = filter === 'all' ? true
      : GROUPS[filter] ? c.dataset.group === filter
      : c.dataset.tags.includes(filter);
    c.classList.toggle('hide', !ok);
  });
}

wrap.appendChild(el('footer', { html:
  '<b>Как читать каталог.</b> Каждый ассет — группа объектов, а не картинка: состояние покоя, жест, отклик, анимация, эффект, тактильная отдача и возврат в покой. ' +
  'Тактильная отдача автоматически уходит в Telegram.WebApp.HapticFeedback, если мини-апп запущен в клиенте; в браузере — в navigator.vibrate. ' +
  'Монтаж ленивый: сцена оживает только во вьюпорте. Кнопка ↺ в углу сцены пересобирает ассет с нуля.' }));

if (window.Telegram && window.Telegram.WebApp) { try { Telegram.WebApp.ready(); Telegram.WebApp.expand() } catch (e) {} }
})();
