SA.register({
  n: '16', title: 'Радар: скан рынка и захват сетапа', group: 'market',
  hint: 'Луч идёт по кругу. <b>Тап по цели</b> — захват и подтверждение',
  tags: ['animation', 'interaction', 'vfx'],
  build(stage) {
    const g = canvas(stage); const fx = new FX(stage);
    const targets = Array.from({ length: 5 }, () => ({ a: rand(SA.TAU), r: rand(.86, .3), hit: 0, locked: false, q: rand(1, .3) }));
    let sweep = 0;
    raf(dt => {
      sweep = (sweep + dt * 1.25) % SA.TAU;
      g.clear();
      const cx = g.w / 2, cy = g.h / 2, R = Math.min(g.w, g.h) * .44;
      g.x.strokeStyle = 'rgba(0,122,253,.18)'; g.x.lineWidth = 1;
      [.33, .66, 1].forEach(k => { g.x.beginPath(); g.x.arc(cx, cy, R * k, 0, 7); g.x.stroke() });
      g.x.beginPath(); g.x.moveTo(cx - R, cy); g.x.lineTo(cx + R, cy); g.x.moveTo(cx, cy - R); g.x.lineTo(cx, cy + R); g.x.stroke();
      const grd = g.x.createConicGradient ? g.x.createConicGradient(sweep, cx, cy) : null;
      if (grd) { grd.addColorStop(0, 'rgba(0,122,253,.42)'); grd.addColorStop(.12, 'rgba(0,122,253,0)'); grd.addColorStop(1, 'rgba(0,122,253,0)');
        g.x.fillStyle = grd; g.x.beginPath(); g.x.arc(cx, cy, R, 0, 7); g.x.fill(); }
      g.x.strokeStyle = 'rgba(102,184,255,.85)'; g.x.lineWidth = 2;
      g.x.beginPath(); g.x.moveTo(cx, cy); g.x.lineTo(cx + Math.cos(sweep) * R, cy + Math.sin(sweep) * R); g.x.stroke();
      targets.forEach(t => {
        let da = Math.abs(((t.a - sweep + Math.PI * 3) % SA.TAU) - Math.PI);
        if (da > Math.PI - .14) { t.hit = 1; }
        t.hit = Math.max(0, t.hit - dt * .55);
        const x = cx + Math.cos(t.a) * R * t.r, y = cy + Math.sin(t.a) * R * t.r;
        t.sx = x; t.sy = y;
        if (t.locked) { g.x.strokeStyle = '#4ADE80'; g.x.lineWidth = 2; g.x.strokeRect(x - 9, y - 9, 18, 18);
          g.x.fillStyle = '#4ADE80'; g.x.beginPath(); g.x.arc(x, y, 3, 0, 7); g.x.fill(); return }
        if (t.hit <= 0) return;
        g.x.globalAlpha = t.hit; g.x.fillStyle = t.q > .7 ? '#FFD166' : '#66B8FF';
        g.x.shadowBlur = 12; g.x.shadowColor = g.x.fillStyle;
        g.x.beginPath(); g.x.arc(x, y, 4 + t.q * 3, 0, 7); g.x.fill();
        g.x.shadowBlur = 0; g.x.globalAlpha = 1;
      });
    });
    stage.addEventListener('pointerdown', e => {
      const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      const t = targets.find(t => t.sx !== undefined && Math.hypot(t.sx - px, t.sy - py) < 26 && !t.locked);

        fx.emit({ x: t.sx, y: t.sy, n: 14, color: '#A7F3C0', speed: 150, life: .5, size: 2.6, gravity: 0 }); }
      else haptic('light');
    });
  }
});
})();

/* ============================================================================
   ГРУППА 5 — ГРАФИКИ (31–38).
   Разбор источников: evilcharts (glowing line, rainbow glow bars, duotone,
   dotted bars, bump chart), magicui Lens и Animated Circular Progress,
   motion-primitives Image Comparison / Animated Number.
   Переосмыслено под обучение: каждый график — не витрина данных, а тренажёр,
   где жест игрока меняет вывод.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, ease, drag, FX, canvas, ohlc, scaleRaw, tipEl, fmt } = SA;

/* 31 ---------------------------------------------------------------------
   Светящаяся линия + градиентная площадь + кроссхейр.
   База: evilcharts «Glowing Line Chart». Добавлено: прогрессивная отрисовка,
   дыхание последней точки, тултип с дельтой от точки входа.                 */
SA.register({
  n: '31', title: 'Светящаяся линия: отрисовка и кроссхейр', group: 'charts',
  hint: 'Веди пальцем — <b>кроссхейр, тултип и дельта</b> от точки входа',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage), tip = tipEl();
    stage.appendChild(tip);
    const data = ohlc(72, { start: 100, vol: 1.2, drift: .09, seed: 2026 }).map(d => d.c);
    const entryIdx = 18;
    let draw01 = 0, cur = -1, pulse = 0;
    const PAD = { l: 8, r: 8, t: 18, b: 26 };
    raf(dt => {
      draw01 = Math.min(1, draw01 + dt * .55); pulse += dt;
      const lo = Math.min(...data) - 1.5, hi = Math.max(...data) + 1.5;
      const X = scaleRaw(0, data.length - 1, PAD.l, g.w - PAD.r);
      const Y = scaleRaw(lo, hi, g.h - PAD.b, PAD.t);
      const shown = Math.max(2, Math.floor(data.length * ease.out(draw01)));
      const pts = data.slice(0, shown).map((v, i) => ({ x: X(i), y: Y(v) }));
      g.clear(); g.dots(20, 'rgba(255,255,255,.05)', 1);

      // площадь под кривой
      const area = g.vgrad([[0, 'rgba(0,122,253,.34)'], [.55, 'rgba(0,122,253,.10)'], [1, 'rgba(0,122,253,0)']], 0, PAD.t, 0, g.h - PAD.b);
      g.x.beginPath(); SA.tracePath(g.x, pts);
      g.x.lineTo(pts[pts.length - 1].x, g.h - PAD.b); g.x.lineTo(pts[0].x, g.h - PAD.b); g.x.closePath();
      g.x.fillStyle = area; g.x.fill();

      // сама линия с внутренним светом
      g.glowLine(pts, { color: '#66B8FF', width: 2.6, blur: 18 });

      // метка входа
      const ex = X(entryIdx), ey = Y(data[entryIdx]);
      if (shown > entryIdx) {
        g.x.strokeStyle = 'rgba(167,139,250,.55)'; g.x.setLineDash([3, 4]); g.x.lineWidth = 1;
        g.x.beginPath(); g.x.moveTo(0, ey); g.x.lineTo(g.w, ey); g.x.stroke(); g.x.setLineDash([]);
        g.x.fillStyle = '#A78BFA'; g.x.beginPath(); g.x.arc(ex, ey, 3.4, 0, SA.TAU); g.x.fill();
      }
      // дышащая голова графика

      g.x.strokeStyle = `rgba(102,184,255,${(.5 - Math.sin(pulse * 3) * .3).toFixed(2)})`; g.x.lineWidth = 1.4;
      g.x.beginPath(); g.x.arc(head.x, head.y, br + 7, 0, SA.TAU); g.x.stroke();

      // кроссхейр

        g.x.fillStyle = '#fff'; g.x.beginPath(); g.x.arc(cx, cy, 3.2, 0, SA.TAU); g.x.fill();
        const delta = (data[cur] - data[entryIdx]) / data[entryIdx] * 100;
        tip.innerHTML = `<b style="color:#E6EDF3">${data[cur].toFixed(2)}</b>

        tip.style.opacity = '1';

    });

      const n = clamp(i, 0, data.length - 1); if (n !== cur) { cur = n; if (n % 4 === 0) haptic('selection') } };
    stage.addEventListener('pointermove', track);

      fx.ring({ x: e.clientX - r.left, y: e.clientY - r.top, r: 54, color: '#66B8FF', width: 2 }); haptic('light') });
    stage.addEventListener('pointerleave', () => cur = -1);
  }
});

/* 32 ---------------------------------------------------------------------
   Радужные объёмные бары с изоляцией.
   База: evilcharts «Rainbow Glow Bars». Добавлено: тап изолирует бар,
   остальные гаснут, сверху считается доля в общем объёме.                   */
SA.register({
  n: '32', title: 'Профиль объёма: изоляция уровня', group: 'charts',
  hint: 'Тап по бару — <b>изоляция уровня</b> и его доля в общем объёме',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    const g = canvas(stage), fx = new FX(stage);
    const N = 14;
    const bars = Array.from({ length: N }, (_, i) => {
      const bell = Math.exp(-Math.pow((i - N * .42) / (N * .22), 2));
      return { v: .12 + bell * .88 * rand(1, .72), grow: new Spring(0, { stiff: 150, damp: 17 }), sel: 0 };
    });
    const total = bars.reduce((s, b) => s + b.v, 0);
    const head = el('div', { class: 'mono', style: 'position:absolute;left:12px;top:10px;font-size:10px;color:#6E7D8F;z-index:2' });
    head.innerHTML = 'ПРОФИЛЬ ОБЪЁМА · <b style="color:#E6EDF3">POC</b> подсвечен';
    stage.appendChild(head);
    let sel = -1, t = 0;
    bars.forEach((b, i) => setTimeout(() => b.grow.set(1), 40 * i));
    const poc = bars.reduce((m, b, i) => b.v > bars[m].v ? i : m, 0);
    raf(dt => {
      t += dt; g.clear();
      const padT = 34, padB = 14, padX = 12;
      const bw = (g.w - padX * 2) / N, gap = bw * .22;
      bars.forEach((b, i) => {
        const k = b.grow.step(dt);
        const h = (g.h - padT - padB) * b.v * k;
        const x = padX + i * bw + gap / 2, y = g.h - padB - h, w = bw - gap;
        const dim = sel >= 0 && sel !== i;
        const hue = 196 + (i / N) * 110;
        const grd = g.x.createLinearGradient(0, y, 0, y + h);
        grd.addColorStop(0, `hsla(${hue},92%,68%,${dim ? .16 : 1})`);
        grd.addColorStop(1, `hsla(${hue + 26},88%,46%,${dim ? .08 : .55})`);
        g.x.fillStyle = grd;
        if (!dim) { g.x.shadowColor = `hsla(${hue},92%,62%,.75)`; g.x.shadowBlur = i === poc || i === sel ? 22 : 9 }
        const r = Math.min(6, w / 2);
        g.x.beginPath(); g.x.roundRect ? g.x.roundRect(x, y, w, h, [r, r, 2, 2]) : g.x.rect(x, y, w, h);
        g.x.fill(); g.x.shadowBlur = 0;
        if (i === poc && !dim) { // линия точки контроля
          g.x.strokeStyle = 'rgba(255,209,102,.85)'; g.x.setLineDash([4, 3]); g.x.lineWidth = 1.2;
          g.x.beginPath(); g.x.moveTo(padX, y); g.x.lineTo(g.w - padX, y); g.x.stroke(); g.x.setLineDash([]);
        }
        if (i === sel) {
          const share = (b.v / total * 100).toFixed(1);
          g.x.fillStyle = '#E6EDF3'; g.x.font = '700 11px ui-monospace,monospace'; g.x.textAlign = 'center';
          g.x.fillText(share + '%', x + w / 2, Math.max(18, y - 8));
        }
      });
      // бегущий блик по всему профилю
      const sheen = (t * .25) % 1.6 - .3;
      const sg = g.x.createLinearGradient((sheen - .12) * g.w, 0, (sheen + .12) * g.w, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.055)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      g.x.fillStyle = sg; g.x.fillRect(0, 0, g.w, g.h);
    });
    stage.addEventListener('pointerdown', e => {
      const r = stage.getBoundingClientRect(), padX = 12, bw = (r.width - padX * 2) / N;
      const i = Math.floor((e.clientX - r.left - padX) / bw);
      if (i < 0 || i >= N) return;
      sel = sel === i ? -1 : i; haptic(sel >= 0 ? 'medium' : 'light');
      if (sel >= 0) { const x = padX + i * bw + bw / 2;
        fx.ring({ x, y: r.height * .6, r: 70, color: '#66B8FF', width: 2 });
        fx.emit({ x, y: r.height - 20, n: 12, color: '#66B8FF', speed: 170, life: .6, size: 2.6, gravity: -90 }); }
    });
  }
});

/* 33 ---------------------------------------------------------------------
   Лупа-детектор паттерна. База: magicui Lens + evilcharts duotone candles.
   Геймплей: под лупой свечи увеличиваются, найденный паттерн подсвечивается
   и подписывается — так учат «видеть», а не «знать».                        */
SA.register({
  n: '33', title: 'Лупа аналитика: поиск паттерна', group: 'charts',
  hint: 'Веди лупу по свечам — <b>паттерн подсвечивается</b> при попадании',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const data = ohlc(40, { start: 100, vol: 1.6, drift: .04, seed: 777 });
    // зашиваем в историю «поглощение»: две свечи подряд
    const PAT = 24;
    data[PAT] = { ...data[PAT], o: data[PAT].c + 2.4, c: data[PAT].c - 1.2 };
    data[PAT + 1] = { ...data[PAT + 1], o: data[PAT].c - .6, c: data[PAT].o + 2.8,
      h: data[PAT].o + 3.6, l: data[PAT].c - 1.4 };
    const label = el('div', { class: 'mono', style: `position:absolute;left:50%;top:10px;transform:translateX(-50%);
      font-size:10px;padding:5px 9px;border-radius:8px;background:rgba(7,9,13,.86);border:1px solid #2A3441;
      opacity:0;transition:.25s;z-index:3;white-space:nowrap` });
    stage.appendChild(label);
    let lens = { x: -999, y: 0, r: new Spring(0, { stiff: 150, damp: 16 }) }, found = false;
    const lo = Math.min(...data.map(d => d.l)) - 1, hi = Math.max(...data.map(d => d.h)) + 1;
    function paint(scaleAt) {
      const X = scaleRaw(0, data.length - 1, 14, g.w - 14), Y = scaleRaw(lo, hi, g.h - 18, 16);
      data.forEach((d, i) => {
        const up = d.c >= d.o;
        let x = X(i), y1 = Y(d.h), y2 = Y(d.l), ya = Y(Math.max(d.o, d.c)), yb = Y(Math.min(d.o, d.c));
        let w = (g.w - 28) / data.length * .62, alpha = 1;
        if (scaleAt) { // увеличение внутри лупы
          const dx = x - scaleAt.x, dist = Math.abs(dx);
          if (dist < scaleAt.r) { const k = 1 + (1 - dist / scaleAt.r) * .9;
            x = scaleAt.x + dx * k; w *= k; const cy = scaleAt.y;
            [y1, y2, ya, yb] = [y1, y2, ya, yb].map(v => cy + (v - cy) * k); alpha = 1 }
          else alpha = .32;
        }
        const inPat = i === PAT || i === PAT + 1;
        const col = up ? '#4ADE80' : '#FF4D4D';
        g.x.globalAlpha = alpha * (inPat && found ? 1 : .92);
        g.x.strokeStyle = col; g.x.lineWidth = Math.max(1, w * .18);
        g.x.beginPath(); g.x.moveTo(x, y1); g.x.lineTo(x, y2); g.x.stroke();
        if (inPat && found) { g.x.shadowColor = '#FFD166'; g.x.shadowBlur = 16 }
        g.x.fillStyle = inPat && found ? (up ? '#A7F3C0' : '#FFB4B4') : col;
        g.x.fillRect(x - w / 2, ya, w, Math.max(1.6, yb - ya));
        g.x.shadowBlur = 0; g.x.globalAlpha = 1;
      });
    }
    raf(dt => {
      const R = lens.r.step(dt) * 62;
      g.clear(); g.grid(26);
      paint(R > 3 ? { x: lens.x, y: lens.y, r: R } : null);
      if (R > 3) {
        g.x.strokeStyle = 'rgba(255,255,255,.75)'; g.x.lineWidth = 2;
        g.x.beginPath(); g.x.arc(lens.x, lens.y, R, 0, SA.TAU); g.x.stroke();
        g.x.strokeStyle = 'rgba(102,184,255,.35)'; g.x.lineWidth = 6;
        g.x.beginPath(); g.x.arc(lens.x, lens.y, R + 4, 0, SA.TAU); g.x.stroke();
      }
    });
    const move = e => {
      const r = stage.getBoundingClientRect();
      lens.x = e.clientX - r.left; lens.y = e.clientY - r.top;
      const X = scaleRaw(0, data.length - 1, 14, r.width - 14);
      const hit = Math.abs(lens.x - X(PAT + .5)) < 44;
      if (hit && !found) { found = true; haptic('success');
        label.style.opacity = '1';
        label.innerHTML = '<span style="color:#FFD166">НАЙДЕНО</span> · бычье поглощение на снятии ликвидности';
        fx.ring({ x: X(PAT + .5), y: lens.y, r: 110, color: '#FFD166', width: 2.4 });
        fx.emit({ x: X(PAT + .5), y: lens.y, n: 20, color: ['#FFD166', '#fff'], speed: 220, life: .8, size: 3, gravity: 0 });
      } else if (!hit && found) { found = false; label.style.opacity = '0' }
    };
    stage.addEventListener('pointerdown', e => { lens.r.set(1); move(e); haptic('light') });
    stage.addEventListener('pointermove', e => { if (lens.r.target) move(e) });
    const off = () => { lens.r.set(0); label.style.opacity = '0'; found = false };
    stage.addEventListener('pointerup', off); stage.addEventListener('pointerleave', off);
  }
});

/* 34 ---------------------------------------------------------------------
   Радиальный аллокатор риска. База: magicui Animated Circular Progress +
   обсидиановые «dial»-контролы. Геймплей: тянешь дугу — пересчитывается
   размер позиции, стоп и максимальная просадка серии из 10 сделок.          */
SA.register({
  n: '34', title: 'Радиальный риск: дуга размера позиции', group: 'charts',
  hint: 'Тяни по дуге — <b>риск, размер позиции и просадка серии</b> пересчитываются',
  tags: ['interaction', 'animation'],
  build(stage) {
    const R = 74, CX = 0, size = 180;
    const box = el('div', { style: 'position:absolute;inset:0;display:grid;place-items:center' });
    const wrap = el('div', { style: `position:relative;width:${size}px;height:${size}px;touch-action:none;cursor:grab` });
    const svg = SA.svg(`<svg viewBox="0 0 ${size} ${size}" style="width:100%;height:100%;transform:rotate(135deg)">
      <circle cx="90" cy="90" r="${R}" fill="none" stroke="#11161D" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${2 * Math.PI * R * .75} 999"/>
      <circle class="arc" cx="90" cy="90" r="${R}" fill="none" stroke="#4ADE80" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="0 999" style="filter:drop-shadow(0 0 10px #4ADE8088);transition:stroke .3s"/>
      <circle class="knob" cx="90" cy="16" r="9" fill="#fff" style="filter:drop-shadow(0 2px 6px #000a)"/></svg>`);
    const center = el('div', { style: `position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;pointer-events:none` });
    center.innerHTML = `<div class="mono v sa-val" style="font-size:26px;font-weight:800;letter-spacing:-.02em">1.0%</div>
      <div class="mono" style="font-size:9px;color:#6E7D8F;letter-spacing:.1em">РИСК НА СДЕЛКУ</div>`;
    wrap.append(svg, center);
    const stats = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;bottom:10px;display:flex;
      justify-content:space-between;font-size:10px;color:#6E7D8F` });
    box.append(wrap); stage.append(box, stats);
    const arc = svg.querySelector('.arc'), knob = svg.querySelector('.knob'), val = center.querySelector('.v');
    const CIRC = 2 * Math.PI * R, SWEEP = .75;
    let risk = .2; // 0..1 → 0.2%..5%
    function paint() {
      const pct = lerp(.2, 5, risk);
      arc.setAttribute('stroke-dasharray', `${(CIRC * SWEEP * risk).toFixed(1)} 999`);
      const col = pct < 1.2 ? '#4ADE80' : pct < 2.6 ? '#F59E0B' : '#FF4D4D';
      arc.setAttribute('stroke', col);
      arc.style.filter = `drop-shadow(0 0 10px ${col}88)`;
      const a = (-.5 + SWEEP * risk) * SA.TAU + Math.PI / 2 * 0;
      const ang = (SWEEP * risk) * SA.TAU - Math.PI / 2;
      knob.setAttribute('cx', (90 + Math.cos(ang) * R).toFixed(1));
      knob.setAttribute('cy', (90 + Math.sin(ang) * R).toFixed(1));
      val.textContent = pct.toFixed(1) + '%';
      val.style.color = col;
      const acct = 10000, stopDist = .018;
      stats.innerHTML = `<span>ПОЗИЦИЯ <b style="color:#E6EDF3">${fmt.usd(acct * (pct / 100) / stopDist)}</b></span>
        <span>5 СТОПОВ ПОДРЯД <b style="color:${pct * 5 > 10 ? '#FF4D4D' : '#E6EDF3'}">−${(pct * 5).toFixed(1)}%</b></span>`;
    }
    paint();
    let lastH = 0;
    const toRisk = (ex, ey) => {
      const r = wrap.getBoundingClientRect();
      const dx = ex - (r.left + r.width / 2), dy = ey - (r.top + r.height / 2);
      let a = Math.atan2(dy, dx) + Math.PI / 2; if (a < 0) a += SA.TAU;
      return clamp((a / SA.TAU) / SWEEP);
    };
    drag(wrap, { axis: true,
      onStart(d) { risk = toRisk(d.ex, d.ey); paint(); haptic('light') },
      onMove(d) { risk = toRisk(d.ex, d.ey); paint();
        if (performance.now() - lastH > 60) { haptic('selection'); lastH = performance.now() } },
      onEnd() { haptic(lerp(.2, 5, risk) > 2.6 ? 'warning' : 'rigid') } });
  }
});

/* 35 ---------------------------------------------------------------------
   Bump-чарт лиги. База: evilcharts «Bump Chart». Геймплей: позиции игроков
   перестраиваются по неделям, тап выделяет траекторию.                      */
SA.register({
  n: '35', title: 'Лига: перестановка мест по неделям', group: 'charts',
  hint: 'Тап по линии — <b>траектория игрока</b> поверх остальных',
  tags: ['interaction', 'animation'],
  build(stage) {
    const g = canvas(stage);
    const names = ['Ты', 'Ворон', 'Квант', 'Хищник', 'Статист'];
    const cols = ['#4ADE80', '#66B8FF', '#A78BFA', '#F59E0B', '#9FB0C2'];
    const W = 7;
    const ranks = names.map((_, p) => {
      const out = [p]; for (let w = 1; w < W; w++) {
        let v = out[w - 1] + (Math.random() < .45 ? (Math.random() < .5 ? -1 : 1) : 0);
        out.push(clamp(v, 0, names.length - 1)) } return out;
    });
    let sel = 0, t = 0;
    raf(dt => {
      t = Math.min(1, t + dt * .5); g.clear();
      const padL = 44, padR = 16, padT = 18, padB = 22;
      const X = scaleRaw(0, W - 1, padL, g.w - padR), Y = scaleRaw(0, names.length - 1, padT, g.h - padB);
      g.x.strokeStyle = 'rgba(255,255,255,.05)';
      for (let i = 0; i < names.length; i++) { g.x.beginPath(); g.x.moveTo(padL, Y(i)); g.x.lineTo(g.w - padR, Y(i)); g.x.stroke() }
      ranks.forEach((r, p) => {
        const k = ease.out(clamp(t * 1.4 - p * .06));
        const pts = r.map((v, w) => ({ x: X(w), y: Y(lerp(p, v, k)) }));
        const active = sel === p;
        g.x.globalAlpha = active ? 1 : .32;
        g.x.lineWidth = active ? 3.4 : 2; g.x.strokeStyle = cols[p];
        if (active) { g.x.shadowColor = cols[p]; g.x.shadowBlur = 14 }
        g.x.beginPath(); SA.tracePath(g.x, pts, .4); g.x.stroke(); g.x.shadowBlur = 0;
        pts.forEach((q, i) => { g.x.fillStyle = active ? '#fff' : cols[p];
          g.x.beginPath(); g.x.arc(q.x, q.y, active ? 4 : 2.6, 0, SA.TAU); g.x.fill() });
        g.x.globalAlpha = 1;
        g.x.fillStyle = active ? cols[p] : '#6E7D8F';
        g.x.font = `${active ? 700 : 500} 10px ui-monospace,monospace`; g.x.textAlign = 'right';
        g.x.fillText(names[p], padL - 8, Y(lerp(p, r[0], ease.out(t))) + 3.5);
        if (active) { g.x.textAlign = 'left'; g.x.fillStyle = cols[p];
          g.x.fillText('#' + (r[W - 1] + 1), g.w - padR + 2 - 22, Y(lerp(p, r[W - 1], ease.out(t))) - 10) }
      });
      g.x.textAlign = 'center'; g.x.fillStyle = '#39434F'; g.x.font = '9px ui-monospace,monospace';
      for (let w = 0; w < W; w++) g.x.fillText('Н' + (w + 1), X(w), g.h - 7);
    });
    stage.addEventListener('pointerdown', e => {
      const r = stage.getBoundingClientRect(), padT = 18, padB = 22;
      const Y = scaleRaw(0, names.length - 1, padT, r.height - padB);
      const py = e.clientY - r.top;
      let best = 0, bd = 1e9;
      ranks.forEach((rr, p) => { const w = clamp(Math.round(scaleRaw(44, r.width - 16, 0, W - 1)(e.clientX - r.left)), 0, W - 1);
        const d = Math.abs(Y(rr[w]) - py); if (d < bd) { bd = d; best = p } });
      sel = best; haptic('selection');
    });
  }
});

/* 36 ---------------------------------------------------------------------
   Кривая эквити с просадками. База: evilcharts dotted bars + duotone area.
   Геймплей: скраб по сделкам, под курсором — метрики серии.                 */
SA.register({
  n: '36', title: 'Эквити: просадки и серия сделок', group: 'charts',
  hint: 'Скраб по кривой — <b>баланс, просадка и текущая серия</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), tip = tipEl(); stage.appendChild(tip);
    const N = 60; const trades = []; let eq = 10000, peak = eq, streak = 0;
    for (let i = 0; i < N; i++) {
      const win = Math.random() < .46;
      const r = win ? rand(2.6, .8) : -1;
      eq += r * 120; peak = Math.max(peak, eq);
      streak = win ? Math.max(1, streak + 1) : Math.min(-1, streak - 1);
      trades.push({ i, eq, r, win, dd: (eq - peak) / peak, streak });
    }
    let cur = -1, t = 0;
    raf(dt => {
      t = Math.min(1, t + dt * .6); g.clear(); g.grid(26);
      const padT = 16, padB = 34, padX = 10;
      const lo = Math.min(...trades.map(d => d.eq)) * .995, hi = Math.max(...trades.map(d => d.eq)) * 1.005;
      const X = scaleRaw(0, N - 1, padX, g.w - padX), Y = scaleRaw(lo, hi, g.h - padB, padT);
      const shown = Math.max(2, Math.floor(N * ease.out(t)));
      const pts = trades.slice(0, shown).map(d => ({ x: X(d.i), y: Y(d.eq) }));
      // зона просадки — заливка от пика
      let pk = -1e9;
      g.x.beginPath(); g.x.moveTo(pts[0].x, Y(trades[0].eq));
      trades.slice(0, shown).forEach(d => { pk = Math.max(pk, d.eq); g.x.lineTo(X(d.i), Y(pk)) });
      for (let i = shown - 1; i >= 0; i--) g.x.lineTo(X(i), Y(trades[i].eq));
      g.x.closePath(); g.x.fillStyle = 'rgba(255,77,77,.13)'; g.x.fill();
      g.glowLine(pts, { color: '#4ADE80', width: 2.4, blur: 14 });
      // точки сделок
      trades.slice(0, shown).forEach(d => { g.x.fillStyle = d.win ? 'rgba(74,222,128,.9)' : 'rgba(255,77,77,.9)';
        g.x.beginPath(); g.x.arc(X(d.i), Y(d.eq), d.i === cur ? 4.4 : 1.9, 0, SA.TAU); g.x.fill() });
      // мини-гистограмма R внизу
      trades.slice(0, shown).forEach(d => {
        const h = Math.abs(d.r) * 7, y0 = g.h - 12;
        g.x.fillStyle = d.win ? 'rgba(74,222,128,.5)' : 'rgba(255,77,77,.5)';
        g.x.fillRect(X(d.i) - 1.6, d.win ? y0 - h : y0, 3.2, h);
      });
      if (cur >= 0 && cur < shown) {
        const d = trades[cur];
        g.x.strokeStyle = 'rgba(255,255,255,.16)'; g.x.beginPath();
        g.x.moveTo(X(cur), padT - 6); g.x.lineTo(X(cur), g.h - 10); g.x.stroke();
        tip.innerHTML = `${fmt.usd(d.eq)} · <span style="color:${d.win ? '#4ADE80' : '#FF4D4D'}">${fmt.r(d.r)}</span><br>
          <span style="color:#6E7D8F">просадка ${(d.dd * 100).toFixed(1)}% · серия ${d.streak > 0 ? '+' : ''}${d.streak}</span>`;
        tip.style.opacity = '1'; tip.style.left = clamp(X(cur) - 52, 4, g.w - 120) + 'px'; tip.style.top = '8px';
      } else tip.style.opacity = '0';
    });
    const track = e => { const r = stage.getBoundingClientRect();
      const i = Math.round(scaleRaw(10, r.width - 10, 0, N - 1)(e.clientX - r.left));
      const n = clamp(i, 0, N - 1); if (n !== cur) { cur = n; if (n % 3 === 0) haptic('selection') } };
    stage.addEventListener('pointermove', track); stage.addEventListener('pointerdown', track);
    stage.addEventListener('pointerleave', () => cur = -1);
  }
});

/* 37 ---------------------------------------------------------------------
   Depth chart. База: биржевые «глубины» + duotone-заливка.
   Геймплей: тянешь объём заявки — считается проскальзывание.                */
SA.register({
  n: '37', title: 'Глубина рынка: цена проскальзывания', group: 'charts',
  hint: 'Тяни ползунок объёма — <b>проскальзывание и средняя цена</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    const g = canvas(stage);
    const mid = 64200, levels = 40;
    const bids = [], asks = [];
    let cb = 0, ca = 0;
    for (let i = 0; i < levels; i++) {
      cb += rand(2.4, .2) * (1 + i * .05); ca += rand(2.4, .2) * (1 + i * .05);
      bids.push({ p: mid - (i + 1) * 2.5, q: cb }); asks.push({ p: mid + (i + 1) * 2.5, q: ca });
    }
    const maxQ = Math.max(bids[levels - 1].q, asks[levels - 1].q);
    const hud = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:10px;line-height:1.6;
      background:rgba(7,9,13,.7);border:1px solid #1C2430;border-radius:9px;padding:6px 8px;z-index:2` });
    const sl = el('div', { style: `position:absolute;left:12px;right:12px;bottom:10px;height:26px;border-radius:13px;
      background:#11161D;border:1px solid #1C2430;touch-action:none;z-index:3` });
    const knob = el('div', { style: `position:absolute;top:3px;left:3px;width:40px;height:18px;border-radius:9px;
      background:#66B8FF;box-shadow:0 0 12px #007AFD88;display:grid;place-items:center;
      font:700 9px/1 ui-monospace,monospace;color:#04203d` , text: '5' });
    sl.appendChild(knob); stage.append(hud, sl);
    let want = .12, t = 0;
    function metrics() {
      const vol = lerp(1, 60, want);
      // идём по уровням стакана и съедаем инкременты объёма
      let left = vol, cost = 0, last = mid, prev = 0;
      for (const a of asks) { const inc = a.q - prev; prev = a.q;
        const take = Math.min(left, inc); cost += take * a.p; left -= take; last = a.p; if (left <= 0) break }
      const avg = cost / vol;
      return { vol, avg, slip: (avg - mid) / mid * 100, last };
    }
    raf(dt => {
      t += dt; g.clear();
      const padB = 46, padT = 14;
      const X = scaleRaw(mid - levels * 2.5, mid + levels * 2.5, 6, g.w - 6);
      const Y = scaleRaw(0, maxQ, g.h - padB, padT);
      const m = metrics();
      const fill = (arr, col, glow) => {
        g.x.beginPath(); g.x.moveTo(X(arr[0].p), g.h - padB);
        arr.forEach(l => g.x.lineTo(X(l.p), Y(l.q)));
        g.x.lineTo(X(arr[arr.length - 1].p), g.h - padB); g.x.closePath();
        const grd = g.x.createLinearGradient(0, padT, 0, g.h - padB);
        grd.addColorStop(0, col + '55'); grd.addColorStop(1, col + '0a'); g.x.fillStyle = grd; g.x.fill();
        g.x.strokeStyle = col; g.x.lineWidth = 2; g.x.shadowColor = col; g.x.shadowBlur = glow ? 14 : 0;
        g.x.beginPath(); arr.forEach((l, i) => i ? g.x.lineTo(X(l.p), Y(l.q)) : g.x.moveTo(X(l.p), Y(l.q)));
        g.x.stroke(); g.x.shadowBlur = 0;
      };
      fill(bids, '#4ADE80', false); fill(asks, '#FF4D4D', true);
      // съеденная часть аска
      g.x.save(); g.x.beginPath(); g.x.rect(X(mid), 0, X(m.last) - X(mid), g.h); g.x.clip();
      g.x.fillStyle = 'rgba(255,209,102,.22)'; g.x.fillRect(0, 0, g.w, g.h - padB); g.x.restore();
      g.x.strokeStyle = 'rgba(255,255,255,.35)'; g.x.setLineDash([4, 4]);
      g.x.beginPath(); g.x.moveTo(X(mid), padT - 6); g.x.lineTo(X(mid), g.h - padB); g.x.stroke(); g.x.setLineDash([]);
      hud.innerHTML = `ОБЪЁМ <b style="color:#66B8FF">${m.vol.toFixed(1)} BTC</b><br>
        СРЕДНЯЯ <b>${m.avg.toFixed(1)}</b><br>
        ПРОСКАЛЬЗЫВАНИЕ <b style="color:${m.slip > .12 ? '#FF4D4D' : '#4ADE80'}">${m.slip.toFixed(3)}%</b>`;
      knob.textContent = m.vol.toFixed(0);
      knob.style.left = (3 + want * (sl.clientWidth - 46)) + 'px';
    });
    let lastH = 0;
    drag(sl, { axis: true, onMove(d) { const r = sl.getBoundingClientRect();
      want = clamp((d.ex - r.left) / r.width);
      if (performance.now() - lastH > 70) { haptic('selection'); lastH = performance.now() } },
      onEnd() { haptic('rigid') } });
  }
});

/* 38 ---------------------------------------------------------------------
   Тренажёр трендовой линии. Геймплей: игрок рисует линию по экстремумам,
   система проверяет касания и ставит оценку. Магнитный снап к хвостам.      */
SA.register({
  n: '38', title: 'Трендовая линия: рисуй и проверяй', group: 'charts',
  hint: 'Проведи линию по минимумам — <b>снап к хвостам и оценка касаний</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const data = ohlc(46, { start: 100, vol: 1.3, drift: .16, seed: 404, regime: 'trend' });
    const lo = Math.min(...data.map(d => d.l)) - 1, hi = Math.max(...data.map(d => d.h)) + 1;
    const verdict = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:10px;z-index:3;
      background:rgba(7,9,13,.8);border:1px solid #1C2430;border-radius:9px;padding:6px 9px` , text: 'ПРОВЕДИ ЛИНИЮ ПО МИНИМУМАМ' });
    const hint = el('div', { class: 'mono', style: `position:absolute;right:10px;top:8px;font-size:9px;color:#39434F;z-index:3` , text: '↺ сброс в углу' });
    stage.append(verdict, hint);
    let line = null, dragging = null, snapPts = [];
    const geom = () => {
      const X = scaleRaw(0, data.length - 1, 14, g.w - 14), Y = scaleRaw(lo, hi, g.h - 20, 18);
      return { X, Y };
    };
    raf(() => {
      const { X, Y } = geom(); g.clear(); g.grid(26);
      snapPts = data.map((d, i) => ({ x: X(i), y: Y(d.l), i }));
      data.forEach((d, i) => {
        const up = d.c >= d.o, col = up ? 'rgba(74,222,128,.85)' : 'rgba(255,77,77,.85)';
        const w = (g.w - 28) / data.length * .6, x = X(i);
        g.x.strokeStyle = col; g.x.lineWidth = Math.max(1, w * .16);
        g.x.beginPath(); g.x.moveTo(x, Y(d.h)); g.x.lineTo(x, Y(d.l)); g.x.stroke();
        g.x.fillStyle = col; const a = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));
        g.x.fillRect(x - w / 2, a, w, Math.max(1.5, b - a));
      });
      if (line) {
        const { x1, y1, x2, y2 } = line;
        g.x.strokeStyle = line.score >= 3 ? '#4ADE80' : '#66B8FF'; g.x.lineWidth = 2.4;
        g.x.shadowColor = g.x.strokeStyle; g.x.shadowBlur = 12;
        // продлеваем линию до краёв
        const k = (y2 - y1) / ((x2 - x1) || .001);
        g.x.beginPath(); g.x.moveTo(0, y1 - k * x1); g.x.lineTo(g.w, y1 + k * (g.w - x1)); g.x.stroke(); g.x.shadowBlur = 0;
        [[x1, y1], [x2, y2]].forEach(([px, py]) => { g.x.fillStyle = '#fff';
          g.x.beginPath(); g.x.arc(px, py, 5, 0, SA.TAU); g.x.fill() });
        (line.touches || []).forEach(p => { g.x.strokeStyle = '#FFD166'; g.x.lineWidth = 2;
          g.x.beginPath(); g.x.arc(p.x, p.y, 8, 0, SA.TAU); g.x.stroke() });
      }
    });
    const snap = (x, y) => {
      let best = null, bd = 26;
      snapPts.forEach(p => { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p } });
      return best ? { x: best.x, y: best.y, snapped: true } : { x, y, snapped: false };
    };
    const evaluate = () => {
      const { x1, y1, x2, y2 } = line; const k = (y2 - y1) / ((x2 - x1) || .001);
      const at = x => y1 + k * (x - x1);
      const touches = snapPts.filter(p => Math.abs(p.y - at(p.x)) < 7);
      const breaks = snapPts.filter(p => p.y - at(p.x) < -9).length;
      line.touches = touches; line.score = touches.length;
      const good = touches.length >= 3 && breaks <= 2;
      verdict.innerHTML = good
        ? `<span style="color:#4ADE80">ЛИНИЯ ВАЛИДНА</span> · касаний ${touches.length} · пробоев ${breaks}`
        : `<span style="color:#F59E0B">СЛАБАЯ ЛИНИЯ</span> · касаний ${touches.length} · нужно ≥ 3`;
      haptic(good ? 'success' : 'warning');
      if (good) { const r = stage.getBoundingClientRect();
        touches.forEach((p, i) => setTimeout(() => fx.ring({ x: p.x, y: p.y, r: 46, color: '#FFD166', width: 2 }), i * 90)); }
    };
    drag(stage, { axis: true,
      onStart(d) { const r = stage.getBoundingClientRect();
        const s = snap(d.ex - r.left, d.ey - r.top);
        line = { x1: s.x, y1: s.y, x2: s.x, y2: s.y, touches: [], score: 0 };
        if (s.snapped) haptic('rigid'); },
      onMove(d) { if (!line) return; const r = stage.getBoundingClientRect();
        const s = snap(d.ex - r.left, d.ey - r.top); line.x2 = s.x; line.y2 = s.y; },
      onEnd() { if (line && Math.hypot(line.x2 - line.x1, line.y2 - line.y1) > 36) evaluate();
        else { line = null; verdict.textContent = 'ПРОВЕДИ ЛИНИЮ ПО МИНИМУМАМ' } } });
  }
});
})();

/* 40 ---------------------------------------------------------------------
   Анимированный луч между узлами. База: magicui Animated Beam.
   Смысл: как сигнал проходит цепочку «данные → фильтр → решение → риск».    */
SA.register({
  n: '40', title: 'Цепочка сигнала: луч между узлами', group: 'motion',
  hint: 'Тап по узлу — <b>луч идёт по цепочке</b> до решения',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const nodes = [
      { id: 'in1', label: 'ЦЕНА', x: .16, y: .18, c: '#66B8FF' },
      { id: 'in2', label: 'ОБЪЁМ', x: .16, y: .5, c: '#66B8FF' },
      { id: 'in3', label: 'НОВОСТЬ', x: .16, y: .82, c: '#9FB0C2' },
      { id: 'hub', label: 'ФИЛЬТР', x: .5, y: .5, c: '#A78BFA' },
      { id: 'out', label: 'ВХОД', x: .86, y: .32, c: '#4ADE80' },
      { id: 'risk', label: 'СТОП', x: .86, y: .74, c: '#F59E0B' },
    ];
    const links = [['in1', 'hub'], ['in2', 'hub'], ['in3', 'hub'], ['hub', 'out'], ['hub', 'risk']];
    const g = canvas(stage);
    const dom = nodes.map(n => {
      const d = el('div', { class: 'mono', style: `position:absolute;transform:translate(-50%,-50%);z-index:2;
        padding:6px 8px;border-radius:10px;font-size:8.5px;letter-spacing:.08em;color:#E6EDF3;cursor:pointer;
        background:#0E131A;border:1px solid ${n.c}55;box-shadow:0 0 0 0 ${n.c}00;transition:box-shadow .4s,border-color .4s`,
        text: n.label });
      stage.appendChild(d); return d;
    });
    const beams = []; // {a,b,t,col}
    function fire(from, depth = 0) {
      links.filter(l => l[0] === from).forEach(l => {
        const a = nodes.findIndex(n => n.id === l[0]), b = nodes.findIndex(n => n.id === l[1]);
        beams.push({ a, b, t: 0, col: nodes[b].c });
        setTimeout(() => { if (depth < 3) fire(l[1], depth + 1); pulse(b) }, 620);
      });
    }
    function pulse(i) {
      const n = nodes[i], d = dom[i];
      d.style.boxShadow = `0 0 20px 2px ${n.c}66`; d.style.borderColor = n.c;
      setTimeout(() => { d.style.boxShadow = `0 0 0 0 ${n.c}00`; d.style.borderColor = n.c + '55' }, 520);
      const r = stage.getBoundingClientRect();
      fx.ring({ x: n.x * r.width, y: n.y * r.height, r: 46, color: n.c, width: 1.6 });
      haptic('light');
    }
    raf(dt => {
      g.clear();
      nodes.forEach((n, i) => { dom[i].style.left = (n.x * 100) + '%'; dom[i].style.top = (n.y * 100) + '%' });
      links.forEach(l => {
        const a = nodes.find(n => n.id === l[0]), b = nodes.find(n => n.id === l[1]);
        g.x.strokeStyle = 'rgba(255,255,255,.08)'; g.x.lineWidth = 1.4;
        g.x.beginPath(); g.x.moveTo(a.x * g.w, a.y * g.h);
        g.x.quadraticCurveTo((a.x + b.x) / 2 * g.w, a.y * g.h, b.x * g.w, b.y * g.h); g.x.stroke();
      });
      for (let i = beams.length - 1; i >= 0; i--) {
        const bm = beams[i]; bm.t += dt * 1.6; if (bm.t >= 1) { beams.splice(i, 1); continue }
        const a = nodes[bm.a], b = nodes[bm.b];
        const p = ease.io(bm.t);
        const qx = (a.x + b.x) / 2 * g.w, qy = a.y * g.h;
        const at = u => ({
          x: (1 - u) * (1 - u) * a.x * g.w + 2 * (1 - u) * u * qx + u * u * b.x * g.w,
          y: (1 - u) * (1 - u) * a.y * g.h + 2 * (1 - u) * u * qy + u * u * b.y * g.h });
        const tail = [];
        for (let k = 0; k < 14; k++) tail.push(at(clamp(p - k * .028)));
        g.x.save(); g.x.shadowColor = bm.col; g.x.shadowBlur = 14;
        tail.forEach((pt, k) => { g.x.globalAlpha = (1 - k / tail.length) * .9;
          g.x.fillStyle = k === 0 ? '#fff' : bm.col;
          g.x.beginPath(); g.x.arc(pt.x, pt.y, (1 - k / tail.length) * 2.8 + .6, 0, SA.TAU); g.x.fill() });
        g.x.restore();
      }
    });
    dom.forEach((d, i) => d.addEventListener('click', () => { pulse(i); fire(nodes[i].id) }));
    setTimeout(() => { pulse(0); fire('in1') }, 500);
  }
});

/* 41 ---------------------------------------------------------------------
   Кнопка ордера: border-beam + shimmer + ripple + удержание.
   База: magicui Shimmer/Ripple/Rainbow Button, uiverse. Смысл: «market buy»

SA.register({

/* 42 ---------------------------------------------------------------------
   Метеоры и частицы с параллаксом. База: magicui Meteors + Particles,
   aceternity backgrounds. Смысл: «шум рынка» — наклоняй сцену и видишь,
   сколько сигналов ложные.                                                  */
SA.register({
  n: '42', title: 'Шум рынка: метеоры и параллакс', group: 'motion',
  hint: 'Веди пальцем — <b>слои шума расходятся</b>, тап ловит сигнал',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const layers = [.35, .65, 1];
    const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(),
      l: randi(0, 2), r: rand(1.4, .4) }));
    const meteors = [];
    const hud = el('div', { class: 'mono', style: 'position:absolute;left:10px;top:8px;font-size:10px;color:#6E7D8F;z-index:2' });
    stage.appendChild(hud);
    let caught = 0, missed = 0, px = .5, py = .5, t = 0;
    const spawn = () => meteors.push({ x: rand(1.2, .1), y: rand(.3, -.25), l: randi(0, 2),
      sp: rand(.55, .3), life: 0, real: Math.random() < .3 });
    for (let i = 0; i < 6; i++) spawn();
    raf(dt => {
      t += dt; g.clear();
      const ox = (px - .5), oy = (py - .5);
      stars.forEach(s => {
        const d = layers[s.l];
        const x = (s.x * g.w) - ox * 26 * d, y = (s.y * g.h) - oy * 18 * d;
        g.x.fillStyle = `rgba(200,220,255,${.1 + d * .25})`;
        g.x.beginPath(); g.x.arc(x, y, s.r * d, 0, SA.TAU); g.x.fill();
      });
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i]; const d = layers[m.l];
        m.x -= m.sp * dt * d; m.y += m.sp * dt * d * .62; m.life += dt;
        if (m.x < -.25 || m.y > 1.25) { if (m.real) missed++; meteors.splice(i, 1); spawn(); continue }
        const x = m.x * g.w - ox * 30 * d, y = m.y * g.h - oy * 20 * d;
        const len = 46 * d, col = m.real ? '#4ADE80' : '#3B4A5C';
        const grd = g.x.createLinearGradient(x, y, x + len, y - len * .62);
        grd.addColorStop(0, col); grd.addColorStop(1, col + '00');
        g.x.strokeStyle = grd; g.x.lineWidth = 1.8 * d; g.x.lineCap = 'round';
        if (m.real) { g.x.shadowColor = col; g.x.shadowBlur = 12 }
        g.x.beginPath(); g.x.moveTo(x, y); g.x.lineTo(x + len, y - len * .62); g.x.stroke(); g.x.shadowBlur = 0;
        g.x.fillStyle = m.real ? '#D7FFE6' : '#55687C';
        g.x.beginPath(); g.x.arc(x, y, 1.9 * d, 0, SA.TAU); g.x.fill();
        m.sx = x; m.sy = y;
      }
      hud.innerHTML = `ПОЙМАНО <b style="color:#4ADE80">${caught}</b> · УПУЩЕНО <b style="color:#FF4D4D">${missed}</b>
        · ШУМ <b style="color:#6E7D8F">${meteors.filter(m => !m.real).length}</b>`;
    });
    stage.addEventListener('pointermove', e => { const r = stage.getBoundingClientRect();
      px = (e.clientX - r.left) / r.width; py = (e.clientY - r.top) / r.height });
    stage.addEventListener('pointerdown', e => {
      const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      let hit = null;
      meteors.forEach((m, i) => { if (m.sx !== undefined && Math.hypot(m.sx - x, m.sy - y) < 30) hit = i });
      if (hit !== null) {
        const m = meteors[hit];
        if (m.real) { caught++; haptic('success');
          fx.emit({ x: m.sx, y: m.sy, n: 18, color: ['#4ADE80', '#fff'], speed: 200, life: .7, size: 2.6, gravity: 40 });
          fx.ring({ x: m.sx, y: m.sy, r: 60, color: '#4ADE80', width: 2 });
        } else { haptic('error');
          fx.emit({ x: m.sx, y: m.sy, n: 8, color: '#FF4D4D', speed: 120, life: .5, size: 2, gravity: 160 }); }
        meteors.splice(hit, 1); spawn();
      } else { fx.ring({ x, y, r: 44, color: 'rgba(255,255,255,.35)', width: 1.4 }); haptic('light') }
    });
  }
});

/* 43 ---------------------------------------------------------------------
   Орбиты навыков. База: magicui Orbiting Circles + Icon Cloud.
   Смысл: ядро — твой капитал, вокруг вращаются навыки; тап фиксирует навык
   и подтягивает его ближе (прокачка).                                       */
SA.register({
  n: '43', title: 'Орбиты навыков вокруг капитала', group: 'motion',
  hint: 'Тап по спутнику — <b>навык выходит на ближнюю орбиту</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const items = [
      { s: '§', n: 'Структура', c: '#007AFD', r: 1, a: 0 },
      { s: '◇', n: 'Ликвидность', c: '#66B8FF', r: 1, a: 2.1 },
      { s: '▲', n: 'Импульс', c: '#4ADE80', r: 1, a: 4.2 },
      { s: '⬡', n: 'Протокол', c: '#A78BFA', r: 2, a: .9 },
      { s: '◼', n: 'Риск', c: '#F59E0B', r: 2, a: 3.0 },
      { s: '✕', n: 'Отказ', c: '#FF4D4D', r: 2, a: 5.2 },
    ];
    items.forEach(i => { i.rad = new Spring(i.r === 1 ? 54 : 84, { stiff: 120, damp: 15 }); i.base = i.r === 1 ? 54 : 84 });
    const label = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:12px;text-align:center;
      font-size:10px;color:#6E7D8F;z-index:2`, text: 'ядро · капитал 10 000 $' });
    stage.appendChild(label);
    let sel = -1, t = 0;
    raf(dt => {
      t += dt; g.clear();
      const cx = g.w / 2, cy = g.h / 2 - 6;
      // орбиты
      [54, 84].forEach(r => { g.x.strokeStyle = 'rgba(255,255,255,.07)'; g.x.setLineDash([2, 5]);
        g.x.beginPath(); g.x.arc(cx, cy, r, 0, SA.TAU); g.x.stroke(); g.x.setLineDash([]) });
      // ядро
      const pr = 22 + Math.sin(t * 2) * 1.6;
      g.x.shadowColor = '#007AFD'; g.x.shadowBlur = 26;
      const core = g.x.createRadialGradient(cx, cy, 2, cx, cy, pr);
      core.addColorStop(0, '#CFE6FF'); core.addColorStop(1, '#0B5ED7');
      g.x.fillStyle = core; g.x.beginPath(); g.x.arc(cx, cy, pr, 0, SA.TAU); g.x.fill(); g.x.shadowBlur = 0;
      items.forEach((it, i) => {
        const dir = it.r === 1 ? 1 : -1;
        it.a += dt * (it.r === 1 ? .42 : .26) * dir;
        const R = it.rad.step(dt);
        const x = cx + Math.cos(it.a) * R, y = cy + Math.sin(it.a) * R * .78;
        it.sx = x; it.sy = y;
        if (sel === i) { g.x.strokeStyle = it.c + '88'; g.x.lineWidth = 1.2;
          g.x.beginPath(); g.x.moveTo(cx, cy); g.x.lineTo(x, y); g.x.stroke() }
        g.x.shadowColor = it.c; g.x.shadowBlur = sel === i ? 20 : 10;
        g.x.fillStyle = '#0D141C'; g.x.beginPath(); g.x.arc(x, y, sel === i ? 17 : 14, 0, SA.TAU); g.x.fill();
        g.x.shadowBlur = 0; g.x.strokeStyle = it.c; g.x.lineWidth = 1.6; g.x.stroke();
        g.x.fillStyle = it.c; g.x.font = '700 13px ui-sans-serif,system-ui'; g.x.textAlign = 'center';
        g.x.textBaseline = 'middle'; g.x.fillText(it.s, x, y + .5);
      });
    });
    stage.addEventListener('pointerdown', e => {
      const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      let hit = -1; items.forEach((it, i) => { if (Math.hypot(it.sx - x, it.sy - y) < 22) hit = i });
      if (hit < 0) return;
      if (sel === hit) { sel = -1; items.forEach(it => it.rad.set(it.base)); label.textContent = 'ядро · капитал 10 000 $'; haptic('light') }
      else { sel = hit; items.forEach((it, i) => it.rad.set(i === hit ? 34 : it.base + 12));
        label.innerHTML = `<b style="color:${items[hit].c}">${items[hit].n}</b> · подтянут к ядру: +7% к весу решения`;
        haptic('medium'); fx.ring({ x: items[hit].sx, y: items[hit].sy, r: 56, color: items[hit].c, width: 2 }); }
    });
  }
});

/* 44 ---------------------------------------------------------------------
   Сотри прогноз. База: ScratchToReveal (magicui) + Image Comparison.

SA.register({

  hint: 'Три пальцем по карточке — <b>прогноз стирается</b>, под ним факт',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    const fx = new FX(stage);
    const card = el('div', { style: `position:absolute;inset:14px;border-radius:16px;overflow:hidden;
      border:1px solid #1C2430;background:linear-gradient(160deg,#101722,#0A0E14);touch-action:none` });

      <div class="mono" style="font-size:26px;font-weight:800;color:#FF4D4D">−7.9%</div>

    card.appendChild(under);
    const g = canvas(card);
    stage.appendChild(card);

      g.x.globalCompositeOperation = 'source-over';
      const grd = g.x.createLinearGradient(0, 0, g.w, g.h);
      grd.addColorStop(0, '#15314F'); grd.addColorStop(1, '#0C1A2B');
      g.x.fillStyle = grd; g.x.fillRect(0, 0, g.w, g.h);

      g.x.fillText('ПРОГНОЗ АНАЛИТИКА', g.w / 2, g.h / 2 - 26);
      g.x.font = '800 26px ui-monospace,monospace'; g.x.fillStyle = '#9FD4FF';
      g.x.fillText('+12% ЗА СУТКИ', g.w / 2, g.h / 2 + 4);

      onMove(d) { const r = card.getBoundingClientRect(); scratch(d.ex - r.left, d.ey - r.top);
        if (++moved % 6 === 0) haptic('selection');
        if (moved % 12 === 0 && !revealed) {
          // дешёвая оценка стёртой площади по выборке
          try { const im = g.x.getImageData(0, 0, g.c.width, g.c.height).data;
            let clear = 0, n = 0; for (let i = 3; i < im.length; i += 4 * 97) { n++; if (im[i] < 20) clear++ }
            pct = clear / Math.max(1, n);

/* 49 ---------------------------------------------------------------------
   Сравнение «до / после разметки». База: motion-primitives Image Comparison.

SA.register({

  hint: 'Тяни разделитель — <b>слева сырой график, справа разметка</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const data = SA.ohlc(44, { start: 100, vol: 1.4, drift: .12, seed: 99 });
    const lo = Math.min(...data.map(d => d.l)) - 1.5, hi = Math.max(...data.map(d => d.h)) + 1.5;
    const handle = el('div', { style: `position:absolute;top:0;bottom:0;width:34px;margin-left:-17px;left:50%;
      cursor:ew-resize;touch-action:none;z-index:3;display:grid;place-items:center` });
    handle.innerHTML = `<div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.75);
        box-shadow:0 0 12px rgba(255,255,255,.4)"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:#0E131A;border:1.5px solid #fff;
        display:grid;place-items:center;font:700 11px ui-monospace,monospace;color:#fff">⇄</div>`;
    const tagL = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:8.5px;letter-spacing:.12em;
      color:#6E7D8F;z-index:2`, text: 'СЫРОЙ ГРАФИК' });
    const tagR = el('div', { class: 'mono', style: `position:absolute;right:10px;top:8px;font-size:8.5px;letter-spacing:.12em;
      color:#4ADE80;z-index:2`, text: 'РАЗМЕТКА' });
    stage.append(handle, tagL, tagR);
    let split = new Spring(.5, { stiff: 160, damp: 20 }), appear = 0;
    raf(dt => {
      const s = split.step(dt); appear = Math.min(1, appear + dt * .6);
      g.clear(); g.grid(26);
      const X = SA.scaleRaw(0, data.length - 1, 12, g.w - 12), Y = SA.scaleRaw(lo, hi, g.h - 16, 16);
      data.forEach((d, i) => {
        const up = d.c >= d.o, w = (g.w - 24) / data.length * .58, x = X(i);
        const bare = x > s * g.w;
        g.x.strokeStyle = bare ? (up ? '#4ADE80' : '#FF4D4D') : '#5A6A7B';
        g.x.fillStyle = g.x.strokeStyle; g.x.lineWidth = Math.max(1, w * .16);
        g.x.beginPath(); g.x.moveTo(x, Y(d.h)); g.x.lineTo(x, Y(d.l)); g.x.stroke();
        const a = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));
        g.x.fillRect(x - w / 2, a, w, Math.max(1.5, b - a));
      });
      // правая половина: разметка
      g.x.save(); g.x.beginPath(); g.x.rect(s * g.w, 0, g.w - s * g.w, g.h); g.x.clip();
      const k = ease.out(appear);
      const trendA = { x: X(4), y: Y(data[4].l) }, trendB = { x: X(38), y: Y(data[38].l) };
      g.x.strokeStyle = 'rgba(102,184,255,.9)'; g.x.lineWidth = 2; g.x.setLineDash([]);
      g.x.beginPath(); g.x.moveTo(trendA.x, trendA.y);
      g.x.lineTo(lerp(trendA.x, trendB.x, k), lerp(trendA.y, trendB.y, k)); g.x.stroke();
      const resist = Y(Math.max(...data.slice(10, 30).map(d => d.h)));
      g.x.strokeStyle = 'rgba(245,158,11,.9)'; g.x.setLineDash([6, 4]);
      g.x.beginPath(); g.x.moveTo(s * g.w, resist); g.x.lineTo(g.w * k, resist); g.x.stroke(); g.x.setLineDash([]);
      g.x.fillStyle = 'rgba(245,158,11,.95)'; g.x.font = '700 9px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('СОПРОТИВЛЕНИЕ', s * g.w + 8, resist - 6);
      g.x.fillStyle = 'rgba(102,184,255,.95)';
      g.x.fillText('ТРЕНД', trendB.x - 46, trendB.y + 14);
      const zy = Y(data[26].l), zh = 16;
      g.x.fillStyle = 'rgba(74,222,128,.14)'; g.x.fillRect(s * g.w, zy - zh, g.w, zh * 2);
      g.x.fillStyle = 'rgba(74,222,128,.95)'; g.x.fillText('ЗОНА СПРОСА', s * g.w + 8, zy + 4);
      g.x.restore();
      handle.style.left = (s * 100) + '%';
    });
    let lastH = 0;
    drag(handle, { axis: true, onMove(d) { const r = stage.getBoundingClientRect();
      split.jump(clamp((d.ex - r.left) / r.width, .06, .94));
      if (performance.now() - lastH > 70) { haptic('selection'); lastH = performance.now() } },
      onStart() { haptic('light') }, onEnd() { haptic('rigid') } });
  }
});

  build(stage) {
    stage.classList.add('tall');
    const DB = [
      ['Урок: структура рынка', 'READ', '#007AFD'],
      ['Урок: ликвидность и стопы', 'READ', '#007AFD'],
      ['Тренажёр: трендовая линия', 'DRILL', '#66B8FF'],

      ['Протокол: правило трёх стопов', 'PROTOCOL', '#A78BFA'],
      ['Защита: калькулятор риска', 'PROTECT', '#F59E0B'],
      ['Бой: Жадность, 3 уровень', 'BOSS', '#FF4D4D'],
      ['Журнал: разбор недели', 'META', '#4ADE80'],
      ['Лига: текущее место', 'META', '#4ADE80'],
    ];
    const KEYS = 'абвгдежзийклмнопрстуфхцчшщъыьэюя ';
    const panel = el('div', { style: `position:absolute;left:12px;right:12px;top:12px;bottom:46px;border-radius:14px;

    const input = el('div', { style: `display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid #1A222C` });
    const q = el('div', { class: 'mono', style: 'font-size:12px;color:#E6EDF3;flex:1;min-height:15px' });
    const caret = el('span', { style: `display:inline-block;width:6px;height:13px;background:#66B8FF;vertical-align:-2px;
      animation:sa-caret 1s step-end infinite` });
    input.append(el('span', { style: 'color:#39434F;font:700 12px ui-monospace,monospace', text: '⌘' }), q, caret);
    const list = el('div', { style: 'flex:1;overflow:auto;padding:6px' });
    const foot = el('div', { class: 'mono', style: `padding:7px 12px;border-top:1px solid #1A222C;font-size:8.5px;

    let query = '', sel = 0;
    // fuzzy: подпоследовательность + бонус за подряд идущие
    function match(text, qq) {
      if (!qq) return { ok: true, score: 0, hit: [] };
      const t = text.toLowerCase(); let i = 0, score = 0, hit = [], streak = 0;
      for (let j = 0; j < t.length && i < qq.length; j++) {
        if (t[j] === qq[i]) { hit.push(j); i++; streak++; score += 2 + streak }
        else streak = 0;
      }
      return { ok: i === qq.length, score, hit };
    }
    function render() {
      q.textContent = query || '';
      q.style.color = query ? '#E6EDF3' : '#39434F';
      if (!query) q.textContent = 'найти урок, протокол, бой…';
      const res = DB.map(([t, tag, c]) => ({ t, tag, c, m: match(t, query.toLowerCase().trim()) }))

      sel = clamp(sel, 0, Math.max(0, res.length - 1));

      cursor:pointer;z-index:5`, text: 'ПРИСЛАТЬ УВЕДОМЛЕНИЕ' });
    stage.append(host, btn);
    const stack = [];
    function layout() {
      stack.forEach((t, i) => {
        const k = stack.length - 1 - i; // 0 — верхний
        t.node.style.zIndex = String(10 + i);
        if (!t.dragging) t.node.style.transform = `translateY(${-k * 10}px) scale(${1 - k * .045})`;
        t.node.style.opacity = k > 2 ? '0' : String(1 - k * .18);
      });
    }
    function push() {
      const [t, s, c, hard] = POOL[randi(0, POOL.length - 1)];
      const node = el('div', { style: `position:absolute;left:0;right:0;bottom:0;border-radius:13px;padding:10px 12px;
        background:linear-gradient(160deg,#141C27,#0C1118);border:1px solid ${c}44;touch-action:none;
        box-shadow:0 10px 28px rgba(0,0,0,.45);transition:transform .32s cubic-bezier(.2,.9,.2,1),opacity .28s;
        will-change:transform` });
      node.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
          <div style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 8px ${c}"></div>

        </div>
        <div class="mono" style="font-size:10px;color:#9FB0C2;margin-top:4px">${s}</div>
        ${hard ? `<div class="ok mono" style="margin-top:8px;text-align:center;padding:7px;border-radius:9px;
          background:${c}1F;border:1px solid ${c}55;color:${c};font-size:10px;font-weight:700;cursor:pointer">ПРИНЯТЬ ОГРАНИЧЕНИЕ</div>` : ''}`;
      const item = { node, hard, dragging: false };
      host.appendChild(node); stack.push(item);
      while (stack.length > 4) { const old = stack.shift(); old.node.remove() }
      layout(); haptic(hard ? 'warning' : 'light');
      if (hard) node.querySelector('.ok').addEventListener('click', e => { e.stopPropagation();
        haptic('success'); dismiss(item, 0) });
      else {
        drag(node, { axis: true,
          onStart() { item.dragging = true; node.style.transition = 'none' },
          onMove(d) { node.style.transform = `translate(${d.x}px,${-(stack.length - 1 - stack.indexOf(item)) * 10}px)
            rotate(${(d.x * .04).toFixed(2)}deg)`; node.style.opacity = String(clamp(1 - Math.abs(d.x) / 220)) },
          onEnd(d) { item.dragging = false; node.style.transition = 'transform .32s cubic-bezier(.2,.9,.2,1),opacity .28s';
            if (Math.abs(d.x) > 76) dismiss(item, Math.sign(d.x)); else { layout(); node.style.opacity = '1' } } });
      }
      return item;
    }
    function dismiss(item, dir) {
      item.node.style.transform = `translateX(${dir * 320}px) rotate(${dir * 9}deg)`;
      item.node.style.opacity = '0'; haptic('rigid');
      setTimeout(() => { item.node.remove(); const i = stack.indexOf(item); if (i >= 0) stack.splice(i, 1); layout() }, 300);
    }
    btn.addEventListener('click', push);
    push(); setTimeout(push, 600); setTimeout(push, 1200);
  }
});

/* 55 ---------------------------------------------------------------------
   Кинетический манифест. База: kinetic typography (colorion/scrolltide).
   Смысл: ключевая фраза курса собирается из букв, реагирует на палец
   и переключается на следующий тезис по тапу.                              */
SA.register({
  n: '55', title: 'Кинетический манифест по буквам', group: 'kinetic',
  hint: 'Веди пальцем — <b>буквы расступаются</b>; тап — следующий тезис',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const LINES = [
      ['РЫНОК', 'НИЧЕГО', 'ТЕБЕ', 'НЕ ДОЛЖЕН'],
      ['СИСТЕМА', 'ВАЖНЕЕ', 'ОДНОЙ', 'СДЕЛКИ'],
      ['СТОП', 'ЭТО', 'ЦЕНА', 'ОШИБКИ'],
    ];
    const COLS = ['#E6EDF3', '#66B8FF', '#4ADE80', '#FFD166'];
    const box = el('div', { style: `position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
      gap:2px;padding:0 16px;cursor:pointer;user-select:none` });
    const foot = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:12px;text-align:center;
      font-size:9px;letter-spacing:.14em;color:#39434F`, text: 'ТЕЗИС 1 / 3 · ТАП' });
    stage.append(box, foot);
    let idx = 0, letters = [], px = -999, py = -999, t = 0;
    function render() {
      box.innerHTML = ''; letters = [];
      LINES[idx].forEach((word, li) => {
        const row = el('div', { style: `display:flex;line-height:.94;font-weight:900;letter-spacing:-.02em;
          font-size:${li === 0 ? 34 : 30}px;color:${COLS[li % COLS.length]}` });
        splitText(row, word).forEach((s, i) => {
          s.style.transform = 'translateY(26px) rotate(8deg)'; s.style.opacity = '0';
          s.style.transition = `transform .5s cubic-bezier(.2,.9,.2,1) ${(li * 5 + i) * 26}ms,
            opacity .4s ${(li * 5 + i) * 26}ms`;
          letters.push({ s, base: 0 });
        });
        box.appendChild(row);
      });
      requestAnimationFrame(() => letters.forEach(l => { l.s.style.opacity = '1'; l.s.style.transform = 'none' }));
      foot.textContent = `ТЕЗИС ${idx + 1} / ${LINES.length} · ТАП`;
    }
    render();
    raf(dt => {
      t += dt;
      if (px < -500) return;
      letters.forEach((l, i) => {
        const r = l.s.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const d = Math.hypot(cx - px, cy - py);
        const k = Math.max(0, 1 - d / 120);
        const ang = Math.atan2(cy - py, cx - px);
        const wob = Math.sin(t * 4 + i) * 1.4 * k;
        l.s.style.transition = 'none';
        l.s.style.transform = `translate(${(Math.cos(ang) * 16 * k).toFixed(2)}px,
          ${(Math.sin(ang) * 12 * k + wob).toFixed(2)}px) scale(${(1 + k * .22).toFixed(3)})`;
        l.s.style.textShadow = k > .2 ? `0 0 ${(k * 22).toFixed(0)}px rgba(102,184,255,${(k * .8).toFixed(2)})` : 'none';
      });
    });
    stage.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY });
    stage.addEventListener('pointerleave', () => { px = py = -999;
      letters.forEach(l => { l.s.style.transition = 'transform .5s cubic-bezier(.2,.9,.2,1)';
        l.s.style.transform = 'none'; l.s.style.textShadow = 'none' }) });
    box.addEventListener('click', e => {
      idx = (idx + 1) % LINES.length; px = py = -999; render(); haptic('medium');
      const r = stage.getBoundingClientRect();
      fx.ring({ x: r.width / 2, y: r.height / 2, r: 150, color: '#66B8FF', width: 2, dur: .6 });
    });
  }
});

/* 60 ---------------------------------------------------------------------
   Гиперпрыжок. База: magicui Warp Background + Retro Grid.
   Смысл: экран перехода между уровнями: удерживай — и сетка разгоняется,
   отпустишь раньше времени — разгон сбрасывается.                           */
SA.register({
  n: '60', title: 'Гиперпрыжок на следующий уровень', group: 'kinetic',
  hint: '<b>Удерживай</b> — сетка разгоняется до прыжка; отпустишь — сброс',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const lbl = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;top:14px;text-align:center;
      font-size:10px;letter-spacing:.16em;color:#6E7D8F;z-index:3`, text: 'УРОВЕНЬ 7 → 8' });
    const big = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
      text-align:center;font-size:40px;font-weight:900;color:#fff;opacity:0;transition:opacity .4s;z-index:3;
      text-shadow:0 0 30px rgba(102,184,255,.8)`, text: '8' });
    const hold = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:16px;text-align:center;
      font-size:10px;color:#9FB0C2;z-index:3`, text: 'УДЕРЖИВАЙ ЭКРАН' });
    stage.append(lbl, big, hold);
    const N = 160;
    const stars = Array.from({ length: N }, () => ({ a: rand(SA.TAU), r: rand(1, .05), z: Math.random(),
      c: pick(['#66B8FF', '#A78BFA', '#4ADE80', '#ffffff']) }));
    let speed = 0, held = false, charge = 0, jumped = false, t = 0;
    raf(dt => {
      t += dt;
      speed = lerp(speed, held ? 1 : .08, dt * (held ? 1.4 : 3));
      charge = clamp(charge + (held ? dt / 1.6 : -dt / .8));
      g.clear();
      const cx = g.w / 2, cy = g.h / 2;
      // ретро-сетка горизонта
      const warp = speed * 1.2;
      g.x.strokeStyle = `rgba(102,184,255,${.1 + charge * .2})`; g.x.lineWidth = 1;
      for (let i = 1; i <= 12; i++) {
        const k = ((i / 12) + (t * (.1 + speed * .8)) % (1 / 12)) % 1;
        const y = cy + Math.pow(k, 2.4) * cy * 1.4;
        g.x.beginPath(); g.x.moveTo(0, y); g.x.lineTo(g.w, y); g.x.stroke();
      }
      for (let i = -8; i <= 8; i++) {
        g.x.beginPath(); g.x.moveTo(cx + i * 14, cy); g.x.lineTo(cx + i * 130, g.h); g.x.stroke();
      }
      // звёздный тоннель
      stars.forEach(s => {
        s.z -= dt * (.12 + speed * 1.9);
        if (s.z <= .02) { s.z = 1; s.a = rand(SA.TAU); s.r = rand(1, .05) }
        const R = (s.r / s.z) * (Math.min(g.w, g.h) * .62);
        const x = cx + Math.cos(s.a) * R, y = cy + Math.sin(s.a) * R;
        const R2 = (s.r / Math.min(1, s.z + dt * (.12 + speed * 1.9))) * (Math.min(g.w, g.h) * .62);
        const x2 = cx + Math.cos(s.a) * R2, y2 = cy + Math.sin(s.a) * R2;
        const al = clamp((1 - s.z) * (.3 + speed));
        g.x.strokeStyle = s.c; g.x.globalAlpha = al; g.x.lineWidth = (1 - s.z) * 2.2 + .4;
        g.x.beginPath(); g.x.moveTo(x, y); g.x.lineTo(x2, y2); g.x.stroke(); g.x.globalAlpha = 1;
      });
      // кольцо заряда
      g.x.strokeStyle = 'rgba(255,255,255,.12)'; g.x.lineWidth = 3;
      g.x.beginPath(); g.x.arc(cx, g.h - 54, 20, 0, SA.TAU); g.x.stroke();
      g.x.strokeStyle = charge > .8 ? '#4ADE80' : '#66B8FF'; g.x.lineCap = 'round';
      g.x.shadowColor = g.x.strokeStyle; g.x.shadowBlur = 14;
      g.x.beginPath(); g.x.arc(cx, g.h - 54, 20, -Math.PI / 2, -Math.PI / 2 + charge * SA.TAU); g.x.stroke();
      g.x.shadowBlur = 0;
      if (charge >= 1 && !jumped) {
        jumped = true; haptic('success');
        big.style.opacity = '1'; lbl.textContent = 'ПРЫЖОК ВЫПОЛНЕН';
        hold.textContent = 'НОВЫЕ МЕХАНИКИ РАЗБЛОКИРОВАНЫ';
        confetti(fx, { x: cx, y: cy, n: 70 });
        setTimeout(() => { big.style.opacity = '0'; jumped = false; charge = 0;
          lbl.textContent = 'УРОВЕНЬ 8 → 9'; hold.textContent = 'УДЕРЖИВАЙ ЭКРАН' }, 1800);
      }
      hold.style.color = held ? '#66B8FF' : '#9FB0C2';
    });
    const down = () => { held = true; haptic('light') };
    const up = () => { if (held && charge < 1) haptic('rigid'); held = false };
    stage.addEventListener('pointerdown', down);
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointerleave', up);
    stage.addEventListener('pointercancel', up);
  }
});
})();

    const closes = data.map(d => d.c);
    const verdict = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;z-index:3;font-size:10px;
      background:rgba(7,9,13,.78);border:1px solid #1C2430;border-radius:9px;padding:6px 9px` });
    stage.appendChild(verdict);
    let a = .55, b = .92, mode = null, grab = 0;
    const MH = 44; // высота мини-карты
    function stats(i0, i1) {
      const seg = closes.slice(i0, i1 + 1);
      const ch = (seg[seg.length - 1] - seg[0]) / seg[0] * 100;
      const mean = sum(seg) / seg.length;
      const sd = Math.sqrt(sum(seg, v => (v - mean) ** 2) / seg.length) / mean * 100;
      const lo = Math.min(...seg), hi = Math.max(...seg);
      const pos = (seg[seg.length - 1] - lo) / ((hi - lo) || 1);
      const regime = Math.abs(ch) > sd * 1.6 ? ['ТРЕНД', '#4ADE80'] : sd < 1.4 ? ['СЖАТИЕ', '#A78BFA'] : ['ДИАПАЗОН', '#F59E0B'];
      return { ch, sd, pos, regime, n: seg.length };
    }
    raf(dt => {
      g.clear();
      const topH = g.h - MH - 14;
      const i0 = Math.floor(a * (closes.length - 1)), i1 = Math.max(i0 + 6, Math.floor(b * (closes.length - 1)));
      const seg = closes.slice(i0, i1 + 1);
      const lo = Math.min(...seg), hi = Math.max(...seg);
      const X = scaleRaw(0, seg.length - 1, 10, g.w - 10), Y = scaleRaw(lo, hi, topH - 12, 16);
      g.grid(26);
      const pts = seg.map((v, i) => ({ x: X(i), y: Y(v) }));
      const area = g.vgrad([[0, 'rgba(102,184,255,.3)'], [1, 'rgba(102,184,255,0)']], 0, 10, 0, topH);
      g.x.beginPath(); SA.tracePath(g.x, pts);
      g.x.lineTo(pts[pts.length - 1].x, topH); g.x.lineTo(pts[0].x, topH); g.x.closePath();
      g.x.fillStyle = area; g.x.fill();
      g.glowLine(pts, { color: '#66B8FF', width: 2.2, blur: 14 });
      const s = stats(i0, i1);
      verdict.innerHTML = `<b style="color:${s.regime[1]}">${s.regime[0]}</b> · окно ${s.n} свечей ·
        ${fmt.pct(s.ch)} · волатильность ${s.sd.toFixed(2)}%`;
      // мини-карта
      const my = g.h - MH;
      g.x.fillStyle = 'rgba(255,255,255,.025)'; rr(g.x, 8, my, g.w - 16, MH - 6, 8).fill();
      const LO = Math.min(...closes), HI = Math.max(...closes);
      const mX = scaleRaw(0, closes.length - 1, 10, g.w - 10), mY = scaleRaw(LO, HI, g.h - 12, my + 6);
      g.x.strokeStyle = 'rgba(159,176,194,.55)'; g.x.lineWidth = 1;
      g.x.beginPath(); closes.forEach((v, i) => i ? g.x.lineTo(mX(i), mY(v)) : g.x.moveTo(mX(i), mY(v))); g.x.stroke();
      const wx0 = mX(i0), wx1 = mX(i1);
      g.x.fillStyle = 'rgba(0,0,0,.5)';
      g.x.fillRect(8, my, wx0 - 8, MH - 6); g.x.fillRect(wx1, my, g.w - 8 - wx1, MH - 6);
      g.x.strokeStyle = '#66B8FF'; g.x.lineWidth = 1.4;
      rr(g.x, wx0, my, wx1 - wx0, MH - 6, 6).stroke();
      [wx0, wx1].forEach(x => { g.x.fillStyle = '#66B8FF'; rr(g.x, x - 3, my + 6, 6, MH - 18, 3).fill() });
    });
    drag(stage, { axis: true,
      onStart(d) {
        const p = local(stage, { clientX: d.ex, clientY: d.ey });
        if (p.y < p.h - MH - 4) { mode = null; return }
        const x = (p.x - 10) / (p.w - 20);
        mode = Math.abs(x - a) < .05 ? 'a' : Math.abs(x - b) < .05 ? 'b' : 'move';
        grab = x - a; haptic('light');
      },
      onMove(d) {
        if (!mode) return;
        const p = local(stage, { clientX: d.ex, clientY: d.ey });
        const x = clamp((p.x - 10) / (p.w - 20));
        if (mode === 'a') a = Math.min(x, b - .04);
        else if (mode === 'b') b = Math.max(x, a + .04);
        else { const wdt = b - a; a = clamp(x - grab, 0, 1 - wdt); b = a + wdt }
      },
      onEnd() { if (mode) haptic('rigid'); mode = null } });
  }
});

/* 62 ---------------------------------------------------------------------
   Санки-диаграмма: куда уходит депозит. База: evilcharts Sankey.

SA.register({

    const nodes = [

      { id: 'loss', col: 2, v: 40, t: 'УБЫТКИ', c: '#FF4D4D' },
    ];
    const links = [
      { from: 'dep', to: 'sys', v: 58 }, { from: 'dep', to: 'imp', v: 42 },
      { from: 'sys', to: 'win', v: 38 }, { from: 'sys', to: 'fee', v: 6 }, { from: 'sys', to: 'loss', v: 14 },
      { from: 'imp', to: 'win', v: 8 }, { from: 'imp', to: 'fee', v: 8 }, { from: 'imp', to: 'loss', v: 26 },
    ];
    const note = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:8px;font-size:9.5px;
      color:#6E7D8F;text-align:center;z-index:2`, text: 'ста долларов хватает на 7 импульсных сделок' });
    stage.appendChild(note);
    let sel = -1, t = 0, laid = false;
    raf(dt => {
      t = Math.min(1, t + dt * .7); g.clear();

      sankey(nodes, links, { w: g.w, h: g.h - 22, pad: 14, gap: 12, nodeW: 10 });
      links.forEach((l, i) => {
        const k = ease.out(clamp(t * 1.3 - i * .04));
        const x0 = l.a.x + l.a.w, x1 = l.b.x;
        const xm = (x0 + x1) / 2, xe = lerp(x0, x1, k);
        const dim = sel >= 0 && sel !== i;
        g.x.beginPath();
        g.x.moveTo(x0, l.y0 - l.th / 2);
        g.x.bezierCurveTo(xm, l.y0 - l.th / 2, xm, l.y1 - l.thB / 2, xe, lerp(l.y0, l.y1, k) - l.thB / 2);
        g.x.lineTo(xe, lerp(l.y0, l.y1, k) + l.thB / 2);
        g.x.bezierCurveTo(xm, l.y1 + l.thB / 2, xm, l.y0 + l.th / 2, x0, l.y0 + l.th / 2);
        g.x.closePath();
        const grd = g.x.createLinearGradient(x0, 0, x1, 0);
        grd.addColorStop(0, alpha(l.a.c, dim ? .06 : .42));
        grd.addColorStop(1, alpha(l.b.c, dim ? .06 : .52));
        g.x.fillStyle = grd; g.x.fill();
        if (sel === i) { g.x.strokeStyle = alpha(l.b.c, .9); g.x.lineWidth = 1; g.x.stroke() }
        l.hit = { x0, x1, y0: l.y0, y1: l.y1, th: l.th };

      nodes.forEach(n => {
        g.x.fillStyle = n.c; g.x.shadowColor = n.c; g.x.shadowBlur = 12;

      links.forEach((l, i) => { if (!l.hit) return;
        if (p.x > l.hit.x0 && p.x < l.hit.x1) {

      } else note.textContent = 'ста долларов хватает на 7 импульсных сделок';
    });
  }

/* 63 ---------------------------------------------------------------------
   Радар профиля с перетаскиванием вершин. База: evilcharts Radar.
   Смысл: распределение очков прокачки — сумма ограничена, апгрейд одного
   навыка отнимает у другого.                                               */
SA.register({
  n: '63', title: 'Профиль трейдера: распределение очков', group: 'flow',
  hint: 'Тяни вершину — <b>очки перетекают</b>, сумма зафиксирована',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const AX = ['Чтение', 'Риск', 'Терпение', 'Скорость', 'Журнал', 'Психика'];
    let vals = [.72, .55, .4, .62, .3, .5];
    const BUDGET = sum(vals);
    const hud = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;color:#6E7D8F;z-index:2` });
    stage.appendChild(hud);
    let drag_i = -1, t = 0;
    raf(dt => {
      t = Math.min(1, t + dt * .8); g.clear();
      const cx = g.w / 2, cy = g.h / 2 + 4, R = Math.min(g.w, g.h) * .34;
      // сетка
      for (let r = 1; r <= 4; r++) {
        g.x.strokeStyle = r === 4 ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.06)';
        g.x.beginPath();
        radarPts(AX.map(() => r / 4), cx, cy, R).forEach((p, i) => i ? g.x.lineTo(p.x, p.y) : g.x.moveTo(p.x, p.y));
        g.x.closePath(); g.x.stroke();
      }
      radarPts(AX.map(() => 1), cx, cy, R).forEach((p, i) => {
        g.x.strokeStyle = 'rgba(255,255,255,.06)';
        g.x.beginPath(); g.x.moveTo(cx, cy); g.x.lineTo(p.x, p.y); g.x.stroke();
        g.x.fillStyle = drag_i === i ? '#E6EDF3' : '#6E7D8F'; g.x.font = '600 9px ui-monospace,monospace';
        g.x.textAlign = p.x > cx + 4 ? 'left' : p.x < cx - 4 ? 'right' : 'center';
        g.x.textBaseline = p.y > cy ? 'top' : 'bottom';
        g.x.fillText(AX[i].toUpperCase(), p.x + Math.sign(p.x - cx) * 5, p.y + Math.sign(p.y - cy) * 4);
      });
      const pts = radarPts(vals.map(v => v * ease.out(t)), cx, cy, R);
      const grd = g.x.createRadialGradient(cx, cy, 4, cx, cy, R);
      grd.addColorStop(0, 'rgba(74,222,128,.42)'); grd.addColorStop(1, 'rgba(0,122,253,.22)');
      g.x.beginPath(); pts.forEach((p, i) => i ? g.x.lineTo(p.x, p.y) : g.x.moveTo(p.x, p.y)); g.x.closePath();
      g.x.fillStyle = grd; g.x.fill();
      g.x.strokeStyle = '#4ADE80'; g.x.lineWidth = 2; g.x.shadowColor = '#4ADE80'; g.x.shadowBlur = 14;
      g.x.stroke(); g.x.shadowBlur = 0;
      pts.forEach((p, i) => { g.x.fillStyle = i === drag_i ? '#fff' : '#4ADE80';
        g.x.beginPath(); g.x.arc(p.x, p.y, i === drag_i ? 6 : 4, 0, SA.TAU); g.x.fill();
        p.hit = true; });
      g.pts = pts;
      const weak = vals.indexOf(Math.min(...vals));
      hud.innerHTML = `ОЧКОВ ${(BUDGET * 100).toFixed(0)} · СЛАБОЕ ЗВЕНО
        <b style="color:#FF4D4D">${AX[weak].toUpperCase()}</b>`;
    });
    drag(stage, { axis: true,
      onStart(d) { const p = local(stage, { clientX: d.ex, clientY: d.ey });
        let best = -1, bd = 26;
        (g.pts || []).forEach((q, i) => { const dd = Math.hypot(q.x - p.x, q.y - p.y); if (dd < bd) { bd = dd; best = i } });
        drag_i = best; if (best >= 0) haptic('light') },
      onMove(d) { if (drag_i < 0) return;
        const p = local(stage, { clientX: d.ex, clientY: d.ey });
        const cx = p.w / 2, cy = p.h / 2 + 4, R = Math.min(p.w, p.h) * .34;
        const nv = clamp(Math.hypot(p.x - cx, p.y - cy) / R, .08, 1);
        const delta = nv - vals[drag_i];
        vals[drag_i] = nv;
        // перераспределяем дельту между остальными
        const others = vals.map((v, i) => i).filter(i => i !== drag_i);
        const pool = sum(others.map(i => vals[i]));
        others.forEach(i => { vals[i] = clamp(vals[i] - delta * (vals[i] / (pool || 1)), .08, 1) });
      },
      onEnd() { if (drag_i >= 0) { haptic('rigid');
        const p = g.pts[drag_i]; if (p) fx.ring({ x: p.x, y: p.y, r: 44, color: '#4ADE80', width: 1.6 }) }
        drag_i = -1 } });
  }
});

/* 64 ---------------------------------------------------------------------
   Хитмап дисциплины. База: календарные хитмапы + evilcharts dots.
   Смысл: видно не прибыль, а соблюдение протокола — главная метрика курса. */
SA.register({
  n: '64', title: 'Календарь дисциплины: 18 недель', group: 'flow',
  hint: 'Тап по клетке — <b>разбор дня</b>; серии подсвечиваются',
  tags: ['interaction', 'animation'],
  build(stage) {
    const g = canvas(stage), tip = tipEl(); stage.appendChild(tip);
    const W = 18, D = 7, rnd = prng(7);
    const cells = [];
    for (let w = 0; w < W; w++) for (let d = 0; d < D; d++) {
      const trend = w / W;
      const v = clamp(rnd() * (.35 + trend * .85) - (d >= 5 ? .25 : 0));
      cells.push({ w, d, v, trades: Math.round(v * 6), broke: v > .1 && rnd() < .18 });
    }
    const head = el('div', { class: 'mono', style: `position:absolute;left:12px;top:8px;font-size:9px;color:#6E7D8F;z-index:2`,
      text: 'СОБЛЮДЕНИЕ ПРОТОКОЛА · 126 ДНЕЙ' });
    stage.appendChild(head);
    let sel = -1, t = 0, hover = -1;
    raf(dt => {
      t = Math.min(1, t + dt * .55); g.clear();
      const padL = 14, padT = 30, padB = 22;
      const cw = (g.w - padL * 2) / W, ch = Math.min(cw, (g.h - padT - padB) / D);
      cells.forEach((c, i) => {
        const k = ease.out(clamp(t * 1.5 - (c.w / W) * .8));
        const x = padL + c.w * cw, y = padT + c.d * ch;
        const s = (Math.min(cw, ch) - 3) * k;
        const col = c.v < .08 ? '#131A24' : mix('#0B3B22', '#4ADE80', c.v);
        g.x.fillStyle = col;
        if (c.v > .7) { g.x.shadowColor = '#4ADE80'; g.x.shadowBlur = 8 }
        rr(g.x, x + (cw - s) / 2, y + (ch - s) / 2, s, s, 3).fill(); g.x.shadowBlur = 0;
        if (c.broke) { g.x.strokeStyle = '#FF4D4D'; g.x.lineWidth = 1.4;
          rr(g.x, x + (cw - s) / 2, y + (ch - s) / 2, s, s, 3).stroke() }
        if (i === sel || i === hover) { g.x.strokeStyle = '#fff'; g.x.lineWidth = 1.6;
          rr(g.x, x + (cw - s) / 2 - 1.5, y + (ch - s) / 2 - 1.5, s + 3, s + 3, 4).stroke() }
        c.px = x + cw / 2; c.py = y + ch / 2; c.size = Math.min(cw, ch);
      });
      // легенда
      const lx = g.w - 92, ly = g.h - 14;
      g.x.fillStyle = '#39434F'; g.x.font = '8px ui-monospace,monospace'; g.x.textAlign = 'left';
      g.x.fillText('меньше', lx - 34, ly + 3);
      for (let i = 0; i < 5; i++) { g.x.fillStyle = i === 0 ? '#131A24' : mix('#0B3B22', '#4ADE80', i / 4);
        rr(g.x, lx + i * 11, ly - 5, 8, 8, 2).fill() }
      g.x.fillStyle = '#39434F'; g.x.fillText('больше', lx + 58, ly + 3);
    });
    const at = e => { const p = local(stage, e);
      let best = -1, bd = 1e9;
      cells.forEach((c, i) => { const d = Math.hypot(c.px - p.x, c.py - p.y); if (d < bd) { bd = d; best = i } });
      return bd < 14 ? best : -1 };
    stage.addEventListener('pointermove', e => { hover = at(e);
      if (hover >= 0) { const c = cells[hover];
        tip.innerHTML = `неделя ${c.w + 1}, день ${c.d + 1}<br>
          <b style="color:${c.v > .5 ? '#4ADE80' : '#F59E0B'}">${Math.round(c.v * 100)}% протокола</b>
          <span style="color:#6E7D8F"> · сделок ${c.trades}</span>${c.broke ? '<br><span style="color:#FF4D4D">нарушение правила риска</span>' : ''}`;
        tip.style.opacity = '1';
        tip.style.left = clamp(c.px - 60, 4, g.w - 130) + 'px';
        tip.style.top = clamp(c.py - 56, 2, g.h - 40) + 'px';
      } else tip.style.opacity = '0' });
    stage.addEventListener('pointerleave', () => { hover = -1; tip.style.opacity = '0' });
    stage.addEventListener('pointerdown', e => { const i = at(e); if (i >= 0) { sel = i; haptic('selection') } });
  }
