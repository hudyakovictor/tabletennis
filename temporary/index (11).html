/* ============================================================================
   ГРУППА 12 — АМБИЕНТ И ПРОЦЕДУРНАЯ ГРАФИКА (85–92).
   Разбор: scrolltide (shaders: swirl/mesh/halftone, Particle Globe,
   Arc/Liquid carousel), aceternity (Dither Shader, ASCII Art, Noise
   Background, Chromatic Image, 3D Globe), kinetics.colorion (кинетика),
   inspora (motion-референсы), getlayers (слоистые сцены).
   Всё считается на canvas 2D: ни WebGL, ни внешних шейдеров — чтобы
   каталог открывался внутри Telegram на слабом телефоне.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, FX, canvas, local,
        rr, alpha, mix, noise2, flowAngle, prng, iso, halftone, chroma, Verlet, link, confetti } = SA;

/* 85 ---------------------------------------------------------------------
   Поле потока: режим рынка как течение. Смысл: ученик видит, что
   «тренд / флэт / шторм» — это свойство среды, а не его настроения.        */
SA.register({
  n: '85', title: 'Поле потока: характер рынка', group: 'ambient',
  hint: 'Тап — <b>смена режима</b>; палец отклоняет поток, как камень в реке',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const MODES = [
      { t: 'ТРЕНД', c1: '#007AFD', c2: '#4ADE80', curl: .25, sp: 46, note: 'линии идут в одну сторону — работай по направлению' },
      { t: 'ДИАПАЗОН', c1: '#A78BFA', c2: '#66B8FF', curl: 1.1, sp: 26, note: 'поток закручен — края диапазона важнее середины' },
      { t: 'ШТОРМ', c1: '#FF4D4D', c2: '#F59E0B', curl: 2.4, sp: 86, note: 'хаос: любая система даёт ложные сигналы' },
    ];
    let m = 0, t = 0, px = -999, py = -999;
    const N = 420;
    const rnd = prng(9);
    const pts = Array.from({ length: N }, () => ({ x: rnd(), y: rnd(), life: rnd() * 60 }));
    const label = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:10px;z-index:2;
      background:rgba(7,9,13,.6);border:1px solid #1C2430;border-radius:8px;padding:5px 8px` });
    const note = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:10px;text-align:center;
      font-size:9.5px;color:#6E7D8F;z-index:2` });
    stage.append(label, note);
    function paintLabel() {
      const M = MODES[m];
      label.innerHTML = `РЕЖИМ <b style="color:${M.c2}">${M.t}</b>`;
      note.textContent = M.note;
    }
    paintLabel();
    raf(dt => {
      t += dt;
      const M = MODES[m];
      // мягкий «шлейф» вместо полной очистки
      g.x.fillStyle = 'rgba(8,11,16,.14)'; g.x.fillRect(0, 0, g.w, g.h);
      pts.forEach(p => {
        const sx = p.x * g.w, sy = p.y * g.h;
        let a = flowAngle(sx, sy, t, .0065, M.curl);
        if (px > -500) { // палец отклоняет поток
          const dx = sx - px, dy = sy - py, d = Math.hypot(dx, dy);
          if (d < 90) { const push = (1 - d / 90); a = lerp(a, Math.atan2(dy, dx), push * .85) }
        }
        const nx = sx + Math.cos(a) * M.sp * dt, ny = sy + Math.sin(a) * M.sp * dt;
        const col = mix(M.c1, M.c2, p.y);
        g.x.strokeStyle = alpha(col, .5); g.x.lineWidth = 1.1;
        g.x.beginPath(); g.x.moveTo(sx, sy); g.x.lineTo(nx, ny); g.x.stroke();
        p.x = nx / g.w; p.y = ny / g.h; p.life -= dt * 10;
        if (p.life < 0 || p.x < -.02 || p.x > 1.02 || p.y < -.02 || p.y > 1.02) {
          p.x = Math.random(); p.y = Math.random(); p.life = 30 + Math.random() * 60;
        }
      });
    });
    stage.addEventListener('pointermove', e => { const p = local(stage, e); px = p.x; py = p.y });
    stage.addEventListener('pointerleave', () => { px = py = -999 });
    stage.addEventListener('pointerdown', () => { m = (m + 1) % MODES.length; paintLabel();
      haptic(m === 2 ? 'warning' : 'medium') });
  }
});

/* 86 ---------------------------------------------------------------------
   Капля ликвидности (metaball). Смысл: ликвидность стекается к крупным
   уровням; пальцем можно «растащить» её и увидеть, как рвётся стакан.      */
SA.register({
  n: '86', title: 'Ликвидность как жидкость', group: 'ambient',
  hint: 'Тяни — <b>капли сливаются и рвутся</b>, уровни притягивают объём',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const rnd = prng(21);
    const blobs = Array.from({ length: 7 }, (_, i) => ({
      x: .2 + rnd() * .6, y: .25 + rnd() * .5, r: 16 + rnd() * 20,
      vx: (rnd() - .5) * .02, vy: (rnd() - .5) * .02, held: false,
    }));
    const LEVELS = [.3, .62]; // уровни-аттракторы
    const hud = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;color:#6E7D8F;z-index:2`,

      t += dt; g.clear();

        g.x.beginPath(); g.x.moveTo(0, ly * g.h); g.x.lineTo(g.w, ly * g.h); g.x.stroke(); g.x.setLineDash([]);
      });
      blobs.forEach((b, i) => {
        if (!b.held) {
          // притяжение к ближайшему уровню и лёгкий дрейф
          const ly = LEVELS.reduce((a, l) => Math.abs(l - b.y) < Math.abs(a - b.y) ? l : a, LEVELS[0]);
          b.vy += (ly - b.y) * .22 * dt;
          b.vx += (Math.sin(t * .6 + i) * .04) * dt;
          b.vx *= .985; b.vy *= .985;
          b.x += b.vx * dt * 6; b.y += b.vy * dt * 6;
          b.x = clamp(b.x, .06, .94); b.y = clamp(b.y, .08, .92);
        }
      });
      // поле metaball: считаем по сетке и заливаем изолинию
      const step = 6;
      for (let py = 0; py < g.h; py += step) {
        for (let pxx = 0; pxx < g.w; pxx += step) {
          let f = 0, cr = 0, cg = 0, cb = 0;
          blobs.forEach(b => {
            const dx = pxx - b.x * g.w, dy = py - b.y * g.h;
            const v = (b.r * b.r) / (dx * dx + dy * dy + 1);

          });
          if (f > .9) {
            const edge = clamp((f - .9) / 1.6);
            g.x.fillStyle = alpha(mix('#007AFD', '#66E0FF', edge), .22 + edge * .6);
            g.x.fillRect(pxx, py, step, step);
          } else if (f > .55) {
            g.x.fillStyle = alpha('#007AFD', .1);
            g.x.fillRect(pxx, py, step, step);
          }
        }
      }
      // ядра
      blobs.forEach(b => { g.x.fillStyle = 'rgba(214,240,255,.85)';
        g.x.beginPath(); g.x.arc(b.x * g.w, b.y * g.h, 2.4, 0, SA.TAU); g.x.fill() });
      const atL = blobs.filter(b => LEVELS.some(l => Math.abs(l - b.y) < .05)).length;
      hud.innerHTML = `НА УРОВНЯХ <b style="color:#66B8FF">${atL}</b> ИЗ ${blobs.length} ·
        <span style="color:#39434F">чем плотнее, тем сильнее реакция цены</span>`;
    });
    drag(stage, { axis: true,
      onStart(d) { const p = local(stage, { clientX: d.ex, clientY: d.ey });
        let bd = 46; drag_i = -1;
        blobs.forEach((b, i) => { const dd = Math.hypot(b.x * p.w - p.x, b.y * p.h - p.y); if (dd < bd) { bd = dd; drag_i = i } });
        if (drag_i >= 0) { blobs[drag_i].held = true; haptic('light') } },
      onMove(d) { if (drag_i < 0) return; const p = local(stage, { clientX: d.ex, clientY: d.ey });
        const b = blobs[drag_i]; b.x = clamp(p.x / p.w, .06, .94); b.y = clamp(p.y / p.h, .08, .92);
        b.vx = b.vy = 0 },
      onEnd() { if (drag_i >= 0) { const b = blobs[drag_i]; b.held = false; haptic('rigid');
        fx.ring({ x: b.x * stage.clientWidth, y: b.y * stage.clientHeight, r: 54, color: '#66B8FF', width: 1.6 }) }

  }

/* 88 ---------------------------------------------------------------------
   Полутоновый рендер графика. База: aceternity Dither/ASCII + halftone
   шейдеры scrolltide. Смысл: один и тот же ряд цен в трёх «оптиках» —
   урок про то, что форма подачи меняет вывод.                              */
SA.register({
  n: '88', title: 'Три оптики одного графика', group: 'ambient',
  hint: 'Тап — <b>полутон / ASCII / чистая линия</b>; данные те же',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage);
    const data = SA.ohlc(70, { start: 100, vol: 1.3, drift: .07, seed: 77 }).map(d => d.c);
    const CH = ' .:-=+*#%@';
    let mode = 0, t = 0;
    const label = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;color:#6E7D8F;z-index:2` });
    stage.appendChild(label);
    const NAMES = ['ПОЛУТОН', 'ASCII', 'ЧИСТАЯ ЛИНИЯ'];
    const NOTES = ['видно плотность, не видно точек входа',
      'данные превращаются в текст — и мозг читает их иначе',
      'привычный вид: красиво, но без фактуры объёма'];
    function paintLabel() { label.innerHTML = `ОПТИКА <b style="color:#66B8FF">${NAMES[mode]}</b> ·
      <span style="color:#39434F">${NOTES[mode]}</span>` }
    paintLabel();
    raf(dt => {
      t += dt; g.clear();
      const lo = Math.min(...data) - 2, hi = Math.max(...data) + 2;
      const X = SA.scaleRaw(0, data.length - 1, 8, g.w - 8), Y = SA.scaleRaw(lo, hi, g.h - 24, 22);
      const valueAt = px => {
        const i = clamp((px - 8) / (g.w - 16)) * (data.length - 1);
        const i0 = Math.floor(i), i1 = Math.min(data.length - 1, i0 + 1);
        return lerp(data[i0], data[i1], i - i0);
      };
      const field = (px, py) => {
        const v = Y(valueAt(px));
        const d = Math.abs(py - v);
        const below = py > v ? clamp(1 - (py - v) / (g.h * .55)) * .55 : 0;
        return clamp(1 - d / 26) ** 1.6 + below + SA.noise2(px * .02, py * .02 + t * .3) * .06;
      };
      if (mode === 0) {
        halftone(g, field, { step: 7, color: '#66B8FF', max: 3.4 });
        halftone(g, (px, py) => field(px, py) > .75 ? 1 : 0, { step: 7, color: '#DFF1FF', max: 1.6 });
      } else if (mode === 1) {
        g.x.font = '10px ui-monospace,monospace'; g.x.textBaseline = 'middle'; g.x.textAlign = 'center';
        for (let py = 14; py < g.h - 8; py += 11)
          for (let px = 8; px < g.w - 4; px += 7) {
            const v = clamp(field(px, py));
            if (v < .06) continue;
            const ch = CH[Math.min(CH.length - 1, Math.floor(v * CH.length))];
            g.x.fillStyle = v > .7 ? '#DFFFE9' : alpha('#4ADE80', .35 + v * .6);
            g.x.fillText(ch, px, py);
          }
      } else {
        g.grid(26);
        const pts = data.map((v, i) => ({ x: X(i), y: Y(v) }));
        const area = g.vgrad([[0, 'rgba(102,184,255,.3)'], [1, 'rgba(102,184,255,0)']], 0, 20, 0, g.h - 24);
        g.x.beginPath(); SA.tracePath(g.x, pts);
        g.x.lineTo(pts[pts.length - 1].x, g.h - 24); g.x.lineTo(pts[0].x, g.h - 24); g.x.closePath();
        g.x.fillStyle = area; g.x.fill();
        g.glowLine(pts, { color: '#66B8FF', width: 2.4, blur: 16 });
      }
    });
    stage.addEventListener('pointerdown', () => { mode = (mode + 1) % 3; paintLabel(); haptic('medium') });
  }
});

/* 89 ---------------------------------------------------------------------

      { x: 3, y: 2, t: 'Протокол', s: 'lock', c: '#55687C' },

    stage.appendChild(info);
    const Z = new Spring(1, { stiff: 160, damp: 18 });
    let ox = 0, oy = 0, bx = 0, by = 0, sel = 3, t = 0, lastTap = 0;
    raf(dt => {
      t += dt; const z = Z.step(dt);
      g.clear();
      g.x.fillStyle = 'rgba(102,184,255,.02)'; g.x.fillRect(0, 0, g.w, g.h);
      const cx = g.w / 2 + ox, cy = g.h / 2 - 28 + oy;
      const P = n => { const p = iso(n.x, n.y, 56 * z, 30 * z); return { x: cx + p.x, y: cy + p.y } };
      // плитки
      NODES.forEach(n => {
        const p = P(n), w = 28 * z, h = 15 * z;
        g.x.beginPath();
        g.x.moveTo(p.x, p.y - h); g.x.lineTo(p.x + w, p.y); g.x.lineTo(p.x, p.y + h); g.x.lineTo(p.x - w, p.y);
        g.x.closePath();
        g.x.fillStyle = n.s === 'lock' ? 'rgba(25,32,41,.9)' : alpha(n.c, n.s === 'done' ? .2 : .3);
        g.x.fill();
        g.x.strokeStyle = n.s === 'lock' ? '#232D3A' : n.c; g.x.lineWidth = n.s === 'cur' ? 2 : 1;
        g.x.stroke();
      });
      // связи
      EDGES.forEach(([a, b]) => {
        const p1 = P(NODES[a]), p2 = P(NODES[b]);
        const done = NODES[a].s !== 'lock' && NODES[b].s !== 'lock';
        g.x.strokeStyle = done ? 'rgba(102,184,255,.45)' : 'rgba(255,255,255,.08)';
        g.x.setLineDash(done ? [] : [3, 4]); g.x.lineWidth = 1.4;
        g.x.beginPath(); g.x.moveTo(p1.x, p1.y); g.x.lineTo(p2.x, p2.y); g.x.stroke(); g.x.setLineDash([]);
      });
      // башни узлов
      NODES.forEach((n, i) => {
        const p = P(n);
        const hgt = (n.s === 'lock' ? 10 : n.s === 'cur' ? 30 + Math.sin(t * 3) * 2 : 20) * z;
        g.x.fillStyle = n.s === 'lock' ? '#131A24' : alpha(n.c, .85);
        if (n.s === 'cur') { g.x.shadowColor = n.c; g.x.shadowBlur = 20 }
        rr(g.x, p.x - 9 * z, p.y - hgt, 18 * z, hgt, 3 * z).fill(); g.x.shadowBlur = 0;
        g.x.fillStyle = n.s === 'lock' ? '#55687C' : '#E6EDF3';
        g.x.font = `${i === sel ? 700 : 500} ${9 * Math.min(1.2, z)}px ui-monospace,monospace`;
        g.x.textAlign = 'center';
        g.x.fillText(n.t, p.x, p.y - hgt - 6);
        if (n.s === 'lock') { g.x.fillStyle = '#39434F'; g.x.fillText('🔒'.length ? '×' : '×', p.x, p.y - hgt / 2) }
        if (i === sel) { g.x.strokeStyle = '#fff'; g.x.lineWidth = 1.4;
          g.x.beginPath(); g.x.arc(p.x, p.y - hgt - 16, 3.4, 0, SA.TAU); g.x.stroke() }
        n.px = p.x; n.py = p.y - hgt / 2;
      });
    });
    drag(stage, { axis: true,
      onStart() { bx = ox; by = oy },
      onMove(d) { ox = bx + d.x; oy = by + d.y },
      onEnd(d) { if (Math.hypot(d.x, d.y) < 6) {
        const now = performance.now();

        lastTap = now;
      } } });
    stage.addEventListener('pointerdown', e => {

      sel = best; haptic('success');
      info.innerHTML = `уровень <b style="color:${n.c}">${n.t.toUpperCase()}</b> ·
        ${n.s === 'done' ? 'пройден, можно переиграть' : n.s === 'cur' ? 'текущий' : 'доступен'}`;
      fx.ring({ x: n.px, y: n.py, r: 60, color: n.c, width: 1.8 });
    });
  }
});

/* 90 ---------------------------------------------------------------------

SA.register({

    box.append(t1, t2, sub); stage.appendChild(box);

      t += dt;

      g.clear();
      const rows = 26;
      for (let i = 0; i < rows; i++) {

/* 91 ---------------------------------------------------------------------
   Глобус ликвидности из частиц. База: scrolltide Particle Globe /
   aceternity 3D Globe. Смысл: объём торгов по биржам и часовым поясам.     */
SA.register({
  n: '91', title: 'Глобус ликвидности: сессии мира', group: 'ambient',
  hint: 'Вращай глобус — <b>подсветка активных сессий</b> и их доли',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const rnd = prng(3);
    const N = 420;
    const dots = Array.from({ length: N }, () => {
      const u = rnd() * 2 - 1, th = rnd() * SA.TAU, r = Math.sqrt(1 - u * u);
      return { x: r * Math.cos(th), y: u, z: r * Math.sin(th) };
    });
    const HUBS = [
      { t: 'АЗИЯ', lon: 1.9, lat: .4, v: 28, c: '#F59E0B' },
      { t: 'ЕВРОПА', lon: .1, lat: .85, v: 34, c: '#66B8FF' },
      { t: 'США', lon: -1.5, lat: .7, v: 38, c: '#4ADE80' },
    ].map(h => ({ ...h,
      x: Math.cos(h.lat) * Math.cos(h.lon), y: Math.sin(h.lat), z: Math.cos(h.lat) * Math.sin(h.lon) }));
    const info = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:10px;text-align:center;
      font-size:10px;color:#6E7D8F;z-index:2`, text: 'вращай: ликвидность не равномерна по суткам' });
    stage.appendChild(info);
    let ry = 0, rx = -.25, vry = .35, t = 0, base = 0, bx = 0;
    raf(dt => {
      t += dt; ry += vry * dt; vry *= .985; if (Math.abs(vry) < .3) vry = lerp(vry, .3, dt);
      g.clear();
      const cx = g.w / 2, cy = g.h / 2 - 8, R = Math.min(g.w, g.h) * .33;
      const rot = p => {
        const cosY = Math.cos(ry), sinY = Math.sin(ry), cosX = Math.cos(rx), sinX = Math.sin(rx);
        const x1 = p.x * cosY - p.z * sinY, z1 = p.x * sinY + p.z * cosY;
        const y2 = p.y * cosX - z1 * sinX, z2 = p.y * sinX + z1 * cosX;
        return { x: x1, y: y2, z: z2 };
      };
      // атмосфера
      const atm = g.x.createRadialGradient(cx, cy, R * .6, cx, cy, R * 1.25);
      atm.addColorStop(0, 'rgba(0,122,253,.12)'); atm.addColorStop(1, 'rgba(0,122,253,0)');
      g.x.fillStyle = atm; g.x.beginPath(); g.x.arc(cx, cy, R * 1.25, 0, SA.TAU); g.x.fill();
      dots.forEach(d => {
        const p = rot(d);
        const depth = (p.z + 1) / 2;
        const sx = cx + p.x * R, sy = cy + p.y * R;
        g.x.fillStyle = alpha('#66B8FF', .08 + depth * .5);
        g.x.beginPath(); g.x.arc(sx, sy, .6 + depth * 1.5, 0, SA.TAU); g.x.fill();
      });
      HUBS.forEach(h => {
        const p = rot(h);
        const depth = (p.z + 1) / 2;
        const sx = cx + p.x * R, sy = cy + p.y * R;
        if (p.z < -.1) return;
        const pulse = 1 + Math.sin(t * 3 + h.v) * .18;
        g.x.fillStyle = h.c; g.x.shadowColor = h.c; g.x.shadowBlur = 16 * depth;
        g.x.beginPath(); g.x.arc(sx, sy, (2.4 + h.v * .08) * pulse * (.5 + depth), 0, SA.TAU); g.x.fill();
        g.x.shadowBlur = 0;
        g.x.strokeStyle = alpha(h.c, .4 * depth); g.x.lineWidth = 1;
        g.x.beginPath(); g.x.arc(sx, sy, (10 + h.v * .22) * pulse, 0, SA.TAU); g.x.stroke();
        if (depth > .55) { g.x.fillStyle = alpha('#E6EDF3', depth);
          g.x.font = '700 9px ui-monospace,monospace'; g.x.textAlign = 'center';
          g.x.fillText(`${h.t} ${h.v}%`, sx, sy - 16) }
        h.sx = sx; h.sy = sy; h.depth = depth;
      });
      // терминатор дня/ночи
      g.x.strokeStyle = 'rgba(255,255,255,.07)'; g.x.lineWidth = 1;
      g.x.beginPath(); g.x.arc(cx, cy, R, 0, SA.TAU); g.x.stroke();
    });
    drag(stage, { axis: true,
      onStart() { base = ry; bx = rx; vry = 0 },
      onMove(d) { ry = base + d.x * .012; rx = clamp(bx + d.y * .008, -.9, .9) },
      onEnd(d) { vry = d.vx * .006; haptic('rigid') } });
    stage.addEventListener('pointerdown', e => {
      const p = local(stage, e);
      const h = HUBS.find(x => x.sx !== undefined && x.depth > .4 && Math.hypot(x.sx - p.x, x.sy - p.y) < 22);
      if (!h) return;
      haptic('medium'); fx.ring({ x: h.sx, y: h.sy, r: 70, color: h.c, width: 2 });
      info.innerHTML = `<b style="color:${h.c}">${h.t}</b> · ${h.v}% дневного объёма ·
        ${h.t === 'США' ? 'самые резкие движения на открытии' : h.t === 'ЕВРОПА' ? 'ложные пробои азиатского диапазона' : 'тонкая ликвидность, широкий спред'}`;
    });
  }
});

          text-shadow:0 0 18px ${alpha(it.c, .5)}">${it.i}</div>
        <div class="mono" style="position:absolute;left:8px;right:8px;top:78px;text-align:center;font-size:11px;

      scene.appendChild(c); return c;

      font-size:10px;color:#6E7D8F;z-index:3`, text: 'следующий шаг: ТРЕНАЖЁР ВХОДА' });
    stage.append(scene, cap);
    const P = new Spring(1, { stiff: 140, damp: 18 });
    let base = 0;

      const p = P.step(dt);
      cards.forEach((c, i) => {

        const ang = o * .52;                   // положение по дуге
        const x = Math.sin(ang) * 128;
        const y = (1 - Math.cos(ang)) * 86;
        const z = -Math.abs(o) * 90;
        const ax = Math.abs(o);
        c.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${z.toFixed(1)}px)

      onMove(d) { P.jump(clamp(base - d.x / 96, -.4, ITEMS.length - .6)) },

  }
});

/* 96 ---------------------------------------------------------------------

SA.register({

      <div class="mono" style="font-size:19px;font-weight:800;color:#fff;margin-top:4px">ТЕРПЕНИЕ · 00:41:12</div>
      <div class="mono" style="font-size:10.5px;color:#C7D3E1;margin-top:6px;line-height:1.5">
        Рынок не обязан давать вход каждый час. Пустой журнал лучше, чем журнал ошибок.</div>`;
    stage.appendChild(card);
    const SPOTS = [
      { c: '#0B5ED7', x: .25, y: .3, r: .55, sp: .22 },
      { c: '#1E9E6A', x: .75, y: .28, r: .5, sp: .17 },
      { c: '#7C3AED', x: .3, y: .78, r: .6, sp: .13 },
      { c: '#B45309', x: .8, y: .8, r: .45, sp: .19 },
    ];
    let t = 0, mx = .5, my = .5, gi = 0;
    raf(dt => {
      t += dt;
      g.clear();
      g.x.fillStyle = '#070A0E'; g.x.fillRect(0, 0, g.w, g.h);
      SPOTS.forEach((s, i) => {
        const px = (s.x + Math.sin(t * s.sp + i) * .08 + (mx - .5) * .06 * (i + 1) * .5) * g.w;
        const py = (s.y + Math.cos(t * s.sp * 1.3 + i) * .07 + (my - .5) * .05 * (i + 1) * .5) * g.h;
        const R = s.r * Math.max(g.w, g.h) * (.85 + Math.sin(t * .4 + i) * .08);
        const grd = g.x.createRadialGradient(px, py, 0, px, py, R);
        grd.addColorStop(0, alpha(s.c, .55)); grd.addColorStop(.55, alpha(s.c, .16)); grd.addColorStop(1, alpha(s.c, 0));
        g.x.fillStyle = grd; g.x.fillRect(0, 0, g.w, g.h);
      });
      // зерно перерисовываем раз в три кадра — дешевле и выглядит плёночно
      if ((gi++ % 3) === 0) {
        grain.clear();
        const step = 3;
        for (let y = 0; y < grain.h; y += step)
          for (let x = 0; x < grain.w; x += step) {
            const v = Math.random();
            if (v > .82) { grain.x.fillStyle = `rgba(255,255,255,${((v - .82) * .5).toFixed(3)})`;
              grain.x.fillRect(x, y, step, step) }
            else if (v < .07) { grain.x.fillStyle = `rgba(0,0,0,${((.07 - v) * .9).toFixed(3)})`;
              grain.x.fillRect(x, y, step, step) }
          }
      }
      card.style.transform = `translateY(-50%) translate(${((mx - .5) * -14).toFixed(1)}px,
        ${((my - .5) * -10).toFixed(1)}px) rotateX(${((my - .5) * -4).toFixed(2)}deg)
        rotateY(${((mx - .5) * 5).toFixed(2)}deg)`;
    });
    stage.addEventListener('pointermove', e => { const p = local(stage, e); mx = p.x / p.w; my = p.y / p.h });
    stage.addEventListener('pointerleave', () => { mx = my = .5 });
    stage.addEventListener('pointerdown', () => haptic('light'));
  }
});

SA.register({
  n: '99', title: 'Журнал: сортировка и спарклайны в строке', group: 'desk',
  hint: 'Тап по заголовку — <b>сортировка с перестановкой строк</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const rnd = prng(31);
    const DATA = ['Пробой уровня', 'Откат в зону', 'Снятие ликвидности', 'Разворот дивергенцией',
      'Новостной импульс', 'Контртренд'].map((t, i) => {
      const n = 8 + ((rnd() * 30) | 0);
      const wr = .3 + rnd() * .45;
      const exp = (wr * 2 - (1 - wr)) * (0.7 + rnd() * .6);
      const curve = []; let v = 0;
      for (let j = 0; j < 26; j++) { v += (rnd() - (wr > .5 ? .4 : .55)) * .4; curve.push(v) }
      return { t, n, wr, exp, curve };
    });
    const COLS = [['СЕТАП', 't'], ['N', 'n'], ['WR', 'wr'], ['ОЖИД.', 'exp']];
    const head = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;top:10px;display:flex;
      gap:6px;font-size:8.5px;color:#6E7D8F;z-index:2` });
    const body = el('div', { style: `position:absolute;left:10px;right:10px;top:30px;bottom:10px;display:flex;
      flex-direction:column;gap:5px` });
    stage.append(head, body);
    let sortKey = 'exp', asc = false;
    const nodes = new Map();
    DATA.forEach(d => {
      const n = el('div', { style: `display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:10px;
        background:#0E131A;border:1px solid #1A222C;will-change:transform` });
      const spark = el('div', { style: 'width:52px;height:20px;position:relative;flex:none' });
      n.innerHTML = `<span class="mono" style="flex:1;font-size:10.5px;color:#E6EDF3">${d.t}</span>
        <span class="mono n" style="width:22px;text-align:right;font-size:10px;color:#9FB0C2">${d.n}</span>
        <span class="mono wr" style="width:32px;text-align:right;font-size:10px">${Math.round(d.wr * 100)}%</span>
        <span class="mono ex" style="width:44px;text-align:right;font-size:10.5px;font-weight:700">${fmt.r(d.exp)}</span>`;
      n.insertBefore(spark, n.children[1]);
      n.querySelector('.wr').style.color = d.wr > .5 ? '#4ADE80' : '#F59E0B';
      n.querySelector('.ex').style.color = d.exp > 0 ? '#4ADE80' : '#FF4D4D';
      const sl = sparkline(spark, { color: d.exp > 0 ? '#4ADE80' : '#FF4D4D' });
      sl.set(d.curve); raf(() => sl.draw());
      body.appendChild(n); nodes.set(d, n);
    });
    function apply() {
      const sorted = [...DATA].sort((a, b) => {
        const va = a[sortKey], vb = b[sortKey];
        const c = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
        return asc ? c : -c;
      });
      flip([...body.children], () => sorted.forEach(d => body.appendChild(nodes.get(d))));
      [...head.children].forEach((h, i) => {
        const on = COLS[i][1] === sortKey;
        h.style.color = on ? '#E6EDF3' : '#6E7D8F';
        h.innerHTML = COLS[i][0] + (on ? (asc ? ' ↑' : ' ↓') : '');
      });
    }
    COLS.forEach(([label, key], i) => {
      const h = el('div', { class: 'mono', style: `cursor:pointer;${i === 0 ? 'flex:1' : 'width:' + (i === 1 ? 80 : i === 2 ? 32 : 44) + 'px;text-align:right'}`,
        text: label });
      h.addEventListener('click', () => { if (sortKey === key) asc = !asc; else { sortKey = key; asc = false }
        apply(); haptic('selection') });
      head.appendChild(h);
    });
    apply();
  }
});

/* 100 --------------------------------------------------------------------
   Тайм-машина сессии. База: spaceui timeline. Смысл: разобрать день
   по шагам — скраб по времени синхронизирует график и события.             */
SA.register({
  n: '100', title: 'Тайм-машина сессии: скраб по дню', group: 'desk',
  hint: 'Тяни время или жми ▶ — <b>график и события идут синхронно</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const bars = ohlc(96, { start: 64000, vol: 90, drift: 4, seed: 808 });
    const EVENTS = [
      { i: 12, t: 'открытие Европы', c: '#66B8FF' },
      { i: 31, t: 'вход по плану', c: '#4ADE80' },
      { i: 44, t: 'новость по ставке', c: '#F59E0B' },
      { i: 58, t: 'стоп в безубыток', c: '#A78BFA' },
      { i: 73, t: 'выход 2R', c: '#4ADE80' },
      { i: 88, t: 'импульсная сделка', c: '#FF4D4D' },
    ];
    const strip = el('div', { style: `position:absolute;left:10px;right:10px;bottom:34px;height:26px;border-radius:13px;
      background:#0E131A;border:1px solid #1C2430;touch-action:none;z-index:3` });
    const knob = el('div', { style: `position:absolute;top:3px;width:18px;height:18px;border-radius:9px;background:#fff;
      box-shadow:0 0 12px rgba(255,255,255,.4);left:3px` });
    strip.appendChild(knob);
    const play = el('div', { class: 'mono', style: `position:absolute;left:10px;bottom:7px;padding:4px 9px;border-radius:8px;
      background:#141C27;border:1px solid #27313E;color:#9FB0C2;font-size:10px;cursor:pointer;z-index:3`, text: '▶ ВОСПРОИЗВЕСТИ' });
    const info = el('div', { class: 'mono', style: `position:absolute;right:10px;bottom:9px;font-size:9.5px;color:#6E7D8F;z-index:3` });
    stage.append(strip, play, info);
    let pos = .34, playing = false;
    raf(dt => {
      if (playing) { pos += dt * .14; if (pos >= 1) { pos = 1; playing = false; play.textContent = '▶ ВОСПРОИЗВЕСТИ' } }
      g.clear(); g.grid(26);
      const n = Math.max(2, Math.round(pos * (bars.length - 1)));
      const seg = bars.slice(0, n + 1);
      const lo = Math.min(...seg.map(d => d.l)) - 40, hi = Math.max(...seg.map(d => d.h)) + 40;
      const X = scaleRaw(0, bars.length - 1, 10, g.w - 10), Y = scaleRaw(lo, hi, g.h - 74, 18);
      seg.forEach((d, i) => {
        const up = d.c >= d.o, w = (g.w - 20) / bars.length * .62;
        g.x.strokeStyle = up ? 'rgba(74,222,128,.85)' : 'rgba(255,77,77,.85)';
        g.x.fillStyle = g.x.strokeStyle; g.x.lineWidth = Math.max(1, w * .2);
        g.x.beginPath(); g.x.moveTo(X(i), Y(d.h)); g.x.lineTo(X(i), Y(d.l)); g.x.stroke();
        const a = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));
        g.x.fillRect(X(i) - w / 2, a, w, Math.max(1.2, b - a));
      });
      EVENTS.forEach(e => {
        if (e.i > n) return;
        const x = X(e.i);
        g.x.strokeStyle = alpha(e.c, .5); g.x.setLineDash([3, 4]); g.x.lineWidth = 1;
        g.x.beginPath(); g.x.moveTo(x, 14); g.x.lineTo(x, g.h - 74); g.x.stroke(); g.x.setLineDash([]);
        g.x.fillStyle = e.c; g.x.beginPath(); g.x.arc(x, 14, 3.4, 0, SA.TAU); g.x.fill();
        if (Math.abs(e.i - n) < 2) {
          g.x.fillStyle = e.c; g.x.font = '700 9px ui-monospace,monospace';
          g.x.textAlign = x > g.w * .6 ? 'right' : 'left';
          g.x.fillText(e.t, x + (x > g.w * .6 ? -6 : 6), 26);
        }
      });
      // курсор времени
      const cx = X(n);
      g.x.strokeStyle = 'rgba(255,255,255,.5)'; g.x.lineWidth = 1.4;
      g.x.beginPath(); g.x.moveTo(cx, 10); g.x.lineTo(cx, g.h - 74); g.x.stroke();
      knob.style.left = (3 + pos * ((strip.clientWidth || 200) - 24)) + 'px';
      const sec = 28800 + n * 600;
      const last = EVENTS.filter(e => e.i <= n).pop();
      info.innerHTML = `${clockHM(sec)} · ${last ? `<b style="color:${last.c}">${last.t}</b>` : 'до открытия'}`;
    });
    drag(strip, { axis: true, onMove(d) { const r = strip.getBoundingClientRect();
      pos = clamp((d.ex - r.left) / r.width); playing = false; play.textContent = '▶ ВОСПРОИЗВЕСТИ';
      if (Math.random() < .25) haptic('selection') }, onEnd() { haptic('rigid') } });
    play.addEventListener('click', () => {
      playing = !playing; if (playing && pos >= .999) pos = 0;
      play.textContent = playing ? '❚❚ ПАУЗА' : '▶ ВОСПРОИЗВЕСТИ'; haptic('medium');
      const r = stage.getBoundingClientRect();
      if (playing) fx.ring({ x: 40, y: r.height - 18, r: 40, color: '#66B8FF', width: 1.6 });
    });
  }
});

/* 101 --------------------------------------------------------------------
   Сравнение периодов. Смысл: прогресс видно не в абсолюте, а в дельте
   месяц к месяцу; шторка двигает «линию раздела» двух наборов метрик.      */

  n: '101', title: 'Месяц к месяцу: шторка сравнения', group: 'desk',
  hint: 'Тяни шторку — <b>метрики пересчитываются в дельты</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const M = [
      { t: 'Сделок', a: 86, b: 112, inv: true, f: v => v },
      { t: 'Винрейт', a: .41, b: .47, f: v => Math.round(v * 100) + '%' },
      { t: 'Средний R', a: .12, b: .34, f: v => fmt.r(v) },
      { t: 'Просадка', a: .114, b: .062, inv: true, f: v => (v * 100).toFixed(1) + '%' },
      { t: 'Нарушений', a: 19, b: 4, inv: true, f: v => v },
    ];
    const head = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;display:flex;
      justify-content:space-between;font-size:9px;color:#6E7D8F;z-index:3` });
    head.innerHTML = '<span>СЕНТЯБРЬ</span><span style="color:#39434F">ТЯНИ</span><span style="color:#4ADE80">ОКТЯБРЬ</span>';
    const list = el('div', { style: `position:absolute;left:12px;right:12px;top:30px;bottom:38px;display:flex;
      flex-direction:column;gap:6px` });
    const handle = el('div', { style: `position:absolute;top:26px;bottom:34px;width:30px;margin-left:-15px;left:50%;
      z-index:4;cursor:ew-resize;touch-action:none;display:grid;place-items:center` });
    handle.innerHTML = `<div style="position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.6)"></div>
      <div style="width:26px;height:26px;border-radius:13px;background:#0E131A;border:1.4px solid #fff;
        display:grid;place-items:center;color:#fff;font:700 10px ui-monospace,monospace">⇄</div>`;
    const sum = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;bottom:10px;text-align:center;
      font-size:10px;color:#9FB0C2;z-index:3` });
    stage.append(head, list, handle, sum);
    const rows = M.map(m => {
      const r = el('div', { style: `position:relative;flex:1;border-radius:10px;overflow:hidden;background:#0E131A;
        border:1px solid #1A222C;display:flex;align-items:center;padding:0 10px` });
      r.innerHTML = `<span class="mono" style="font-size:10.5px;color:#9FB0C2">${m.t}</span>
        <b class="mono v" style="margin-left:auto;font-size:12px;color:#E6EDF3"></b>
        <span class="mono d" style="margin-left:8px;font-size:9.5px"></span>`;
      list.appendChild(r); return r;
    });
    const S = new Spring(.5, { stiff: 170, damp: 20 });
    raf(dt => {
      const k = S.step(dt);
      handle.style.left = (k * 100) + '%';
      M.forEach((m, i) => {
        const v = lerp(m.a, m.b, k);
        const r = rows[i];
        r.querySelector('.v').textContent = m.f(v);
        const dPct = ((m.b - m.a) / (Math.abs(m.a) || 1)) * 100;
        const good = m.inv ? m.b < m.a : m.b > m.a;
        const d = r.querySelector('.d');
        d.textContent = (dPct >= 0 ? '+' : '') + dPct.toFixed(0) + '%';
        d.style.color = good ? '#4ADE80' : '#FF4D4D';
        d.style.opacity = String(clamp((k - .55) * 3));
        r.style.background = `linear-gradient(90deg, ${alpha('#66B8FF', .07)} ${k * 100}%, #0E131A ${k * 100}%)`;
      });
      sum.innerHTML = k > .5
        ? 'октябрь: <b style="color:#4ADE80">меньше сделок — больше результата</b>'
        : 'сентябрь: <span style="color:#F59E0B">много действий, мало смысла</span>';
    });
    drag(handle, { axis: true, onMove(d) { const r = stage.getBoundingClientRect();
      S.jump(clamp((d.ex - r.left) / r.width, .04, .96)); if (Math.random() < .2) haptic('selection') },
      onEnd() { S.set(S.v > .5 ? 1 : 0); haptic('rigid') } });
  }
});

/* 102 --------------------------------------------------------------------
   Тренажёр горячих клавиш. База: aceternity Keyboard + cmdk.
   Смысл: скорость исполнения — часть риск-менеджмента.                     */
SA.register({
  n: '102', title: 'Горячие клавиши: тренажёр скорости', group: 'desk',
  hint: 'Нажимай подсвеченные клавиши — <b>считается время реакции</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const fx = new FX(stage);
    const ROWS = [['Q', 'W', 'E', 'R'], ['A', 'S', 'D', 'F'], ['Z', 'X', 'C', 'V']];
    const ACT = { Q: 'лимит бид', W: 'лимит аск', E: 'закрыть 50%', R: 'закрыть всё',
      A: 'стоп в б/у', S: 'стоп −1R', D: 'удвоить стоп', F: 'скрин в журнал',
      Z: 'отмена всех', X: 'паника-выход', C: 'заметка', V: 'повтор сетапа' };
    const task = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;top:12px;text-align:center;
      font-size:11px;color:#9FB0C2;z-index:2` });
    const pad = el('div', { style: `position:absolute;left:12px;right:12px;top:48px;display:flex;flex-direction:column;
      gap:6px;z-index:2` });
    const stats = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;bottom:12px;text-align:center;
      font-size:9.5px;color:#6E7D8F;z-index:2`, text: 'среднее время реакции —' });
    stage.append(task, pad, stats);
    const keys = {};
    ROWS.forEach(row => {
      const r = el('div', { style: 'display:flex;gap:6px' });
      row.forEach(k => {
        const b = el('div', { class: 'mono', style: `flex:1;height:40px;border-radius:9px;display:grid;place-items:center;
          background:linear-gradient(180deg,#1A222C,#10161D);border:1px solid #27313E;color:#9FB0C2;font-size:12px;
          font-weight:700;cursor:pointer;transition:transform .08s,background .18s,border-color .18s;
          box-shadow:0 3px 0 #0A0E13`, text: k });
        b.addEventListener('pointerdown', () => press(k, b));
        r.appendChild(b); keys[k] = b;
      });
      pad.appendChild(r);
    });
    let target = null, t0 = 0, times = [], misses = 0;
    function next() {
      const all = Object.keys(ACT);
      target = all[(Math.random() * all.length) | 0];
      Object.entries(keys).forEach(([k, b]) => {
        const on = k === target;
        b.style.background = on ? 'linear-gradient(180deg,#1D4ED8,#0B3E99)' : 'linear-gradient(180deg,#1A222C,#10161D)';
        b.style.borderColor = on ? '#66B8FF' : '#27313E';
        b.style.color = on ? '#fff' : '#9FB0C2';
      });
      task.innerHTML = `выполни: <b style="color:#66B8FF">${ACT[target]}</b>`;
      t0 = performance.now();
    }
    function press(k, b) {
      b.style.transform = 'translateY(2px)';
      setTimeout(() => b.style.transform = '', 90);
      const r = stage.getBoundingClientRect();
      if (k === target) {
        const ms = performance.now() - t0; times.push(ms);
        haptic(ms < 700 ? 'success' : 'medium');
        fx.ring({ x: r.width / 2, y: r.height * .6, r: 70, color: ms < 700 ? '#4ADE80' : '#F59E0B', width: 1.8 });
        const avg = times.reduce((s, v) => s + v, 0) / times.length;
        stats.innerHTML = `реакция <b style="color:${ms < 700 ? '#4ADE80' : '#F59E0B'}">${Math.round(ms)} мс</b> ·
          среднее ${Math.round(avg)} мс · промахов ${misses}`;
        next();
      } else {
        misses++; haptic('error'); SA.shake(b, 4, .25);
        stats.innerHTML = `<span style="color:#FF4D4D">не та клавиша</span> · «${ACT[k]}» вместо «${ACT[target]}»`;
      }
    }
    window.addEventListener('keydown', e => { const k = e.key.toUpperCase(); if (keys[k]) press(k, keys[k]) });
    next();
  }
});

/* 104 --------------------------------------------------------------------
   Кольцо торговых сессий. Смысл: 24 часа как циферблат: где ликвидность,
   где твои лучшие и худшие сделки.                                         */
SA.register({
  n: '104', title: 'Кольцо суток: когда ты зарабатываешь', group: 'desk',
  hint: 'Веди по кольцу — <b>часовая статистика и сессии</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const rnd = prng(13);
    const HOURS = Array.from({ length: 24 }, (_, h) => {
      const sess = h >= 1 && h < 8 ? 0 : h >= 8 && h < 16 ? 1 : 2;
      const base = [.3, .75, 1][sess];
      const r = (rnd() - .42) * 2 * base;
      return { h, sess, vol: base * (.6 + rnd() * .6), r, n: 1 + ((rnd() * 9 * base) | 0) };
    });
    const SESS = [['АЗИЯ', '#F59E0B'], ['ЕВРОПА', '#66B8FF'], ['США', '#4ADE80']];
    const center = el('div', { class: 'mono', style: `position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;pointer-events:none;z-index:2;gap:2px` });
    center.innerHTML = `<div style="font-size:9px;letter-spacing:.14em;color:#6E7D8F">ЛУЧШИЙ ЧАС</div>
      <div class="hh" style="font-size:24px;font-weight:800;color:#4ADE80">—</div>
      <div class="ss" style="font-size:9px;color:#55687C">—</div>`;
    const legend = el('div', { class: 'mono', style: `position:absolute;left:0;right:0;bottom:10px;display:flex;
      gap:10px;justify-content:center;font-size:8.5px;z-index:2` });
    SESS.forEach(([t, c]) => legend.appendChild(el('span', { style: `color:${c}`, html:
      `<span style="display:inline-block;width:6px;height:6px;border-radius:3px;background:${c};margin-right:4px"></span>${t}` })));
    stage.append(center, legend);
    const best = HOURS.reduce((m, x) => x.r > m.r ? x : m, HOURS[0]);
    let hover = -1, t = 0;
    raf(dt => {
      t += dt; g.clear();
      const cx = g.w / 2, cy = g.h / 2 - 8, R = Math.min(g.w, g.h) * .34;
      HOURS.forEach((x, i) => {
        const a0 = -Math.PI / 2 + (i / 24) * SA.TAU + .012, a1 = a0 + SA.TAU / 24 - .024;
        const len = 14 + x.vol * 34;
        const act = hover === i;
        SA.arcSeg(g.x, cx, cy, R, R + len * (act ? 1.12 : 1), a0, a1);
        const col = x.r > 0 ? mix('#15351F', '#4ADE80', clamp(x.r)) : mix('#3A1A1D', '#FF4D4D', clamp(-x.r));
        g.x.fillStyle = act ? '#fff' : col;
        if (act) { g.x.shadowColor = '#fff'; g.x.shadowBlur = 14 }
        g.x.fill(); g.x.shadowBlur = 0;
        // кольцо сессии
        SA.arcSeg(g.x, cx, cy, R - 9, R - 3, a0, a1);
        g.x.fillStyle = alpha(SESS[x.sess][1], .55); g.x.fill();
      });
      // стрелка «сейчас»
      const now = (t * .12) % 24;
      const na = -Math.PI / 2 + (now / 24) * SA.TAU;
      g.x.strokeStyle = 'rgba(255,255,255,.65)'; g.x.lineWidth = 1.4;
      g.x.beginPath(); g.x.moveTo(cx + Math.cos(na) * (R - 14), cy + Math.sin(na) * (R - 14));
      g.x.lineTo(cx + Math.cos(na) * (R + 52), cy + Math.sin(na) * (R + 52)); g.x.stroke();
      const show = hover >= 0 ? HOURS[hover] : best;
      center.querySelector('.hh').textContent = String(show.h).padStart(2, '0') + ':00';
      center.querySelector('.hh').style.color = show.r > 0 ? '#4ADE80' : '#FF4D4D';
      center.querySelector('.ss').innerHTML = `${SESS[show.sess][0]} · ${show.n} сделок · ${fmt.r(show.r)}`;
      g.cx = cx; g.cy = cy; g.R = R;
    });
    const at = e => { const p = local(stage, e);
      const d = Math.hypot(p.x - g.cx, p.y - g.cy);
      if (d < g.R - 12 || d > g.R + 60) return -1;
      let a = Math.atan2(p.y - g.cy, p.x - g.cx) + Math.PI / 2; if (a < 0) a += SA.TAU;
      return Math.floor(a / (SA.TAU / 24)) % 24 };
    stage.addEventListener('pointermove', e => { const i = at(e); if (i !== hover) { hover = i; if (i >= 0) haptic('selection') } });
    stage.addEventListener('pointerleave', () => hover = -1);
    stage.addEventListener('pointerdown', e => { const i = at(e); if (i < 0) return;
      haptic('medium'); const x = HOURS[i];
      fx.ring({ x: g.cx, y: g.cy, r: g.R + 60, color: x.r > 0 ? '#4ADE80' : '#FF4D4D', width: 1.8 }) });
  }
});
})();

/* 105 --------------------------------------------------------------------

SA.register({
  n: '105', title: 'Квиз по графику: ответ за 8 секунд', group: 'drill',
  hint: 'Выбери вариант до истечения кольца — <b>затем разбор ответа</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const Q = [
      { seed: 12, regime: 'squeeze', q: 'Что делает рынок?',
        a: ['Сжатие перед импульсом', 'Разворот тренда', 'Устойчивый тренд', 'Паническая распродажа'], ok: 0,
        why: 'Диапазон сужается, объём падает — это сжатие. Торгуется выход, а не середина.' },
      { seed: 44, regime: 'trend', q: 'Где рабочая гипотеза?',

        why: 'Серия повышающихся минимумов. Работа от откатов по направлению, а не против.' },
      { seed: 71, regime: 'range', q: 'Как действовать?',
        a: ['Пробой по рынку', 'Ждать края диапазона', 'Усреднять', 'Увеличить плечо'], ok: 1,
        why: 'В диапазоне деньги на краях. Пробой по рынку в середине — донат маркетмейкеру.' },
    ];
    let qi = 0, chosen = -1, left = 8, running = true;
    const title = el('div', { class: 'mono', style: `position:absolute;left:12px;top:10px;font-size:11px;
      color:#E6EDF3;z-index:3;font-weight:700` });
    const ringBox = el('div', { style: 'position:absolute;right:10px;top:8px;width:34px;height:34px;z-index:3' });
    const rg = canvas(ringBox);
    const opts = el('div', { style: `position:absolute;left:10px;right:10px;bottom:10px;display:grid;
      grid-template-columns:1fr 1fr;gap:6px;z-index:3` });
    const why = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:84px;font-size:10px;
      line-height:1.5;color:#9FB0C2;background:rgba(7,9,13,.9);border:1px solid #1C2430;border-radius:10px;
      padding:8px 9px;opacity:0;transition:.3s;z-index:4` });
    stage.append(title, ringBox, opts, why);
    let data = [];
    function load() {
      const q = Q[qi];
      data = ohlc(44, { start: 100, vol: 1.3, drift: .06, seed: q.seed, regime: q.regime });
      title.textContent = q.q;
      chosen = -1; left = 8; running = true; why.style.opacity = '0';
      opts.innerHTML = '';

        const b = el('div', { class: 'mono', style: `padding:9px 8px;border-radius:10px;font-size:10px;cursor:pointer;
          background:#0E131A;border:1px solid #1C2430;color:#9FB0C2;text-align:center;transition:.2s`, text: txt });
        b.addEventListener('click', () => answer(i, b));
        opts.appendChild(b);
      });
    }
    function answer(i, node) {
      if (!running) return;
      running = false; chosen = i;
      const q = Q[qi], good = i === q.ok;
      [...opts.children].forEach((b, j) => {
        if (j === q.ok) { b.style.borderColor = '#4ADE80'; b.style.background = alpha('#4ADE80', .14); b.style.color = '#4ADE80' }
        else if (j === i) { b.style.borderColor = '#FF4D4D'; b.style.background = alpha('#FF4D4D', .12); b.style.color = '#FF8A8A' }
        else b.style.opacity = '.45';
      });
      why.innerHTML = `${good ? '<b style="color:#4ADE80">ВЕРНО</b>' : '<b style="color:#FF4D4D">МИМО</b>'} · ${q.why}`;
      why.style.opacity = '1';
      haptic(good ? 'success' : 'error');
      const r = stage.getBoundingClientRect();
      if (good) confetti(fx, { x: r.width / 2, y: r.height * .4, n: 40 });
      else SA.shake(stage, 6, .35);
      setTimeout(() => { qi = (qi + 1) % Q.length; load() }, 2600);
    }
    load();
    raf(dt => {
      if (running) { left -= dt; if (left <= 0) { left = 0; answer(-1, null) } }
      g.clear(); g.grid(26);
      const lo = Math.min(...data.map(d => d.l)) - 1, hi = Math.max(...data.map(d => d.h)) + 1;
      const X = scaleRaw(0, data.length - 1, 12, g.w - 12), Y = scaleRaw(lo, hi, g.h - 104, 36);
      data.forEach((d, i) => {
        const up = d.c >= d.o, w = (g.w - 24) / data.length * .6;
        g.x.strokeStyle = up ? 'rgba(74,222,128,.9)' : 'rgba(255,77,77,.9)';
        g.x.fillStyle = g.x.strokeStyle; g.x.lineWidth = Math.max(1, w * .18);
        g.x.beginPath(); g.x.moveTo(X(i), Y(d.h)); g.x.lineTo(X(i), Y(d.l)); g.x.stroke();
        const a = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));
        g.x.fillRect(X(i) - w / 2, a, w, Math.max(1.4, b - a));

      rg.clear();
      const k = left / 8;
      gauge(rg.x, rg.w / 2, rg.h / 2, 13, k, { color: k > .4 ? '#66B8FF' : '#FF4D4D', width: 3.4, from: -Math.PI / 2, span: SA.TAU });
      rg.x.fillStyle = k > .4 ? '#E6EDF3' : '#FF4D4D'; rg.x.font = '700 11px ui-monospace,monospace';
      rg.x.textAlign = 'center'; rg.x.textBaseline = 'middle';

  }

/* 107 --------------------------------------------------------------------
   «Угадай продолжение». Смысл: калибровка уверенности — ученик ставит
   прогноз и видит реальный исход, а также свою статистику попаданий.       */
SA.register({
  n: '107', title: 'Угадай продолжение и проверь калибровку', group: 'drill',
  hint: 'Тяни стрелку прогноза, жми «проверить» — <b>раскрывается будущее</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    let seed = 5, hist = [], future = [], guess = 0, reveal = 0, tries = 0, hits = 0;
    function deal() {
      seed += 7;
      const all = ohlc(58, { start: 100, vol: 1.3, drift: rand(.14, -.07), seed });
      hist = all.slice(0, 40).map(d => d.c); future = all.slice(40).map(d => d.c);
      guess = 0; reveal = 0;
    }
    deal();
    const btn = el('div', { class: 'mono', style: `position:absolute;left:50%;transform:translateX(-50%);bottom:12px;
      padding:9px 16px;border-radius:11px;background:linear-gradient(180deg,#1D4ED8,#0B3E99);color:#fff;
      font-size:10.5px;font-weight:800;cursor:pointer;z-index:3`, text: 'ПРОВЕРИТЬ' });
    const score = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;color:#6E7D8F;z-index:3` });
    stage.append(btn, score);
    raf(dt => {
      if (reveal > 0 && reveal < 1) reveal = Math.min(1, reveal + dt * 1.2);
      g.clear(); g.grid(26);
      const all = hist.concat(future);
      const lo = Math.min(...all) - 2, hi = Math.max(...all) + 2;
      const X = scaleRaw(0, all.length - 1, 10, g.w - 10), Y = scaleRaw(lo, hi, g.h - 44, 24);
      g.glowLine(hist.map((v, i) => ({ x: X(i), y: Y(v) })), { color: '#66B8FF', width: 2.2, blur: 12 });
      const last = hist[hist.length - 1], lx = X(hist.length - 1), ly = Y(last);
      // стрелка прогноза
      const gy = ly - guess;
      g.x.strokeStyle = guess > 0 ? '#4ADE80' : guess < 0 ? '#FF4D4D' : '#9FB0C2';
      g.x.setLineDash([5, 4]); g.x.lineWidth = 2;
      g.x.beginPath(); g.x.moveTo(lx, ly); g.x.lineTo(X(all.length - 1), gy); g.x.stroke(); g.x.setLineDash([]);
      g.x.fillStyle = g.x.strokeStyle;
      g.x.beginPath(); g.x.arc(X(all.length - 1), gy, 6, 0, SA.TAU); g.x.fill();
      g.x.fillStyle = '#07090D'; g.x.font = '700 9px ui-monospace,monospace';
      g.x.textAlign = 'center'; g.x.textBaseline = 'middle'; g.x.fillText('⇕', X(all.length - 1), gy + .5);
      if (reveal > 0) {
        const n = Math.max(2, Math.floor(future.length * ease.out(reveal)));
        const pts = [{ x: lx, y: ly }].concat(future.slice(0, n).map((v, i) => ({ x: X(hist.length + i), y: Y(v) })));
        g.glowLine(pts, { color: '#FFD166', width: 2.4, blur: 14 });
      }
      score.innerHTML = `ПОПАДАНИЙ <b style="color:#E6EDF3">${hits}/${tries}</b> ·
        <span style="color:#39434F">направление важнее уровня</span>`;
    });
    drag(stage, { axis: true, onMove(d) { if (reveal) return;
      const p = local(stage, { clientX: d.ex, clientY: d.ey });
      guess = clamp((p.h / 2 - p.y) * 1.4, -70, 70); if (Math.random() < .2) haptic('selection') } });
    btn.addEventListener('click', () => {
      if (reveal) { deal(); btn.textContent = 'ПРОВЕРИТЬ'; haptic('light'); return }
      reveal = .001; tries++;
      const realUp = future[future.length - 1] > hist[hist.length - 1];
      const guessUp = guess > 0;
      const ok = realUp === guessUp && Math.abs(guess) > 4;
      if (ok) { hits++; haptic('success');
        const r = stage.getBoundingClientRect(); confetti(fx, { x: r.width / 2, y: r.height * .4, n: 36 }) }
      else haptic('error');
      btn.textContent = ok ? 'ВЕРНО · ДАЛЬШЕ' : 'МИМО · ДАЛЬШЕ';
    });
  }
});

/* 108 --------------------------------------------------------------------
   Ранжирование рисков. Смысл: расставить угрозы по убыванию ущерба —
   тренировка приоритетов, а не запоминания списка.                        */
SA.register({
  n: '108', title: 'Расставь риски по тяжести', group: 'drill',
  hint: 'Перетаскивай строки — <b>порядок проверяется кнопкой</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const RISK = [
      { t: 'Торговля без стопа', w: 5 },
      { t: 'Усреднение убытка', w: 4 },

/* 109 --------------------------------------------------------------------
   Чек-лист входа с физическим подтверждением. Смысл: кнопка «купить»

  hint: 'Отметь все пункты — <b>появится свайп-подтверждение сделки</b>',

    const fx = new FX(stage);
    const ITEMS = [
      'Старший ТФ согласен с направлением',
      'Цена в зоне, а не «где-то рядом»',
      'Есть триггер подтверждения',
      'Стоп за структурой, риск ≤ 1%',
      'Цель даёт минимум 2R',
    ];
    const list = el('div', { style: `position:absolute;left:10px;right:10px;top:12px;bottom:70px;display:flex;
      flex-direction:column;gap:6px` });
    const slot = el('div', { style: `position:absolute;left:10px;right:10px;bottom:12px;height:48px;border-radius:24px;
      background:#0C1118;border:1px solid #1F2834;overflow:hidden;opacity:.35;transition:opacity .35s;
      touch-action:none` });
    const track = el('div', { class: 'mono', style: `position:absolute;inset:0;display:grid;place-items:center;

    const knob = el('div', { style: `position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:20px;
      background:linear-gradient(180deg,#2A3647,#16202B);border:1px solid #39465A;display:grid;place-items:center;
      color:#9FB0C2;font-size:15px;will-change:transform`, text: '→' });
    slot.append(track, knob); stage.append(list, slot);
    let done = 0;
    ITEMS.forEach(t => {
      const row = el('div', { class: 'mono', style: `flex:1;display:flex;align-items:center;gap:9px;padding:0 10px;

      row.append(box, el('span', { text: t }));

        box.textContent = on ? '✓' : '';

        row.style.color = on ? '#E6EDF3' : '#9FB0C2';

/* 110 --------------------------------------------------------------------
   Нарисуй зону. Смысл: зона — это прямоугольник реакции, а не линия.
   Система оценивает попадание по касаниям и ширине.                        */
SA.register({
  n: '110', title: 'Нарисуй зону спроса и получи оценку', group: 'drill',
  hint: 'Протяни прямоугольник по экстремумам — <b>оценка по касаниям</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const data = ohlc(48, { start: 100, vol: 1.2, drift: .02, seed: 303, regime: 'range' });
    const verdict = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;z-index:3;
      background:rgba(7,9,13,.82);border:1px solid #1C2430;border-radius:9px;padding:6px 9px`,
      text: 'ПРОТЯНИ ЗОНУ ПО НИЖНИМ ХВОСТАМ' });
    stage.appendChild(verdict);
    const lo = Math.min(...data.map(d => d.l)) - 1, hi = Math.max(...data.map(d => d.h)) + 1;
    let box = null, start = null;
    raf(() => {
      g.clear(); g.grid(26);
      const X = scaleRaw(0, data.length - 1, 12, g.w - 12), Y = scaleRaw(lo, hi, g.h - 16, 34);
      data.forEach((d, i) => {
        const up = d.c >= d.o, w = (g.w - 24) / data.length * .6;
        g.x.strokeStyle = up ? 'rgba(74,222,128,.78)' : 'rgba(255,77,77,.78)';
        g.x.fillStyle = g.x.strokeStyle; g.x.lineWidth = Math.max(1, w * .18);
        g.x.beginPath(); g.x.moveTo(X(i), Y(d.h)); g.x.lineTo(X(i), Y(d.l)); g.x.stroke();
        const a = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));
        g.x.fillRect(X(i) - w / 2, a, w, Math.max(1.3, b - a));
      });
      if (box) {
        const col = box.score >= 3 ? '#4ADE80' : '#66B8FF';
        g.x.fillStyle = alpha(col, .14); g.x.fillRect(0, box.y0, g.w, box.y1 - box.y0);
        g.x.strokeStyle = col; g.x.lineWidth = 1.6;
        g.x.beginPath(); g.x.moveTo(0, box.y0); g.x.lineTo(g.w, box.y0);
        g.x.moveTo(0, box.y1); g.x.lineTo(g.w, box.y1); g.x.stroke();
        (box.touch || []).forEach(p => { g.x.strokeStyle = '#FFD166'; g.x.lineWidth = 1.8;
          g.x.beginPath(); g.x.arc(p.x, p.y, 7, 0, SA.TAU); g.x.stroke() });
      }
      g.X = X; g.Y = Y;
    });
    function evaluate() {
      const touch = [];
      data.forEach((d, i) => { const y = g.Y(d.l);
        if (y >= box.y0 - 2 && y <= box.y1 + 2) touch.push({ x: g.X(i), y }) });
      const h = box.y1 - box.y0;
      box.touch = touch; box.score = touch.length;
      const tooWide = h > 60;
      verdict.innerHTML = touch.length >= 3 && !tooWide
        ? `<span style="color:#4ADE80">ЗОНА РАБОЧАЯ</span> · касаний ${touch.length}, ширина ${Math.round(h)} px`
        : tooWide ? '<span style="color:#F59E0B">СЛИШКОМ ШИРОКО</span> · «зона» размером с полрынка ничего не значит'
                  : `<span style="color:#F59E0B">МАЛО КАСАНИЙ</span> · ${touch.length}, нужно ≥ 3`;
      haptic(touch.length >= 3 && !tooWide ? 'success' : 'warning');
      if (touch.length >= 3 && !tooWide)
        touch.forEach((p, i) => setTimeout(() => fx.ring({ x: p.x, y: p.y, r: 44, color: '#FFD166', width: 1.8 }), i * 90));
    }
    drag(stage, { axis: true,
      onStart(d) { const p = local(stage, { clientX: d.ex, clientY: d.ey }); start = p.y;
        box = { y0: p.y, y1: p.y, touch: [], score: 0 }; haptic('light') },
      onMove(d) { if (!box) return; const p = local(stage, { clientX: d.ex, clientY: d.ey });
        box.y0 = Math.min(start, p.y); box.y1 = Math.max(start, p.y) },
      onEnd() { if (box && box.y1 - box.y0 > 6) evaluate();
        else { box = null; verdict.textContent = 'ПРОТЯНИ ЗОНУ ПО НИЖНИМ ХВОСТАМ' } } });
  }
});

/* 111 --------------------------------------------------------------------
   Симулятор типов ордеров. Смысл: один и тот же план с разными ордерами
   даёт разный результат — это видно на симуляции исполнения.               */
SA.register({
  n: '111', title: 'Маркет, лимит, стоп-лимит: симуляция', group: 'drill',
  hint: 'Выбери тип ордера — <b>симуляция покажет исполнение</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const base = ohlc(34, { start: 100, vol: 1.1, drift: .05, seed: 616 }).map(d => d.c);
    const TYPES = [
      { t: 'МАРКЕТ', c: '#FF4D4D', desc: 'исполнение мгновенное, цена — какая есть',
        sim: p => ({ fill: true, price: p + .22, slip: .22, miss: false }) },
      { t: 'ЛИМИТ', c: '#4ADE80', desc: 'цена твоя, но сделка может не состояться',
        sim: p => { const hit = Math.random() < .55; return { fill: hit, price: p - .18, slip: -.18, miss: !hit } } },
      { t: 'СТОП-ЛИМИТ', c: '#A78BFA', desc: 'вход по подтверждению, но с риском гэпа',
        sim: p => { const gap = Math.random() < .25; return { fill: !gap, price: p + .12, slip: .12, miss: gap } } },
    ];
    const row = el('div', { style: `position:absolute;left:10px;right:10px;bottom:48px;display:flex;gap:6px;z-index:3` });
    const out = el('div', { class: 'mono', style: `position:absolute;left:10px;right:10px;bottom:10px;text-align:center;
      font-size:10px;color:#6E7D8F;z-index:3`, text: 'выбери тип ордера и смотри исполнение' });
    stage.append(row, out);
    let res = null, t = 0, anim = 0;
    TYPES.forEach(ty => {
      const b = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:9px 4px;border-radius:10px;
        font-size:10px;font-weight:700;cursor:pointer;background:${alpha(ty.c, .1)};
        border:1px solid ${alpha(ty.c, .4)};color:${ty.c}`, text: ty.t });
      b.addEventListener('click', () => {
        const p = base[base.length - 1];
        res = { ...ty.sim(p), ty }; anim = 0; haptic(res.miss ? 'error' : 'success');
        const r = stage.getBoundingClientRect();
        if (res.miss) { fx.emit({ x: r.width * .8, y: r.height / 2, n: 14, color: '#FF4D4D', speed: 180, life: .6, size: 2.6 }) }
        else { fx.ring({ x: r.width * .8, y: r.height / 2, r: 70, color: ty.c, width: 2 }) }
        out.innerHTML = res.miss
          ? `<b style="color:#FF4D4D">НЕ ИСПОЛНЕН</b> · ${ty.desc}`
          : `<b style="color:${ty.c}">ИСПОЛНЕН ${res.price.toFixed(2)}</b> · проскальзывание ${res.slip > 0 ? '+' : ''}${res.slip.toFixed(2)} · ${ty.desc}`;
      });
      row.appendChild(b);
    });
    raf(dt => {
      t += dt; anim = Math.min(1, anim + dt * 1.2);
      g.clear(); g.grid(26);
      const lo = Math.min(...base) - 1.5, hi = Math.max(...base) + 1.5;
      const X = scaleRaw(0, base.length + 6, 10, g.w - 10), Y = scaleRaw(lo, hi, g.h - 94, 20);
      g.glowLine(base.map((v, i) => ({ x: X(i), y: Y(v) })), { color: '#66B8FF', width: 2.2, blur: 12 });
      const lx = X(base.length - 1), ly = Y(base[base.length - 1]);
      g.x.strokeStyle = 'rgba(255,255,255,.25)'; g.x.setLineDash([4, 4]);
      g.x.beginPath(); g.x.moveTo(0, ly); g.x.lineTo(g.w, ly); g.x.stroke(); g.x.setLineDash([]);
      if (res) {
        const px = lerp(lx, X(base.length + 4), ease.out(anim));
        const py = Y(res.price);
        if (res.miss) {
          g.x.strokeStyle = '#FF4D4D'; g.x.lineWidth = 2;
          g.x.beginPath(); g.x.moveTo(px - 6, py - 6); g.x.lineTo(px + 6, py + 6);
          g.x.moveTo(px + 6, py - 6); g.x.lineTo(px - 6, py + 6); g.x.stroke();
        } else {
          g.x.fillStyle = res.ty.c; g.x.shadowColor = res.ty.c; g.x.shadowBlur = 14;
          g.x.beginPath(); g.x.arc(px, py, 5.5, 0, SA.TAU); g.x.fill(); g.x.shadowBlur = 0;
          g.x.strokeStyle = alpha(res.ty.c, .5); g.x.setLineDash([3, 3]);
          g.x.beginPath(); g.x.moveTo(px, ly); g.x.lineTo(px, py); g.x.stroke(); g.x.setLineDash([]);
        }
      }
    });
  }
});

/* 112 --------------------------------------------------------------------
   Найди ошибки в сделке. Смысл: разбор чужой сделки — самый быстрый
   способ научиться видеть свои. Три «горячие точки» на скриншоте.          */
SA.register({
  n: '112', title: 'Найди три ошибки в чужой сделке', group: 'drill',

  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const data = ohlc(40, { start: 100, vol: 1.5, drift: -.05, seed: 909 });

      { rx: .22, ry: .28, t: 'Вход против старшего тренда', found: false },
      { rx: .62, ry: .74, t: 'Стоп внутри шума — выбило', found: false },

      flex-direction:column;gap:4px;z-index:3;font-size:9.5px` });
    const head = el('div', { class: 'mono', style: `position:absolute;left:10px;top:8px;font-size:9.5px;color:#6E7D8F;z-index:3`,
      text: 'НАЙДЕНО 0 ИЗ 3' });
    stage.append(head, list);
    const lo = Math.min(...data.map(d => d.l)) - 1, hi = Math.max(...data.map(d => d.h)) + 1;
    let t = 0;
    raf(dt => {
      t += dt; g.clear(); g.grid(26);
      const X = scaleRaw(0, data.length - 1, 12, g.w - 12), Y = scaleRaw(lo, hi, g.h - 74, 26);
      data.forEach((d, i) => {
        const up = d.c >= d.o, w = (g.w - 24) / data.length * .6;
        g.x.strokeStyle = up ? 'rgba(74,222,128,.75)' : 'rgba(255,77,77,.75)';
        g.x.fillStyle = g.x.strokeStyle; g.x.lineWidth = Math.max(1, w * .18);
        g.x.beginPath(); g.x.moveTo(X(i), Y(d.h)); g.x.lineTo(X(i), Y(d.l)); g.x.stroke();
        const a = Y(Math.max(d.o, d.c)), b = Y(Math.min(d.o, d.c));
        g.x.fillRect(X(i) - w / 2, a, w, Math.max(1.3, b - a));
      });
      SPOTS.forEach(s => {
        s.px = s.rx * g.w; s.py = 26 + s.ry * (g.h - 100);
        const pulse = 1 + Math.sin(t * 2.6) * .12;
        g.x.strokeStyle = s.found ? '#FF4D4D' : 'rgba(255,255,255,.12)';
        g.x.lineWidth = s.found ? 2 : 1;
        g.x.beginPath(); g.x.arc(s.px, s.py, (s.found ? 16 : 14) * (s.found ? 1 : pulse), 0, SA.TAU); g.x.stroke();
        if (s.found) { g.x.fillStyle = alpha('#FF4D4D', .18); g.x.fill();
          g.x.fillStyle = '#FF8A8A'; g.x.font = '700 11px ui-monospace,monospace';
          g.x.textAlign = 'center'; g.x.textBaseline = 'middle'; g.x.fillText('!', s.px, s.py) }
      });
    });
    stage.addEventListener('pointerdown', e => {
      const p = local(stage, e);
      const s = SPOTS.find(x => !x.found && Math.hypot(x.px - p.x, x.py - p.y) < 26);
      if (!s) { haptic('light'); fx.ring({ x: p.x, y: p.y, r: 36, color: 'rgba(255,255,255,.3)', width: 1.2 }); return }
      s.found = true; haptic('success');
      fx.ring({ x: s.px, y: s.py, r: 64, color: '#FF4D4D', width: 2 });
      const row = el('div', { style: `padding:5px 8px;border-radius:8px;background:${alpha('#FF4D4D', .1)};
        border:1px solid ${alpha('#FF4D4D', .35)};color:#FF8A8A;animation:sa-pop .26s both`, text: '• ' + s.t });

      if (n === 3) { const r = stage.getBoundingClientRect();
        confetti(fx, { x: r.width / 2, y: r.height * .35, n: 46 });
        head.innerHTML = '<b style="color:#4ADE80">ВСЕ ОШИБКИ НАЙДЕНЫ</b> · теперь найди их в своём журнале' }
    });
  }
});
})();

/* ============================================================================
   ГРУППА 15 — СОЦИАЛЬНОЕ И МОНЕТИЗАЦИЯ (113–120).
   Разбор: getlayers и vantaui (пейволлы и ценностные экраны), spaceui
   (avatars stack, activity heatmap), magicui (animated list, confetti),
   motion-primitives (transition panel), obsidianui (карточки профиля).

   Правило группы: никакой лжи в цифрах — то, что показано, реально считается.
   ========================================================================== */
(() => {
const { el, raf, Spring, haptic, clamp, lerp, rand, randi, pick, ease, drag, swipe, FX, canvas,
        local, rr, alpha, mix, prng, fmt, scaleRaw, ohlc, confetti, flip, sortable, longPress,
        sparkline, odometer, heat, heatRisk, clockHM, gauge, pill, chroma } = SA;

/* 113 --------------------------------------------------------------------
   Лидерборд недели. Смысл: позиция меняется в реальном времени, и это
   видно физически — строки переезжают, а не перерисовываются.              */
SA.register({
  n: '113', title: 'Лига: строки переезжают вживую', group: 'social',
  hint: 'Жми «тик недели» — <b>места меняются с FLIP-перестановкой</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');

        <span class="dl" style="width:26px;text-align:right;font-size:9px;color:#39434F"></span>`;
      host.appendChild(n); nodes.set(p, n);

      const sorted = [...P].sort((a, b) => b.xp - a.xp);

});

/* 116 --------------------------------------------------------------------
   Реферальная цепочка. Смысл: приглашения как живой граф — узлы растут
   на пружинах, линии тянутся, счётчик бонуса растёт вместе с сетью.        */
SA.register({
  n: '116', title: 'Рефералы: живой граф приглашений', group: 'social',
  hint: 'Жми «пригласить» — <b>сеть растёт, бонус считается</b>',
  tags: ['interaction', 'animation', 'vfx'],
  build(stage) {
    stage.classList.add('tall');
    const g = canvas(stage), fx = new FX(stage);
    const nodes = [{ x: .5, y: .5, r: 16, lvl: 0, p: null, s: new Spring(1, { stiff: 140, damp: 14 }) }];
    const btn = el('div', { class: 'mono', style: `position:absolute;left:50%;transform:translateX(-50%);bottom:10px;
      padding:9px 16px;border-radius:11px;background:linear-gradient(180deg,#1D4ED8,#0B3E99);color:#fff;
      font-size:10.5px;font-weight:800;cursor:pointer;z-index:3`, text: '+ ПРИГЛАСИТЬ' });
    const info = el('div', { class: 'mono', style: `position:absolute;left:10px;top:9px;font-size:9.5px;color:#6E7D8F;z-index:3` });
    stage.append(btn, info);
    let t = 0;
    const COL = ['#66B8FF', '#4ADE80', '#A78BFA', '#F59E0B'];
    function add() {
      const parents = nodes.filter(n => n.lvl < 2);
      const p = parents[(Math.random() * parents.length) | 0];
      const a = rand(SA.TAU, 0), d = .16 + Math.random() * .1;
      const n = { x: clamp(p.x + Math.cos(a) * d, .1, .9), y: clamp(p.y + Math.sin(a) * d * .8, .14, .86),
        r: 13 - p.lvl * 2.4, lvl: p.lvl + 1, p, s: new Spring(0, { stiff: 190, damp: 12 }) };
      n.s.set(1); nodes.push(n);
      haptic('light');
      fx.ring({ x: n.x * g.w, y: n.y * g.h, r: 38, color: COL[n.lvl % 4], width: 1.5 });
      if (nodes.length % 5 === 0) { const r = stage.getBoundingClientRect();
        confetti(fx, { x: r.width / 2, y: r.height * .4, n: 24 }); haptic('success') }
    }
    btn.addEventListener('click', add);
    for (let i = 0; i < 4; i++) setTimeout(add, 260 + i * 180);
    raf(dt => {
      t += dt; g.clear();
      nodes.forEach(n => { n.s.step(dt);
        n.px = n.x * g.w + Math.sin(t * .8 + n.x * 9) * 2.4;
        n.py = n.y * g.h + Math.cos(t * .7 + n.y * 11) * 2.4 });
      nodes.forEach(n => { if (!n.p) return;
        const k = clamp(n.s.v);
        g.x.strokeStyle = alpha(COL[n.lvl % 4], .35 * k); g.x.lineWidth = 1.2;
        g.x.beginPath(); g.x.moveTo(n.p.px, n.p.py);
        g.x.lineTo(lerp(n.p.px, n.px, k), lerp(n.p.py, n.py, k)); g.x.stroke();
        // бегущий импульс
        const ph = ((t * .5 + n.x * 3) % 1);
        if (k > .95) { g.x.fillStyle = COL[n.lvl % 4];
          g.x.beginPath(); g.x.arc(lerp(n.p.px, n.px, ph), lerp(n.p.py, n.py, ph), 1.8, 0, SA.TAU); g.x.fill() } });
      nodes.forEach(n => {
        const k = clamp(n.s.v), c = COL[n.lvl % 4];
        g.x.fillStyle = alpha(c, .16); g.x.strokeStyle = c; g.x.lineWidth = 1.4;
        g.x.beginPath(); g.x.arc(n.px, n.py, n.r * k, 0, SA.TAU); g.x.fill(); g.x.stroke();
        if (n.lvl === 0) { g.x.fillStyle = '#E6EDF3'; g.x.font = '700 10px ui-monospace,monospace';
          g.x.textAlign = 'center'; g.x.textBaseline = 'middle'; g.x.fillText('ТЫ', n.px, n.py) }
      });
      const total = nodes.length - 1;
      const bonus = nodes.slice(1).reduce((s, n) => s + (n.lvl === 1 ? 300 : n.lvl === 2 ? 120 : 40), 0);
      info.innerHTML = `ПРИГЛАШЕНО <b style="color:#E6EDF3">${total}</b> ·
        БОНУС <b style="color:#4ADE80">${fmt.num(bonus)} ₽</b> · 1-я линия 300, 2-я 120`;
    });
  }
});

});

/* 119 --------------------------------------------------------------------
   Плеер разбора с метками. Смысл: видеоразбор без воды — таймкоды
   кликабельны, волна показывает «плотность смысла».                        */
SA.register({
  n: '119', title: 'Разбор недели: плеер с таймкодами', group: 'social',
  hint: 'Тапай метки или тяни волну — <b>перемотка по смыслу</b>',
  tags: ['interaction', 'animation'],
  build(stage) {
    stage.classList.add('tall');
    const rnd = prng(91);
    const DUR = 420;
    const MARKS = [
      { t: 24, l: 'Ошибка входа' }, { t: 96, l: 'Где был сигнал' },
      { t: 188, l: 'Размер позиции' }, { t: 268, l: 'Выход по плану' }, { t: 352, l: 'Итоги' },
    ];
    const title = el('div', { class: 'mono', style: `position:absolute;left:12px;right:12px;top:10px;font-size:11px;
      color:#E6EDF3;font-weight:700`, text: 'Разбор: почему 4 из 5 сделок были лишними' });
    const waveBox = el('div', { style: `position:absolute;left:10px;right:10px;top:40px;height:74px;border-radius:12px;
      background:#0B1016;border:1px solid #1A222C;overflow:hidden;touch-action:none` });
    const wg = canvas(waveBox);
    const marks = el('div', { style: `position:absolute;left:10px;right:10px;top:124px;bottom:52px;display:flex;
      flex-direction:column;gap:4px;overflow:hidden` });
    const ctrl = el('div', { style: `position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;
      gap:10px` });
    const play = el('div', { style: `width:36px;height:36px;border-radius:18px;flex:none;display:grid;place-items:center;
      background:linear-gradient(180deg,#1D4ED8,#0B3E99);color:#fff;font-size:13px;cursor:pointer`, text: '▶' });
    const time = el('div', { class: 'mono', style: 'font-size:10px;color:#9FB0C2;min-width:84px' });
    const speed = el('div', { class: 'mono', style: `margin-left:auto;font-size:10px;padding:5px 9px;border-radius:8px;
      background:#141C27;border:1px solid #27313E;color:#9FB0C2;cursor:pointer`, text: '1.0×' });
    ctrl.append(play, time, speed); stage.append(title, waveBox, marks, ctrl);
    const amp = Array.from({ length: 120 }, (_, i) => {
      const near = MARKS.some(m => Math.abs(m.t / DUR * 120 - i) < 5);
      return (near ? .75 : .3) + rnd() * .35;
    });
    const rows = MARKS.map(m => {
      const r = el('div', { class: 'mono', style: `flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;
        border-radius:9px;background:#0E131A;border:1px solid #1A222C;font-size:10.5px;color:#9FB0C2;cursor:pointer;
        transition:.2s` });
      r.innerHTML = `<b style="color:#66B8FF;font-variant-numeric:tabular-nums">${clockHM(m.t)}</b><span>${m.l}</span>`;
      r.addEventListener('click', () => { pos = m.t; playing = true; play.textContent = '❚❚'; haptic('medium') });
      marks.appendChild(r); return r;
    });
    let pos = 0, playing = false, rate = 1;
    const RATES = [1, 1.25, 1.5, 2];
    speed.addEventListener('click', () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
      speed.textContent = rate.toFixed(2).replace(/0$/, '') + '×'; haptic('selection') });
    play.addEventListener('click', () => { playing = !playing; play.textContent = playing ? '❚❚' : '▶'; haptic('medium') });
    drag(waveBox, { axis: true, onMove(d) { const r = waveBox.getBoundingClientRect();
      pos = clamp((d.ex - r.left) / r.width) * DUR; if (Math.random() < .2) haptic('selection') } });
    raf(dt => {
      if (playing) { pos += dt * rate * 6; if (pos > DUR) { pos = DUR; playing = false; play.textContent = '▶' } }
      wg.clear();
      const k = pos / DUR;
      amp.forEach((a, i) => {
        const x = (i + .5) / amp.length * wg.w, h = a * (wg.h - 14);
        wg.x.fillStyle = (i / amp.length) < k ? '#66B8FF' : '#1E2733';
        wg.x.fillRect(x - 1.1, (wg.h - h) / 2, 2.2, h);
      });
      MARKS.forEach(m => { const x = m.t / DUR * wg.w;
        wg.x.strokeStyle = alpha('#FFD166', .7); wg.x.lineWidth = 1;
        wg.x.beginPath(); wg.x.moveTo(x, 2); wg.x.lineTo(x, wg.h - 2); wg.x.stroke() });
      const cx = k * wg.w;
      wg.x.strokeStyle = '#fff'; wg.x.lineWidth = 1.6;
      wg.x.beginPath(); wg.x.moveTo(cx, 0); wg.x.lineTo(cx, wg.h); wg.x.stroke();
      time.textContent = `${clockHM(pos)} / ${clockHM(DUR)}`;
      const act = MARKS.reduce((a, m, i) => pos >= m.t ? i : a, -1);
      rows.forEach((r, i) => { const on = i === act;
        r.style.borderColor = on ? 'rgba(102,184,255,.5)' : '#1A222C';
        r.style.background = on ? 'rgba(102,184,255,.08)' : '#0E131A';
        r.style.color = on ? '#E6EDF3' : '#9FB0C2' });
    });
  }
});

    card.append(over);
    const seg = el('div', { style: `position:absolute;left:14px;right:14px;top:220px;display:flex;gap:5px` });
    const btn = el('div', { class: 'mono', style: `position:absolute;left:14px;right:14px;bottom:12px;height:38px;
      border-radius:12px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#07090D;cursor:pointer;
      background:#E6EDF3;overflow:hidden`, text: 'ПОДЕЛИТЬСЯ В ЛИГЕ' });
    stage.append(card, seg, btn);
    let th = 1, t = 0;
    const rnd = prng(66);
    const path = Array.from({ length: 50 }, (_, i) => i).map(i => 20 + i * .9 + Math.sin(i * .5) * 5 + rnd() * 4);
    function apply() {
      card.style.background = THEMES[th].bg;
      over.querySelector('.r').style.color = THEMES[th].ac;
      [...seg.children].forEach((b, i) => { const on = i === th;
        b.style.borderColor = on ? THEMES[i].ac : '#1C2430';
        b.style.color = on ? THEMES[i].ac : '#6E7D8F';
        b.style.background = on ? alpha(THEMES[i].ac, .12) : '#0C1118' });
    }
    THEMES.forEach((x, i) => { const b = el('div', { class: 'mono', style: `flex:1;text-align:center;padding:7px 0;
      font-size:9.5px;border-radius:9px;border:1px solid #1C2430;background:#0C1118;color:#6E7D8F;cursor:pointer;

      b.addEventListener('click', () => { th = i; apply(); haptic('selection') }); seg.appendChild(b) });
    apply();
    raf(dt => {
      t += dt; cg.clear();
      const ac = THEMES[th].ac;
      const X = scaleRaw(0, path.length - 1, -6, cg.w + 6), Y = scaleRaw(Math.min(...path) - 6, Math.max(...path) + 26, cg.h, 20);

      pts.forEach(p => cg.x.lineTo(p.x, p.y)); cg.x.lineTo(pts[pts.length - 1].x, cg.h); cg.x.closePath();
